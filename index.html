// Encapsulates everything about one checklist — email bar, the to-dos
// themselves, and the add-todo footer — with its own independent local
// state (expanded notes, selected email, new-todo text). Used once for
// every ordinary phase, and twice side by side for the combined Program
// Design & Contracting view, where each tile needs to behave completely
// independently of the other.
function TodoListPanel({ todos, subKey, milestoneKey, property, onToggleTodo, onAddTodo, onReassignTodo, onSetToggleWith, onSwapToggle, onUndoSwap, onUpdateTodoNotes }) {
  const [newTodo, setNewTodo] = useState("");
  const [expandedNotes, setExpandedNotes] = useState({});
  const [selectedEmailKey, setSelectedEmailKey] = useState(null);

  const emailOptions = [];
  (todos || []).forEach((t) => {
    (t.emailTemplates || []).forEach((tpl) => {
      emailOptions.push({ key: `${t.text}::${tpl.label || ""}`, todoText: t.text, tpl });
    });
  });
  const effectiveEmailKey = selectedEmailKey || (emailOptions[0] && emailOptions[0].key);
  const selectedEmail = emailOptions.find((o) => o.key === effectiveEmailKey) || emailOptions[0];

  const submitTodo = () => { if (newTodo.trim()) { onAddTodo(newTodo.trim(), subKey); setNewTodo(""); } };
  const toggleNote = (i) => setExpandedNotes((m) => ({ ...m, [i]: !m[i] }));

  return (
    <div>
      {emailOptions.length > 0 && (
        <div className="phase-email-bar">
          <select
            className="todo-responsible todo-email-select"
            value={effectiveEmailKey || ""}
            onChange={(e) => setSelectedEmailKey(e.target.value)}
          >
            {emailOptions.map((o) => (
              <option key={o.key} value={o.key}>{o.todoText.length > 46 ? o.todoText.slice(0, 45) + "…" : o.todoText}{o.tpl.label ? ` — ${o.tpl.label}` : ""}</option>
            ))}
          </select>
          {selectedEmail && (
            <a className="todo-email-btn" href={buildMailtoLink(selectedEmail.tpl, property)} title="Opens a pre-filled draft in your default mail app (may be blocked in a sandboxed preview)">
              ✉ Draft email
            </a>
          )}
        </div>
      )}

      <div className="todo-list">
        {(todos || []).length === 0 && <div className="dim" style={{ fontSize: 13 }}>No to-dos yet — add one below.</div>}
        {(todos || []).map((t, i) => {
          const expanded = !!expandedNotes[i];
          const isDerived = t.text === ADVISORY_TRACKER_STEP || t.text === ADVISORY_DRAFT_STEP;
          const isKeyMilestone = KEY_MILESTONE_TODOS[milestoneKey] === t.text;
          return (
            <div className="todo-block" key={i}>
              <div className="todo-item todo-item-wrap">
                <button
                  className="todo-check-row"
                  onClick={() => !isDerived && onToggleTodo(i, subKey)}
                  disabled={isDerived}
                  style={isDerived ? { cursor: "default", opacity: 0.85 } : undefined}
                >
                  {t.done ? <CircleCheck size={16} color="#007B0C" /> : <Circle size={16} color="#B2B3B5" />}
                  <span className={`${t.done ? "ms-done" : ""} ${isKeyMilestone ? "todo-key-milestone" : ""}`}>
                    {t.text}
                    {t.text === ADVISORY_TRACKER_STEP && <span className="dim" style={{ fontSize: 11, fontStyle: "italic" }}> — auto-set from Contracted Options</span>}
                    {t.text === ADVISORY_DRAFT_STEP && <span className="dim" style={{ fontSize: 11, fontStyle: "italic" }}> — auto-set once the Ironclad draft date is on file</span>}
                    {t.approvalGate && <span className="dim" style={{ fontSize: 11, fontStyle: "italic" }}> — check = reviewed and approved, not just paused</span>}
                  </span>
                </button>
                {t.due && !t.done && <span className={`mono todo-due ${parseDate(t.due) < parseDate(TODAY) ? "todo-overdue" : ""}`}>due {fmtDate(t.due)}</span>}
                {t.blocked && !t.done && <span className="todo-blocked">blocked</span>}
                <div className="todo-toggle-row">
                  <select className="todo-responsible" value={t.responsible || "Advisory Services"} onChange={(e) => onReassignTodo(i, e.target.value, subKey)}>
                    {STAKEHOLDER_GROUPS.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                  {t.toggleWith ? (
                    <>
                      <button className="todo-swap-btn" title={`Send to ${t.toggleWith}`} onClick={() => onSwapToggle(i, subKey)}>⇄ {t.toggleWith}</button>
                      {t.rounds > 0 && <span className="chip-count todo-round">R{t.rounds}</span>}
                      {t.rounds > 0 && (
                        <button className="todo-undo-btn" title="Undo the last swap only" onClick={() => onUndoSwap(i, subKey)}>Undo</button>
                      )}
                      <button className="icon-btn" title="Remove this toggle pairing entirely" onClick={() => onSetToggleWith(i, "", subKey)}><X size={11} /></button>
                    </>
                  ) : (
                    <select className="todo-responsible todo-toggle-select" value="" onChange={(e) => onSetToggleWith(i, e.target.value, subKey)}>
                      <option value="">+ toggle partner…</option>
                      {STAKEHOLDER_GROUPS.filter((s) => s !== t.responsible).map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  )}
                </div>
              </div>
              <button className="todo-note-toggle" onClick={() => toggleNote(i)}>
                {expanded ? "▾" : "▸"} {t.notes ? "Note" : "+ note"}
              </button>
              {expanded && (
                <textarea
                  className="todo-note-textarea"
                  placeholder="Note for this to-do…"
                  rows={2}
                  value={t.notes || ""}
                  onChange={(e) => onUpdateTodoNotes(i, e.target.value, subKey)}
                />
              )}
            </div>
          );
        })}
      </div>
      <div className="row-inputs" style={{ marginTop: 10 }}>
        <input placeholder="Add a to-do…" value={newTodo} onChange={(e) => setNewTodo(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitTodo(); }} />
        <button className="btn-primary" onClick={submitTodo}><Plus size={14} /> Add</button>
      </div>
    </div>
  );
}

function PhaseModal({ property, phaseKey, onClose, onToggleTodo, onAddTodo, onToggleOption, onReassignTodo, onSetToggleWith, onSwapToggle, onUndoSwap, onUpdateTodoNotes, onOpenEconomicModel }) {
  const phases = buildPhases(property.program);
  let phase = phases.find((p) => p.key === phaseKey);
  let notContracted = false;
  if (!phase && phaseKey === "programDesign") {
    // Neither Contracting & Legal nor Program Design is contracted at
    // all — build the same combined, two-tile view used when either
    // genuinely is, with both tiles pre-checked and tagged here instead.
    const legalStored = property.program.phaseData.contractingLegal;
    const designStored = property.program.phaseData.programDesign;
    const legalTodos = legalStored ? legalStored.todos : defaultTodosFor("contractingLegal", true);
    const designTodos = designStored ? designStored.todos : defaultTodosFor("programDesign", true);
    phase = {
      key: "programDesign", label: "Program Design & Contracting",
      color: PHASE_DEFS.find((d) => d.key === "programDesign").color,
      subPhases: [
        { key: "contractingLegal", label: "Contracting & Legal", contracted: false, todos: legalTodos, done: legalTodos.length > 0 && legalTodos.every((t) => t.done) },
        { key: "programDesign", label: "Program Design", contracted: false, todos: designTodos, done: designTodos.length > 0 && designTodos.every((t) => t.done) },
      ],
    };
    notContracted = true;
  } else if (!phase && phaseKey !== "contractingLegal" && NOT_CONTRACTED_ELIGIBLE_KEYS.includes(phaseKey)) {
    const def = PHASE_DEFS.find((d) => d.key === phaseKey);
    if (def) {
      const stored = property.program.phaseData[phaseKey];
      phase = { key: phaseKey, label: def.label, color: def.color, todos: stored ? stored.todos : defaultTodosFor(phaseKey, true) };
      notContracted = true;
    }
  }
  if (!phase) return null;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal modal-wide ${phase.subPhases ? "modal-dual-wide" : ""}`} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <span className="mono tag-code">{property.code} · {property.name}</span>
            <h2>{phase.label}</h2>
          </div>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-pills">
          <span className="legend-swatch" style={{ background: phase.color }} />
          {notContracted ? (
            <span className="tag-not-contracted">Not Contracted — pre-checked by default; uncheck anything that genuinely needs attention</span>
          ) : (
            <>
              <span className="dim mono">{fmtDate(phase.start)} – {fmtDate(phase.end)}</span>
              {phase.billing && <span className="dim">{phase.billing}</span>}
            </>
          )}
        </div>

        {phaseKey === "advisory" && (
          <>
            <div className="field-label">{property.program.advisoryContractExecuted ? "Contracted options" : "Proposed options — contract drafted, not executed"}</div>
            <div className="chip-row" style={{ marginBottom: 18 }}>
              {OPTIONAL_PHASES.map((def) => (
                <button
                  key={def.key}
                  className={`chip ${property.program.selectedOptions[def.optionKey] ? "chip-active" : ""}`}
                  onClick={() => onToggleOption(def.optionKey)}
                >
                  {property.program.selectedOptions[def.optionKey] ? <CircleCheck size={13} /> : <Circle size={13} />} {def.key === "deployment" ? "Deployment + Ongoing Management" : def.label}
                </button>
              ))}
            </div>
            <div className="dim" style={{ fontSize: 12, marginBottom: 18 }}>
              {property.program.advisoryContractExecuted ? "Toggling an option reshapes the rest of this property's timeline immediately." : "These services join the timeline once the advisory contract is executed."} Due Diligence fee is credited 100% if RFP is selected.
            </div>
          </>
        )}

        {phaseKey === "rfp" && (
          <div style={{ marginBottom: 18 }}>
            <button className="btn-primary" onClick={onOpenEconomicModel}>
              <CheckSquare size={14} /> Economic Modeling
            </button>
            <div className="dim" style={{ fontSize: 11.5, marginTop: 6 }}>
              Upload each vendor's RFP Response form or enter their numbers directly, add Greystar's own revenue assumptions, and compare vendors side by side.
            </div>
          </div>
        )}

        {phase.fields && Object.keys(phase.fields).length > 0 && (
          <>
            <div className="field-label">Phase fields</div>
            <div className="attr-grid" style={{ marginBottom: 18 }}>
              {Object.entries(phase.fields).map(([k, v]) => (
                <div className="attr-item" key={k}>
                  <span className="attr-key">{k}</span>
                  <span className="attr-val">{v}</span>
                </div>
              ))}
            </div>
          </>
        )}

        <div className="dim" style={{ fontSize: 11.5, marginBottom: 12 }}>
          To-dos are permanent — they can't be deleted, only checked, reassigned, or toggled between two parties.
        </div>

        {phase.subPhases ? (
          <div className="dual-todo-grid">
            {phase.subPhases.map((sp) => (
              <div className="dual-todo-tile" key={sp.key}>
                <div className="field-label" style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  {sp.done ? <CircleCheck size={13} color="#007B0C" /> : <CheckSquare size={12} />} {sp.label}
                  {sp.contracted === false && <span className="tag-not-contracted">Not Contracted</span>}
                </div>
                <TodoListPanel
                  todos={sp.todos} subKey={sp.key} milestoneKey={sp.key} property={property}
                  onToggleTodo={onToggleTodo} onAddTodo={onAddTodo} onReassignTodo={onReassignTodo}
                  onSetToggleWith={onSetToggleWith} onSwapToggle={onSwapToggle} onUndoSwap={onUndoSwap}
                  onUpdateTodoNotes={onUpdateTodoNotes}
                />
              </div>
            ))}
          </div>
        ) : (
          <>
            <div className="field-label" style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <CheckSquare size={12} /> To-do list
            </div>
            <TodoListPanel
              todos={phase.todos} subKey={undefined} milestoneKey={phaseKey} property={property}
              onToggleTodo={onToggleTodo} onAddTodo={onAddTodo} onReassignTodo={onReassignTodo}
              onSetToggleWith={onSetToggleWith} onSwapToggle={onSwapToggle} onUndoSwap={onUndoSwap}
              onUpdateTodoNotes={onUpdateTodoNotes}
            />
          </>
        )}
      </div>
    </div>
  );
}

const DURATION_FIELDS = [

  { key: "advisory", label: "Additional Services" },
  { key: "rfp", label: "RFP Track" },
  { key: "incumbentNegotiation", label: "Incumbent Negotiation Track" },

function findRfpValue(headerRow, dataRow, label) {
  const idx = headerRow.findIndex((h) => (h || "").toString().toLowerCase().includes(label.toLowerCase()));
  return idx === -1 ? null : dataRow[idx];
}

const VENDOR_CHART_COLORS = ["#0077D4", "#A6DE9E", "#FFD972", "#DA7A62", "#92C9EB", "#9E3B2E"];

// Hand-coded SVG rather than an external charting library — this dashboard
// has no real bundler, just Babel-in-browser loading pre-built UMD scripts,
// and most chart libraries don't have a reliable standalone build for that
// setup. Custom SVG guarantees it always renders, no CDN dependency risk.
function CCFLineChart({ results }) {
  const W = 640, H = 260, padL = 60, padR = 20, padT = 16, padB = 30;
  const maxYears = Math.max(...results.map((r) => r.model.rows.length));
  const allCCF = results.flatMap((r) => r.model.rows.map((row) => row.ccf));
  const minY = Math.min(0, ...allCCF);
  const maxY = Math.max(0, ...allCCF);
  const yRange = maxY - minY || 1;
  const xFor = (year) => padL + ((year - 1) / Math.max(1, maxYears - 1)) * (W - padL - padR);
  const yFor = (val) => padT + (1 - (val - minY) / yRange) * (H - padT - padB);
  const zeroY = yFor(0);

  const ticks = 4;
  const yTicks = Array.from({ length: ticks + 1 }, (_, i) => minY + (yRange * i) / ticks);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {yTicks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={yFor(t)} y2={yFor(t)} stroke="var(--grid-line)" strokeWidth="1" />
          <text x={padL - 8} y={yFor(t) + 4} textAnchor="end" fontSize="10" fill="var(--ink-muted)">{FMT_MONEY(t)}</text>
        </g>
      ))}
      <line x1={padL} x2={W - padR} y1={zeroY} y2={zeroY} stroke="var(--ink-muted)" strokeWidth="1.5" />
      {Array.from({ length: maxYears }).map((_, i) => (
        <text key={i} x={xFor(i + 1)} y={H - 10} textAnchor="middle" fontSize="10" fill="var(--ink-muted)">Y{i + 1}</text>
      ))}
      {results.map(({ vendor, model }, vi) => {
        const color = VENDOR_CHART_COLORS[vi % VENDOR_CHART_COLORS.length];
        const points = model.rows.map((row) => `${xFor(row.year)},${yFor(row.ccf)}`).join(" ");
        return (
          <g key={vendor.id}>
            <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" />
            {model.rows.map((row) => <circle key={row.year} cx={xFor(row.year)} cy={yFor(row.ccf)} r="3" fill={color} />)}
          </g>
        );
      })}
    </svg>
  );
}

function VendorBarChart({ results, metric, label }) {
  const W = 640, H = 180, padL = 70, padR = 20, padT = 16, padB = 30;
  const values = results.map((r) => metric(r.model));
  const maxAbs = Math.max(1, ...values.map((v) => Math.abs(v)));
  const barW = (W - padL - padR) / results.length - 20;
  const zeroY = padT + (H - padT - padB) / 2;
  const scale = (H - padT - padB) / 2 / maxAbs;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      <text x={4} y={padT + 4} fontSize="10" fill="var(--ink-muted)">{label}</text>
      <line x1={padL} x2={W - padR} y1={zeroY} y2={zeroY} stroke="var(--ink-muted)" strokeWidth="1" />
      {results.map(({ vendor, model }, i) => {
        const val = metric(model);
        const color = VENDOR_CHART_COLORS[i % VENDOR_CHART_COLORS.length];
        const x = padL + i * ((W - padL - padR) / results.length) + 10;
        const barH = Math.abs(val) * scale;
        const y = val >= 0 ? zeroY - barH : zeroY;
        return (
          <g key={vendor.id}>
            <rect x={x} y={y} width={barW} height={Math.max(1, barH)} fill={color} rx="2" />
            <text x={x + barW / 2} y={val >= 0 ? y - 5 : y + barH + 14} textAnchor="middle" fontSize="10" fill="var(--ink)">{FMT_MONEY(val)}</text>
            <text x={x + barW / 2} y={H - 8} textAnchor="middle" fontSize="10" fill="var(--ink-muted)">{vendor.name}</text>
          </g>
        );
      })}
    </svg>
  );
}

function EconomicModelModal({ property, onClose, onSave }) {
  const totalUnits = Number(property.program.attributes.Units) || 0;
  const existing = property.program.economicModel;
  const [assumptions, setAssumptions] = useState(existing ? existing.assumptions : defaultEconomicAssumptions());
  const [vendors, setVendors] = useState(existing && existing.vendors && existing.vendors.length ? existing.vendors : [newVendorBid("Vendor A")]);
  const [saved, setSaved] = useState(false);
  const [uploadError, setUploadError] = useState(null);

  const updateAssumption = (key, value) => setAssumptions((a) => ({ ...a, [key]: value }));
  const updateVendor = (id, key, value) => setVendors((vs) => vs.map((v) => (v.id === id ? { ...v, [key]: value } : v)));
  const addVendor = () => setVendors((vs) => [...vs, newVendorBid(`Vendor ${String.fromCharCode(65 + vs.length)}`)]);
  const removeVendor = (id) => setVendors((vs) => (vs.length > 1 ? vs.filter((v) => v.id !== id) : vs));

  const handleUpload = (vendorId, file) => {
    setUploadError(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets["RFP Response"] || wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const headerRow = rows[3] || []; // row 4 — the real form's header row
        const dataRow = rows[4] || [];  // row 5 — first property's bid data
        if (!headerRow.length || !dataRow.length) throw new Error("empty");

        const num = (v) => (typeof v === "number" ? v : parseFloat(v)) || 0;
        const rawRateIncrease = findRfpValue(headerRow, dataRow, "Annual Rate Increase");
        // The form's percentage cells can read as a fraction (0.03) or a
        // whole number (3) depending on how the vendor typed it — normalize.
        const rateIncreaseNum = num(rawRateIncrease);
        const rateIncrease = rateIncreaseNum > 1 ? rateIncreaseNum / 100 : rateIncreaseNum;

        updateVendor(vendorId, "circuitCostPerUnit", num(findRfpValue(headerRow, dataRow, "Circuit Cost")));
        updateVendor(vendorId, "supportFeePerUnit", num(findRfpValue(headerRow, dataRow, "Support Fee")));
        updateVendor(vendorId, "backupCircuitPerUnit", num(findRfpValue(headerRow, dataRow, "Backup Circuit")));
        updateVendor(vendorId, "annualRateIncreasePct", rateIncrease);
        updateVendor(vendorId, "lvConduitCost", num(findRfpValue(headerRow, dataRow, "LV / Conduit")));
        updateVendor(vendorId, "equipmentCost", num(findRfpValue(headerRow, dataRow, "Equipment Cost")));
        setVendors((vs) => vs.map((v) => v.id === vendorId ? {
          ...v,
          financingRates: {
            ...v.financingRates,
            5: num(findRfpValue(headerRow, dataRow, "5Y")) || null,
            7: num(findRfpValue(headerRow, dataRow, "7Y")) || null,
            10: num(findRfpValue(headerRow, dataRow, "10Y")) || null
          }
        } : v));
        const companyName = findRfpValue(headerRow, dataRow, "Company");
        if (companyName) updateVendor(vendorId, "name", String(companyName));
      } catch (err) {
        setUploadError("Could not read this file — make sure it's the standard RFP Response template.");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const results = vendors.map((v) => ({ vendor: v, model: computeVendorYearlyModel(v, assumptions, totalUnits) }));
  const maxYears = Math.max(...vendors.map((v) => v.contractTermYears || 5));

  const handleSave = () => {
    onSave({ assumptions, vendors, savedAt: TODAY });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-wide econ-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <span className="mono tag-code">{property.code} · {property.name}</span>

          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="dim" style={{ fontSize: 12, marginBottom: 4 }}>

        <div className="section-header">Greystar Assumptions</div>
        <div className="dim" style={{ fontSize: 11.5, marginBottom: 8 }}>

        <div className="attr-edit-grid" style={{ marginBottom: 18 }}>
          <div className="attr-edit-item">

            <input

              <div className="attr-edit-item">

// Advisory Contracts — a permanent repository of every Advisory Services
// contract ever executed. This is purely a filtered view over the same
// property data everything else uses; nothing in the app ever deletes a
// property or clears an execution date, so this record only grows over
// time, never shrinks. Styled to match the flat Table view exactly.
// ============================================================
// Shared file parsers, used by the Refresh functions below — ports the
// reusable processing script's logic into the browser, using the same
// SheetJS library already proven for the Economic Modeling vendor-bid
// upload. Deliberately keeps the review step in the loop: anything
// ambiguous gets flagged for a person to look at here, in the
// interface, rather than silently applied.
// ============================================================
// Name aliases for imports. A property's own "Previous Names" attribute is
// matched too (see previousNamesOf), so prefer adding old names there.
const SMART_IMPORT_ALIASES = {
  "anthology": "anthology apartments",
  "saratoga downs": "saratoga downs at sheveland ranch",
  "dorian": "alto apartments (now dorian)",
  "union heights (fka flats at atlas)": "union heights",
};

// DELIBERATE DISPLAY OVERWRITE — not a data-accuracy fix. Every property's
// real Opportunity Start Date gets replaced with this fixed date on import,
// specifically to shift how far back the Prospecting segment stretches on
// the timeline. prospectStart no longer reflects when a property genuinely
// entered the pipeline once this runs — worth remembering if this field is
// ever used for anything historical/reporting-accurate later. Kept in sync
// with the same constant in process_new_import.py — update both together.
const SMART_IMPORT_OPPORTUNITY_START_OVERWRITE = "2026-04-01";

function excelCellDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  // Defensive fallback: some export formats store what's visually a date
  // as plain text rather than a true date-formatted cell — confirmed
  // directly against a real file, where "Commencement Date" and
  // "Workflow Created Date" both came through as literal strings like
  // "2026-03-16" rather than real date values. Handles that directly
  // rather than assuming SheetJS's cellDates option always converts it.
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  return null;
}

// The Excel Master Data tab is the more recent source of truth, so
// every Attributes refresh also upserts it into Supabase
// master_properties — combining Master Data's own fields (Yardi Code,
// RPM, RPM Email, CM) with the richer Due Diligence tab (client,
// region, units, address) for whatever this file can provide.
// master_properties requires write access under its own RLS policy;
// if the signed-in user doesn't have it, this fails gracefully and
// reports the real reason rather than blocking the rest of the import.
async function syncMasterPropertiesToSupabase(supabaseClient, ddProperties, masterByName) {
  if (!supabaseClient) return { synced: 0, skipped: 0, error: null };
  const ddByKey = {};
  ddProperties.forEach((p) => { ddByKey[p.name.trim().toLowerCase()] = p; });

  const rows = [];
  let skipped = 0;
  Object.keys(masterByName).forEach((key) => {
    const md = masterByName[key];
    if (!md.yardiCode) { skipped += 1; return; } // yardi_code is the table's primary key — can't upsert without it
    const dd = ddByKey[key] || {};
    rows.push({
      yardi_code: String(md.yardiCode),
      name: md.name || dd.name || null,
      client: dd.client || null,
      region: dd.region || null,
      office: dd.office || null,
      units: dd.units || null,
      address: dd.address || null,
      city: dd.city || null,
      state: dd.state || null,
      zip: dd.zip || null,
      rpm: md.rpm || null,
      rpm_email: md.rpmEmail || null,
      cm: md.cm || null,
      is_active: true,
      last_imported_at: new Date().toISOString(),
    });
  });

  if (rows.length === 0) return { synced: 0, skipped, error: null };
  const { error } = await supabaseClient.from("master_properties").upsert(rows, { onConflict: "yardi_code" });
  if (error) return { synced: 0, skipped, error: error.message };
  return { synced: rows.length, skipped, error: null };
}

function parseMasterDataSheet(workbook) {
  const ws = workbook.Sheets["Master Data"];
  if (!ws) throw new Error('No "Master Data" sheet found in this file');
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, range: 1, defval: null });
  const byName = {};
  const duplicates = {};
  for (const r of rows) {
    if (!r[1]) continue;
    const key = String(r[1]).trim().toLowerCase();
    const record = { name: r[1], yardiCode: r[5], rpm: r[41], rpmEmail: r[42], cm: r[43] };
    if (byName[key]) {
      duplicates[key] = duplicates[key] || [byName[key]];
      duplicates[key].push(record);
    } else {
      byName[key] = record;
    }
  }
  return { byName, duplicates };
}


// JS port of parse_ironclad_all_status from the reusable Python script,
// now made fully self-sufficient — this single export provides
// everything the old two-file setup needed: real, direct True/False
// flags for which services were actually selected (replacing the
// "infer from Advisory Services: All, or default to RFP-only and flag
// it" guesswork), "Commencement Date" as the authoritative execution
// date (confirmed as what actually gets entered into the contract's
// own terms), and "Workflow Created Date" for drafted-but-not-executed
// records — the same field the older, separate export relied on for
// that purpose. Critical gate, confirmed directly against real data:
// Commencement Date is populated even on in-progress ("review" stage)
// and inactive/superseded records — e.g. Rushmark MF 1 has a real
// Commencement Date despite being nowhere near executed. Using the date
// alone without checking Contract Status is genuinely "active" would
// incorrectly treat live drafts as executed contracts.
const REVENUE_TRACKER_STATUS_MAP = { "Contract Executed": "Pending", "Invoiced": "Invoiced", "Paid": "Complete" };
const REVENUE_TRACKER_BUCKET_TO_PHASE = { "RFP Services": "rfp", "Program Design / Contract Oversight": "programDesign", "Deployment & Ongoing Management": "deployment" };

function parseRevenueTrackerSheet(workbook) {
  const sheetName = workbook.SheetNames.includes("Revenue Tracker") ? "Revenue Tracker" : workbook.SheetNames[0];
  const ws = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, range: 0, defval: null });
  // The real header sits a few rows down, after Purpose/Input guidance
  // notes — scan for it rather than assuming row 1.
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if (rows[i] && rows[i].includes("Engagement ID") && rows[i].includes("Asset / Property")) { headerRowIdx = i; break; }
  }
  if (headerRowIdx === -1) return { records: [], flags: ['No "Engagement ID" / "Asset / Property" header row found in the first 15 rows — is this really a Revenue Tracker export?'] };

  const header = rows[headerRowIdx];
  const idx = {};
  header.forEach((h, i) => { if (h) idx[h] = i; });
  const required = ["Asset / Property", "Service Bucket", "Billing Milestone / Period", "Status"];
  const missing = required.filter((col) => !(col in idx));
  if (missing.length > 0) return { records: [], flags: [`Missing required column(s): ${missing.join(", ")}.`] };

  const records = [];
  const flags = [];
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const propNameRaw = r[idx["Asset / Property"]];
    if (!propNameRaw) continue;
    // Property names in this file can carry a literal newline
    // (e.g. "Thorndal \nCircle") — collapse it before matching.
    const propName = String(propNameRaw).replace(/\s*\n\s*/g, " ").trim();
    const serviceBucket = r[idx["Service Bucket"]];
    const milestone = r[idx["Billing Milestone / Period"]];
    const status = r[idx["Status"]];
    const revenueMonthRaw = idx["Revenue Month"] !== undefined ? r[idx["Revenue Month"]] : null;
    const amountCollected = idx["Amount Collected"] !== undefined ? r[idx["Amount Collected"]] : null;
    const invoiceAmount = idx["Invoice Amount"] !== undefined ? r[idx["Invoice Amount"]] : null;

    if (status === "Pipeline") continue; // never a real, decided billing event — deal flow belongs to the contract import, not this one

    const phaseKey = REVENUE_TRACKER_BUCKET_TO_PHASE[serviceBucket];
    if (!phaseKey) {
      // Covers "Due Diligence" or any other bucket this file format
      // doesn't define — Due Diligence is handled entirely by the
      // existing RFP-crediting logic and was never expected to appear
      // here.
      if (serviceBucket) flags.push(`"${propName}": unrecognized Service Bucket "${serviceBucket}" — skipped.`);
      continue;
    }
    const mappedStatus = REVENUE_TRACKER_STATUS_MAP[status];
    if (!mappedStatus) {
      flags.push(`"${propName}" (${serviceBucket}): unrecognized Status "${status}" — skipped.`);
      continue;
    }

    records.push({
      propName, key: propName.toLowerCase(), phaseKey, milestone, status: mappedStatus,
      revenueMonth: revenueMonthRaw ? excelCellDate(revenueMonthRaw) : null,
      amountCollected: typeof amountCollected === "number" ? amountCollected : null,
      invoiceAmount: typeof invoiceAmount === "number" ? invoiceAmount : null,
    });
  }
  return { records, flags };
}

const BILLING_STATUS_RANK = { "Pending": 0, "Invoiced": 1, "Complete": 2 };

function buildBillingStatusRefreshResult(records, existingProperties) {
  const flags = [];
  const existingByKey = {};
  existingProperties.forEach((p) => { existingByKey[p.name.trim().toLowerCase()] = p; });

  const byProperty = {};
  records.forEach((r) => {
    if (!byProperty[r.key]) byProperty[r.key] = [];
    byProperty[r.key].push(r);
  });

  const updates = [];
  Object.keys(byProperty).forEach((key) => {
    const existing = existingByKey[key];
    const propRecords = byProperty[key];
    if (!existing) {
      flags.push(`"${propRecords[0].propName}" — no existing property matches this name. This import never creates new properties; use Refresh Contract Data if this one genuinely needs to be added.`);
      return;
    }

    const opts = existing.program.selectedOptions || {};
    const existingOverrides = existing.program.manualPaymentOverrides || {};
    const overrides = {};
    let deploymentUpdate = null;

    propRecords.forEach((r) => {
      if (r.phaseKey === "deployment") {
        if (!opts.deployment) {
          flags.push(`"${existing.name}": Deployment row found, but Deployment isn't selected on this property — skipped.`);
          return;
        }
        const amount = r.amountCollected != null ? r.amountCollected : r.invoiceAmount;
        if (amount == null) return;
        if (!r.revenueMonth) {
          flags.push(`"${existing.name}": Deployment row has no Revenue Month, so there's no way to tell if it's already been counted — skipped to avoid double-counting.`);
          return;
        }
        // Compare against whatever's already been accumulated earlier
        // in this same batch, not just the original pre-import value —
        // otherwise two rows for the same month in one file (a genuine
        // duplicate, or the same file run twice in one sitting) both
        // get counted.
        const currentThroughMonth = (deploymentUpdate ? deploymentUpdate.newThroughMonth : null) || existing.program.deploymentCollectedThroughMonth || null;
        if (currentThroughMonth && r.revenueMonth <= currentThroughMonth) {
          flags.push(`"${existing.name}": Deployment row for ${r.revenueMonth} is already counted (through ${currentThroughMonth}) — skipped.`);
          return;
        }
        if (!deploymentUpdate) deploymentUpdate = { addAmount: 0, newThroughMonth: existing.program.deploymentCollectedThroughMonth || null };
        deploymentUpdate.addAmount += amount;
        deploymentUpdate.newThroughMonth = r.revenueMonth;
        return;
      }

      if (!opts[r.phaseKey]) {
        flags.push(`"${existing.name}": a ${r.phaseKey} row was found, but that phase isn't selected on this property — skipped.`);
        return;
      }
      const firstKey = r.phaseKey === "rfp" ? "rfp-1" : "pd-1";
      const secondKey = r.phaseKey === "rfp" ? "rfp-2" : "pd-2";
      const keysToSet = r.milestone === "50% Start" ? [firstKey]
        : r.milestone === "50% Completion" ? [secondKey]
        : r.milestone === "100% One-time" ? [firstKey, secondKey]
        : null;
      if (!keysToSet) {
        flags.push(`"${existing.name}" (${r.phaseKey}): unrecognized milestone "${r.milestone}" — skipped.`);
        return;
      }
      keysToSet.forEach((k) => {
        const currentStatus = overrides[k] || existingOverrides[k] || "Pending";
        if (BILLING_STATUS_RANK[r.status] >= BILLING_STATUS_RANK[currentStatus]) {
          overrides[k] = r.status;
        } else {
          flags.push(`"${existing.name}" (${k}): import says "${r.status}" but it's already "${currentStatus}" here — status never moves backward, so this was left alone.`);
        }
      });
    });

    if (Object.keys(overrides).length > 0 || deploymentUpdate) {
      updates.push({ id: existing.id, name: existing.name, overrides, deploymentUpdate });
    }
  });

  return { updates, flags };
}

function parseIroncladAllStatusSheet(workbook) {
  const sheetName = workbook.SheetNames.includes("export") ? "export" : workbook.SheetNames[0];
  const ws = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, range: 0, defval: null });
  const header = rows[0] || [];
  const idx = {};
  header.forEach((h, i) => { if (h) idx[h] = i; });
  const required = ["Record Type", "Record Name", "Contract Status",
    "Formal RFP", "Contract Support & Program Design", "Program Deployment & Ongoing Management"];
  if (!required.every((col) => col in idx)) return { selections: {}, executed: {}, draftedOnly: {} };

  const selections = {};
  const executed = {};
  const draftedOnly = {};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const nameField = r[idx["Record Name"]];
    if (!nameField || r[idx["Record Type"]] !== "connectedLivingAdvisoryServicesAgreement") continue;
    // Terminated agreements never create, update or count: Ironclad prefixes their
    // Record Name with "(TERMINATED)" (and may set the status to terminated).
    if (/^\s*\(terminated\)/i.test(String(nameField)) || /terminat/i.test(String(r[idx["Contract Status"]] || ""))) continue;

    const propName = String(nameField).split(/ - Connected Living - Advisory Services Agreement| - Advisory Services Agreement/)[0].trim();
    const key = SMART_IMPORT_ALIASES[propName.toLowerCase()] || propName.toLowerCase();

    const contractStatus = r[idx["Contract Status"]];
    const commencementRaw = idx["Commencement Date"] !== undefined ? r[idx["Commencement Date"]] : null;
    const createdRaw = idx["Workflow Created Date"] !== undefined ? r[idx["Workflow Created Date"]] : null;
    const created = createdRaw ? excelCellDate(createdRaw) : null;
    const commencementDate = contractStatus === "active" ? excelCellDate(commencementRaw) : null;

    // Forward-compatible for a Due Diligence flag Ironclad doesn't
    // provide yet — matches the exact naming pattern of the three real
    // flags already in this export. Safely does nothing today (the
    // column doesn't exist, so this always reads false); the moment
    // it's added to a real export, it starts working automatically with
    // no further code changes needed. The column name here is a
    // best-guess based on the existing pattern — confirm and adjust
    // once the real column actually appears.
    // Confirmed real as of the 2026-08-21 export — this column now
    // genuinely exists in Ironclad, matching the same naming pattern
    // the other three flags already used.
    const dueDiligenceSelected = idx["Due Diligence"] !== undefined ? !!r[idx["Due Diligence"]] : false;
    // Needed specifically for Ironclad-only properties that have no Due
    // Diligence tab match at all — the only real attribute Ironclad
    // itself can provide for creating a property record in that case.
    const clientName = idx["Client Name"] !== undefined ? r[idx["Client Name"]] : null;

    // Real, confirmed fee amounts straight from the contract — Vert
    // proved these can genuinely differ from our calculation (a
    // restructured Program Design rate, RFP skipped entirely), so a
    // real value here takes priority over the calculation whenever
    // it's actually present. Confirmed against real data these come
    // through as dollar-sign-prefixed strings (e.g. "$4155"), not
    // numbers — parsed accordingly. As of this writing Vert is the
    // only known outlier, but this is read for every property, not
    // special-cased. Column name for Due Diligence's fee confirmed
    // directly against the 2026-08-21 export — "Due Diligence Advisory
    // Fee", not the earlier best-guess name.
    const parseFeeString = (v) => {
      if (v === null || v === undefined || v === "") return null;
      const n = parseFloat(String(v).replace(/[$,]/g, ""));
      return isNaN(n) ? null : n;
    };
    const rfpFeeConfirmed = idx["RFP Advisory Fee"] !== undefined ? parseFeeString(r[idx["RFP Advisory Fee"]]) : null;
    const programDesignFeeConfirmed = idx["Contract Support & Program Design Fee"] !== undefined ? parseFeeString(r[idx["Contract Support & Program Design Fee"]]) : null;
    const deploymentFeeConfirmed = idx["Program Deployment & Management Fee"] !== undefined ? parseFeeString(r[idx["Program Deployment & Management Fee"]]) : null;
    const dueDiligenceFeeConfirmed = idx["Due Diligence Advisory Fee"] !== undefined ? parseFeeString(r[idx["Due Diligence Advisory Fee"]]) : null;

    const existingSel = selections[key];
    const newRfp = !!r[idx["Formal RFP"]];
    const newProgramDesign = !!r[idx["Contract Support & Program Design"]];
    const newDeployment = !!r[idx["Program Deployment & Ongoing Management"]];

    // A property can have more than one real contract row over time — a
    // client who starts with just RFP and later comes back for Program
    // Design shows up as two separate rows. Each newly-flagged service
    // gets its own, genuine contract date recorded here, rather than
    // this later row silently overwriting the earlier row's own
    // selections and date entirely.
    const serviceContractDates = existingSel ? { ...existingSel.serviceContractDates } : {};
    if (commencementDate) {
      if (newRfp && !(existingSel && existingSel.rfp)) serviceContractDates.rfp = commencementDate;
      if (newProgramDesign && !(existingSel && existingSel.programDesign)) serviceContractDates.programDesign = commencementDate;
      if (newDeployment && !(existingSel && existingSel.deployment)) serviceContractDates.deployment = commencementDate;
    }

    selections[key] = {
      propName, contractStatus, clientName,
      // The property's primary contract date is the earliest one seen —
      // when the relationship with this client genuinely began — not
      // whichever row happens to be processed last.
      commencementDate: (existingSel && existingSel.commencementDate && (!commencementDate || existingSel.commencementDate < commencementDate))
        ? existingSel.commencementDate : commencementDate,
      serviceContractDates,
      dueDiligence: dueDiligenceSelected || !!(existingSel && existingSel.dueDiligence),
      rfpFeeConfirmed: rfpFeeConfirmed ?? (existingSel ? existingSel.rfpFeeConfirmed : null),
      programDesignFeeConfirmed: programDesignFeeConfirmed ?? (existingSel ? existingSel.programDesignFeeConfirmed : null),
      deploymentFeeConfirmed: deploymentFeeConfirmed ?? (existingSel ? existingSel.deploymentFeeConfirmed : null),
      dueDiligenceFeeConfirmed: dueDiligenceFeeConfirmed ?? (existingSel ? existingSel.dueDiligenceFeeConfirmed : null),
      rfp: newRfp || !!(existingSel && existingSel.rfp),
      programDesign: newProgramDesign || !!(existingSel && existingSel.programDesign),
      deployment: newDeployment || !!(existingSel && existingSel.deployment),
    };

    if (commencementDate) {
      executed[key] = [propName, commencementDate, created];
    } else if (created && contractStatus !== "inactive") {
      // Same "keep the latest draft" rule as the older parser — a
      // property could have more than one row (an old lapsed draft plus
      // a fresh one); inactive rows are excluded here since they're
      // dead, not genuinely in-progress.
      if (!draftedOnly[key] || created > draftedOnly[key][2]) {
        draftedOnly[key] = [propName, null, created];
      }
    }
  }
  return { selections, executed, draftedOnly };
}

// Refresh Property Attributes — master tracker file only. Matches
// existing properties by name and updates them; a name with no match
// creates a new property instead, attributes only, since this file
// alone has no contract data. For each attribute, a blank or missing
// value in the upload leaves the existing value untouched — only a
// genuinely present new value overwrites it. Returns a preview (not a
// commit) so flagged items can be reviewed first.
// Parses a bid-comparison spreadsheet into one bid-row object per
// data row — matches the real shape of a quote-comparison export
// (one row per pricing option, with Units/Rate/CAPEX/Term columns),
// using flexible, keyword-based header detection so reasonable naming
// variations ("MRR / Unit ($)" vs "Rate per Unit") still match, rather
// than requiring one exact, brittle header string.
// Scans raw, already-extracted PDF text for recognizable deal-point
// patterns — a rate, a CAPEX figure, a contract term — rather than
// attempting to reconstruct a structured table the way the spreadsheet
// parser does. Unlike a spreadsheet, a PDF has no predictable,
// shared column layout across different providers, so this returns
// every candidate found for review, not a single trusted answer; when
// a document's layout doesn't support reliable extraction at all, it
// honestly returns nothing rather than a wrong guess.
function buildAttributesRefreshResult(ddProperties, masterByName, masterDuplicates, existingProperties) {
  const flags = [];
  const updates = [];
  const creates = [];
  const existingByKey = {};
  existingProperties.forEach((p) => { existingByKey[p.name.trim().toLowerCase()] = p; });

  for (const p of ddProperties) {
    const key = p.name.trim().toLowerCase();
    const existing = existingByKey[key];
    if (!existing) {
      const mdRaw = masterByName[key];
      const md = mdRaw || {};
      if (!mdRaw) flags.push(`No Master Data match for new property "${p.name}" — Yardi Code/RPM/CM will be blank.`);
      if (masterDuplicates[key]) flags.push(`"${p.name}" matches multiple Master Data rows — verify which real property this is before trusting the attributes pulled in.`);
      flags.push(`"${p.name}" created as a new property — no contract data yet, since this file alone doesn't provide it. Starts in Prospecting.`);
      creates.push({
        name: p.name,
        attrs: {
          Client: p.client || "—", Region: p.region || "National", "Project Type": "Retrofit",
          ...(md.yardiCode ? { "Yardi Code": md.yardiCode } : {}),
          ...(p.office ? { Office: p.office } : {}),
          ...(p.units ? { Units: p.units } : {}),
          ...(md.rpm ? { RPM: md.rpm } : {}),
          ...(md.rpmEmail ? { "RPM Email": md.rpmEmail } : {}),
          ...(md.cm ? { CM: md.cm } : {}),
          ...(p.address ? { Address: p.address } : {}),
          ...(p.city ? { City: p.city } : {}),
          ...(p.state ? { State: p.state } : {}),
          ...(p.zip ? { Zip: p.zip } : {}),
          // A genuine Master Data match confirms this is a real,
          // active Greystar-managed property — reflect that directly.
          ...(mdRaw ? { "PMA Status": "Active PMA" } : {}),
        },
        prospectStart: p.oppStart || null,
      });
      continue;
    }
    if (computeStatus(existing) === "Closed") {
      flags.push(`"${p.name}" is marked Closed on the tracker — skipped, not updated. A closed property's data is intentionally left alone; re-open it manually first if it genuinely needs a refresh.`);
      continue;
    }
    const mdRaw = masterByName[key];
    const md = mdRaw || {};
    if (!mdRaw) {
      flags.push(`No Master Data match for "${p.name}" — Yardi Code/RPM/CM won't be updated from this file for this property.`);
    }
    if (masterDuplicates[key]) {
      flags.push(`"${p.name}" matches multiple Master Data rows — verify which real property this is before trusting the attributes pulled in.`);
    }
    // Only a genuinely present new value overwrites — a blank cell in
    // the upload leaves whatever's already stored exactly as it is.
    const attrs = {
      Client: p.client || existing.program.attributes.Client,
      Region: p.region || existing.program.attributes.Region,
      Office: p.office || existing.program.attributes.Office,
      Units: p.units || existing.program.attributes.Units,
      "Yardi Code": md.yardiCode || existing.program.attributes["Yardi Code"],
      RPM: md.rpm || existing.program.attributes.RPM,
      "RPM Email": md.rpmEmail || existing.program.attributes["RPM Email"],
      CM: md.cm || existing.program.attributes.CM,
      Address: p.address || existing.program.attributes.Address,
      City: p.city || existing.program.attributes.City,
      State: p.state || existing.program.attributes.State,
      Zip: p.zip || existing.program.attributes.Zip,
      // A genuine Master Data match confirms this is a real, active
      // Greystar-managed property — reflect that directly, overriding
      // whatever PMA Status was there before.
      "PMA Status": mdRaw ? "Active PMA" : existing.program.attributes["PMA Status"],
    };
    const prospectStart = p.oppStart || existing.program.prospectStart;
    updates.push({ id: existing.id, name: p.name, attrs, prospectStart });
  }
  return { updates, creates, flags };
}

// Refresh Contract Data — Ironclad export only. Matches existing
// properties by name and updates them; a name with no match creates a
// new property instead, enriched from master_properties (a live,
// read-only Supabase table) when a match exists there, since this
// file alone has no units/region/address of its own. Contract dates
// and confirmed fees only overwrite when a genuinely new value is
// present. Selected-service flags only ever turn on, never downgrade
// an existing true back to false — a genuine removal is rare and can
// always be done manually, while incorrectly dropping a selected
// service would silently break real billing.
function buildContractsRefreshResult(ironcladSelections, executed, draftedOnly, existingProperties, masterByName) {
  masterByName = masterByName || {};
  const flags = [];
  const updates = [];
  const creates = [];
  const existingByKey = {};
  existingProperties.forEach((p) => { existingByKey[p.name.trim().toLowerCase()] = p; });
  // Also match a property's Previous Names, so a renamed property isn't offered as new.
  existingProperties.forEach((p) => previousNamesOf(p).forEach((n) => {
    [n, SMART_IMPORT_ALIASES[n]].filter(Boolean).forEach((k) => { if (!existingByKey[k]) existingByKey[k] = p; });
  }));

  const allKeys = new Set([...Object.keys(ironcladSelections), ...Object.keys(executed), ...Object.keys(draftedOnly)]);
  for (const key of allKeys) {
    const existing = existingByKey[key];
    const realSelection = ironcladSelections[key];
    const propName = (realSelection && realSelection.propName) || key;
    if (!existing) {
      const advRow = executed[key];
      const draftRow = draftedOnly[key];
      const name = (advRow ? advRow[0] : null) || (draftRow ? draftRow[0] : null) || propName;
      const clientName = realSelection ? realSelection.clientName : null;
      const mdRaw = masterByName[key];
      const md = mdRaw || {};

      const realCommencement = (realSelection && realSelection.contractStatus === "active") ? realSelection.commencementDate : null;
      const advDate = realCommencement || (advRow ? advRow[1] : null);
      const draftedDate = draftRow ? draftRow[2] : null;

      let rfpSelected = false, programDesignSelected = false, deploymentSelected = false;
      if (advDate && realSelection) {
        rfpSelected = realSelection.rfp;
        programDesignSelected = realSelection.programDesign;
        deploymentSelected = realSelection.deployment;
      } else if (advDate) {
        rfpSelected = true;
        flags.push(`"${name}" has an executed advisory contract — defaulted to RFP-only per the rule that every executed contract has at least one service. Confirm the real services contracted.`);
      }

      const dueDiligenceSelected = realSelection ? !!realSelection.dueDiligence : false;
      const anyAdditionalService = rfpSelected || programDesignSelected || deploymentSelected;
      let ddContractExecuted = null;
      let advisoryContractExecutedFinal = advDate;
      if (dueDiligenceSelected && !anyAdditionalService) {
        ddContractExecuted = advDate;
        advisoryContractExecutedFinal = null;
      }

      const mdNote = mdRaw ? "master_properties match found — attributes pulled in from there." : "No master_properties match either — attributes genuinely blank until confirmed manually.";
      flags.push(`"${name}" created from Ironclad only — no existing property matched. Client name pulled directly from Ironclad${clientName ? ` ("${clientName}")` : " — not available in the export either"}. ${mdNote}${!mdRaw ? " Units, Region, and Project Type still need manual attributes before this is fully trustworthy." : ""}`);

      creates.push({
        name,
        attrs: {
          Client: clientName || md.client || "—",
          Region: md.region || "National",
          "Project Type": "Retrofit",
          ...(md.yardi_code ? { "Yardi Code": md.yardi_code } : {}),
          ...(md.office ? { Office: md.office } : {}),
          ...(md.units ? { Units: md.units } : {}),
          ...(md.rpm ? { RPM: md.rpm } : {}),
          ...(md.rpm_email ? { "RPM Email": md.rpm_email } : {}),
          ...(md.cm ? { CM: md.cm } : {}),
          ...(md.cm_email ? { "CM Email": md.cm_email } : {}),
          ...(md.address ? { Address: md.address } : {}),
          ...(md.city ? { City: md.city } : {}),
          ...(md.state ? { State: md.state } : {}),
          ...(md.zip ? { Zip: md.zip } : {}),
          // A genuine master_properties match confirms this is a real,
          // active Greystar-managed property — reflect that directly.
          ...(mdRaw ? { "PMA Status": "Active PMA" } : {}),
        },
        ddContractExecuted, advisoryContractExecuted: advisoryContractExecutedFinal, advisoryContractDrafted: draftedDate,
        selectedOptions: { dueDiligence: dueDiligenceSelected, rfp: rfpSelected, incumbentNegotiation: false, programDesign: programDesignSelected, deployment: deploymentSelected },
        confirmedFees: {
          dueDiligence: realSelection ? realSelection.dueDiligenceFeeConfirmed : null,
          rfp: realSelection ? realSelection.rfpFeeConfirmed : null,
          programDesign: realSelection ? realSelection.programDesignFeeConfirmed : null,
          deployment: realSelection ? realSelection.deploymentFeeConfirmed : null,
        },
      });
      continue;
    }
    if (computeStatus(existing) === "Closed") {
      flags.push(`"${propName}" is marked Closed on the tracker — skipped, not updated. A closed property's data is intentionally left alone; re-open it manually first if it genuinely needs a refresh.`);
      continue;
    }
    const prog = existing.program;
    const advRow = executed[key];
    const draftRow = draftedOnly[key];
    const realCommencement = (realSelection && realSelection.contractStatus === "active") ? realSelection.commencementDate : null;
    const advExecuted = realCommencement || (advRow ? advRow[1] : null) || prog.advisoryContractExecuted;
    const ddExecuted = prog.ddContractExecuted; // this file alone can't distinguish DD from Advisory execution — left untouched here
    const advDrafted = (draftRow ? draftRow[2] : null) || prog.advisoryContractDrafted;

    const existingOpts = prog.selectedOptions || {};
    const selectedOptions = {
      dueDiligence: existingOpts.dueDiligence || (realSelection ? realSelection.dueDiligence : false),
      rfp: existingOpts.rfp || (realSelection ? realSelection.rfp : false),
      incumbentNegotiation: existingOpts.incumbentNegotiation || false,
      programDesign: existingOpts.programDesign || (realSelection ? realSelection.programDesign : false),
      deployment: existingOpts.deployment || (realSelection ? realSelection.deployment : false),
    };

    const existingFees = prog.confirmedFees || {};
    const confirmedFees = {
      dueDiligence: (realSelection && realSelection.dueDiligenceFeeConfirmed != null) ? realSelection.dueDiligenceFeeConfirmed : (existingFees.dueDiligence ?? null),
      rfp: (realSelection && realSelection.rfpFeeConfirmed != null) ? realSelection.rfpFeeConfirmed : (existingFees.rfp ?? null),
      programDesign: (realSelection && realSelection.programDesignFeeConfirmed != null) ? realSelection.programDesignFeeConfirmed : (existingFees.programDesign ?? null),
      deployment: (realSelection && realSelection.deploymentFeeConfirmed != null) ? realSelection.deploymentFeeConfirmed : (existingFees.deployment ?? null),
    };

    // A service's own contract date, once recorded, is never overwritten
    // by a later import run — only filled in the first time real
    // evidence of a separately-dated contract shows up.
    const existingSvcDates = prog.serviceContractDates || {};
    const incomingSvcDates = (realSelection && realSelection.serviceContractDates) || {};
    const serviceContractDates = {
      rfp: existingSvcDates.rfp || incomingSvcDates.rfp || null,
      programDesign: existingSvcDates.programDesign || incomingSvcDates.programDesign || null,
      deployment: existingSvcDates.deployment || incomingSvcDates.deployment || null,
    };

    // A genuine master_properties match confirms this is a real,
    // active Greystar-managed property — reflect that directly, same
    // rule as the create path above and as Refresh Property
    // Attributes already applies on its own master-data lookup.
    const existingMdRaw = masterByName[key];
    const attrs = existingMdRaw ? { ...prog.attributes, "PMA Status": "Active PMA" } : null;

    updates.push({
      id: existing.id, name: existing.name,
      advisoryContractExecuted: advExecuted, advisoryContractDrafted: advDrafted,
      selectedOptions, confirmedFees, serviceContractDates, attrs,
    });
  }
  return { updates, creates, flags };
}


// ROVR's commission percentage, by project type and phase — shared
// between computeAdvisoryBilling (which only ever reports a real
// amount once a payment is genuinely Complete) and the dashboard
// (which also needs the same percentage to project the eventual ROVR
// share of amounts that are still Pending or Invoiced).
const ROVR_PERCENTAGES = {
  "Retrofit": { dueDiligence: 0.6, rfp: 0.6, programDesign: 0, deployment: 0.6 },
  "New Construction": { dueDiligence: 0.6, rfp: 0.6, programDesign: 0.6, deployment: 0.6 },
};
function rovrPercentForProjectType(projectType, phaseKey) {
  const table = ROVR_PERCENTAGES[projectType] || ROVR_PERCENTAGES["Retrofit"];
  return table[phaseKey] != null ? table[phaseKey] : 0;
}

const ADVISORY_FEE_RATES = {
  "New Construction": { perUnit: 15, floor: 3000, ceiling: 7500 },
  "Retrofit": { perUnit: 10, floor: 3000, ceiling: 5000 },
};
function calculateAdvisoryFee(units, projectType) {
  const rates = ADVISORY_FEE_RATES[projectType] || ADVISORY_FEE_RATES["Retrofit"];
  const raw = (units || 0) * rates.perUnit;
  return Math.min(Math.max(raw, rates.floor), rates.ceiling);
}

function addCalendarDays(dateStr, days) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Finds a specific checklist item by matching text within a given phase,
// and reports whether it's actually been checked off, along with that
// phase's end date — real if the phase is genuinely done, calculated/
// projected if it's still in progress. That's what lets a checklist-
// triggered payment show a real date instead of just a trigger name.
function findTodoStatus(property, phaseKey, textMatch) {
  const phases = buildPhases(property.program);
  const phase = phases.find((p) => p.key === phaseKey);
  if (!phase || !phase.todos) return { exists: false, done: false, phaseEnd: null, phaseDone: false };
  const todo = phase.todos.find((t) => t.text.toLowerCase().includes(textMatch.toLowerCase()));
  return todo
    ? { exists: true, done: !!todo.done, phaseEnd: phase.end, phaseDone: !!phase.done }
    : { exists: false, done: false, phaseEnd: phase.end, phaseDone: !!phase.done };
}

// Contracts define fees, not master data: the unit count on the advisory
// contract ("Contract Units") drives every fee. Master sync updates Units but
// never Contract Units; Units is only the fallback when Contract Units is blank.
function contractUnitsOf(property) {
  const a = (property && property.program && property.program.attributes) || {};
  const cu = Number(a["Contract Units"]);
  return cu > 0 ? cu : (Number(a.Units) || 0);
}

function computeAdvisoryBilling(property) {
  const units = contractUnitsOf(property);
  const projectType = property.program.attributes["Project Type"] || "Retrofit";
  const contractExecuted = property.program.advisoryContractExecuted;
  const fee = calculateAdvisoryFee(units, projectType);
  const half = fee / 2;

  // Previously removed this distinction after checking every real fee
  // value found at the time and confirming they all matched the
  // calculation exactly — concluded the rate was fully standardized,
  // no exceptions. Reintroduced after Vert proved that conclusion
  // wrong: its actual signed contract charges the new-construction
  // Program Design rate ($15/unit) despite not being flagged as new
  // construction, with RFP never selected at all — a genuinely
  // restructured fee arrangement, confirmed directly against the real
  // contract document. The formula is a reasonable default, not a hard
  // rule — real, contracted fees from Ironclad's own fee columns
  // (populated once a contract reaches its final, executed state) take
  // priority over the calculation whenever they're actually present.
  // Any property with a blank fee field still falls back to the same
  // calculation as always — this only overrides the number when
  // Ironclad genuinely provides one.
  const confirmedFees = property.program.confirmedFees || {};
  const rfpFee = confirmedFees.rfp != null ? confirmedFees.rfp : fee;
  const rfpHalf = rfpFee / 2;
  const rfpFeeConfirmed = confirmedFees.rfp != null && confirmedFees.rfp !== fee;
  const pdFee = confirmedFees.programDesign != null ? confirmedFees.programDesign : fee;
  const pdHalf = pdFee / 2;
  const pdFeeConfirmed = confirmedFees.programDesign != null && confirmedFees.programDesign !== fee;
  const ddFee = confirmedFees.dueDiligence != null ? confirmedFees.dueDiligence : fee;
  const ddHalf = ddFee / 2;
  const ddFeeConfirmed = confirmedFees.dueDiligence != null && confirmedFees.dueDiligence !== fee;

  // A manual override exists alongside the automatic, checklist-driven
  // detection — not instead of it. Real use case: payment genuinely came
  // in, but nobody went and checked the actual checklist item yet, or
  // never will (e.g., paid outside the normal workflow). Manually
  // marking a line paid here doesn't touch or fake the checklist itself
  // — it's a separate, explicit record that this specific line is
  // considered settled, independent of what the checklist shows.
  const overrides = property.program.manualPaymentOverrides || {};
  // ROVR's own commission — a percentage of what's actually billed to
  // the client, only ever owed once that specific line is genuinely
  // Complete. Retrofit carves out Program Design (ROVR earns nothing on
  // it); New Construction pays the same 60% across every contracted
  // phase instead.
  const rovrPercentFor = (phaseKey) => rovrPercentForProjectType(projectType, phaseKey);
  const rovrOverrides = property.program.rovrPaymentOverrides || {};
  // ROVR's own Pending/Complete tracking — entirely separate from the
  // client billing status above, defaulting the same way (always
  // Pending until someone explicitly marks it). Only actually relevant
  // once the client side is Complete; the amount itself is null before
  // that, since nothing is really owed yet.
  const rovrFields = (phaseKey, key, clientComplete, billedAmount) => {
    const amountDue = clientComplete ? billedAmount * rovrPercentFor(phaseKey) : null;
    return { rovrAmountDue: amountDue, rovrStatus: clientComplete ? (rovrOverrides[key] || "Pending") : null };
  };
  // Status is purely a person's own call — it always starts at Pending,
  // whether or not the underlying trigger has actually fired, and only
  // ever changes because someone explicitly set it. "done" stays
  // exactly what it always meant — the trigger has genuinely fired —
  // kept as its own, separate, automatic signal (still shown via the
  // trigger/date columns, still what credit logic and the Payments Due
  // alert actually need), completely independent of status now.
  // Date each half was marked Invoiced (set by setPaymentStatus); drives net 30 overdue.
  const invoicedDates = property.program.paymentInvoicedDates || {};
  const halfFields = (phaseKey, key, naturallyDone, amount) => {
    const status = overrides[key] || "Pending";
    return { status, done: naturallyDone, manual: !!overrides[key], invoicedDate: invoicedDates[key] || null, ...rovrFields(phaseKey, key, status === "Complete", amount) };
  };

  const ddExecuted = (property.program.serviceContractDates && property.program.serviceContractDates.rfp) || contractExecuted;
  const opts = property.program.selectedOptions || {};
  const ddSelected = !!opts.dueDiligence;
  const rfpOrIncumbentSelected = !!(opts.rfp || opts.incumbentNegotiation);
  const pdSelected = !!opts.programDesign;

  // Real phase objects, for each one-time-fee phase's own completion
  // status — the actual trigger for every "second half" payment, and
  // for every "first half" payment except whichever phase happens to
  // be first in the real, selected sequence.
  const phases = buildPhases(property.program);
  // Genuine checklist completion — every to-do actually checked —
  // rather than trusting a phase's own .done flag directly, which can
  // be softened for general workflow display (Due Diligence specifically
  // can show as done just because a later contract date exists). Real
  // billing triggers need the real thing, not an inferred assumption.
  const rawDone = (ph) => !!ph && (ph.todos || []).length > 0 && ph.todos.every((t) => t.done);
  const withGenuineDone = (ph) => ph ? { ...ph, done: rawDone(ph) } : null;
  const ddPhase = withGenuineDone(phases.find((ph) => ph.key === "dueDiligence"));
  const rfpTrackPhase = withGenuineDone(phases.find((ph) => ph.key === "rfp" || ph.key === "incumbentNegotiation"));
  const pdCombinedPhaseRaw = phases.find((ph) => ph.key === "programDesign");
  const pdSubPhase = pdCombinedPhaseRaw && pdCombinedPhaseRaw.subPhases ? withGenuineDone(pdCombinedPhaseRaw.subPhases.find((sp) => sp.key === "programDesign")) : null;
  const legalSubPhase = pdCombinedPhaseRaw && pdCombinedPhaseRaw.subPhases ? withGenuineDone(pdCombinedPhaseRaw.subPhases.find((sp) => sp.key === "contractingLegal")) : null;
  // The combined phase's own done already correctly limits itself to
  // only its contracted sub-tiles — just needs each of those sub-tiles'
  // done re-checked against genuine completion too, not trusted as-is.
  const pdCombinedPhase = pdCombinedPhaseRaw ? {
    ...pdCombinedPhaseRaw,
    done: pdCombinedPhaseRaw.subPhases.filter((sp) => sp.contracted).every((sp) => sp.key === "programDesign" ? (pdSubPhase && pdSubPhase.done) : (legalSubPhase && legalSubPhase.done)),
  } : null;

  // Each phase's "first half" depends on exactly one, specific other
  // phase — never a generic "whatever's earlier" cascade. Due Diligence
  // is never a valid trigger for anything but RFP, even when DD is
  // selected and the thing downstream isn't preceded by RFP itself.
  const contractExecutedTrigger = { trigger: "Contract Executed", done: !!contractExecuted, triggerExists: true, dueDate: contractExecuted };
  const triggerFromPhase = (label, phase) => ({
    trigger: label, done: phase ? phase.done : false, triggerExists: !!phase,
    dueDate: phase && phase.done ? phase.completedDate : null,
  });

  // DD is always the absolute lead-off phase when selected — its first
  // half uses the same single contract execution date as Advisory
  // itself, since there's no separate DD contract in reality.
  const dueDiligence = ddSelected ? {
    total: ddFee, feeConfirmed: ddFeeConfirmed,
    firstHalf: { key: "dd-1", amount: ddHalf, trigger: "Contract Executed", triggerExists: true, dueDate: ddExecuted, ...halfFields("dueDiligence", "dd-1", !!ddExecuted, ddHalf) },
    secondHalf: {
      key: "dd-2", amount: ddHalf, trigger: "DD Phase Complete",
      triggerExists: !!ddPhase, dueDate: ddPhase && ddPhase.done ? ddPhase.completedDate : null, ...halfFields("dueDiligence", "dd-2", ddPhase ? ddPhase.done : false, ddHalf),
    },
  } : null;
  // RFP's first half depends specifically on DD — its only possible
  // predecessor — contract executed directly whenever DD isn't selected.
  const rfpFirstHalf = ddSelected ? triggerFromPhase("DD Phase Complete", ddPhase) : contractExecutedTrigger;
  // RFP shows as credited the moment DD is selected on the contract —
  // the real agreement already shows RFP at $0 from day one whenever DD
  // is bundled in, not contingent on DD's own payment status.
  const rfp = ddSelected ? { total: rfpFee, credited: true, creditSource: "Due Diligence" } : {
    total: rfpFee, feeConfirmed: rfpFeeConfirmed,
    firstHalf: { key: "rfp-1", amount: rfpHalf, trigger: rfpFirstHalf.trigger, triggerExists: rfpFirstHalf.triggerExists, dueDate: rfpFirstHalf.dueDate, ...halfFields("rfp", "rfp-1", rfpFirstHalf.done, rfpHalf) },
    secondHalf: {
      key: "rfp-2", amount: rfpHalf, trigger: "RFP Phase Complete",
      triggerExists: !!rfpTrackPhase, dueDate: rfpTrackPhase && rfpTrackPhase.done ? rfpTrackPhase.completedDate : null, ...halfFields("rfp", "rfp-2", rfpTrackPhase ? rfpTrackPhase.done : false, rfpHalf),
    },
  };

  // Program Design's first half depends specifically on RFP — never DD,
  // even when DD is selected and RFP isn't. Contract executed directly
  // whenever RFP/Incumbent Negotiation isn't selected.
  const pdFirstHalf = rfpOrIncumbentSelected ? triggerFromPhase("RFP Phase Complete", rfpTrackPhase) : contractExecutedTrigger;
  const programDesign = {
    total: pdFee, feeConfirmed: pdFeeConfirmed,
    firstHalf: { key: "pd-1", amount: pdHalf, trigger: pdFirstHalf.trigger, triggerExists: pdFirstHalf.triggerExists, dueDate: pdFirstHalf.dueDate, ...halfFields("programDesign", "pd-1", pdFirstHalf.done, pdHalf) },
    secondHalf: {
      key: "pd-2", amount: pdHalf, trigger: "Program Design Phase Complete",
      triggerExists: !!pdSubPhase, dueDate: pdSubPhase && pdSubPhase.done ? pdCombinedPhase.completedDate : null, ...halfFields("programDesign", "pd-2", pdSubPhase ? pdSubPhase.done : false, pdHalf),
    },
  };

  // 24-month review flag — Vert's real contract terms show the
  // deployment rate can step down (or the client can potentially
  // redline services and cancel) once Deployment has run 24 months
  // from its own start (ISP contract execution). What actually happens
  // at that point is a real, per-client negotiation outcome — not
  // something to calculate automatically. This only flags that the
  // 24-month mark has been reached (or passed), so someone knows to go
  // find out what the client wants to do, rather than silently
  // continuing to bill the same rate as if nothing changed.
  const deploymentTrigger = pdCombinedPhase
    ? { started: pdCombinedPhase.done, startDate: pdCombinedPhase.done ? pdCombinedPhase.completedDate : null, triggerExists: true }
    : { started: !!contractExecuted, startDate: contractExecuted, triggerExists: true };
  const gatingDone = deploymentTrigger.started;
  // The gating phase being done is a real, important milestone — the
  // paperwork and program design are finished — but it doesn't mean the
  // service is actually live. There's often a genuine real-world
  // installation/cutover gap in between that can't be assumed away.
  // Billing, and the 24-month review clock, only start once a real live
  // date is on file, not from the earlier paperwork-completion date.
  const liveDate = property.program.deploymentLiveDate || null;
  // A live date only means genuinely started once that date has
  // actually arrived — a future date is scheduled, not yet billing.
  const deployGenuinelyStarted = !!liveDate && liveDate <= TODAY;
  const deployScheduled = !!liveDate && liveDate > TODAY;
  const deployStart = deployGenuinelyStarted ? liveDate : null;
  const monthsSinceDeployStart = deployStart
    ? Math.floor((parseDate(TODAY) - parseDate(deployStart)) / (30.44 * 86400000))
    : null;
  const deployment24MonthReviewDue = monthsSinceDeployStart != null && monthsSinceDeployStart >= 24;

  const deployment = {
    perUnitMonthly: 2,
    monthlyTotal: (units || 0) * 2,
    gatingDone,
    gatingCompletedDate: deploymentTrigger.startDate,
    pending: gatingDone && !liveDate,
    scheduled: deployScheduled,
    scheduledDate: deployScheduled ? liveDate : null,
    started: deployGenuinelyStarted,
    startDate: deployStart,
    termEnd: property.program.ispTermEnd || null,
    monthsSinceStart: monthsSinceDeployStart,
    reviewDue: deployment24MonthReviewDue,
    // A real, available alternative to ongoing monthly billing — paying
    // the first 24 months' worth as a single, one-time charge up front
    // instead. Computed whenever selected, even with no dedicated UI
    // for it yet.
    prepaid: !!property.program.deploymentPrepaid,
    prepaidTotal: property.program.deploymentPrepaid ? (units || 0) * 2 * 24 : null,
    // Not used in the calculation above — Vert's real contract shows
    // this can be a tiered, time-based rate (e.g. $2/unit/month for 24
    // months, then $1/unit/month after), which a single confirmed
    // number can't safely represent without misleading anyone using
    // it. Kept here purely as a visible reference so a real, confirmed
    // value from the contract isn't silently dropped.
    feeConfirmedReference: confirmedFees.deployment != null ? confirmedFees.deployment : null,
    ...rovrFields("deployment", "deployment-1", !!liveDate, (units || 0) * 2),
  };

  return { dueDiligence, rfp, programDesign, deployment };
}

// Total Contract Value — one-time fees (DD/RFP/Program Design) plus
// Deployment's ongoing revenue, projected at an assumed average
// contract length. Deployment counts whenever selected, whether or
// not it's actually gone live yet, since this reflects the full
// signed commitment, not just what's been billed so far. Shared by
// the Advisory Contracts page's totals footer and the home page's
// billing summary, so the two figures can never independently drift.
function computeTotalContractValue(executedProperties, assumedContractMonths) {
  let oneTimeTotal = 0;
  let projectedDeploymentValue = 0;
  executedProperties.forEach((p) => {
    const opts = p.program.selectedOptions || {};
    const billing = computeAdvisoryBilling(p);
    if (opts.dueDiligence && billing.dueDiligence && !billing.dueDiligence.credited) oneTimeTotal += billing.dueDiligence.total;
    if (opts.rfp && !billing.rfp.credited) oneTimeTotal += billing.rfp.total;
    if (opts.programDesign) oneTimeTotal += billing.programDesign.total;
    if (opts.deployment) projectedDeploymentValue += billing.deployment.monthlyTotal * assumedContractMonths;
  });
  return { oneTimeTotal, projectedDeploymentValue, totalContractValue: oneTimeTotal + projectedDeploymentValue };
}
