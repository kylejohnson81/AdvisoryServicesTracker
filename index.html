/* ---------------------------------------------------------
   BILLING — Revenue Tracker import (CL Advisory Services Revenue
   Tracker .xlsx, sheet "Revenue Tracker"). Spec: Billing Details
   Import. One billing record per tracker row. The import is saved to
   app_state under "revenueTrackerImport" and replaces the previous
   import each time. Status (Paid / Past due / Current / Not invoiced)
   is worked out from the dates against an as-of date when shown, so
   it moves on by itself as months turn over.
--------------------------------------------------------- */
const RT_STATE_KEY = "revenueTrackerImport";
const RT_DEFAULT_SETTINGS = { rovrRate: 0.6, rovrBucket: "RFP Services", gateRovrPaidOnPaymentDate: false };
const RT_CRITICAL_HEADERS = { A: "engagement id", G: "service bucket", P: "invoice amount", T: "estimated ap cost", V: "invoice date", W: "paid date" };
const RT_TABS = [
  { key: "rfp", bucket: "rfp services", label: "RFP Track" },
  { key: "pd", bucket: "program design / contract oversight", label: "Program Design & Contracting" },
  { key: "dep", bucket: "deployment & ongoing management", label: "Deployment & Ongoing" },
];
const RT_STATUS_LABEL = { "Paid": "Paid", "Past due": "Overdue", "Current": "Invoiced", "Not invoiced": "Pending" };
const RT_STATUS_PILL = { "Paid": "p-Paid", "Past due": "p-Overdue", "Current": "p-Invoiced", "Not invoiced": "p-Pending" };

const rtCol = (L) => L.charCodeAt(0) - 65;
const rtRound2 = (x) => Math.round((Number(x) + Number.EPSILON) * 100) / 100;
const rtCollapse = (v) => v == null ? "" : String(v).replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim();
const rtNormHead = (v) => rtCollapse(v).toLowerCase().replace(/[^a-z0-9 /&#]/g, "").replace(/\s+/g, " ").trim();
const rtIso = (d) => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
const rtDaysBetween = (a, b) => Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 86400000);

// Excel serial (1899-12-30 + days), Date, "YYYY-MM-DD" or "M/D/YYYY". Returns { iso, bad }.
function rtDate(v) {
  if (v == null || (typeof v === "string" && !v.trim())) return { iso: null, bad: false };
  if (v instanceof Date && !isNaN(v)) return { iso: rtIso(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()))), bad: false };
  if (typeof v === "number" && isFinite(v) && v > 0 && v < 2958466) return { iso: rtIso(new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 86400000)), bad: false };
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); if (!isNaN(d) && d.getUTCMonth() === +m[2] - 1) return { iso: rtIso(d), bad: false }; }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; const d = new Date(Date.UTC(y, +m[1] - 1, +m[2])); if (!isNaN(d) && d.getUTCMonth() === +m[1] - 1) return { iso: rtIso(d), bad: false }; }
  return { iso: null, bad: true };
}

// Number from a cell: { n, blank, bad }.
function rtNum(v) {
  if (v == null || (typeof v === "string" && !v.trim())) return { n: 0, blank: true, bad: false };
  if (typeof v === "number" && isFinite(v)) return { n: v, blank: false, bad: false };
  const n = Number(String(v).replace(/[$,\s]/g, "").replace(/^\((.*)\)$/, "-$1"));
  return isFinite(n) ? { n, blank: false, bad: false } : { n: 0, blank: false, bad: true };
}

// rows: array of arrays of cached cell values, rows[0] = Excel row 1, rows[r][0] = column A.
function rtParseRows(rows, opts) {
  const sourceFile = (opts && opts.sourceFile) || "";
  const sheetName = (opts && opts.sheetName) || "";
  const cell = (r, L) => (rows[r] || [])[rtCol(L)];
  let h = -1;
  for (let r = 0; r < Math.min(25, rows.length); r++) if (rtNormHead(cell(r, "A")) === "engagement id") { h = r; break; }
  if (h < 0) return { blocking: ["Header row not found: no cell in column A of the first 25 rows reads \"Engagement ID\"."], records: [] };
  const blocking = [];
  Object.entries(RT_CRITICAL_HEADERS).forEach(([L, want]) => {
    const got = rtNormHead(cell(h, L));
    if (got !== want && !got.startsWith(want)) blocking.push(`Column ${L} header is "${rtCollapse(cell(h, L)) || "(blank)"}", expected "${want.replace(/\b\w/g, (c) => c.toUpperCase())}". A column may have been moved or renamed.`);
  });
  if (blocking.length) return { blocking, records: [], headerRow: h + 1 };

  const records = [];
  for (let r = h + 1; r < rows.length; r++) {
    const eid = rtCollapse(cell(r, "A"));
    if (!eid) continue;
    const w = [];
    const P = rtNum(cell(r, "P"));
    if (P.blank) w.push("Invoice Amount (P) is blank; imported as 0.");
    else if (P.bad) w.push("Invoice Amount (P) is not a number; imported as 0.");
    else if (P.n < 0) w.push("Invoice Amount (P) is negative.");
    const T = rtNum(cell(r, "T"));
    if ((T.blank || T.bad) && P.n > 0) w.push("Estimated AP Cost (T) is blank; ROVR pending imported as 0.");
    const Q = rtNum(cell(r, "Q"));
    const V = rtDate(cell(r, "V")), W = rtDate(cell(r, "W")), Y = rtDate(cell(r, "Y"));
    if (V.bad) w.push("Invoice Date (V) is not a valid date; imported as blank.");
    if (W.bad) w.push("Paid Date (W) is not a valid date; imported as blank.");
    if (Y.bad) w.push("ROVR Payment Date (Y) is not a valid date; imported as blank.");
    if (W.iso && (Q.blank || Q.bad || Q.n === 0)) w.push("Paid Date (W) is filled but Amount Collected (Q) is blank or 0.");
    if (W.iso && V.iso && W.iso < V.iso) w.push("Paid Date (W) is earlier than Invoice Date (V).");
    if (W.iso && !V.iso) w.push("Paid Date (W) is filled but Invoice Date (V) is blank.");
    const yardi = rtCollapse(cell(r, "D"));
    const inv = cell(r, "X");
    records.push({
      source_row: r + 1,
      engagement_id: eid,
      client_owner: rtCollapse(cell(r, "B")),
      property: rtCollapse(cell(r, "C")),
      yardi_code: !yardi || /^n\/?a$/i.test(yardi) ? null : yardi,
      service_bucket: rtCollapse(cell(r, "G")),
      billing_milestone: rtCollapse(cell(r, "H")),
      tracker_status: rtCollapse(cell(r, "I")),
      invoice_number: inv == null || String(inv).trim() === "" ? null : String(inv).trim(),
      invoice_date: V.iso,
      paid_date: W.iso,
      rovr_payment_date: Y.iso,
      invoiced: rtRound2(P.n),
      rovr_pending: rtRound2(T.n),
      amount_collected: Q.blank || Q.bad ? null : rtRound2(Q.n),
      warnings: w,
    });
  }
  // Duplicate natural key (engagement + bucket + milestone).
  const seen = new Map();
  records.forEach((rec) => { const k = `${rec.engagement_id}|${rec.service_bucket}|${rec.billing_milestone}`.toLowerCase(); seen.set(k, (seen.get(k) || 0) + 1); });
  records.forEach((rec) => { const k = `${rec.engagement_id}|${rec.service_bucket}|${rec.billing_milestone}`.toLowerCase(); if (seen.get(k) > 1) rec.warnings.push("Duplicate Engagement ID + Service Bucket + Billing Milestone; kept as a separate line (see source row)."); });
  return { blocking: [], records, headerRow: h + 1, sourceFile, sheetName };
}

// Reads a File with SheetJS (window.XLSX, already loaded for Import / Export).
async function rtReadWorkbook(file) {
  if (!window.XLSX) throw new Error("The spreadsheet reader (SheetJS) didn't load. Refresh and try again.");
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: "array", cellFormula: false });
  const sheetName = wb.SheetNames.find((n) => n.trim().toLowerCase() === "revenue tracker") || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const range = ws && ws["!ref"] ? window.XLSX.utils.decode_range(ws["!ref"]) : { e: { r: -1 } };
  const rows = [];
  for (let r = 0; r <= range.e.r; r++) {
    const row = [];
    for (let c = 0; c < 26; c++) { const x = ws[window.XLSX.utils.encode_cell({ r, c })]; row.push(x ? x.v : null); }
    rows.push(row);
  }
  return rtParseRows(rows, { sourceFile: file.name, sheetName });
}

// Business rules 4.1–4.3 for one record at an as-of date (YYYY-MM-DD).
function rtEvaluate(rec, asOf, settings) {
  const s = { ...RT_DEFAULT_SETTINGS, ...(settings || {}) };
  const isRovrBucket = rec.service_bucket.trim().toLowerCase() === String(s.rovrBucket).trim().toLowerCase();
  let rovr_paid = isRovrBucket ? rtRound2(rec.invoiced * Number(s.rovrRate)) : 0;
  if (s.gateRovrPaidOnPaymentDate && !rec.rovr_payment_date) rovr_paid = 0;
  // Net 30: past due once more than NET_TERMS_DAYS have passed since the invoice date.
  const daysSinceInvoice = rec.invoice_date ? rtDaysBetween(rec.invoice_date, asOf) : 0;
  let payment_status;
  if (rec.paid_date) payment_status = "Paid";
  else if (!rec.invoice_date) payment_status = "Not invoiced";
  else if (daysSinceInvoice > NET_TERMS_DAYS) payment_status = "Past due";
  else payment_status = "Current";
  const past_due = payment_status === "Past due";
  return {
    ...rec,
    rovr_paid,
    payment_status,
    past_due,
    past_due_amount: past_due ? rec.invoiced : 0,
    days_past_due: past_due ? daysSinceInvoice - NET_TERMS_DAYS : 0,
    paid: payment_status === "Paid" ? rec.invoiced : 0,
    outstanding: payment_status === "Paid" ? 0 : rec.invoiced,
  };
}

const rtBaseId = (eid) => String(eid || "").trim().replace(/-(PD|OM)$/i, "");

function rtTotals(evaluated) {
  const t = { rows: evaluated.length, invoiced: 0, rovr_pending: 0, rovr_paid: 0, paid: 0, current: 0, past_due: 0, not_invoiced: 0, past_due_rows: 0, warning_rows: 0 };
  const props = new Set();
  evaluated.forEach((r) => {
    t.invoiced += r.invoiced; t.rovr_pending += r.rovr_pending; t.rovr_paid += r.rovr_paid;
    if (r.payment_status === "Paid") t.paid += r.invoiced;
    else if (r.payment_status === "Current") t.current += r.invoiced;
    else if (r.payment_status === "Past due") { t.past_due += r.invoiced; t.past_due_rows++; }
    else t.not_invoiced += r.invoiced;
    if (r.warnings && r.warnings.length) t.warning_rows++;
    props.add(rtBaseId(r.engagement_id));
  });
  Object.keys(t).forEach((k) => { if (typeof t[k] === "number" && !/rows$/.test(k)) t[k] = rtRound2(t[k]); });
  t.properties = props.size;
  return t;
}

const RT_EXPORT_FIELDS = ["source_row", "engagement_id", "client_owner", "property", "yardi_code", "service_bucket", "billing_milestone", "tracker_status", "invoice_number", "invoice_date", "paid_date", "rovr_payment_date", "invoiced", "rovr_pending", "rovr_paid", "payment_status", "past_due", "past_due_amount", "days_past_due", "warnings"];
function rtDownload(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function rtExport(kind, imp, evaluated, asOf) {
  const stamp = asOf.replace(/-/g, "");
  const records = evaluated.map((r) => Object.fromEntries(RT_EXPORT_FIELDS.map((f) => [f, r[f] === undefined ? null : r[f]])));
  if (kind === "json") {
    const env = { generated_at: new Date().toISOString(), source_file: imp.source_file, as_of_date: asOf, settings: { ...RT_DEFAULT_SETTINGS, ...(imp.settings || {}) }, totals: rtTotals(evaluated), records };
    rtDownload(`billing_import_${stamp}.json`, JSON.stringify(env, null, 2), "application/json");
  } else {
    const esc = (v) => { const s = Array.isArray(v) ? v.join(" | ") : v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = [RT_EXPORT_FIELDS.join(","), ...records.map((r) => RT_EXPORT_FIELDS.map((f) => esc(r[f])).join(","))].join("\n");
    rtDownload(`billing_import_${stamp}.csv`, csv, "text/csv");
  }
}

const rtMoney = (n) => `${n < 0 ? "-" : ""}$${Math.abs(Math.round(n)).toLocaleString()}`;
const rtMoney2 = (n) => `${n < 0 ? "-" : ""}$${Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;


// Links a billing line to a tracker property: Yardi code first, then name.
// A property's "Previous Names" attribute, lowercased (separate several with ; or a new line).
function previousNamesOf(p) {
  const a = (p && p.program && p.program.attributes) || {};
  return String(a["Previous Names"] || "").split(/[;|\n]+/).map((x) => x.trim().toLowerCase()).filter(Boolean);
}

function rtPropertyMatcher(properties) {
  const byYardi = new Map(), byName = new Map(), byPrevName = new Map();
  const nn = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  (properties || []).forEach((p) => {
    const a = (p.program && p.program.attributes) || {};
    if (a["Yardi Code"]) byYardi.set(String(a["Yardi Code"]).toLowerCase(), p);
    if (p.name) byName.set(nn(p.name), p);
    // A property's "Previous Names" attribute (separate several with ; or a new line)
    // also matches billing lines filed under those names.
    String(a["Previous Names"] || "").split(/[;|\n]+/).map(nn).filter(Boolean).forEach((k) => { if (!byPrevName.has(k)) byPrevName.set(k, p); });
  });
  return (r) => (r.yardi_code && byYardi.get(String(r.yardi_code).toLowerCase())) || byName.get(nn(r.property))
    || byPrevName.get(nn(r.property))
    || null;
}

// Advisory Contracts guide billing: a Revenue Tracker line only counts when it
// matches a tracker property with an executed advisory contract that includes
// the service the line bills for. Returns null when it counts, otherwise why not.
function rtNotContractedReason(r, p) {
  if (!p) return "No matching property on the tracker";
  const prog = p.program || {};
  if (!prog.advisoryContractExecuted) return "No executed advisory contract";
  const svc = RT_BUCKET_SERVICE[String(r.service_bucket || "").trim().toLowerCase()];
  if (!svc) return `Unrecognized service bucket "${r.service_bucket || ""}"`;
  const opts = prog.selectedOptions || {};
  if (!svc.keys.some((k) => opts[k])) return `${svc.label} isn't on the advisory contract`;
  return null;
}

// Splits evaluated lines into those that count (contracted) and those that don't (excluded).
function rtSplitByContract(evaluated, properties) {
  const match = rtPropertyMatcher(properties);
  const contracted = [], excluded = [];
  (evaluated || []).forEach((r) => {
    const p = match(r);
    const reason = rtNotContractedReason(r, p);
    if (reason) excluded.push({ line: r, property: p, reason }); else contracted.push(r);
  });
  return { contracted, excluded };
}

// Lists Revenue Tracker lines left out of billing because Advisory Contracts doesn't cover them.
function RtExcludedPanel({ excluded, onOpenProperty }) {

        <b style={{ fontWeight: 600 }}>Not on Advisory Contracts, not counted</b>
        <span style={{ color: "var(--mut)" }}>{excluded.length} line{excluded.length === 1 ? "" : "s"} · {rtMoney(total)}</span>
        <span style={{ marginLeft: "auto", color: "var(--mut)", fontSize: 12 }}>{open ? "Hide" : "Show"}</span>
      </button>
      {open && (
        <div className="tw" style={{ marginTop: 8 }}>
          <table className="rt-table">
            <thead><tr><th>Property</th><th>Engagement</th><th>Service</th><th>Milestone</th><th className="r">Amount</th><th>Why it isn't counted</th></tr></thead>
            <tbody>
              {excluded.map(({ line: r, property: p, reason }) => (
                <tr key={r.source_row}>
                  <td className="rt-wrap">{p ? <button className="link" onClick={() => onOpenProperty && onOpenProperty(p)}>{p.code} {p.name}</button> : r.property}</td>
                  <td>{r.engagement_id}</td>
                  <td className="rt-wrap">{r.service_bucket}</td>
                  <td>{r.billing_milestone || "—"}</td>
                  <td className="r">{rtMoney(r.invoiced)}</td>
                  <td className="rt-wrap" style={{ color: "var(--mut)" }}>{reason}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="foot" style={{ marginTop: 6 }}>Advisory Contracts guides billing. These lines are left out of every billing total until the property's advisory contract is executed with that service selected.</div>
    </div>
  );
}

// Service bucket -> the Advisory Contracts service(s) it bills for.
const RT_BUCKET_SERVICE = {
  "rfp services": { keys: ["rfp", "incumbentNegotiation"], feeKey: "rfp", label: "RFP" },
  "program design / contract oversight": { keys: ["programDesign"], feeKey: "programDesign", label: "Program Design" },
  "deployment & ongoing management": { keys: ["deployment"], feeKey: null, label: "Deployment" },
};
const RT_CHECK_META = {
  noMatch: { sev: "warn", title: "Billing line not matched to a tracker property" },
  multiEngagement: { sev: "warn", title: "More than one engagement ID for one property" },
  noContract: { sev: "error", title: "Billed, but no executed advisory contract" },
  serviceNotContracted: { sev: "error", title: "Service billed that isn't on the contract" },
  billedBeforeExecution: { sev: "warn", title: "Invoiced before the contract was executed" },
  feeMismatch: { sev: "warn", title: "Billed amount differs from the contracted fee" },
  closedUnpaid: { sev: "warn", title: "Closed property with unpaid billing" },
  contractNotBilled: { sev: "info", title: "Executed contract with no billing lines" },
  serviceNotBilled: { sev: "info", title: "Contracted service with no billing lines" },
};

// Cross-checks the Revenue Tracker import against Advisory Contracts data.
// evaluated: rtEvaluate() output. Returns [{ type, sev, title, detail, property, lines }].
function rtContractChecks(evaluated, properties) {
  const out = [];
  if (!evaluated || !evaluated.length) return out;
  const match = rtPropertyMatcher(properties);
  const add = (type, detail, property, lines) => out.push({ type, ...RT_CHECK_META[type], detail, property: property || null, lines: lines || [] });
  const byProp = new Map();
  const unmatched = new Map();
  evaluated.forEach((r) => {
    const p = match(r);
    if (!p) { const k = rtBaseId(r.engagement_id); if (!unmatched.has(k)) unmatched.set(k, []); unmatched.get(k).push(r); return; }
    if (!byProp.has(p.id)) byProp.set(p.id, { p, lines: [] });
    byProp.get(p.id).lines.push(r);
  });
  unmatched.forEach((lines, k) => add("noMatch", `${k} · ${lines[0].property}${lines[0].yardi_code ? ` (Yardi ${lines[0].yardi_code})` : ""} — no tracker property with that Yardi code or name.`, null, lines));

  byProp.forEach(({ p, lines }) => {
    const prog = p.program || {};
    const opts = prog.selectedOptions || {};
    const executed = prog.advisoryContractExecuted || null;
    // One contract per property should mean one engagement ID in the Revenue Tracker.
    const engs = new Map();
    lines.forEach((l) => { const k = rtBaseId(l.engagement_id); if (!engs.has(k)) engs.set(k, { names: new Set(), total: 0 }); const g = engs.get(k); g.names.add(l.property); g.total += l.invoiced; });
    if (engs.size > 1) add("multiEngagement", `${engs.size} engagement IDs in the Revenue Tracker: ${[...engs.entries()].map(([k, g]) => `${k} (${[...g.names].join(" / ")}, ${rtMoney(g.total)})`).join("; ")}. Merge them into one in the file.`, p, lines);
    if (!executed) add("noContract", `${lines.length} billing line${lines.length === 1 ? "" : "s"} (${rtMoney(lines.reduce((s, l) => s + l.invoiced, 0))})${prog.advisoryContractDrafted ? `; contract drafted ${fmtDate(prog.advisoryContractDrafted)} but not executed` : "; no advisory contract on the tracker"}.`, p, lines);
    let billing = null; try { billing = computeAdvisoryBilling(p); } catch (e) {}
    const buckets = new Map();
    lines.forEach((l) => { const b = l.service_bucket.toLowerCase(); if (!buckets.has(b)) buckets.set(b, []); buckets.get(b).push(l); });
    buckets.forEach((bl, b) => {
      const svc = RT_BUCKET_SERVICE[b];
      if (!svc) return;
      const billed = bl.reduce((s, l) => s + l.invoiced, 0);
      if (executed && !svc.keys.some((k) => opts[k])) add("serviceNotContracted", `${svc.label} billed (${rtMoney(billed)}) but ${svc.label} isn't a selected service on the contract.`, p, bl);
      if (svc.feeKey && billing && billing[svc.feeKey] && !billing[svc.feeKey].credited && Number.isFinite(billing[svc.feeKey].total) && svc.keys.some((k) => opts[k])) {
        const fee = billing[svc.feeKey].total;
        if (Math.abs(fee - billed) > 1) add("feeMismatch", `${svc.label}: Revenue Tracker bills ${rtMoney(billed)} across ${bl.length} line${bl.length === 1 ? "" : "s"}; the contract fee is ${rtMoney(fee)} (difference ${rtMoney(billed - fee)}).`, p, bl);
      }
    });
    if (executed) {
      const early = lines.filter((l) => l.invoice_date && l.invoice_date < String(executed).slice(0, 10));
      if (early.length) add("billedBeforeExecution", `${early.length} line${early.length === 1 ? "" : "s"} invoiced before the contract was executed on ${fmtDate(String(executed).slice(0, 10))} (earliest ${fmtDate(early.map((l) => l.invoice_date).sort()[0])}).`, p, early);
    }
    if (prog.manualStatus === "Closed") {
      const unpaid = lines.filter((l) => l.payment_status !== "Paid" && l.invoiced > 0);
      if (unpaid.length) add("closedUnpaid", `Property is Closed but has ${rtMoney(unpaid.reduce((s, l) => s + l.invoiced, 0))} not yet paid across ${unpaid.length} line${unpaid.length === 1 ? "" : "s"}.`, p, unpaid);
    }
  });

  (properties || []).forEach((p) => {
    const prog = p.program || {};
    if (!prog.advisoryContractExecuted || prog.manualStatus === "Closed") return;
    const entry = byProp.get(p.id);
    if (!entry) { add("contractNotBilled", `Contract executed ${fmtDate(String(prog.advisoryContractExecuted).slice(0, 10))}; nothing for this property in the Revenue Tracker.`, p, []); return; }
    const opts = prog.selectedOptions || {};
    const billedBuckets = new Set(entry.lines.map((l) => l.service_bucket.toLowerCase()));
    Object.entries(RT_BUCKET_SERVICE).forEach(([b, svc]) => {
      // Deployment billing only starts at go-live, so only expect it once there's a live date.
      if (b === "deployment & ongoing management" && !prog.deploymentLiveDate) return;
      if (svc.keys.some((k) => opts[k]) && !billedBuckets.has(b)) add("serviceNotBilled", `${svc.label} is on the contract but has no billing lines in the Revenue Tracker.`, p, []);
    });
  });
  const rank = { error: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || a.type.localeCompare(b.type) || String(a.property ? a.property.code : "~").localeCompare(String(b.property ? b.property.code : "~")));
}

const RT_SEV_STYLE = { error: { bg: "#6e2a28", color: "#ffc7c1", label: "Fix" }, warn: { bg: "#5a4a1a", color: "#ffd98a", label: "Review" }, info: { bg: "#2a3d6d", color: "#c4d1e8", label: "FYI" } };

function RtChecksPanel({ checks, onOpenProperty, compact }) {
  const [open, setOpen] = useState(() => new Set());
  const groups = useMemo(() => {
    const m = new Map();
    checks.forEach((c) => { if (!m.has(c.type)) m.set(c.type, []); m.get(c.type).push(c); });
    return [...m.entries()];
  }, [checks]);
  if (!checks.length) return <div className="card" style={{ marginTop: 12 }}><h3 style={{ marginBottom: 4 }}>Contract checks</h3><div className="c-g">Billing agrees with Advisory Contracts — nothing to review.</div></div>;
  const toggle = (k) => setOpen((s) => { const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n; });
  return (
    <div className="card" style={{ marginTop: 12 }}>
      <h3 style={{ marginBottom: 8 }}>Contract checks <span style={{ fontWeight: 400, color: "var(--mut)", fontSize: 13 }}>· Revenue Tracker vs Advisory Contracts</span></h3>
      {groups.map(([type, items]) => {
        const st = RT_SEV_STYLE[items[0].sev];
        const isOpen = open.has(type) || compact === false;
        return (
          <div key={type} style={{ borderTop: "1px solid var(--line)", padding: "8px 0" }}>
            <button className="link" style={{ textDecoration: "none", color: "var(--txt)", fontSize: 13.5, display: "flex", gap: 8, alignItems: "center", width: "100%" }} onClick={() => toggle(type)}>
              <span className="pill" style={{ background: st.bg, color: st.color }}>{st.label}</span>
              <b style={{ fontWeight: 600 }}>{items[0].title}</b>
              <span style={{ color: "var(--mut)" }}>{items.length}</span>
              <span style={{ marginLeft: "auto", color: "var(--mut)", fontSize: 12 }}>{isOpen ? "Hide" : "Show"}</span>
            </button>
            {isOpen && (
              <ul style={{ margin: "6px 0 0", paddingLeft: 18, fontSize: 13 }}>
                {items.map((c, i) => (
                  <li key={i} style={{ margin: "4px 0" }}>
                    {c.property ? <button className="link" onClick={() => onOpenProperty && onOpenProperty(c.property)}>{c.property.code} {c.property.name}</button> : null}
                    {c.property ? " — " : ""}<span style={{ color: "var(--mut)" }}>{c.detail}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      })}
    </div>
  );
}

function RevenueImportModal({ onClose, onSave, previous, properties }) {
  const [parsed, setParsed] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [settings, setSettings] = useState(() => ({ ...RT_DEFAULT_SETTINGS, ...((previous && previous.settings) || {}) }));
  const [asOf, setAsOf] = useState(TODAY);
  const onPick = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    setErr(null); setParsed(null); setBusy(true);
    try { setParsed(await rtReadWorkbook(f)); } catch (x) { setErr(x.message); }
    setBusy(false);
  };
  const evaluated = useMemo(() => parsed && !parsed.blocking.length ? parsed.records.map((r) => rtEvaluate(r, asOf, settings)) : [], [parsed, asOf, settings]);
  const t = useMemo(() => rtTotals(evaluated), [evaluated]);
  const checks = useMemo(() => rtContractChecks(evaluated, properties || []), [evaluated, properties]);
  const save = async () => {
    setBusy(true); setErr(null);
    try {
      await onSave({ source_file: parsed.sourceFile, sheet: parsed.sheetName, header_row: parsed.headerRow, imported_at: new Date().toISOString(), settings, records: parsed.records });
      onClose();
    } catch (x) { setErr(`Couldn't save: ${x.message}`); }
    setBusy(false);
  };
  const row = (k, v) => <div className="contract-date-row"><span className="field-label">{k}</span><span className="mono">{v}</span></div>;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-wide" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div><div className="field-label">Billing</div><h2>Import Revenue Tracker</h2></div>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><X size={18} /></button>
        </div>
        <p className="dim" style={{ marginTop: 0 }}>Upload the CL Advisory Services Revenue Tracker (.xlsx). Save it in Excel first so the formula columns hold current values. Saving replaces the previous import{previous && previous.source_file ? ` (${previous.source_file})` : ""}.</p>
        <label className="btn-primary" style={{ display: "inline-flex", cursor: "pointer" }}>
          <Plus size={14} /> {parsed ? "Choose a different file" : "Choose file"}
          <input type="file" accept=".xlsx,.xlsm,.xls" style={{ display: "none" }} onChange={onPick} />
        </label>
        {busy && !parsed && <div className="dim" style={{ marginTop: 10 }}>Reading…</div>}
        {err && <div style={{ color: "#ff8f86", marginTop: 10 }}>{err}</div>}
        {parsed && parsed.blocking.length > 0 && (
          <div style={{ marginTop: 14, border: "1px solid #9E3B2E", background: "rgba(158,59,46,0.15)", borderRadius: 6, padding: 12 }}>
            <b>Can't import this file</b>
            <ul style={{ margin: "6px 0 0", paddingLeft: 18 }}>{parsed.blocking.map((b, i) => <li key={i}>{b}</li>)}</ul>
          </div>
        )}
        {parsed && !parsed.blocking.length && (
          <>
            <div className="section-header">Preview — {parsed.sourceFile} · sheet "{parsed.sheetName}" · header row {parsed.headerRow}</div>
            <div className="attr-edit-grid" style={{ marginBottom: 12 }}>
              <div className="attr-edit-item"><label>As-of date (preview)</label><input type="date" value={asOf} onChange={(e) => setAsOf(e.target.value || TODAY)} /></div>
              <div className="attr-edit-item"><label>ROVR paid rate</label><input type="number" step="0.01" min="0" max="1" value={settings.rovrRate} onChange={(e) => setSettings((s) => ({ ...s, rovrRate: Number(e.target.value) }))} /></div>
              <div className="attr-edit-item"><label>ROVR paid service bucket</label><input type="text" value={settings.rovrBucket} onChange={(e) => setSettings((s) => ({ ...s, rovrBucket: e.target.value }))} /></div>
              <div className="attr-edit-item"><label>ROVR paid only once ROVR Payment Date is filled</label>
                <select value={settings.gateRovrPaidOnPaymentDate ? "yes" : "no"} onChange={(e) => setSettings((s) => ({ ...s, gateRovrPaidOnPaymentDate: e.target.value === "yes" }))}><option value="no">No (default)</option><option value="yes">Yes</option></select>
              </div>
            </div>
            <div className="contract-dates-list">
              {row("Rows imported", t.rows)}
              {row("Properties", t.properties)}
              {row("Invoiced (P)", rtMoney2(t.invoiced))}
              {row("ROVR pending (T)", rtMoney2(t.rovr_pending))}
              {row("ROVR paid", rtMoney2(t.rovr_paid))}
              {row("Paid / Invoiced / Overdue / Pending", `${rtMoney(t.paid)} / ${rtMoney(t.current)} / ${rtMoney(t.past_due)} / ${rtMoney(t.not_invoiced)}`)}
              {row("Past due", `${t.past_due_rows} rows · ${rtMoney2(t.past_due)}`)}
              {row("Rows with warnings", t.warning_rows)}
            </div>
            <div className="section-header">Checks against Advisory Contracts</div>
            {checks.length === 0 ? <div style={{ color: "#7bd88a" }}>Billing agrees with Advisory Contracts.</div> : (
              <div className="contract-dates-list">
                {Object.values(checks.reduce((m, c) => { (m[c.type] = m[c.type] || { ...c, n: 0 }).n++; return m; }, {})).map((c) => (
                  <div key={c.type} className="contract-date-row"><span><span className="pill" style={{ background: RT_SEV_STYLE[c.sev].bg, color: RT_SEV_STYLE[c.sev].color, marginRight: 8, fontSize: 11 }}>{RT_SEV_STYLE[c.sev].label}</span>{c.title}</span><span className="mono">{c.n}</span></div>
                ))}
                <div className="dim" style={{ fontSize: 12.5 }}>These don't block the import. After saving, the Billing page lists each one with the property.</div>
              </div>
            )}
            {t.warning_rows > 0 && (
              <details style={{ marginTop: 10 }}>
                <summary style={{ cursor: "pointer" }}>Show {t.warning_rows} rows with warnings</summary>
                <div style={{ maxHeight: 240, overflowY: "auto", marginTop: 6, fontSize: 12.5 }}>
                  {evaluated.filter((r) => r.warnings.length).map((r) => (
                    <div key={r.source_row} style={{ padding: "6px 0", borderTop: "1px solid var(--border)" }}>
                      <b>Row {r.source_row}</b> · {r.engagement_id} · {r.service_bucket} · {r.billing_milestone}
                      <ul style={{ margin: "2px 0 0", paddingLeft: 18, color: "var(--ink-muted)" }}>{r.warnings.map((x, i) => <li key={i}>{x}</li>)}</ul>
                    </div>
                  ))}
                </div>
              </details>
            )}
          </>
        )}
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn-primary" disabled={!parsed || parsed.blocking.length > 0 || !parsed.records.length || busy} onClick={save}>{busy && parsed ? "Saving…" : "Save import"}</button>
        </div>
      </div>
    </div>
  );
}

function BillingView({ properties, allProperties, onOpenProperty, onSetPaymentStatus, onExport, billingImport, onSaveBillingImport, statusFilter, onStatusFilterChange }) {
  const [tab, setTab] = useState("totals");
  const [search, setSearch] = useState("");
  const [asOf, setAsOf] = useState(TODAY);
  const [legacy, setLegacy] = useState(false);
  const [showWarnings, setShowWarnings] = useState(false);
  const imp = billingImport && Array.isArray(billingImport.records) ? billingImport : null;

  const evaluatedAll = useMemo(() => imp ? imp.records.map((r) => rtEvaluate(r, asOf || TODAY, imp.settings)) : [], [imp, asOf]);
  // Advisory Contracts guides billing: only lines for an executed, contracted service count.
  const split = useMemo(() => rtSplitByContract(evaluatedAll, allProperties || properties), [evaluatedAll, allProperties, properties]);
  const evaluated = split.contracted;
  // Link billing rows to tracker properties by Yardi code, then by name.
  const findProperty = useMemo(() => rtPropertyMatcher(allProperties || properties), [allProperties, properties]);
  const checks = useMemo(() => rtContractChecks(evaluatedAll, allProperties || properties), [evaluatedAll, allProperties, properties]);

  const tabDef = RT_TABS.find((x) => x.key === tab);
  const scoped = tab === "totals" ? evaluated : evaluated.filter((r) => r.service_bucket.toLowerCase() === tabDef.bucket);
  const q = search.toLowerCase();
  const matches = (r) => !q || `${r.engagement_id} ${r.property} ${r.client_owner} ${r.yardi_code || ""} ${r.invoice_number || ""}`.toLowerCase().includes(q);
  const statusOk = (r) => billingStatusMatches(statusFilter, RT_STATUS_BUCKET[r.payment_status]);
  const shown = (r) => matches(r) && statusOk(r);
  const agg = useMemo(() => rtTotals(scoped), [scoped]);
  const tabsPresent = RT_TABS.filter((x) => evaluated.some((r) => r.service_bucket.toLowerCase() === x.bucket));

  // One row per tracker property (P-code), whatever engagement IDs or names
  // the Revenue Tracker files its lines under; those engagement IDs are listed.
  const propertyTotals = useMemo(() => {
    const m = new Map();
    scoped.forEach((r) => {
      const tracker = findProperty(r);
      const k = tracker ? `p${tracker.id}` : rtBaseId(r.engagement_id);
      if (!m.has(k)) m.set(k, { key: k, tracker, property: tracker ? tracker.name : r.property, client: r.client_owner, engagements: [], lines: [], total: 0, paid: 0, outstanding: 0, rovr_paid: 0, rovr_pending: 0, maxDays: 0 });
      const e = m.get(k);
      const eid = rtBaseId(r.engagement_id);
      if (eid && !e.engagements.includes(eid)) e.engagements.push(eid);
      e.lines.push(r); e.total += r.invoiced; e.paid += r.paid; e.outstanding += r.outstanding; e.rovr_paid += r.rovr_paid; e.rovr_pending += r.rovr_pending;
      if (r.days_past_due > e.maxDays) e.maxDays = r.days_past_due;
    });
    return [...m.values()].map((e) => {
      const st = e.lines.some((l) => l.payment_status === "Past due") ? "Past due"
        : e.lines.every((l) => l.payment_status === "Paid") ? "Paid"
        : e.lines.some((l) => l.payment_status === "Current") ? "Current" : "Not invoiced";
      return { ...e, status: st };
    }).sort((a, b) => String(a.tracker ? a.tracker.code : `~${a.key}`).localeCompare(String(b.tracker ? b.tracker.code : `~${b.key}`)));
  }, [scoped, findProperty]);

  // No Revenue Tracker imported yet: go straight to the calculated billing dashboard.
  if (!imp) {
    return (
      <div>
        <div className="proto-dash"><div className="wrap" style={{ paddingBottom: 0 }}><div className="foot" style={{ marginTop: 0 }}>Showing calculated billing. Once the Revenue Tracker is imported (Import / Export → Refresh Billing), this page switches to it.</div></div></div>
        <LegacyBillingView properties={properties} onOpenProperty={onOpenProperty} onSetPaymentStatus={onSetPaymentStatus} onExport={onExport} statusFilter={statusFilter} onStatusFilterChange={onStatusFilterChange} />
      </div>
    );
  }

  if (legacy) {
    return (
      <div>
        <div className="proto-dash"><div className="wrap" style={{ paddingBottom: 0 }}><button className="link" onClick={() => setLegacy(false)}>← Back to Revenue Tracker billing</button></div></div>
        <LegacyBillingView properties={properties} onOpenProperty={onOpenProperty} onSetPaymentStatus={onSetPaymentStatus} onExport={onExport} statusFilter={statusFilter} onStatusFilterChange={onStatusFilterChange} />
      </div>
    );
  }

  const statusPill = (st, days) => <span className={`pill ${RT_STATUS_PILL[st]}`} title={st === "Past due" ? `${days} days past due (net 30)` : st}>{RT_STATUS_LABEL[st]}{st === "Past due" && days ? ` · ${days}d` : ""}</span>;
  const nameCell = (label, tracker, eid, engagements) => (
    <td className={`rt-wrap${tracker ? " click" : ""}`} onClick={tracker ? (ev) => { ev.stopPropagation(); onOpenProperty(tracker); } : undefined} style={tracker ? { cursor: "pointer" } : undefined}>
      <div>{label}</div><span className="id" style={tracker ? undefined : { opacity: 0.6 }}>{tracker ? tracker.code : eid}</span>
      {engagements && engagements.length > 0 && <span className="id" style={{ opacity: 0.6, marginLeft: 6 }} title="Revenue Tracker engagement IDs">{engagements.join(", ")}</span>}
    </td>
  );

  return (
    <div className="proto-dash">
      <div className="wrap">
        <h1>Billing</h1>
        <p className="sub">
          {imp ? <>From the Revenue Tracker import: <b>{imp.source_file || "Revenue Tracker"}</b>, imported {imp.imported_at ? fmtDate(imp.imported_at.slice(0, 10)) : "—"}{imp.imported_by ? ` by ${imp.imported_by}` : ""}. Status comes from the invoice and paid dates.</> : "No Revenue Tracker has been imported yet. Import it from Import / Export in the header."}
        </p>
        <div className="toolbar" style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          {imp && <label style={{ display: "flex", gap: 6, alignItems: "center", color: "var(--mut)", fontSize: 13 }}>As of <input type="date" value={asOf} onChange={(e) => setAsOf(e.target.value || TODAY)} /></label>}
          <span className="sp" style={{ flex: 1 }} />
          <button className="link" onClick={() => setLegacy(true)}>Calculated billing (previous method)</button>
        </div>

        {!imp ? (
          <div className="card" style={{ marginTop: 12 }}>To see invoiced, paid, past-due and ROVR amounts here, use <b>Import / Export → Refresh Billing (Revenue Tracker)</b> in the header.</div>
        ) : (
          <>
            <div className="card" style={{ marginTop: 12 }}>
              <h3>ROVR Score</h3>
              <div className="kpis">
                <div className="kpi"><div className="v">{rtMoney(agg.invoiced)}</div><div className="k">Greystar invoiced</div><div className="n">Invoice Amount (P)</div></div>
                <div className="kpi"><div className="v c-g">{rtMoney(agg.rovr_paid)}</div><div className="k">ROVR paid</div><div className="n">of {rtMoney(agg.paid)} paid</div></div>
                <div className="kpi"><div className="v c-b">{rtMoney(agg.rovr_pending)}</div><div className="k">ROVR pending</div><div className="n">of {rtMoney(agg.invoiced)} contract total</div></div>
              </div>
            </div>

            <div className="kpis" style={{ marginTop: 12 }}>
              <div className="kpi"><div className="v">{rtMoney(agg.invoiced)}</div><div className="k">Contract total, {agg.properties} {agg.properties === 1 ? "property" : "properties"}</div></div>
              <div className="kpi"><div className="v c-g">{rtMoney(agg.paid)}</div><div className="k">Paid</div></div>
              <div className="kpi"><div className="v c-b">{rtMoney(agg.current)}</div><div className="k">Invoiced</div></div>
              <div className="kpi"><div className="v c-r">{rtMoney(agg.past_due)}</div><div className="k">Overdue{agg.past_due_rows ? `, ${agg.past_due_rows} lines` : ""}</div></div>
              <div className="kpi"><div className="v c-a">{rtMoney(agg.not_invoiced)}</div><div className="k">Pending</div></div>
            </div>

            <RtChecksPanel checks={checks} onOpenProperty={onOpenProperty} />
            <RtExcludedPanel excluded={split.excluded} onOpenProperty={onOpenProperty} />

            <div className="tabs" role="tablist">
              <button className={tab === "totals" ? "on" : ""} onClick={() => setTab("totals")}>Property totals</button>
              {tabsPresent.map((x) => <button key={x.key} className={tab === x.key ? "on" : ""} onClick={() => setTab(x.key)}>{x.label}</button>)}
            </div>

            <div className="toolbar">
              <input type="text" placeholder="Search property, client, engagement ID or invoice #" value={search} onChange={(e) => setSearch(e.target.value)} style={{ minWidth: 320 }} aria-label="Search billing" />
              <BillingStatusSelect value={statusFilter} onChange={onStatusFilterChange} />
              <span className="sp" />
              <button className="btn" onClick={() => rtExport("csv", imp, evaluated, asOf)}>Export CSV</button>
              <button className="btn" onClick={() => rtExport("json", imp, evaluated, asOf)}>Export JSON</button>
            </div>

            <div className="tw">
              {tab === "totals" ? (
                <table className="rt-table">
                  <thead><tr><th>Property</th><th>Client</th><th className="r">Lines</th><th className="r">Total</th><th className="r">Paid</th><th className="r">Outstanding</th><th className="r">Greystar invoiced</th><th className="r">ROVR paid</th><th className="r">ROVR pending</th><th>Status</th></tr></thead>
                  <tbody>
                    {propertyTotals.filter((x) => x.lines.some(shown)).length === 0 ? (
                      <tr><td colSpan={10} style={{ color: "var(--mut)" }}>No properties match.</td></tr>
                    ) : propertyTotals.filter((x) => x.lines.some(shown)).map((x) => (
                      <tr key={x.key} className={x.tracker ? "click" : ""} onClick={x.tracker ? () => onOpenProperty(x.tracker) : undefined}>
                        {nameCell(x.property, x.tracker, x.key, x.engagements)}
                        <td className="rt-wrap">{x.client || "—"}</td>
                        <td className="r">{x.lines.length}</td>
                        <td className="r">{rtMoney(x.total)}</td>
                        <td className="r">{rtMoney(x.paid)}</td>
                        <td className="r">{rtMoney(x.outstanding)}</td>
                        <td className="r">{rtMoney(x.total)}</td>
                        <td className="r">{rtMoney(x.rovr_paid)}</td>
                        <td className="r">{rtMoney(x.rovr_pending)}</td>
                        <td>{statusPill(x.status, x.maxDays)}</td>

                  <tbody>

                          <td className="r">{rtMoney(r.paid)}</td>
                          <td className="r">{rtMoney(r.outstanding)}</td>
                          <td className="r">{rtMoney(r.invoiced)}</td>
                          <td className="r">{rtMoney(r.rovr_paid)}</td>
                          <td className="r">{rtMoney(r.rovr_pending)}</td>
                          <td>{statusPill(r.payment_status, r.days_past_due)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
            <div className="foot">
              Paid = a Paid Date is filled. Overdue = not paid and more than {NET_TERMS_DAYS} days past the invoice date (net {NET_TERMS_DAYS}). Invoiced = invoiced within the last {NET_TERMS_DAYS} days, not yet paid. Pending = not invoiced.
              ROVR paid is {Math.round(Number({ ...RT_DEFAULT_SETTINGS, ...(imp.settings || {}) }.rovrRate) * 100)}% of {({ ...RT_DEFAULT_SETTINGS, ...(imp.settings || {}) }).rovrBucket} invoices; ROVR pending is Estimated AP Cost (T). The two overlap on RFP lines, so don't add them together.
              {" "}{agg.warning_rows > 0 && <button className="link" onClick={() => setShowWarnings((v) => !v)}>{showWarnings ? "Hide" : "Show"} {agg.warning_rows} lines with import warnings</button>}
            </div>
            {showWarnings && (
              <div className="card" style={{ marginTop: 8, fontSize: 12.5 }}>
                {scoped.filter((r) => r.warnings.length).map((r) => (
                  <div key={r.source_row} style={{ padding: "6px 0", borderTop: "1px solid var(--line)" }}>
                    <b>Row {r.source_row}</b> · {r.engagement_id} · {r.property} · {r.service_bucket} · {r.billing_milestone}
                    <ul style={{ margin: "2px 0 0", paddingLeft: 18, color: "var(--mut)" }}>{r.warnings.map((x, i) => <li key={i}>{x}</li>)}</ul>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


// Previous calculated billing (per-unit fee schedule), kept behind a link on the Billing page.
function LegacyBillingView({ properties, onOpenProperty, onSetPaymentStatus, onExport, statusFilter, onStatusFilterChange }) {
  const [tab, setTab] = useState("totals");
  const [search, setSearch] = useState("");

  // One row per property per selected, not-credited one-time-fee phase
  // — the real multi-phase structure a property can actually have,
  // unlike the prototype's one-phase-per-property sample model.
  const billingRows = useMemo(() => {
    const rows = [];
    properties.forEach((p) => {
      if (!p.program.advisoryContractExecuted) return;
      const opts = p.program.selectedOptions || {};
      const billing = computeAdvisoryBilling(p);
      const projectType = (p.program.attributes || {})["Project Type"] || "Retrofit";
      const rate = (ADVISORY_FEE_RATES[projectType] || ADVISORY_FEE_RATES.Retrofit).perUnit;
      [["dueDiligence", opts.dueDiligence, billing.dueDiligence], ["rfp", opts.rfp, billing.rfp], ["programDesign", opts.programDesign, billing.programDesign]]
        .forEach(([phaseKey, selected, feeObj]) => {
          if (!selected || !feeObj || feeObj.credited) return;
          rows.push({ property: p, phaseKey, phaseLabel: BILLING_PHASE_META[phaseKey].label, total: feeObj.total, firstHalf: feeObj.firstHalf, secondHalf: feeObj.secondHalf, rate, units: contractUnitsOf(p) });
        });
    });
    return rows;
  }, [properties]);

  const phasesPresent = useMemo(() => {
    const seen = [];
    billingRows.forEach((r) => { if (!seen.includes(r.phaseKey)) seen.push(r.phaseKey); });
    return seen;
  }, [billingRows]);

  const scopedRows = tab === "totals" ? billingRows : billingRows.filter((r) => r.phaseKey === tab);

  // Property totals — one row per property, aggregating every phase it
  // has, with its real current phase shown for reference.
  const propertyTotals = useMemo(() => {
    const byProperty = new Map();
    scopedRows.forEach((r) => {
      if (!byProperty.has(r.property.id)) byProperty.set(r.property.id, { property: r.property, total: 0, paid: 0, outstanding: 0, nextStatus: "Complete", phaseKeys: [], buckets: [] });
      const entry = byProperty.get(r.property.id);
      entry.phaseKeys.push(r.phaseKey);
      [r.firstHalf, r.secondHalf].forEach((h) => {
        entry.total += h.amount;
        entry.buckets.push(legacyHalfBucket(h));
        if (h.status === "Complete") entry.paid += h.amount; else entry.outstanding += h.amount;
        const rank = { Pending: 0, Invoiced: 1, Complete: 2 };
        if (rank[h.status] < rank[entry.nextStatus]) entry.nextStatus = h.status;
      });
    });
    return [...byProperty.values()];
  }, [scopedRows]);

  const q = search.toLowerCase();
  // Status filter (from the overview tiles or the Status dropdown): keep a property or phase row if any of its halves is in that status.
  const filteredTotals = propertyTotals.filter((x) => (!q || `${x.property.name} ${x.property.program.attributes.Client || ""} ${x.property.code}`.toLowerCase().includes(q))
    && x.buckets.some((b) => billingStatusMatches(statusFilter, b)));
  const filteredPhaseRows = scopedRows.filter((r) => (!q || `${r.property.name} ${r.property.program.attributes.Client || ""} ${r.property.code}`.toLowerCase().includes(q))
    && [r.firstHalf, r.secondHalf].some((h) => billingStatusMatches(statusFilter, legacyHalfBucket(h))));

  // Aggregate KPIs for whatever's currently in scope (totals or one phase)
  const agg = useMemo(() => {
    let total = 0, paid = 0, invoiced = 0, pending = 0, overdue = 0, rovrPaid = 0, rovrInvoiced = 0;
    scopedRows.forEach((r) => {
      [r.firstHalf, r.secondHalf].forEach((h) => {
        total += h.amount;
        const isOverdue = isPaymentOverdue(h);
        if (isOverdue) overdue += h.amount;
        else if (h.status === "Complete") paid += h.amount;
        else if (h.status === "Invoiced") invoiced += h.amount;
        else pending += h.amount;
        if (h.rovrAmountDue != null) {
          if (h.rovrStatus === "Complete") rovrPaid += h.rovrAmountDue; else rovrInvoiced += h.rovrAmountDue;
        }
      });
    });
    return { total, paid, invoiced, pending, overdue, rovrPaid, rovrInvoiced };
  }, [scopedRows]);

  // Monthly revenue forecast — unpaid amounts grouped by due month,
  // matching the prototype's exact 8-bucket structure.
  const forecast = useMemo(() => {
    const labels = ["Past due", "This mo.", "+1 mo.", "+2 mo.", "+3 mo.", "+4 mo.", "+5 mo.", "Later"];
    const vals = labels.map(() => 0);
    const todayParts = TODAY.split("-").map(Number);
    scopedRows.forEach((r) => {
      [r.firstHalf, r.secondHalf].forEach((h) => {
        if (h.status === "Complete" || !h.dueDate) return;
        let idx;
        if (h.dueDate < TODAY) idx = 0;
        else {
          const dParts = h.dueDate.split("-").map(Number);
          const monthsOut = (dParts[0] - todayParts[0]) * 12 + (dParts[1] - todayParts[1]);
          idx = monthsOut <= 5 ? monthsOut + 1 : 7;
        }
        vals[idx] += h.amount;
      });
    });
    return { labels, vals, max: Math.max(...vals, 1), total: vals.reduce((a, b) => a + b, 0) };
  }, [scopedRows]);

  const money = (n) => `$${Math.round(n).toLocaleString()}`;

  return (
    <div className="proto-dash">
      <div className="wrap">
        <h1>Billing</h1>
        <p className="sub">One total for each property. Select a phase tab to see the breakdown for that phase. Change a payment status from its dropdown.</p>

        <div className="card">
          <h3>ROVR Score: Paid &amp; Pending</h3>
          <div className="owed-top" style={{ marginBottom: 0 }}>
            <div className="kpi"><div className="v c-g">{money(agg.rovrPaid)}</div><div className="k">ROVR paid</div><div className="n">of {money(agg.paid)} paid</div></div>
            <div className="kpi"><div className="v c-b">{money(agg.rovrInvoiced)}</div><div className="k">ROVR pending</div><div className="n">of {money(agg.invoiced)} invoiced</div></div>
          </div>
        </div>

        <div className="kpis" style={{ marginTop: 12 }}>
          <div className="kpi"><div className="v">{money(agg.total)}</div><div className="k">Contract total, {tab === "totals" ? propertyTotals.length : scopedRows.length} {tab === "totals" ? "properties" : "payments"}</div></div>
          <div className="kpi"><div className="v c-g">{money(agg.paid)}</div><div className="k">Paid</div></div>
          <div className="kpi"><div className="v c-b">{money(agg.invoiced)}</div><div className="k">Invoiced</div></div>
          <div className="kpi"><div className="v c-r">{money(agg.overdue)}</div><div className="k">Overdue</div></div>
          <div className="kpi"><div className="v c-a">{money(agg.pending)}</div><div className="k">Pending</div></div>
        </div>

        <div className="tabs" role="tablist">
          <button className={tab === "totals" ? "on" : ""} onClick={() => setTab("totals")}>Property totals</button>
          {phasesPresent.map((k) => (
            <button key={k} className={tab === k ? "on" : ""} onClick={() => setTab(k)}>{BILLING_PHASE_META[k].label}</button>
          ))}
        </div>

        <div className="toolbar">
          <input type="text" placeholder="Search by property or client" value={search} onChange={(e) => setSearch(e.target.value)} style={{ minWidth: 260 }} aria-label="Search billing" />
          <BillingStatusSelect value={statusFilter} onChange={onStatusFilterChange} />
          <span className="sp" />
          <button className="btn" onClick={onExport}>Export</button>
        </div>

        {tab === "totals" ? (
          <div className="tw">
            <table>
              <thead><tr><th>Property</th><th>Client</th><th>Billing phase</th><th className="r">Total</th><th className="r">Paid</th><th className="r">Outstanding</th><th>Status</th></tr></thead>
              <tbody>
                {filteredTotals.length === 0 ? (
                  <tr><td colSpan={7} style={{ color: "var(--mut)" }}>No properties match.</td></tr>
                ) : (
                  filteredTotals.map((x) => {
                    const anyOverdue = x.buckets.includes("overdue");
                    const pillClass = anyOverdue ? "p-Overdue" : x.nextStatus === "Complete" ? "p-Paid" : x.nextStatus;
                    return (
                      <tr key={x.property.id} className="click" onClick={() => onOpenProperty(x.property)}>
                        <td><span className="id">{x.property.code}</span> {x.property.name}</td>
                        <td>{x.property.program.attributes.Client || "—"}</td>
                        <td><span className="dot" style={{ background: colorForPhaseLabel(currentPhaseGroupLabel(x.property)) }} />{currentPhaseGroupLabel(x.property)}</td>
                        <td className="r">{money(x.total)}</td>
                        <td className="r">{money(x.paid)}</td>
                        <td className="r">{money(x.outstanding)}</td>
                        <td><span className={`pill ${pillClass}`}>{anyOverdue ? "Overdue" : x.nextStatus === "Complete" ? "Paid" : x.nextStatus}</span></td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        ) : (
          <>
            <div className="tw">
              <table>
                <thead><tr><th>Property</th><th>Client</th><th className="r">Units</th><th className="r">Rate</th><th className="r">Total</th><th>1st half due</th><th>2nd half due</th><th>ROVR 1st half due</th><th>ROVR 2nd half due</th><th>Status</th></tr></thead>
                <tbody>
                  {filteredPhaseRows.length === 0 ? (
                    <tr><td colSpan={10} style={{ color: "var(--mut)" }}>No properties match.</td></tr>
                  ) : (
                    filteredPhaseRows.map((r) => {
                      const overallStatus = [r.firstHalf, r.secondHalf].every((h) => h.status === "Complete") ? "Complete" : ([r.firstHalf, r.secondHalf].find((h) => h.status !== "Complete") || {}).status || "Pending";
                      const rowOverdue = [r.firstHalf, r.secondHalf].some((h) => isPaymentOverdue(h));
                      const pillClass = rowOverdue ? "p-Overdue" : overallStatus === "Complete" ? "p-Paid" : overallStatus;
                      return (
                        <tr key={r.property.id + r.phaseKey}>
                          <td className="click" onClick={() => onOpenProperty(r.property)} style={{ cursor: "pointer" }}><span className="id">{r.property.code}</span> {r.property.name}</td>
                          <td>{r.property.program.attributes.Client || "—"}</td>
                          <td className="r">{r.units}</td>
                          <td className="r">${r.rate}</td>
                          <td className="r">{money(r.total)}</td>
                          {[r.firstHalf, r.secondHalf].map((h, i) => (
                            <td key={i}>
                              {money(h.amount)}<small>Due {h.dueDate ? fmtDate(h.dueDate) : "—"}</small>
                              <select value={h.status} onChange={(e) => onSetPaymentStatus(r.property.id, h.key, e.target.value)} aria-label="Payment status">
                                <option>Pending</option><option>Invoiced</option><option value="Complete">Paid</option>
                              </select>
                              {isPaymentOverdue(h) && <span className="pill p-Overdue" style={{ marginLeft: 4 }} title={`Invoiced ${fmtDate(paymentInvoiceDate(h))}, net ${NET_TERMS_DAYS}`}>Overdue · {paymentDaysPastDue(h)}d</span>}
                            </td>
                          ))}
                          {[r.firstHalf, r.secondHalf].map((h, i) => (
                            <td key={"rv" + i}>{h.rovrAmountDue != null ? <>{money(h.rovrAmountDue)}<small>Due {h.dueDate ? fmtDate(h.dueDate) : "—"}</small></> : "—"}</td>
                          ))}
                          <td><span className={`pill ${pillClass}`}>{rowOverdue ? "Overdue" : overallStatus === "Complete" ? "Paid" : overallStatus}</span></td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
            <div className="foot">Rate is $10 per unit for retrofit and $15 per unit for new construction (floor $3,000, ceiling varies by project type). The 2nd half is the total minus the 1st half. Status shown is the least-advanced unpaid half, or Paid once both halves are complete. Overdue means invoiced, not paid, and more than {NET_TERMS_DAYS} days past the invoice date (net {NET_TERMS_DAYS}); lines marked Invoiced before invoice dates were recorded count from their trigger date.</div>
          </>
        )}

        <div className="card" style={{ marginTop: 16 }}>
          <h3>Monthly revenue forecast</h3>
          <div className="fc" role="img" aria-label="Unpaid amounts by due month">
            {forecast.vals.map((n, i) => (
              <div key={i} className={i === 0 ? "late" : ""} style={{ height: (n / forecast.max) * 100 + "%", minHeight: n ? undefined : 2, opacity: n ? 1 : 0.4 }}>
                <span>{n ? money(n) : ""}</span>
              </div>
            ))}
          </div>
          <div className="fl">{forecast.labels.map((l) => <span key={l}>{l}</span>)}</div>
          <div className="foot">Unpaid amounts grouped by due date. The total is {money(forecast.total)}.</div>
        </div>
      </div>
    </div>
  );
}

function TimelineView({ properties, onOpenProperty }) {
  const [colorByPhase, setColorByPhase] = useState(false);
  const { months, end } = useMemo(() => buildChartRange(false), []);
  const rangeStart = months[0].start;
  const rangeStartMs = parseDate(rangeStart).getTime();
  const rangeEndMs = parseDate(end).getTime();
  const rangeSpanMs = rangeEndMs - rangeStartMs;
  const pct = (dateStr) => {
    const ms = parseDate(dateStr).getTime();
    return Math.max(0, Math.min(100, ((ms - rangeStartMs) / rangeSpanMs) * 100));
  };
  const todayPct = pct(TODAY);

  // Only the phases that actually have a real, fixed duration belong in
  // this legend — Prospecting/Planning are open-ended, growing segments,
  // not part of the portfolio's standard phase durations.
  const legendPhases = PHASE_DEFS;

  return (
    <div className="proto-dash">
      <div className="wrap">
        <h1>Phase timeline</h1>
        <p className="sub">Turn on Color by phase to split each bar by phase. Click a property to open its notes.</p>

        <div className="gwrap">
          <div className={`switch${colorByPhase ? " on" : ""}`} onClick={() => setColorByPhase((v) => !v)} role="switch" aria-checked={colorByPhase} tabIndex={0}>
            <div className="sw"><i /></div><span>Color by phase</span>
          </div>
          <div className="gleg">
            {colorByPhase
              ? legendPhases.map((ph) => (<span key={ph.key}><b style={{ background: ph.color }} />{ph.label} ({ph.days}d)</span>))
              : <span>Turn on Color by phase to color the timeline</span>}
          </div>

          <div className="gantt">
            <div className="gh">
              <div style={{ padding: "7px 10px" }}>Property</div>
              <div className="gm">{months.map((m) => <div key={m.key}>{m.label}</div>)}</div>
            </div>
            {properties.map((p) => {
              const phases = buildPhases(p.program).filter((ph) => ph.start && ph.end);
              return (
                <div key={p.id} className="gr">
                  <button className="gn" onClick={() => onOpenProperty(p)}><span>{p.code}</span>{p.name}</button>
                  <div className="gl">
                    {phases.map((ph, i) => {
                      const startPct = pct(ph.start);
                      const endPct = pct(ph.end);
                      if (startPct >= 100) return null;
                      const cls = `gs ${ph.virtual ? "pr " : ""}${colorByPhase ? "on " : "off "}${i === 0 ? "f " : ""}${i === phases.length - 1 || endPct >= 100 ? "l " : ""}`;
                      const style = { left: startPct + "%", width: Math.max(0, endPct - startPct) + "%" };
                      if (colorByPhase && !ph.virtual) style.background = ph.color;
                      return <div key={ph.key + i} className={cls} title={`${ph.label} · ${ph.start} to ${ph.end}`} style={style} />;
                    })}
                  </div>
                </div>
              );
            })}
            <div className="today" style={{ left: `calc(220px + (100% - 220px) * ${todayPct / 100})` }}><em>TODAY</em></div>
          </div>
          <p className="foot">Segment lengths use real phase durations and dates from each property's actual contract history.</p>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   CLIENT OWNERS — owner records for the Client page.
   Stored in app_state under "clientPortfolios" (one entry per owner,
   keyed by owner name), which already holds the portfolio notes and
   bids for BGO and Westbrook Partners. Each entry keeps whatever
   fields it already had; this adds profile and contacts.
   A property belongs to an owner through its Client and, separately,
   its JV Partner, so one property can sit under two owners.
--------------------------------------------------------- */
const OWNER_STATE_KEY = "clientPortfolios";
const BID_BUCKET = "provider-bid-documents";
const OWNER_TYPES = ["", "REIT", "Private equity / fund", "Institutional investor", "Developer", "Family office", "Operator", "Other"];
// Bid statuses reuse BID_STATUSES from the property bid tracker.
const NO_CLIENT = "No client listed";

const ownerNorm = (s) => String(s || "").toLowerCase().replace(/[.,()]/g, " ").replace(/\b(llc|inc|lp|llp|ltd|co|corp)\b/g, " ").replace(/\s+/g, " ").trim();

// The stored key for an owner, matched loosely (case, punctuation, LLC/Inc)
// so "Westbrook Partners" and "Westbrook Partners, LLC" share one record.
function ownerRecordKey(portfolios, name) {
  const n = ownerNorm(name);
  return Object.keys(portfolios || {}).find((k) => ownerNorm(k) === n) || String(name || "").trim();
}

function blankOwnerRecord() {
  return { profile: { type: "", hq: "", website: "", relationshipLead: "" }, contacts: [], todos: [], bids: [], notes: "" };
}

function withOwnerDefaults(rec) {
  const base = blankOwnerRecord();
  const r = rec ? JSON.parse(JSON.stringify(rec)) : {};
  return { ...base, ...r, profile: { ...base.profile, ...(r.profile || {}) }, contacts: r.contacts || [], todos: r.todos || [], bids: r.bids || [], notes: r.notes || "" };
}

// Groups properties into owners by Client and by JV Partner.
function buildOwnerGroups(properties, portfolios) {
  const groups = new Map();
  const add = (name, p, role) => {
    const display = String(name || "").trim();
    const key = display ? ownerNorm(display) : "__none__";
    if (!groups.has(key)) groups.set(key, { key, name: display || NO_CLIENT, none: !display, items: [] });
    const g = groups.get(key);
    if (!g.items.some((it) => it.p.code === p.code)) g.items.push({ p, role });
  };
  properties.forEach((p) => {
    const a = p.program.attributes || {};
    add(a.Client, p, "Client");
    const jv = String(a["JV Partner"] || "").trim();
    if (jv && ownerNorm(jv) !== ownerNorm(a.Client)) add(jv, p, "JV Partner");
  });
  // Owners that have a record but no properties on the page right now.
  Object.keys(portfolios || {}).forEach((k) => {
    const key = ownerNorm(k);
    if (!groups.has(key)) groups.set(key, { key, name: k, none: false, items: [] });
  });
  return [...groups.values()].sort((a, b) => (a.none - b.none) || a.name.localeCompare(b.name));
}

function OwnerRecordModal({ ownerName, record, items, clientNotes, onSave, onClose, onOpenProperty, supabaseClient }) {
  const [draft, setDraft] = useState(() => withOwnerDefaults(record));
  const [saved, setSaved] = useState(() => JSON.stringify(withOwnerDefaults(record)));
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const dirty = JSON.stringify(draft) !== saved;

  const set = (fn) => setDraft((d) => { const n = JSON.parse(JSON.stringify(d)); fn(n); return n; });
  const notes = useMemo(() => (clientNotes || [])
    .filter((n) => ownerNorm(n.client_key) === ownerNorm(ownerName))
    .sort((a, b) => String(b.digest_date || "").localeCompare(String(a.digest_date || ""))), [clientNotes, ownerName]);

  const save = async () => {
    setBusy(true); setStatus(null);
    try { await onSave(ownerName, draft); setSaved(JSON.stringify(draft)); setStatus({ ok: true, text: "Saved" }); }
    catch (e) { setStatus({ ok: false, text: `Couldn't save: ${e.message}` }); }
    setBusy(false);
  };
  const close = () => { if (!dirty || window.confirm("Discard unsaved changes to this owner record?")) onClose(); };

  const openBidFile = async (f) => {
    if (!supabaseClient || !f.path) return;
    const win = window.open("", "_blank");
    const { data, error } = await supabaseClient.storage.from(BID_BUCKET).createSignedUrl(f.path, 300);
    if (error || !data || !data.signedUrl) { if (win) win.close(); setStatus({ ok: false, text: `Couldn't open ${f.name}: ${error ? error.message : "no link returned"}` }); return; }
    if (win) win.location = data.signedUrl; else window.location.href = data.signedUrl;
  };
  const uploadBidFile = async (bidIdx, file) => {
    if (!supabaseClient || !file) return;
    setBusy(true); setStatus(null);
    const folder = ownerName.replace(/[^A-Za-z0-9]+/g, "_");
    const path = `${folder}/_imports/${Date.now()}_${file.name.replace(/[^A-Za-z0-9.\-]+/g, "_")}`;
    const { error } = await supabaseClient.storage.from(BID_BUCKET).upload(path, file, { contentType: file.type || undefined, upsert: false });
    if (error) setStatus({ ok: false, text: `Upload failed: ${error.message}` });
    else { set((d) => { d.bids[bidIdx].files = [...(d.bids[bidIdx].files || []), { name: file.name, path, uploadedAt: TODAY }]; }); setStatus({ ok: true, text: `${file.name} uploaded — click Save to keep it on the bid` }); }
    setBusy(false);
  };

  const inp = (value, onChange, props = {}) => <input type="text" value={value || ""} onChange={(e) => onChange(e.target.value)} {...props} />;
  const rowStyle = { display: "grid", gap: 8, alignItems: "center", marginBottom: 8 };
  const smallBtn = { padding: "6px 10px", fontSize: 12.5 };
  const clientCount = items.filter((i) => i.role === "Client").length;
  const jvCount = items.length - clientCount;

  return (
    <div className="modal-overlay" onClick={close}>
      <div className="modal modal-dual-wide owner-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="field-label">Owner record</div>
            <h2>{ownerName}</h2>
            <div className="dim" style={{ marginTop: 4 }}>{clientCount} as client{jvCount ? ` · ${jvCount} as JV partner` : ""}</div>
          </div>
          <button className="icon-btn" onClick={close} aria-label="Close"><X size={18} /></button>
        </div>

        <div className="attr-edit-grid">
          <div className="attr-edit-item"><label>Owner type</label>
            <select value={draft.profile.type} onChange={(e) => set((d) => { d.profile.type = e.target.value; })}>

          <div className="attr-edit-item"><label>Greystar relationship lead</label>{inp(draft.profile.relationshipLead, (v) => set((d) => { d.profile.relationshipLead = v; }))}</div>

        <div className="section-header">Contacts</div>
        {draft.contacts.length === 0 && <div className="dim" style={{ marginBottom: 8 }}>No contacts yet.</div>}
        {draft.contacts.map((c, i) => (
          <div key={i} className="attr-edit-item owner-row" style={{ ...rowStyle, gridTemplateColumns: "1.2fr 1fr 1.4fr 1fr auto" }}>
            {inp(c.name, (v) => set((d) => { d.contacts[i].name = v; }), { placeholder: "Name" })}
            {inp(c.title, (v) => set((d) => { d.contacts[i].title = v; }), { placeholder: "Title" })}
            {inp(c.email, (v) => set((d) => { d.contacts[i].email = v; }), { placeholder: "Email" })}
            {inp(c.phone, (v) => set((d) => { d.contacts[i].phone = v; }), { placeholder: "Phone" })}
            <button className="icon-btn" title="Remove contact" onClick={() => set((d) => { d.contacts.splice(i, 1); })}><X size={15} /></button>
          </div>
        ))}
        <button className="btn-ghost" style={smallBtn} onClick={() => set((d) => { d.contacts.push({ name: "", title: "", email: "", phone: "" }); })}><Plus size={13} /> Add contact</button>

        <div className="section-header">Portfolio to-dos</div>
        {draft.todos.length === 0 && <div className="dim" style={{ marginBottom: 8 }}>No portfolio to-dos.</div>}
        {draft.todos.map((t, i) => (
          <div key={t.id || i} className="attr-edit-item owner-row" style={{ ...rowStyle, gridTemplateColumns: "auto 2.5fr 1fr 150px auto" }}>
            <input type="checkbox" checked={!!t.done} onChange={(e) => set((d) => { d.todos[i].done = e.target.checked; })} style={{ width: 16, height: 16 }} aria-label="Done" />
            {inp(t.text, (v) => set((d) => { d.todos[i].text = v; }), { placeholder: "To-do", style: t.done ? { textDecoration: "line-through", opacity: 0.6 } : undefined })}
            {inp(t.owner, (v) => set((d) => { d.todos[i].owner = v; }), { placeholder: "Who" })}
            <input type="date" value={t.due || ""} onChange={(e) => set((d) => { d.todos[i].due = e.target.value; })} aria-label="Due date" />
            <button className="icon-btn" title="Remove to-do" onClick={() => set((d) => { d.todos.splice(i, 1); })}><X size={15} /></button>
          </div>
        ))}
        <button className="btn-ghost" style={smallBtn} onClick={() => set((d) => { d.todos.push({ id: Date.now(), text: "", owner: "", due: "", done: false }); })}><Plus size={13} /> Add to-do</button>

        <div className="section-header">Portfolio bids</div>
        {draft.bids.length === 0 && <div className="dim" style={{ marginBottom: 8 }}>No portfolio bids.</div>}
        {draft.bids.map((b, i) => (
          <div key={b.id || i} className="vendor-card">
            <div className="attr-edit-grid" style={{ gridTemplateColumns: "1.3fr 1fr 1fr 1fr auto", alignItems: "end" }}>
              <div className="attr-edit-item"><label>Provider</label>{inp(b.provider, (v) => set((d) => { d.bids[i].provider = v; }))}</div>
              <div className="attr-edit-item"><label>Status</label>
                <select value={b.status || ""} onChange={(e) => set((d) => { d.bids[i].status = e.target.value; })}>
                  {(BID_STATUSES.includes(b.status) || !b.status ? BID_STATUSES : [b.status, ...BID_STATUSES]).map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="attr-edit-item"><label>Term (months)</label>{inp(b.term, (v) => set((d) => { d.bids[i].term = v; }))}</div>
              <div className="attr-edit-item"><label>Option</label>{inp(b.optionLabel, (v) => set((d) => { d.bids[i].optionLabel = v; }))}</div>
              <button className="icon-btn" title="Remove bid" onClick={() => { if (window.confirm(`Remove the ${b.provider || "this"} bid from the record? Its files stay in storage.`)) set((d) => { d.bids.splice(i, 1); }); }}><X size={15} /></button>
            </div>
            <div className="attr-edit-item" style={{ marginTop: 8 }}><label>Notes</label>{inp(b.notes, (v) => set((d) => { d.bids[i].notes = v; }))}</div>

        <div className="section-header">Call digest notes</div>
        {notes.length === 0 ? <div className="dim">No digest notes for this owner yet.</div> : notes.map((n) => (
          <div key={n.id} style={{ background: "var(--panel-alt)", border: "1px solid var(--border)", borderRadius: 6, padding: "10px 12px", marginBottom: 8, fontSize: 13 }}>

            {n.todo && <div className="dim" style={{ marginTop: 6, whiteSpace: "pre-wrap" }}><b>To-do:</b> {typeof n.todo === "string" ? n.todo : JSON.stringify(n.todo)}</div>}

        ))}

        <div className="section-header">Properties</div>
        {items.length === 0 ? <div className="dim">No properties on the tracker for this owner.</div> : (
          <div className="todo-list">
            {items.map(({ p, role }) => (
              <button key={p.id} className="phase-row" style={{ marginBottom: 4 }} onClick={() => { if (!dirty || window.confirm("Leave without saving this owner record?")) { onClose(); onOpenProperty(p); } }}>
                <span className="mono tag-code">{p.code}</span> {p.name}
                <span className="phase-row-trailing">
                  {role === "JV Partner" && <span className="tag-not-contracted" style={{ fontSize: 11, padding: "2px 8px" }}>JV partner</span>}
                  <span className="dim" style={{ fontSize: 12 }}>{currentPhaseGroupLabel(p)}</span>
                </span>
              </button>
