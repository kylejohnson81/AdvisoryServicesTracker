<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crestline — Advisory Services</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

        * { box-sizing: border-box; }
        .app-root {
          --bg: #0A2245;
          --panel: #14315E;
          --panel-alt: #1C3E70;
          --border: rgba(169,196,218,0.16);
          --grid-line: rgba(169,196,218,0.10);
          --ink: #FFFFFF;
          --ink-muted: #B2B3B5;
          --accent: #0077D4;
          --accent-dim: rgba(0,119,212,0.16);
          background: var(--bg);
          color: var(--ink);
          font-family: Arial, Helvetica, sans-serif;
          min-height: 100vh;
          padding: 28px;
          background-image:
            linear-gradient(var(--grid-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
          background-size: 32px 32px;
        }
        .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
        h1, h2, h3 { font-family: Arial, Helvetica, sans-serif; margin: 0; }

        .top-bar { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-right: 220px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
        .brand-sub { color: var(--ink-muted); font-size: 12.5px; margin-top: 2px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
        .sync-badge { font-size: 10.5px; font-weight: 600; margin-top: 3px; font-family: Arial, Helvetica, sans-serif; }
        .sync-badge-live { color: #007B0C; }
        .sync-badge-local { color: var(--ink-muted); }
        .brand-icon { width: 34px; height: 34px; border: 1px solid var(--accent); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: var(--accent-dim); }
        .brand-logo-plate { position: absolute; top: 0; right: 0; background: #FFFFFF; padding: 6px 16px; border-radius: 4px; display: flex; align-items: center; }
        .brand-logo-img { height: 32px; width: auto; display: block; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .btn-primary { background: var(--accent); color: #FFFFFF; border: none; font-weight: 600; padding: 9px 16px; border-radius: 4px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: Arial, Helvetica, sans-serif; transition: filter 0.15s; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--border); padding: 9px 16px; border-radius: 4px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: Arial, Helvetica, sans-serif; }
        .icon-btn { background: none; border: none; color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .icon-btn:hover { color: var(--ink); }

        .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .view-toggle button { background: var(--panel); color: var(--ink-muted); border: none; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .view-toggle button.active { background: var(--accent-dim); color: var(--accent); }

        .search-box { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; min-width: 200px; }
        .search-box input { background: none; border: none; color: var(--ink); font-size: 13px; outline: none; width: 100%; }
        .search-box input::placeholder { color: var(--ink-muted); }

        .kpi-strip { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
        .kpi {
          background: var(--panel); flex: 1; padding: 18px 18px; display: flex; flex-direction: column; gap: 6px;
          border: none; border-right: 1px solid var(--border); cursor: pointer; text-align: left; font-family: Arial, Helvetica, sans-serif;
        }
        .kpi:last-child { border-right: none; }
        .kpi:hover { background: var(--panel-alt); }
        .kpi:disabled { cursor: default; }
        .kpi:disabled:hover { background: var(--panel); }
        .kpi-active { background: var(--panel-alt); }
        .kpi-value { font-size: 22px; font-weight: 600; }
        .kpi-label { font-size: 13.5px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.01em; }
        .kpi-total .kpi-value { color: var(--ink); }

        .legend { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 20px; font-size: 13.5px; font-weight: 600; color: var(--ink-muted); }
        .legend-item { flex: 1; background: var(--panel); padding: 14px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; border-right: 1px solid var(--border); }
        .legend-item:last-child { border-right: none; }
        .legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; display: inline-block; }
        .legend-item .legend-swatch { width: 11px; height: 11px; }
        .legend-caption { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-muted); margin: -12px 0 20px 2px; flex-wrap: wrap; }
        .legend-hatch-sample {
          width: 20px; height: 9px; border-radius: 2px; flex-shrink: 0; display: inline-block;
          opacity: 0.85;
        }
        .legend-hatch-sky {
          background: #92C9EB;
          background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 2px, transparent 2px, transparent 6px);
          margin-left: 12px;
        }
        .legend-hatch-stucco {
          background: #FBF7EF;
          background-image: repeating-linear-gradient(45deg, rgba(10,34,69,0.3) 0, rgba(10,34,69,0.3) 2px, transparent 2px, transparent 6px);
        }

        .main-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
        .sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; position: sticky; top: 20px; }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .group-option { width: 100%; text-align: left; background: none; border: none; color: var(--ink-muted); padding: 8px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-bottom: 2px; }
        .group-option.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
        .group-option:hover:not(.active) { background: var(--panel-alt); color: var(--ink); }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-muted); }
        .toggle-btn { background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink-muted); border-radius: 20px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 11.5px; }
        .toggle-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink-muted); font-size: 12px; padding: 6px 10px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .chip-active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .chip-static { cursor: default; }
        .chip-count { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 1px 6px; font-size: 10.5px; font-family: Consolas, 'SF Mono', Menlo, monospace; }
        .clear-link { margin-top: 8px; background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 0; }

        .lane { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
        .lane-tab { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; background: var(--panel-alt); border-bottom: 1px solid var(--border); border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .lane-tab-left { display: flex; align-items: center; gap: 12px; }
        .lane-tab-clickable { cursor: pointer; }
        .lane-tab-clickable:hover { background: var(--panel); }
        .lane-tab-clickable:hover .lane-title { color: var(--accent); }
        .isolate-banner {
          display: flex; align-items: center; justify-content: space-between; gap: 10px;
          background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 6px;
          padding: 10px 14px; margin-bottom: 12px; font-size: 13px;
        }
        .lane-body { position: relative; }
        .lane-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.01em; }
        .lane-count { color: var(--accent); font-size: 13.5px; font-weight: 600; }
        .tl-header { position: relative; display: grid; grid-template-columns: 220px repeat(12, 1fr); border-bottom: 1px solid var(--border); margin-right: 8px; }
        .tl-year-toggle {
          position: absolute; top: 50%; right: 4px; transform: translateY(-50%); z-index: 4;
          width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border);
          background: var(--panel-alt); color: var(--accent); font-size: 13px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; padding: 0;
        }
        .tl-year-toggle:hover { border-color: var(--accent); }
        .tl-header-spacer { }
        .tl-header-cell { padding: 6px 4px; text-align: center; font-size: 10.5px; color: var(--ink-muted); font-family: Consolas, 'SF Mono', Menlo, monospace; border-left: 1px solid var(--border); }
        .tl-header-cell:first-child { border-left: none; }
        .lane-rows { padding: 6px 0; }
        .today-overlay { position: absolute; top: 0; bottom: 0; left: 220px; right: 8px; pointer-events: none; }
        .today-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--accent); z-index: 3; }
        .today-label {
          position: absolute; top: -20px; left: 0; transform: translateX(-50%); z-index: 4;
          background: var(--accent); color: #FFFFFF; font-size: 9px; font-weight: 700;
          letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap;
          display: inline-flex; align-items: center; justify-content: center; line-height: 1;
        }

        .prop-row { display: grid; grid-template-columns: 220px 1fr; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--grid-line); }
        .prop-row:last-child { border-bottom: none; }
        .prop-row-label { padding: 0 16px; display: flex; align-items: center; gap: 8px; overflow: hidden; background: none; border: none; text-align: left; cursor: pointer; font-family: Arial, Helvetica, sans-serif; }
        .prop-row-label:hover .prop-row-name { color: var(--accent); }
        .prop-row-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
        .tag-code { color: var(--accent); font-size: 11px; flex-shrink: 0; }
        .prop-track { position: relative; height: 34px; margin-right: 8px; }
        .tl-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); }
        .tl-grid-line { border-left: 1px solid var(--grid-line); }
        .phase-seg { position: absolute; top: 6px; height: 20px; cursor: pointer; }
        .phase-seg-done { box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.4); }
        .phase-seg-virtual {
          background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 2px, transparent 2px, transparent 6px);
          opacity: 0.85;
        }
        .phase-seg-virtual-dark {
          background-image: repeating-linear-gradient(45deg, rgba(10,34,69,0.3) 0, rgba(10,34,69,0.3) 2px, transparent 2px, transparent 6px);
        }
        .phase-seg:hover { filter: brightness(1.2); }
        .blocked-strike {
          position: absolute; top: 2px; width: 0; height: 28px; border-left: 2px solid #9E3B2E;
          cursor: pointer; z-index: 6;
        }
        .blocked-dotted {
          position: absolute; top: 50%; height: 0; border-top: 2px dashed #9E3B2E;
          transform: translateY(-50%); pointer-events: none; z-index: 6; opacity: 0.9;
        }
        .prospect-note { position: absolute; left: 8px; top: 8px; font-size: 11.5px; color: var(--ink-muted); font-style: italic; }

        .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
        .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ptable th { text-align: left; padding: 12px 14px; background: var(--panel-alt); color: var(--ink-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; font-weight: 500; }
        .ptable td { padding: 12px 14px; border-top: 1px solid var(--border); }
        .ptable tbody tr { cursor: pointer; }
        .ptable tbody tr:hover { background: var(--panel-alt); }

        .pill { border: 1px solid; border-radius: 20px; padding: 3px 10px; font-size: 11.5px; font-weight: 500; display: inline-flex; align-items: center; }
        .dim { color: var(--ink-muted); font-size: 13px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(6,12,22,0.7); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 26px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; }
        .modal-wide { max-width: 680px; }
        .modal-extra-wide { max-width: 860px; }
        .econ-modal { max-width: 920px; }
        .vendor-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .vendor-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .vendor-name-input {
          background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--ink);
          font-size: 14px; font-weight: 700; padding: 4px 2px; flex: 1; outline: none;
        }
        .vendor-name-input:focus { border-bottom-color: var(--accent); }
        .vendor-upload-btn { cursor: pointer; white-space: nowrap; flex: none; }
        .econ-table-scroll { overflow-x: auto; margin-bottom: 14px; }
        .econ-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
        .econ-table th { text-align: left; padding: 6px 10px; font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); }
        .econ-table td { padding: 7px 10px; border-bottom: 1px solid var(--grid-line); }
        .econ-chart-box { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
        .econ-chart-row { display: flex; gap: 12px; margin-bottom: 4px; }
        .econ-chart-half { flex: 1; margin-bottom: 14px; }
        .econ-legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 6px; }
        .econ-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
        .econ-legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .modal-head h2 { font-size: 19px; margin-top: 4px; }
        .modal-pills { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin-bottom: 6px; }
        .section-header {
          font-size: 15px; font-weight: 700; color: var(--ink); margin: 20px 0 8px;
          padding-top: 16px; border-top: 1px solid var(--border);
        }
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .attr-item { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
        .attr-key { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .attr-val { font-size: 13px; font-family: Consolas, 'SF Mono', Menlo, monospace; }
        .attr-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .attr-edit-item { display: flex; flex-direction: column; gap: 4px; }
        .attr-edit-item label { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .attr-edit-item input, .attr-edit-item select {
          background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink); border-radius: 4px;
          padding: 7px 9px; font-size: 13px; font-family: Arial, Helvetica, sans-serif; outline: none;
          width: 100%; box-sizing: border-box; appearance: none;
        }
        .attr-edit-item select {
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B2B3B5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
          background-repeat: no-repeat; background-position: right 8px center; background-size: 14px; padding-right: 28px;
        }
        .attr-edit-item input:focus, .attr-edit-item select:focus { border-color: var(--accent); }
        .address-block { display: flex; flex-direction: column; gap: 8px; }
        .address-line1, .address-line2 input, .address-line2 select {
          background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink); border-radius: 4px;
          padding: 7px 9px; font-size: 13px; font-family: Arial, Helvetica, sans-serif; outline: none; appearance: none;
        }
        .address-line1 { width: 100%; }
        .address-line1:focus, .address-line2 input:focus, .address-line2 select:focus { border-color: var(--accent); }
        .address-line2 select {
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B2B3B5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
          background-repeat: no-repeat; background-position: right 6px center; background-size: 12px; padding-right: 22px;
        }
        .address-line2 { display: flex; gap: 8px; }
        .address-city { flex: 2; }
        .address-state { flex: 1; min-width: 0; }
        .address-zip { flex: 1; min-width: 0; }
        .dd-date-entry { display: flex; flex-direction: column; gap: 4px; }
        .dd-date-entry input {
          background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink); border-radius: 4px;
          padding: 7px 9px; font-size: 13px; font-family: Consolas, 'SF Mono', Menlo, monospace; outline: none; width: fit-content;
        }
        .dd-date-entry input:focus { border-color: var(--accent); }
        .contract-dates-list { display: flex; flex-direction: column; gap: 10px; }
        .contract-date-row {
          display: flex; align-items: center; justify-content: space-between; gap: 14px;
          padding: 9px 12px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px;
        }
        .contract-date-row .field-label { margin-bottom: 0; }
        .contract-date-row-editable { align-items: flex-start; }
        .contract-date-input {
          background: var(--panel); border: 1px solid var(--border); color: var(--ink); border-radius: 4px;
          padding: 6px 9px; font-size: 12.5px; font-family: Consolas, 'SF Mono', Menlo, monospace; outline: none;
        }
        .contract-date-input:focus { border-color: var(--accent); }
        .ms-list { display: flex; flex-direction: column; gap: 6px; }
        .ms-done { color: var(--ink-muted); text-decoration: line-through; }
        .todo-key-milestone {
          background: rgba(166,222,158,0.18); color: #4a7a42; border-radius: 3px;
          padding: 1px 6px; font-weight: 600;
        }
        .ms-date { color: var(--ink-muted); font-size: 12px; min-width: 160px; text-align: right; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

        .phase-row { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 4px; padding: 9px 12px; cursor: pointer; width: 100%; text-align: left; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
        .phase-row:hover { border-color: var(--accent); }
        .phase-todo-count { min-width: 34px; text-align: right; display: inline-block; }
        .phase-chevron { transform: rotate(-90deg); color: var(--ink-muted); flex-shrink: 0; }
        .phase-row-trailing { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .todo-list { display: flex; flex-direction: column; gap: 2px; }
        .todo-block { padding: 4px 0; border-bottom: 1px solid var(--grid-line); }
        .todo-block:last-child { border-bottom: none; }
        .todo-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 0; }
        .todo-item-wrap { flex-wrap: wrap; }
        .todo-check-row {
          background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
          padding: 6px 4px; margin: -6px -4px; border-radius: 4px; text-align: left; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: var(--ink);
          flex: 1; min-width: 0;
        }
        .todo-check-row:hover { background: var(--panel-alt); }
        .todo-check-row:disabled { cursor: default; }

<script>
(function () {
  var CORRECT_HASH = "1a7fb04e6b71807310724b25b3eac0e84dcbb19e0811771e027e35eb7cc58708";
  var gate = document.getElementById("auth-gate");
  var input = document.getElementById("auth-gate-input");
  var submit = document.getElementById("auth-gate-submit");
  var error = document.getElementById("auth-gate-error");

  async function sha256(text) {
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }

  async function tryUnlock() {
    var hash = await sha256(input.value);
    if (hash === CORRECT_HASH) {
      sessionStorage.setItem("crestline_auth_ok", "1");
      gate.style.display = "none";
      if (window.__mountApp) window.__mountApp();
    } else {
      error.style.display = "block";
      input.value = "";
      input.focus();
    }
  }

  submit.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });

  if (sessionStorage.getItem("crestline_auth_ok") === "1") {
    gate.style.display = "none";
    // app mounts once babel script below defines __mountApp; small delay ensures order
    window.addEventListener("load", function () { if (window.__mountApp) window.__mountApp(); });
  } else {
    input.focus();
  }
})();

/* ---------------------------------------------------------
   ECONOMIC MODEL — RFP vendor cost/revenue comparison
   Two input sources feed one calculation, matching how this is

   data; Crestline's own commercial assumptions supply the revenue side.

const CONTRACT_TERMS = [3, 5, 7, 10];

// Vendor-supplied fields — mirror the real RFP Response form exactly,

// whichever term(s) the vendor actually offers, not a single flat fee.
function newVendorBid(name) {

    id: Date.now() + Math.random(), name: name || "New Vendor",
    circuitCostPerUnit: 0, supportFeePerUnit: 0, backupCircuitPerUnit: 0,

    financingRates: { 3: null, 5: null, 7: null, 10: null }
  };

// Crestline-side assumptions — never vendor-supplied, since a vendor has
// no basis to set resident pricing or predict adoption.
function defaultEconomicAssumptions() {
  return { monthlyFee: 0, maxAdoptionPct: 0.9, adoptionRampMonths: 6, buyoutCost: 0 };
}

// Yearly rollup for one vendor — the term length itself flexes to
// whatever that vendor's contract runs (3/5/7/10 years), rather than a
// fixed 5-year window like the old model.
function computeVendorYearlyModel(vendor, assumptions, totalUnits) {
  const years = vendor.contractTermYears || 5;
  const rows = [];
  let cumulativeCCF = 0;
  const monthlyCostPerUnitBase = (vendor.circuitCostPerUnit || 0) + (vendor.supportFeePerUnit || 0) + (vendor.backupCircuitPerUnit || 0);
  const upfrontCost = (vendor.lvConduitCost || 0) + (vendor.equipmentCost || 0) + (assumptions.buyoutCost || 0);
  const rampMonths = Math.max(1, assumptions.adoptionRampMonths || 1);

  for (let year = 1; year <= years; year++) {
    // Average adoption fraction across this year's 12 months — ramps
    // linearly from 0 to Max Adoption over the ramp period, then holds flat.
    let monthSum = 0;
    for (let m = 1; m <= 12; m++) {
      const monthIndex = (year - 1) * 12 + m;
      const fraction = monthIndex >= rampMonths ? 1 : monthIndex / rampMonths;
      monthSum += fraction * (assumptions.maxAdoptionPct || 0);
    }
    const avgAdoption = monthSum / 12;
    const adoptedUnits = totalUnits * avgAdoption;

    const revenue = adoptedUnits * (assumptions.monthlyFee || 0) * 12;
    // Escalator compounds annually — the old model held cost flat for
    // every year, which doesn't reflect a real annual rate increase.
    const escalatedMonthlyCost = monthlyCostPerUnitBase * Math.pow(1 + (vendor.annualRateIncreasePct || 0), year - 1);
    const recurringCost = adoptedUnits * escalatedMonthlyCost * 12;
    const yearUpfront = year === 1 ? upfrontCost : 0;
    const profit = revenue - recurringCost - yearUpfront;
    cumulativeCCF += profit;

    rows.push({ year, adoptedUnits, revenue, recurringCost, upfrontCost: yearUpfront, profit, ccf: cumulativeCCF });
  }

  const totalRevenue = rows.reduce((s, r) => s + r.revenue, 0);
  const totalCost = rows.reduce((s, r) => s + r.recurringCost, 0) + upfrontCost;
  const finalCCF = rows.length ? rows[rows.length - 1].ccf : 0;
  const roi = upfrontCost > 0 ? finalCCF / upfrontCost : null;
  // Payback month, not just year — interpolates within whichever year CCF
  // actually crosses zero, assuming that year's profit accrues evenly
  // across its 12 months (the yearly rollup doesn't track true monthly
  // detail, so this is the closest reasonable estimate without it).
  let positiveCCFMonth = null;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (row.ccf < 0) continue;
    const prevCCF = i === 0 ? 0 : rows[i - 1].ccf;
    if (prevCCF >= 0) {
      positiveCCFMonth = (row.year - 1) * 12 + 1;
    } else {
      const monthlyProfit = row.profit / 12;
      const monthsIntoYear = monthlyProfit > 0 ? Math.ceil(-prevCCF / monthlyProfit) : 12;
      positiveCCFMonth = (row.year - 1) * 12 + Math.min(12, Math.max(1, monthsIntoYear));
    }
    break;
  }

  return { rows, upfrontCost, totalRevenue, totalCost, finalCCF, roi, positiveCCFMonth };
}

  { key: "deployment", label: "Deployment", days: 183, optionKey: "deployment", color: "#DA7A62", billing: "$2/unit/mo (with Ongoing Mgmt)" },
  { key: "ongoing", label: "Ongoing Management", days: null, optionKey: "deployment", color: "#B2B3B5", billing: "$2/unit/mo (with Deployment)" }
];
// Deployment + Ongoing Management are sold and billed as a single line —
// selecting one always includes the other.
const OPTIONAL_PHASES = [
  PHASE_DEFS.find((d) => d.key === "rfp"),
  PHASE_DEFS.find((d) => d.key === "programDesign"),
  PHASE_DEFS.find((d) => d.key === "deployment")
];

// Default day-lengths for every phase with a fixed duration (Ongoing Mgmt
// has none — it always runs to the ISP term end). buildPhases reads this
// object directly, so editing it via Settings recalculates every phase
// length everywhere consistently — timeline, status, table view, all of it.
const DEFAULT_PHASE_DURATIONS = { dueDiligence: 30, advisory: 30, rfp: 30, programDesign: 60, deployment: 90 };
let PHASE_DURATIONS = { ...DEFAULT_PHASE_DURATIONS };

/* ---------------------------------------------------------
   DATE HELPERS
--------------------------------------------------------- */
const parseDate = (s) => new Date(s + "T00:00:00");
const pct = (s, chartEnd) => {
  const end = chartEnd || TIMELINE_END;
  const totalMs = parseDate(end) - parseDate(TIMELINE_START);
  const v = ((parseDate(s) - parseDate(TIMELINE_START)) / totalMs) * 100;
  return Math.min(100, Math.max(0, v));
};

// Real day-proportional column widths for the month grid — NOT equal 1/12
// columns. Months have different lengths, so an equal-width grid drifts
// out of alignment with any date-based position (Today line, phase
// segments) as the year progresses. This guarantees they always agree.
const monthColumnWidths = (months, chartEnd) => months.map((m, i) => {
  const startPct = pct(m.start, chartEnd);
  const nextStart = months[i + 1] ? months[i + 1].start : chartEnd;
  const endPct = pct(nextStart, chartEnd);
  return Math.max(0.1, endPct - startPct);
});
const fmtDate = (s) =>
  parseDate(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const addDays = (s, n) => {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};

// Substitutes {{property}}/{{client}}/{{manager}}/{{code}} placeholders
// with real data — shared by both the mailto link builder and the
// clipboard-copy fallback below, so they never drift out of sync.
function fillEmailTemplate(s, property) {
  return (s || "")
    .replace(/\{\{property\}\}/g, property.name)
    .replace(/\{\{client\}\}/g, property.program.attributes.Client || "")
    .replace(/\{\{manager\}\}/g, property.program.attributes["CM"] || "")
    .replace(/\{\{code\}\}/g, property.code);
}

// Builds a mailto: link from a to-do's email template, substituting
// placeholders with real property data. Opens the user's default mail
// client (Outlook, if configured) with a pre-filled draft — this can't
// auto-send or log anywhere without a real backend/Graph API integration,
// but it gets a one-click drafted email in front of the user right now.
// Note: mailto: links are silently blocked inside sandboxed iframes (e.g.
// an embedded artifact preview) — they work normally in a standalone
// browser tab. The clipboard-copy button below is the reliable fallback.
function buildMailtoLink(template, property) {
  const subject = encodeURIComponent(fillEmailTemplate(template.subject, property));
  const body = encodeURIComponent(fillEmailTemplate(template.body, property));
  const to = template.to ? encodeURIComponent(fillEmailTemplate(template.to, property)) : "";
  return `mailto:${to}?subject=${subject}&body=${body}`;
}

const PLANNING_COLOR = "#92C9EB"; // matches the Planning status color (Sky)
const PROSPECTING_COLOR = "#FBF7EF"; // near-white, lightened from Stucco

// Canonical Prospecting checklist — the pitch/pre-agreement stage, before
// the Due Diligence contract has been executed. This is shown both for
// pure prospects (no DD signed at all) and for the pre-engagement lead
// time on properties that have since signed DD — same underlying work.
function prospectingTemplate(done) {

    { text: "Identify property as a prospect", responsible: "Advisory Services", done },
    { text: "Initial outreach to ownership/management", responsible: "Advisory Services", done },

    { text: "Schedule discovery call", responsible: "Advisory Services", done },

    { text: "Follow up as needed", responsible: "Advisory Services", done }
  ];
}

// Canonical Planning checklist — the gap after Due Diligence completes but
// before the Advisory contract gets executed (whether that gap is still
// live/growing, or already resolved historically).
function planningTemplate(done) {
  return [
    { text: "Confirm current status with client", responsible: "Advisory Services", done },
    { text: "Follow up on outstanding next steps", responsible: "Advisory Services", done },
    { text: "Re-engage / check in with client", responsible: "Advisory Services", done }
  ];
}

// Planning's two possible timeline segments (waiting on the Advisory
// contract, already-resolved or still live/growing) share one underlying
// to-do list — this maps either display key back to the single canonical
// storage bucket they should read/write.
function storageKeyFor(phaseKey) {
  if (phaseKey === "planningGap" || phaseKey === "planningGapLive") return "planning";
  return phaseKey;
}

/* Build the actual phase sequence for a property's program. Two real
   events anchor the whole timeline: the Due Diligence contract execution
   date starts phase 1, and the Advisory Services contract execution date
   (a separate, independently-timed event) starts phase 2. Everything from
   RFP onward chains off Advisory's end. Ongoing Management runs to the
   ISP term end date rather than indefinitely. Prospecting renders before
   Due Diligence exists at all (pre-agreement lead time, whether or not DD
   has since been signed); Planning gaps render only after Due Diligence,
   if there's a real gap before the Advisory contract gets executed. */
function buildPhases(program) {
  // Per-property overrides take precedence over the portfolio-wide default —
  // anything not customized for this property falls back to PHASE_DURATIONS.
  // Overrides carry an optional note explaining why the timeframe was
  // extended or reduced, alongside the day count itself.
  const dur = (key) => {
    const override = program.durationOverrides && program.durationOverrides[key];
    return (override && override.days != null) ? override.days : PHASE_DURATIONS[key];
  };
  const durNote = (key) => {
    const override = program.durationOverrides && program.durationOverrides[key];
    return (override && override.note) || "";
  };
  // Once a phase is actually done, its real completion date — not the
  // calculated one — is what determines the phase's true end and the
  // next phase's start. Finishing every to-do early genuinely shifts the
  // whole downstream chain earlier; finishing late shifts it later. The
  // calculated end is only the fallback while a phase is still open,
  // used for At Risk detection.
  const actualEnd = (done, completedDate, calculatedEnd) => (done && completedDate) ? completedDate : calculatedEnd;

  const phases = [];
  const hasDD = !!program.ddContractExecuted;
  const hasAdvisory = !!program.advisoryContractExecuted;

  if (!hasDD && !hasAdvisory) {
    // Nothing contracted at all yet — still show a live, growing segment
    // if we know when the pitch/prospecting relationship started.
    if (program.prospectStart) {
      const end = TODAY > program.prospectStart ? TODAY : program.prospectStart;
      const data = program.phaseData.prospecting || { done: false, todos: prospectingTemplate(false) };
      phases.push({
        key: "prospecting", label: "Prospecting", color: PROSPECTING_COLOR, hatchDark: true,
        start: program.prospectStart, end, virtual: true, ...data
      });
    }
    return phases;
  }

  let ddEnd = null;
  if (hasDD) {
    if (program.prospectStart && program.prospectStart < program.ddContractExecuted) {
      // Pre-agreement lead time before DD was signed — this is still
      // Prospecting, not Planning, even though DD has since been executed.
      // It's necessarily concluded by now (DD couldn't have started
      // otherwise), so it always reads as done regardless of checklist state.
      const data = program.phaseData.prospecting || { done: false, todos: prospectingTemplate(false) };
      phases.push({
        key: "prospecting", label: "Prospecting", color: PROSPECTING_COLOR, hatchDark: true,
        start: program.prospectStart, end: program.ddContractExecuted, virtual: true, ...data, done: true
      });
    }

    const ddDef = PHASE_DEFS[0];
    const ddData = program.phaseData.dueDiligence || { done: false, todos: [] };
    const ddCalcEnd = addDays(program.ddContractExecuted, dur("dueDiligence"));
    ddEnd = actualEnd(ddData.done, ddData.completedDate, ddCalcEnd);
    phases.push({ ...ddDef, start: program.ddContractExecuted, end: ddEnd, ...ddData, durationNote: durNote("dueDiligence") });

    if (!hasAdvisory) {
      // Still waiting, right now — the gap grows every day this stays
      // empty, so render it out to today rather than showing nothing.
      if (TODAY > ddEnd) {
        const data = program.phaseData.planning || { done: false, todos: planningTemplate(false) };
        phases.push({
          key: "planningGapLive", label: "Planning (awaiting advisory contract)", color: PLANNING_COLOR,
          start: ddEnd, end: TODAY, virtual: true, ...data
        });
      }
      return phases;
    }

    if (program.advisoryContractExecuted > ddEnd) {
      // Same logic — this gap already ended, since the Advisory contract
      // has since been executed. Always reads as done either way.
      const data = program.phaseData.planning || { done: false, todos: planningTemplate(false) };
      phases.push({
        key: "planningGap", label: "Planning (awaiting advisory contract)", color: PLANNING_COLOR,
        start: ddEnd, end: program.advisoryContractExecuted, virtual: true, ...data, done: true
      });
    }
  } else if (program.prospectStart && program.prospectStart < program.advisoryContractExecuted) {
    // No Due Diligence contract at all — this property went straight to
    // Advisory Services. Still show a Prospecting lead-in if we know when
    // the relationship started; DD and the Planning gap simply don't exist.
    const data = program.phaseData.prospecting || { done: false, todos: prospectingTemplate(false) };
    phases.push({
      key: "prospecting", label: "Prospecting", color: PROSPECTING_COLOR, hatchDark: true,
      start: program.prospectStart, end: program.advisoryContractExecuted, virtual: true, ...data, done: true
    });
  }

  // hasAdvisory is guaranteed true past this point, whether DD happened or not.
  const advDef = PHASE_DEFS[1];
  const advData = program.phaseData.advisory || { done: false, todos: [] };
  const advCalcEnd = addDays(program.advisoryContractExecuted, dur("advisory"));
  // "Advisory Services selected in tracker" isn't independently toggled —
  // it's derived directly from whether the client has actually had at
  // least one Contracted Option (RFP/Program Design/Deployment) selected.
  // That keeps the checklist and the options chips from ever drifting out
  // of sync with each other.
  const optionsChosen = Object.values(program.selectedOptions || {}).some(Boolean);
  const advEnd = actualEnd(optionsChosen, advData.completedDate, advCalcEnd);
  const advTodos = (advData.todos || []).map((t) =>
    t.text === ADVISORY_TRACKER_STEP ? { ...t, done: optionsChosen } : t
  );
  phases.push({ ...advDef, start: program.advisoryContractExecuted, end: advEnd, ...advData, todos: advTodos, done: optionsChosen, durationNote: durNote("advisory") });

  let cursor = advEnd;
  if (optionsChosen) {
    PHASE_DEFS.slice(2).forEach((def) => {
      if (!program.selectedOptions[def.optionKey]) return;
      let start = cursor;
      // A client can skip Crestline running RFP/Program Design entirely —
      // they did their own procurement and just want deployment managed.
      // In that case, Advisory's calculated end date has no real bearing
      // on when Deployment should start — the ISP contract's actual
      // execution date does. Only applies when both upstream phases are
      // genuinely skipped; if either is selected, the normal calculated
      // chain still applies, since that's how the ISP contract would
      // actually get executed in the first place.
      if (def.key === "deployment" && program.ispContractExecuted && !program.selectedOptions.rfp && !program.selectedOptions.programDesign) {
        start = program.ispContractExecuted;
      }
      const data = program.phaseData[def.key] || { done: false, todos: [] };
      const end = def.key === "ongoing"
        ? (program.ispTermEnd || TIMELINE_END) // perpetual — never early-shifted
        : actualEnd(data.done, data.completedDate, addDays(start, dur(def.key)));
      phases.push({ ...def, start, end, ...data, durationNote: def.key === "ongoing" ? "" : durNote(def.key) });
      cursor = end;
    });
  }
  return phases;
}

/* Status is computed from the current phase's to-do list — a manual
   override always wins if your team sets one. */
function computeStatus(property) {
  const { program } = property;
  if (program.manualStatus) return program.manualStatus;
  // A contract workflow has been created (drafting started, per the real
  // Ironclad "Workflow Created Date") but hasn't reached execution yet —
  // a genuine pivot point distinct from either Prospecting or a fully
  // executed Advisory engagement.
  if (program.advisoryContractDrafted && !program.advisoryContractExecuted) return "Advisory Contracts Drafted";
  if (!program.ddContractExecuted && !program.advisoryContractExecuted) return "Prospecting";

  const phases = buildPhases(program);
  const realPhases = phases.filter((ph) => !ph.virtual);
  const today = parseDate(TODAY);
  const allDone = realPhases.every((ph) => ph.done);
  if (allDone) {
    if (realPhases.length === 1) return "Planning"; // DD complete, Advisory contract not yet executed
    if (realPhases.length === 2) return program.decision === "closed" ? "Closed" : "Planning";
    const last = realPhases[realPhases.length - 1];
    // A phase can be checked off ahead of its own calculated schedule —
    // that shouldn't jump the status to Stabilized before today has
    // actually reached the point where Ongoing Management begins.
    return (last.key === "ongoing" && today >= parseDate(last.start)) ? "Stabilized" : "On Track";
  }
  const current = realPhases.find((ph) => !ph.done);
  const todos = current.todos || [];
  if (todos.some((t) => t.blocked && !t.done)) return "Blocked";
  if (todos.some((t) => t.due && !t.done && parseDate(t.due) < today)) return "At Risk";
  // No specific to-do is flagged, but the phase itself has already run past
  // its own default (or overridden) duration — that's still behind schedule.
  if (today > parseDate(current.end)) return "At Risk";
  // Same guard here — Ongoing Management only reads as Stabilized once
  // today has genuinely reached it, not just because everything before it
  // got marked done early.
  return (current.key === "ongoing" && today >= parseDate(current.start)) ? "Stabilized" : "On Track";
}

const CLIENTS = [...new Set(PROPERTIES.map((p) => p.program.attributes.Client).filter(Boolean))].sort();

// Which phase a property is "currently" sitting in, normalized for
// grouping — matches the same current-phase logic used in the table view,
// with virtual Prospecting/Planning segments collapsed to a clean label.
function currentPhaseGroupLabel(property) {
  const phases = buildPhases(property.program);
  if (phases.length === 0) return "No phase yet";
  const current = phases.find((ph) => !ph.done) || phases[phases.length - 1];
  if (current.virtual) return current.key === "prospecting" ? "Prospecting" : "Planning";
  return current.label;
}

// Natural phase sequence, used to sort Group-by-Phase lanes in the order
// work actually flows rather than alphabetically.
const PHASE_GROUP_ORDER = [
  "Prospecting", "Property & Contract Due Diligence", "Planning",
  "Advisory Service Contracting", "RFP", "Program Design & Contracting",
  "Deployment", "Ongoing Management", "No phase yet"
];

const GROUP_DEFS = {
  none: { label: "None (flat list)" },
  client: { label: "Client", keys: CLIENTS, get: (p) => [p.program.attributes.Client || "—"] },
  phase: { label: "Phase", keys: [], get: (p) => [currentPhaseGroupLabel(p)] },
  status: { label: "Status", keys: STATUS_OPTIONS, get: (p) => [computeStatus(p)] },
  region: { label: "Region", keys: REGIONS_SEED, get: (p) => [p.program.attributes.Region || "—"] },
  office: { label: "Office", keys: OFFICES_SEED, get: (p) => [p.program.attributes.Office || "—"] },
  projectType: { label: "Project Type", keys: PROJECT_TYPES, get: (p) => [p.program.attributes["Project Type"] || "Retrofit"] }
};

function Pill({ children, color, bg }) {

    <span className="pill" style={{ color, background: bg || "transparent", borderColor: color }}>

}

function StakeholderChip({ label, active, onClick, count }) {
  return (
    <button className={`chip ${active ? "chip-active" : ""}`} onClick={onClick}>
      {label}
      {typeof count === "number" && <span className="chip-count">{count}</span>}
    </button>
  );
}

function PhaseLegend() {
  return (
    <>
      <div className="legend">
        {PHASE_DEFS.filter((d) => d.key !== "ongoing" || true).map((d, i) => (
          i === 5 ? null : (
            <div className="legend-item" key={d.key}>
              <span className="legend-swatch" style={{ background: d.color }} />
              {d.label}
            </div>
          )
        ))}
        <div className="legend-item" key="ongoing">
          <span className="legend-swatch" style={{ background: PHASE_DEFS[5].color }} />

      </div>
    </>
  );
}

function TimelineHeader({ months, showYear2, onToggleYear2, chartEnd }) {
  const widths = monthColumnWidths(months, chartEnd);
  return (
    <div className="tl-header" style={{ gridTemplateColumns: `220px ${widths.map((w) => `${w}fr`).join(" ")}` }}>
      <div className="tl-header-spacer" />
      {months.map((m) => (
        <div className="tl-header-cell" key={m.key}><span>{m.label}{m.year2 ? " '27" : ""}</span></div>
      ))}
      <button
        className="tl-year-toggle"
        onClick={onToggleYear2}
        title={showYear2 ? "Collapse back to one year" : "Expand to show next year"}
      >
        {showYear2 ? "−" : "+"}
      </button>
    </div>
  );
}

function PropertyRow({ property, onOpenPhase, onOpenProgram, chartEnd, months }) {
  const isProspect = !property.program.ddContractExecuted && !property.program.advisoryContractExecuted;
  const phases = buildPhases(property.program);

  // A property reads as not-on-track (Blocked or At Risk) when its current
  // real phase has an unresolved blocked to-do, an overdue due date, or —
  // failing either of those — has simply run past its own default duration
  // with nothing flagged. Same three conditions computeStatus checks, in
  // the same order. Whichever fires, position the strike chronologically:
  // a specific to-do's position within the checklist if one exists, or the
  // phase's own end date if the phase itself is just running long.
  const currentRealPhase = phases.filter((ph) => !ph.virtual).find((ph) => !ph.done);
  const stallTodos = currentRealPhase ? (currentRealPhase.todos || []) : [];
  const today = parseDate(TODAY);
  const blockedIdx = stallTodos.findIndex((t) => t.blocked && !t.done);
  const overdueIdx = stallTodos.findIndex((t) => t.due && !t.done && parseDate(t.due) < today);
  const phaseOverdue = currentRealPhase && today > parseDate(currentRealPhase.end);
  const firstOpenIdx = stallTodos.findIndex((t) => !t.done);

  let stallIdx = blockedIdx !== -1 ? blockedIdx : overdueIdx;
  let stallKind = blockedIdx !== -1 ? "Blocked" : (overdueIdx !== -1 ? "At Risk" : null);
  let strikeAtPhaseEnd = false;
  if (stallIdx === -1 && phaseOverdue) {
    stallKind = "At Risk";
    if (firstOpenIdx !== -1) stallIdx = firstOpenIdx;
    else strikeAtPhaseEnd = true; // no to-dos to anchor to — just run past the phase's own end
  }
  const isBlocked = stallIdx !== -1 || strikeAtPhaseEnd;
  const stallColor = "#9E3B2E"; // red for both Blocked and At Risk — same visual for any stall
  let strikeX = 0;
  if (isBlocked) {
    const leftPct = pct(currentRealPhase.start, chartEnd);
    const rightPct = pct(currentRealPhase.end, chartEnd);
    if (strikeAtPhaseEnd) {
      strikeX = rightPct;
    } else {
      const frac = (stallIdx + 0.5) / stallTodos.length;
      strikeX = leftPct + frac * (rightPct - leftPct);
    }
  }
  const todayPct = pct(TODAY, chartEnd);

  return (
    <div className="prop-row">
      <button className="prop-row-label" onClick={() => onOpenProgram(property)}>
        <span className="mono tag-code">{property.code}</span>
        <div className="prop-row-name">{property.name}</div>
      </button>
      <div className="prop-track">
        <div className="tl-grid" style={{ gridTemplateColumns: monthColumnWidths(months, chartEnd).map((w) => `${w}fr`).join(" ") }}>
          {months.map((m) => <div className="tl-grid-line" key={m.key} />)}
        </div>
        {isProspect && phases.length === 0 && <div className="prospect-note">Prospecting — no agreement signed yet</div>}
        {phases.map((ph, i) => {
          const left = pct(ph.start, chartEnd);
          const right = pct(ph.end, chartEnd);
          const width = Math.max(0.8, right - left);
          const isFirst = i === 0, isLast = i === phases.length - 1;
          return (
            <div
              key={ph.key}
              className={`phase-seg ${ph.done && !ph.virtual ? "phase-seg-done" : ""} ${ph.virtual ? "phase-seg-virtual" : ""} ${ph.hatchDark ? "phase-seg-virtual-dark" : ""}`}
              style={{
                left: `${left}%`, width: `calc(${width}% + 1px)`, backgroundColor: ph.color,
                borderTopLeftRadius: isFirst ? 3 : 0, borderBottomLeftRadius: isFirst ? 3 : 0,
                borderTopRightRadius: isLast ? 3 : 0, borderBottomRightRadius: isLast ? 3 : 0
              }}
              onClick={() => onOpenPhase(property, ph.key)}
              title={`${ph.label} — ${fmtDate(ph.start)} to ${fmtDate(ph.end)}${ph.done && !ph.virtual ? " (complete)" : ""}${ph.durationNote ? ` — ${ph.durationNote}` : ""}`}
            />
          );
        })}
        {isBlocked && (
          <>
            <div
              className="blocked-strike"
              style={{ left: `${strikeX}%`, borderLeftColor: stallColor }}
              title={strikeAtPhaseEnd
                ? `${stallKind} — ${currentRealPhase.label} has run past its expected ${fmtDate(currentRealPhase.end)} completion`
                : `${stallKind} — "${stallTodos[stallIdx].text}" (${currentRealPhase.label})`}
              onClick={() => onOpenPhase(property, currentRealPhase.key)}
            />
            {todayPct > strikeX && (
              <div
                className="blocked-dotted"
                style={{ left: `${strikeX}%`, width: `${todayPct - strikeX}%`, borderTopColor: stallColor }}
                title={`Stalled — no progress since this point, as of today`}
              />
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   TABLE VIEW
--------------------------------------------------------- */
function TableView({ properties, onOpenProgram }) {
  const [sortKey, setSortKey] = useState("name");
  const [sortDir, setSortDir] = useState(1);

  const rows = useMemo(() => properties.map((p) => {
    const status = computeStatus(p);
    let current = { label: "Prospecting", color: "#92C9EB" };
    if (p.program.ddContractExecuted) {
      const phases = buildPhases(p.program);
      current = phases.find((ph) => !ph.done) || phases[phases.length - 1];
    }
    return { property: p, status, current };
  }), [properties]);

  const sorted = useMemo(() => {
    const copy = [...rows];
    const val = (r) => sortKey === "name" ? r.property.name
      : sortKey === "current" ? r.current.label
      : sortKey === "status" ? r.status
      : r.property.program[sortKey];
    copy.sort((a, b) => {
      const av = val(a), bv = val(b);
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
    return copy;
  }, [rows, sortKey, sortDir]);

  const setSort = (key) => {
    if (sortKey === key) setSortDir((d) => d * -1);
    else { setSortKey(key); setSortDir(1); }
  };

  const cols = [
    { key: "name", label: "Property" },
    { key: "status", label: "Status" },
    { key: "priority", label: "Priority" },
    { key: "current", label: "Current Phase" }
  ];

  return (
    <div className="table-wrap">
      <table className="ptable">
        <thead>
          <tr>{cols.map((c) => (
            <th key={c.key} onClick={() => setSort(c.key)}>{c.label} {sortKey === c.key && (sortDir === 1 ? "▲" : "▼")}</th>
          ))}</tr>
        </thead>
        <tbody>
          {sorted.map((r) => (
            <tr key={r.property.id} onClick={() => onOpenProgram(r.property)}>
              <td className="mono">{r.property.code} — {r.property.name}</td>
              <td><Pill color={STATUS_META[r.status].color} bg={STATUS_META[r.status].bg}>{r.status}</Pill></td>
              <td><Pill color={PRIORITY_META[r.property.program.priority].color}>{r.property.program.priority}</Pill></td>
              <td style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span className="legend-swatch" style={{ background: r.current.color }} /> {r.current.label}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

            <span className="mono">{program.advisoryContractExecuted ? fmtDate(program.advisoryContractExecuted) : "Not yet"}</span>

            <span className="field-label">ISP Contract Executed</span>

                  return (
                    <button className="phase-row phase-row-virtual" key={ph.key} onClick={() => onOpenPhase(ph.key)}>
                      <span className="legend-swatch" style={{ background: ph.color }} />
                      <span className="dim" style={{ fontStyle: "italic" }}>{ph.label}</span>
                      <span className="phase-row-trailing">
                        <span className="mono ms-date">{fmtDate(ph.start)} – {fmtDate(ph.end)}</span>

                      <ChevronDown size={14} className="phase-chevron" />
                    </span>
                  </button>
                );
              })}

            {isHoldingPattern && (
              <>
                <div className="field-label" style={{ marginTop: 18 }}>Post-Due-Diligence decision</div>

          <div className="dim" style={{ fontSize: 13 }}>
            No agreement signed yet — this property is still in the pitch/prospect stage.
          </div>
        )}
      </div>
    </div>
  );
}

function PhaseModal({ property, phaseKey, onClose, onToggleTodo, onAddTodo, onToggleOption, onReassignTodo, onSetToggleWith, onSwapToggle, onUndoSwap, onUpdateTodoNotes, onOpenEconomicModel }) {
  const [newTodo, setNewTodo] = useState("");
  const [expandedNotes, setExpandedNotes] = useState({});
  const [selectedEmailKey, setSelectedEmailKey] = useState(null);
  const phases = buildPhases(property.program);
  const phase = phases.find((p) => p.key === phaseKey);
  if (!phase) return null;

  // Every email template across every to-do in this phase, flattened into
  // one list so there's a single "Draft email" control at the top instead
  // of a button scattered on each individual to-do.
  const emailOptions = [];
  (phase.todos || []).forEach((t) => {
    (t.emailTemplates || []).forEach((tpl) => {
      emailOptions.push({ key: `${t.text}::${tpl.label || ""}`, todoText: t.text, tpl });
    });
  });
  const effectiveEmailKey = selectedEmailKey || (emailOptions[0] && emailOptions[0].key);
  const selectedEmail = emailOptions.find((o) => o.key === effectiveEmailKey) || emailOptions[0];

  const submitTodo = () => { if (newTodo.trim()) { onAddTodo(newTodo.trim()); setNewTodo(""); } };
  const toggleNote = (i) => setExpandedNotes((m) => ({ ...m, [i]: !m[i] }));

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-wide" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <span className="mono tag-code">{property.code} · {property.name}</span>
            <h2>{phase.label}</h2>
          </div>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-pills">
          <span className="legend-swatch" style={{ background: phase.color }} />
          <span className="dim mono">{fmtDate(phase.start)} – {fmtDate(phase.end)}</span>
          {phase.billing && <span className="dim">{phase.billing}</span>}

            <div className="field-label">Phase fields</div>

// Preserves original header casing (so the mapping dropdowns show your
// real column names) — rows are keyed by that same original header text.
function parseDelimited(text) {
  const lines = text.trim().split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return { headers: [], rows: [] };
  const delim = lines[0].includes("\t") ? "\t" : ",";
  const headers = lines[0].split(delim).map((h) => h.trim());
  const rows = lines.slice(1).map((line) => {
    const cells = line.split(delim).map((c) => c.trim());
    const row = {};
    headers.forEach((h, i) => { row[h] = cells[i] !== undefined ? cells[i] : ""; });
    return row;
  });
  return { headers, rows };
}

const FMT_MONEY = (n) => `$${Math.round(n || 0).toLocaleString()}`;

// Finds a value in the parsed RFP Response sheet by matching the header
// row's label text (partial, case-insensitive) rather than a hardcoded
// column letter — the real form's column order could shift between
// versions, but the header text is stable.
function findRfpValue(headerRow, dataRow, label) {
  const idx = headerRow.findIndex((h) => (h || "").toString().toLowerCase().includes(label.toLowerCase()));
  return idx === -1 ? null : dataRow[idx];
}

const VENDOR_CHART_COLORS = ["#0077D4", "#A6DE9E", "#FFD972", "#DA7A62", "#92C9EB", "#9E3B2E"];

// Hand-coded SVG rather than an external charting library — this dashboard
// has no real bundler, just Babel-in-browser loading pre-built UMD scripts,
// and most chart libraries don't have a reliable standalone build for that
// setup. Custom SVG guarantees it always renders, no CDN dependency risk.
function CCFLineChart({ results }) {
  const W = 640, H = 260, padL = 60, padR = 20, padT = 16, padB = 30;
  const maxYears = Math.max(...results.map((r) => r.model.rows.length));
  const allCCF = results.flatMap((r) => r.model.rows.map((row) => row.ccf));
  const minY = Math.min(0, ...allCCF);
  const maxY = Math.max(0, ...allCCF);
  const yRange = maxY - minY || 1;
  const xFor = (year) => padL + ((year - 1) / Math.max(1, maxYears - 1)) * (W - padL - padR);
  const yFor = (val) => padT + (1 - (val - minY) / yRange) * (H - padT - padB);
  const zeroY = yFor(0);

  const ticks = 4;
  const yTicks = Array.from({ length: ticks + 1 }, (_, i) => minY + (yRange * i) / ticks);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {yTicks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={yFor(t)} y2={yFor(t)} stroke="var(--grid-line)" strokeWidth="1" />
          <text x={padL - 8} y={yFor(t) + 4} textAnchor="end" fontSize="10" fill="var(--ink-muted)">{FMT_MONEY(t)}</text>
        </g>
      ))}
      <line x1={padL} x2={W - padR} y1={zeroY} y2={zeroY} stroke="var(--ink-muted)" strokeWidth="1.5" />
      {Array.from({ length: maxYears }).map((_, i) => (
        <text key={i} x={xFor(i + 1)} y={H - 10} textAnchor="middle" fontSize="10" fill="var(--ink-muted)">Y{i + 1}</text>
      ))}
      {results.map(({ vendor, model }, vi) => {
        const color = VENDOR_CHART_COLORS[vi % VENDOR_CHART_COLORS.length];
        const points = model.rows.map((row) => `${xFor(row.year)},${yFor(row.ccf)}`).join(" ");
        return (
          <g key={vendor.id}>
            <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" />
            {model.rows.map((row) => <circle key={row.year} cx={xFor(row.year)} cy={yFor(row.ccf)} r="3" fill={color} />)}
          </g>
        );
      })}
    </svg>
  );
}

function VendorBarChart({ results, metric, label }) {
  const W = 640, H = 180, padL = 70, padR = 20, padT = 16, padB = 30;
  const values = results.map((r) => metric(r.model));
  const maxAbs = Math.max(1, ...values.map((v) => Math.abs(v)));
  const barW = (W - padL - padR) / results.length - 20;
  const zeroY = padT + (H - padT - padB) / 2;
  const scale = (H - padT - padB) / 2 / maxAbs;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      <text x={4} y={padT + 4} fontSize="10" fill="var(--ink-muted)">{label}</text>
      <line x1={padL} x2={W - padR} y1={zeroY} y2={zeroY} stroke="var(--ink-muted)" strokeWidth="1" />
      {results.map(({ vendor, model }, i) => {
        const val = metric(model);
        const color = VENDOR_CHART_COLORS[i % VENDOR_CHART_COLORS.length];
        const x = padL + i * ((W - padL - padR) / results.length) + 10;
        const barH = Math.abs(val) * scale;
        const y = val >= 0 ? zeroY - barH : zeroY;
        return (
          <g key={vendor.id}>
            <rect x={x} y={y} width={barW} height={Math.max(1, barH)} fill={color} rx="2" />
            <text x={x + barW / 2} y={val >= 0 ? y - 5 : y + barH + 14} textAnchor="middle" fontSize="10" fill="var(--ink)">{FMT_MONEY(val)}</text>
            <text x={x + barW / 2} y={H - 8} textAnchor="middle" fontSize="10" fill="var(--ink-muted)">{vendor.name}</text>
          </g>
        );
      })}
    </svg>
  );
}

  const [saved, setSaved] = useState(false);
  const [uploadError, setUploadError] = useState(null);

  const updateAssumption = (key, value) => setAssumptions((a) => ({ ...a, [key]: value }));
  const updateVendor = (id, key, value) => setVendors((vs) => vs.map((v) => (v.id === id ? { ...v, [key]: value } : v)));
  const addVendor = () => setVendors((vs) => [...vs, newVendorBid(`Vendor ${String.fromCharCode(65 + vs.length)}`)]);
  const removeVendor = (id) => setVendors((vs) => (vs.length > 1 ? vs.filter((v) => v.id !== id) : vs));

  const handleUpload = (vendorId, file) => {
    setUploadError(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets["RFP Response"] || wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const headerRow = rows[3] || []; // row 4 — the real form's header row
        const dataRow = rows[4] || [];  // row 5 — first property's bid data
        if (!headerRow.length || !dataRow.length) throw new Error("empty");

        const num = (v) => (typeof v === "number" ? v : parseFloat(v)) || 0;
        const rawRateIncrease = findRfpValue(headerRow, dataRow, "Annual Rate Increase");
        // The form's percentage cells can read as a fraction (0.03) or a
        // whole number (3) depending on how the vendor typed it — normalize.
        const rateIncreaseNum = num(rawRateIncrease);
        const rateIncrease = rateIncreaseNum > 1 ? rateIncreaseNum / 100 : rateIncreaseNum;

        updateVendor(vendorId, "circuitCostPerUnit", num(findRfpValue(headerRow, dataRow, "Circuit Cost")));
        updateVendor(vendorId, "supportFeePerUnit", num(findRfpValue(headerRow, dataRow, "Support Fee")));

        setVendors((vs) => vs.map((v) => v.id === vendorId ? {
          ...v,

            7: num(findRfpValue(headerRow, dataRow, "7Y")) || null,
            10: num(findRfpValue(headerRow, dataRow, "10Y")) || null

        } : v));
        const companyName = findRfpValue(headerRow, dataRow, "Company");
        if (companyName) updateVendor(vendorId, "name", String(companyName));

        setUploadError("Could not read this file — make sure it's the standard RFP Response template.");

// Executed Contracts — a permanent repository of every Advisory Services
// contract ever executed. This is purely a filtered view over the same
// property data everything else uses; nothing in the app ever deletes a
// property or clears an execution date, so this record only grows over
// time, never shrinks. Styled to match the flat Table view exactly.
function ExecutedContractsModal({ properties, onOpenProperty, onClose }) {
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("executed");
  const [sortDir, setSortDir] = useState(-1);

  const executed = useMemo(() => properties.filter((p) => p.program.advisoryContractExecuted), [properties]);
  const q = search.trim().toLowerCase();
  const filtered = q
    ? executed.filter((p) => p.name.toLowerCase().includes(q) || (p.program.attributes.Client || "").toLowerCase().includes(q))
    : executed;

  const servicesFor = (p) => {
    const { rfp, programDesign, deployment } = p.program.selectedOptions || {};
    const selected = [];
    if (rfp) selected.push("RFP");
    if (programDesign) selected.push("Program Design");
    if (deployment) selected.push("Deployment");
    return selected.length ? selected.join(", ") : "None yet selected";
  };

  const sorted = useMemo(() => {
    const val = (p) => {
      if (sortKey === "name") return p.name;
      if (sortKey === "client") return p.program.attributes.Client || "";
      if (sortKey === "units") return p.program.attributes.Units || 0;
      if (sortKey === "region") return p.program.attributes.Region || "";
      if (sortKey === "executed") return p.program.advisoryContractExecuted;
      if (sortKey === "services") return servicesFor(p);
      return "";
    };
    const copy = [...filtered];
    copy.sort((a, b) => {
      const av = val(a), bv = val(b);
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
    return copy;
  }, [filtered, sortKey, sortDir]);

  const setSort = (key) => {
    if (sortKey === key) setSortDir((d) => d * -1);
    else { setSortKey(key); setSortDir(1); }
  };

  const cols = [
    { key: "name", label: "Property" },
    { key: "client", label: "Client" },
    { key: "units", label: "Units" },
    { key: "region", label: "Region" },
    { key: "executed", label: "Contract Executed" },
    { key: "services", label: "Services Selected" }
  ];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-extra-wide" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <h2>Executed Contracts</h2>
            <div className="dim" style={{ fontSize: 12, marginTop: 2 }}>
              A permanent record of every Advisory Services contract executed — {executed.length} total, none ever removed.
            </div>
          </div>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="search-box" style={{ marginBottom: 14 }}>
          <Search size={14} color="var(--ink-muted)" />
          <input placeholder="Search by property or client…" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <div className="table-wrap">
          <table className="ptable">
            <thead>
              <tr>{cols.map((c) => (
                <th key={c.key} onClick={() => setSort(c.key)}>{c.label} {sortKey === c.key && (sortDir === 1 ? "▲" : "▼")}</th>
              ))}</tr>
            </thead>
            <tbody>
              {sorted.map((p) => (
                <tr key={p.id} onClick={() => onOpenProperty(p)}>
                  <td className="mono">{p.code} — {p.name}</td>
                  <td>{p.program.attributes.Client || "—"}</td>
                  <td className="mono">{p.program.attributes.Units || "—"}</td>
                  <td>{p.program.attributes.Region || "—"}</td>
                  <td className="mono">{fmtDate(p.program.advisoryContractExecuted)}</td>
                  <td>{servicesFor(p)}</td>
                </tr>
              ))}
              {sorted.length === 0 && (
                <tr><td colSpan={6} className="dim" style={{ textAlign: "center", padding: 24 }}>No executed contracts match your search.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div className="modal-actions">
          <button className="btn-primary" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

function ImportModal({ onImport, onClose }) {
  const [text, setText] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [result, setResult] = useState(null);

  const detectColumns = () => {
    const parsed = parseDelimited(text);
    setHeaders(parsed.headers);
    setRows(parsed.rows);
    // Best-effort auto-guess so you're rarely mapping every column by hand.
    // Tries an exact (case-insensitive) match on the full label first —
    // Client and Client Services share the same first word, so falling
    // straight to a first-word match would guess them both onto the same
    // column. An exact match on the real header avoids that collision.
    const guess = {};
    IMPORT_FIELDS.forEach((f) => {
      const labelLower = f.label.toLowerCase();
      const exact = parsed.headers.find((h) => h.toLowerCase() === labelLower);
      if (exact) { guess[f.key] = exact; return; }
      const keyword = f.label.split(" ")[0].toLowerCase();
      guess[f.key] = parsed.headers.find((h) => h.toLowerCase().includes(keyword)) || "";
    });
    setMapping(guess);
    setResult(null);
  };

  const updateMapping = (key, value) => setMapping((m) => ({ ...m, [key]: value }));

  const handleImport = () => {
    onImport(rows, mapping);
    setResult(`Imported ${rows.length} row(s) from your master file using the mapping below.`);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-wide" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Import master file</h2>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="dim" style={{ fontSize: 12, marginBottom: 10 }}>
          Paste one file (comma or tab separated, header row required) with all your property, prospect, and contract execution columns in it — then tell us which column is which.
        </div>
        <textarea className="import-textarea" rows={8} placeholder="Paste your master file here…" value={text} onChange={(e) => { setText(e.target.value); setHeaders([]); setRows([]); setResult(null); }} />
        <button className="btn-ghost" style={{ marginTop: 8 }} disabled={!text.trim()} onClick={detectColumns}><Table2 size={14} /> Detect columns</button>

        {headers.length > 0 && (
          <>
            <div className="field-label" style={{ marginTop: 18 }}>Column mapping — {rows.length} row(s) detected</div>
            <div className="mapping-grid">
              {IMPORT_FIELDS.map((f) => (
                <div className="form-field" key={f.key}>
                  <label>{f.label}{f.required ? " *" : ""}</label>
                  <select value={mapping[f.key] || ""} onChange={(e) => updateMapping(f.key, e.target.value)}>
                    <option value="">— Not mapped —</option>
                    {headers.map((h) => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </>
        )}

        {result && <div style={{ fontSize: 12, marginTop: 12, color: "#007B0C" }}>{result}</div>}

        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>Close</button>
          <button className="btn-primary" disabled={!rows.length || !mapping.name} onClick={handleImport}><Plus size={14} /> Import rows</button>
        </div>
      </div>
    </div>
  );
}
