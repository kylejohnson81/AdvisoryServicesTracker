/* ---------------------------------------------------------
   MAIN APP
--------------------------------------------------------- */
function App() {
  const [properties, setProperties] = useState(PROPERTIES);
  const [groupBy, setGroupBy] = useState("none");
  // Regions genuinely grow over time — this starts from the real seed list
  // but stays open-ended, not a fixed enum.
  const [regionsList, setRegionsList] = useState(REGIONS_SEED);

  // Shared, persistent data across everyone using this as a live artifact —
  // window.storage only exists when this is actually rendered through
  // Claude's artifact runtime, not when the standalone HTML file is
  // downloaded and opened directly in a regular browser. When it's
  // available, every team member's edits (checking off to-dos, updating
  // attributes, adding regions, everything) are saved to shared storage
  // and loaded by everyone else — genuinely the same live data, not
  // separate copies. When it's not available, the app falls back exactly
  // to today's standalone behavior: local to this browser tab only.
  const hasSharedStorage = typeof window !== "undefined" && !!window.storage;
  const [dataSyncStatus, setDataSyncStatus] = useState(hasSharedStorage ? "loading" : "standalone");

  useEffect(() => {
    if (!hasSharedStorage) return;
    (async () => {
      try {
        const result = await window.storage.get("properties-data", true);
        if (result && result.value) {
          setProperties(JSON.parse(result.value));
        } else {
          await window.storage.set("properties-data", JSON.stringify(PROPERTIES), true);
        }
      } catch (e) {
        // Key doesn't exist yet for this artifact — seed shared storage
        // with the current data so the next person to open it sees the same thing.
        try { await window.storage.set("properties-data", JSON.stringify(PROPERTIES), true); } catch (e2) { /* ignore */ }
      }
      try {
        const regionResult = await window.storage.get("regions-data", true);
        if (regionResult && regionResult.value) setRegionsList(JSON.parse(regionResult.value));
      } catch (e) { /* no shared regions yet — local seed list stands */ }
      setDataSyncStatus("shared");
    })();
  }, []);

  useEffect(() => {
    if (!hasSharedStorage || dataSyncStatus === "loading") return;
    window.storage.set("properties-data", JSON.stringify(properties), true).catch(() => {});
  }, [properties]);

  useEffect(() => {
    if (!hasSharedStorage || dataSyncStatus === "loading") return;
    window.storage.set("regions-data", JSON.stringify(regionsList), true).catch(() => {});
  }, [regionsList]);

  const addRegion = (newRegion) => {
    const trimmed = (newRegion || "").trim();
    if (!trimmed) return null;
    if (!regionsList.includes(trimmed)) {
      setRegionsList((prev) => [...prev, trimmed].sort());
    }
    return trimmed;
  };
  const [isolatedKey, setIsolatedKey] = useState(null);
  // Isolating a group only makes sense within the current grouping — if
  // the person switches from Group by Client to Group by Region, an
  // isolated client name wouldn't map to anything meaningful anymore.
  useEffect(() => { setIsolatedKey(null); }, [groupBy]);
  const [view, setView] = useState("timeline");
  const [search, setSearch] = useState("");
  const [showClosed, setShowClosed] = useState(false);
  const [programPropertyId, setProgramPropertyId] = useState(null);
  const [phaseSel, setPhaseSel] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [durationsOpen, setDurationsOpen] = useState(false);
  const [executedContractsOpen, setExecutedContractsOpen] = useState(false);
  const [propDurationsOpen, setPropDurationsOpen] = useState(false);
  const [econModelOpen, setEconModelOpen] = useState(false);
  const [durations, setDurationsState] = useState({ ...PHASE_DURATIONS });
  const [queueStakeholder, setQueueStakeholder] = useState(null);
  const [statusFilter, setStatusFilter] = useState(null);
  const [showYear2, setShowYear2] = useState(false);
  const { months, end: chartEnd } = useMemo(() => buildChartRange(showYear2), [showYear2]);
  const toggleYear2 = () => setShowYear2((v) => !v);

  const visible = useMemo(() => {
    return properties.filter((p) => showClosed || computeStatus(p) !== "Closed");
  }, [properties, showClosed]);

  const searched = useMemo(() => {
    return visible.filter((p) => {
      const term = search.toLowerCase();
      return !term || p.name.toLowerCase().includes(term) || (p.program.attributes["CM"] || "").toLowerCase().includes(term) || (p.program.attributes.Client || "").toLowerCase().includes(term);
    });
  }, [visible, search]);

  const filtered = useMemo(() => {
    return statusFilter ? searched.filter((p) => computeStatus(p) === statusFilter) : searched;
  }, [searched, statusFilter]);

  const toggleStatusFilter = (s) => setStatusFilter((cur) => cur === s ? null : s);

  // Every open (not done) to-do across every property's active phases,
  // bucketed by whoever is currently responsible for it.
  const openTodosByStakeholder = useMemo(() => {
    const map = {};
    STAKEHOLDER_GROUPS.forEach((s) => { map[s] = []; });
    visible.forEach((p) => {
      const phases = buildPhases(p.program);
      // Only the phase actually being worked on right now — otherwise a
      // property in RFP still surfaces every to-do from Program Design
      // and Deployment too, since those phases are pre-populated with
      // full checklists the moment they're selected, long before they're
      // actually reached. That's clutter, not a real action item.
      const current = phases.find((ph) => !ph.done);
      if (!current) return;
      (current.todos || []).forEach((t, idx) => {
        if (t.done) return;
        if (t.text === ADVISORY_TRACKER_STEP) return; // derived, not a real action item
        const resp = t.responsible || "Advisory Services";
        if (map[resp]) map[resp].push({ property: p, phase: current, todoIdx: idx, todo: t });
      });
    });
    return map;
  }, [visible]);

  const stakeholderCounts = useMemo(() => {
    const map = {};
    STAKEHOLDER_GROUPS.forEach((s) => { map[s] = (openTodosByStakeholder[s] || []).length; });
    return map;
  }, [openTodosByStakeholder]);

  const grouped = useMemo(() => {
    if (groupBy === "none") return [{ key: null, properties: filtered }];
    const def = GROUP_DEFS[groupBy];
    // Client, Region, and Phase are all open-ended or derived live (new
    // values can arrive via import, or a property's current phase changes
    // as work progresses) — Status is the only truly fixed enum.
    let keys;
    if (groupBy === "client" || groupBy === "region" || groupBy === "office" || groupBy === "projectType") {
      keys = [...new Set(filtered.map((p) => def.get(p)[0]))].sort();
    } else if (groupBy === "phase") {
      keys = [...new Set(filtered.map((p) => def.get(p)[0]))]
        .sort((a, b) => PHASE_GROUP_ORDER.indexOf(a) - PHASE_GROUP_ORDER.indexOf(b));
    } else {
      keys = def.keys;
    }
    return keys.map((key) => ({ key, properties: filtered.filter((p) => def.get(p).includes(key)) }));
  }, [filtered, groupBy]);

  const nextCode = `P-${String(properties.reduce((max, p) => Math.max(max, parseInt(p.code.split("-")[1] || 0)), 0) + 1).padStart(2, "0")}`;

  const programProperty = properties.find((p) => p.id === programPropertyId) || null;
  const phaseProperty = phaseSel ? properties.find((p) => p.id === phaseSel.propertyId) : null;

  const openProgram = (property) => { setProgramPropertyId(property.id); setPhaseSel(null); };
  const closeProgram = () => setProgramPropertyId(null);
  const openPhaseDirect = (property, phaseKey) => { setQueueStakeholder(null); setProgramPropertyId(property.id); setPhaseSel({ propertyId: property.id, phaseKey }); };
  const openPhaseFromProgram = (phaseKey) => setPhaseSel({ propertyId: programPropertyId, phaseKey });
  const closePhase = () => setPhaseSel(null);

  const mutatePhaseDataFor = (propertyId, phaseKey, updater) => {
    const storageKey = storageKeyFor(phaseKey);
    setProperties((prev) => prev.map((p) => {
      if (p.id !== propertyId) return p;
      const current = p.program.phaseData[storageKey] || { done: false, todos: [] };
      return { ...p, program: { ...p.program, phaseData: { ...p.program.phaseData, [storageKey]: updater(current) } } };
    }));
  };
  const mutatePhaseData = (updater) => mutatePhaseDataFor(phaseSel.propertyId, phaseSel.phaseKey, updater);

  // Toggling these specific to-dos is what actually starts the clock —
  // Due Diligence's and Advisory's "Advisory Services contract executed"
  // set ddContractExecuted / advisoryContractExecuted respectively (same
  // text, but phaseKey disambiguates which one), and Program Design's
  // "ISP contract executed" sets ispContractExecuted.
  // These five have a real, finite default duration and chain into the
  // next phase — Ongoing Management deliberately isn't included here,
  // since it's a perpetual steady-state phase, not something that should
  // "complete" just because a checklist item got checked.
  const AUTO_COMPLETE_KEYS = ["dueDiligence", "advisory", "rfp", "programDesign", "deployment"];
  const toggleTodoGeneric = (propertyId, phaseKey, todoIdx) => {
    const storageKey = storageKeyFor(phaseKey);
    setProperties((prev) => prev.map((p) => {
      if (p.id !== propertyId) return p;
      const current = p.program.phaseData[storageKey] || { done: false, todos: [] };
      const todo = current.todos[todoIdx];
      const newDone = !todo.done;
      const newTodos = current.todos.map((t, idx) => idx !== todoIdx ? t : { ...t, done: newDone });
      const patch = {};
      if (phaseKey === "dueDiligence" && todo.text === "Advisory Services contract executed") patch.ddContractExecuted = newDone ? TODAY : null;
      if (phaseKey === "advisory" && todo.text === "Advisory Services contract executed") patch.advisoryContractExecuted = newDone ? TODAY : null;
      if (phaseKey === "programDesign" && todo.text === "ISP contract executed") patch.ispContractExecuted = newDone ? TODAY : null;

      let phaseUpdate = { todos: newTodos };
      if (AUTO_COMPLETE_KEYS.includes(storageKey)) {
        const allDone = newTodos.length > 0 && newTodos.every((t) => t.done);
        // Quietly records the real completion date the moment every to-do
        // is checked — used to shift the next phase's start earlier when
        // work wraps ahead of the default schedule, and to eventually
        // report on how often phases finish early vs. late. Nothing about
        // this shows up on the tracker itself.
        phaseUpdate = { todos: newTodos, done: allDone, completedDate: allDone ? (current.completedDate || TODAY) : null };
      }
      return { ...p, program: { ...p.program, ...patch, phaseData: { ...p.program.phaseData, [storageKey]: { ...current, ...phaseUpdate } } } };
    }));
  };
  const toggleTodo = (i) => toggleTodoGeneric(phaseSel.propertyId, phaseSel.phaseKey, i);
  const addTodo = (text) => mutatePhaseData((ph) => ({ ...ph, todos: [...(ph.todos || []), { text, done: false, responsible: "Advisory Services" }] }));
  const reassignTodo = (i, newResponsible) => mutatePhaseData((ph) => ({ ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, responsible: newResponsible }) }));
  const setToggleWith = (i, partner) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : (partner ? { ...t, toggleWith: partner, rounds: t.rounds || 0 } : { ...t, toggleWith: null }))
  }));
  const swapToggle = (i) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, responsible: t.toggleWith, toggleWith: t.responsible, rounds: (t.rounds || 0) + 1 })
  }));
  // Steps back exactly one swap — same swap mechanic as forward, but only
  // available while rounds > 0, and it decrements instead of increments.
  // Leaves the toggle pairing itself alone (see setToggleWith to remove it).
  const undoSwap = (i) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => (idx !== i || !(t.rounds > 0)) ? t : { ...t, responsible: t.toggleWith, toggleWith: t.responsible, rounds: t.rounds - 1 })
  }));
  const updateTodoNotes = (i, text) => mutatePhaseData((ph) => ({ ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, notes: text }) }));
  const toggleTodoFor = (propertyId, phaseKey, todoIdx) => toggleTodoGeneric(propertyId, phaseKey, todoIdx);

  const toggleOption = (optionKey) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== phaseSel.propertyId) return p;
      const newSelectedOptions = { ...p.program.selectedOptions, [optionKey]: !p.program.selectedOptions[optionKey] };
      const wasChosen = Object.values(p.program.selectedOptions).some(Boolean);
      const nowChosen = Object.values(newSelectedOptions).some(Boolean);
      const advisory = p.program.phaseData.advisory || { done: false, todos: [] };
      // Quietly captures when Advisory actually wrapped (an option got
      // chosen) relative to its default timeline — nothing shown on the
      // tracker for this, but the data is there for future reporting on
      // how often phases finish early vs. late.
      const advisoryPatch = (!wasChosen && nowChosen && !advisory.completedDate)
        ? { completedDate: TODAY }
        : (!nowChosen ? { completedDate: null } : {});
      return {
        ...p,
        program: {
          ...p.program, selectedOptions: newSelectedOptions,
          phaseData: { ...p.program.phaseData, advisory: { ...advisory, ...advisoryPatch } }
        }
      };
    }));
  };

  const setManualStatus = (status) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, manualStatus: status } }));
  };
  const setDecision = (decision) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, decision } }));
  };
  const setPriority = (priority) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, priority } }));
  };
  const setDDDate = (dateStr) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== programPropertyId) return p;
      const hasChecklist = p.program.phaseData.dueDiligence && p.program.phaseData.dueDiligence.todos && p.program.phaseData.dueDiligence.todos.length > 0;
      const dueDiligence = hasChecklist
        ? p.program.phaseData.dueDiligence
        : { done: false, todos: ddTemplate(false) };
      return { ...p, program: { ...p.program, ddContractExecuted: dateStr, phaseData: { ...p.program.phaseData, dueDiligence } } };
    }));
  };
  const setISPDate = (dateStr) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, ispContractExecuted: dateStr }
    }));
  };
  const updateAttribute = (key, value) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, attributes: { ...(p.program.attributes || {}), [key]: value } }
    }));
  };
  const saveEconomicModel = (data) => {
    if (!phaseSel) return;
    setProperties((prev) => prev.map((p) => p.id !== phaseSel.propertyId ? p : {
      ...p, program: { ...p.program, economicModel: data }
    }));
  };

  // Mutating the shared module-level object is what makes buildPhases
  // recalculate everywhere (timeline, status, table view) — the React
  // state here just exists to trigger that re-render and drive the UI.
  const updateDuration = (key, value) => {
    PHASE_DURATIONS = { ...PHASE_DURATIONS, [key]: value };
    setDurationsState(PHASE_DURATIONS);
  };
  const resetDurations = () => {
    PHASE_DURATIONS = { ...DEFAULT_PHASE_DURATIONS };
    setDurationsState(PHASE_DURATIONS);
  };
  // patch is { days } or { note } or both — merges onto whatever override
  // already exists for this phase (defaulting days to the portfolio value
  // the first time a note gets added without a day change). patch === null
  // clears the override entirely, falling back to the portfolio default.
  const updatePropertyDuration = (key, patch) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== programPropertyId) return p;
      const next = { ...(p.program.durationOverrides || {}) };
      if (patch == null) {
        delete next[key];
      } else {
        const current = next[key] || { days: PHASE_DURATIONS[key], note: "" };
        next[key] = { ...current, ...patch };
      }
      return { ...p, program: { ...p.program, durationOverrides: next } };
    }));
  };

  const addProperty = (property) => {
    setProperties((prev) => [...prev, { ...property, id: Date.now() }]);
    setAddOpen(false);
  };

  const importData = (rows, mapping) => {
    setProperties((prev) => {
      const list = [...prev];
      const col = (row, key) => (mapping[key] ? row[mapping[key]] : "") || "";
      const norm = (s) => (s || "").trim().toLowerCase();
      // True unique match, in priority order: Yardi Code first, when this
      // row has one and an existing property already has a matching one
      // on file — then falling back to Name AND Address both matching.
      // Matching on name alone isn't reliable enough, since two different
      // properties can share a name; requiring both together is the real
      // fallback identifier until every property has a Yardi Code on file.
      const findIdx = (row) => {
        const yardiCode = norm(col(row, "yardiCode"));
        if (yardiCode) {
          const byYardi = list.findIndex((p) => norm(p.program.attributes["Yardi Code"]) === yardiCode);
          if (byYardi !== -1) return byYardi;
        }
        const rowName = norm(col(row, "name"));
        const rowAddress = norm(col(row, "address"));
        return list.findIndex((p) => norm(p.name) === rowName && norm(p.program.attributes.Address) === rowAddress);
      };
      const nextCodeFor = () => `P-${String(list.reduce((m, p) => Math.max(m, parseInt(p.code.split("-")[1] || 0)), 0) + 1).padStart(2, "0")}`;

      rows.forEach((row) => {
        const name = col(row, "name");
        if (!name.trim()) return;
        let idx = findIdx(row);
        if (idx === -1) {
          list.push(newPropertyStub(name.trim(), nextCodeFor()));
          idx = list.length - 1;
        }
        let p = list[idx];

        // Every attribute-mapped column merges into program.attributes —
        // preserves anything already there (e.g. Vendor) that isn't part
        // of this import.
        const attrUpdates = {};
        Object.entries(IMPORT_TO_ATTRIBUTE).forEach(([importKey, attrName]) => {
          const val = col(row, importKey);
          if (val) attrUpdates[attrName] = val;
        });
        if (Object.keys(attrUpdates).length > 0) {
          p = { ...p, program: { ...p.program, attributes: { ...(p.program.attributes || {}), ...attrUpdates } } };
        }

        const prospectStart = col(row, "prospectStart");
        if (prospectStart) {
          p = { ...p, program: { ...p.program, prospectStart } };
        }

        const ddDate = col(row, "ddDate");
        if (ddDate) {
          p = {
            ...p,
            program: {
              ...p.program, ddContractExecuted: ddDate,
              phaseData: { ...p.program.phaseData, dueDiligence: { done: true, todos: ddTemplate(true) } }
            }
          };
        }

        const advisoryDate = col(row, "advisoryDate");
        if (advisoryDate) {
          p = {
            ...p,
            program: {
              ...p.program, advisoryContractExecuted: advisoryDate,
              phaseData: { ...p.program.phaseData, advisory: { done: true, todos: advisoryTemplate(true) } }
            }
          };
        }

        list[idx] = p;
      });
      return list;
    });
  };

  return (
    <div className="app-root">
      

      <div className="top-bar">
        <div className="brand">
          <div className="brand-icon"><Building2 size={18} /></div>
          <div>
            <h1>Advisory Services</h1>
            <div className="brand-sub">Master property tracker</div>
            {dataSyncStatus === "shared" && <div className="sync-badge sync-badge-live">● Shared — live for your whole team</div>}
            {dataSyncStatus === "standalone" && <div className="sync-badge sync-badge-local">○ Standalone — this device only</div>}
            {dataSyncStatus === "loading" && <div className="sync-badge sync-badge-local">Loading shared data…</div>}
          </div>
        </div>
        <div className="top-actions">
          <div className="search-box">
            <Search size={14} color="#B2B3B5" />
            <input placeholder="Search properties…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          <div className="view-toggle">
            <button className={view === "timeline" ? "active" : ""} onClick={() => setView("timeline")}><LayoutGrid size={14} /> Timeline</button>
            <button className={view === "table" ? "active" : ""} onClick={() => setView("table")}><ListIcon size={14} /> Table</button>
          </div>
          <button className="btn-ghost" onClick={() => setDurationsOpen(true)}><CheckSquare size={15} /> Phase durations</button>
          <button className="btn-ghost" onClick={() => setExecutedContractsOpen(true)}><CircleCheck size={15} /> Executed Contracts</button>
          <button className="btn-ghost" onClick={() => setImportOpen(true)}><Table2 size={15} /> Import data</button>
          <button className="btn-primary" onClick={() => setAddOpen(true)}><Plus size={15} /> Add property</button>
        </div>
      </div>

      <KpiStrip properties={searched} activeStatus={statusFilter} onSelect={toggleStatusFilter} />
      <PhaseLegend />

      <div className="main-layout">
        <div className="sidebar">
          <div className="sidebar-section">
            <div className="sidebar-title"><LayoutGrid size={12} /> Group by</div>
            {Object.entries(GROUP_DEFS).map(([key, def]) => (
              <button
                key={key}
                className={`group-option ${groupBy === key ? "active" : ""}`}
                onClick={() => (groupBy === key ? setIsolatedKey(null) : setGroupBy(key))}
              >
                {def.label}
              </button>
            ))}
          </div>
          <div className="sidebar-section">
            <div className="sidebar-title"><Filter size={12} /> Responsibilities</div>
            <div className="chip-row" style={{ flexDirection: "column", alignItems: "stretch" }}>
              {STAKEHOLDER_GROUPS.map((s) => (
                <StakeholderChip key={s} label={s} active={queueStakeholder === s} onClick={() => setQueueStakeholder(s)} count={stakeholderCounts[s]} />
              ))}
            </div>
          </div>
          <div className="sidebar-section">
            <div className="toggle-row">
              <span>Show closed</span>
              <button className={`toggle-btn ${showClosed ? "on" : ""}`} onClick={() => setShowClosed((v) => !v)}>
                {showClosed ? <Eye size={13} /> : <EyeOff size={13} />} {showClosed ? "Shown" : "Hidden"}
              </button>
            </div>
          </div>
        </div>

        <div>
          {isolatedKey && (
            <div className="isolate-banner">
              <span>Isolated: <strong>{isolatedKey}</strong></span>
              <button className="btn-ghost" onClick={() => setIsolatedKey(null)}>Show all groups</button>
            </div>
          )}
          {view === "timeline" ? (
            (() => {
              const visibleGroups = isolatedKey ? grouped.filter((g) => g.key === isolatedKey) : grouped;
              return visibleGroups.every((g) => g.properties.length === 0) ? (
                <div className="table-wrap" style={{ padding: 40, textAlign: "center", color: "var(--ink-muted)" }}>No properties match the current filters.</div>
              ) : (
                visibleGroups.map((g) => (
                  <PropertyGroup
                    key={g.key || "flat"} title={g.key} properties={g.properties}
                    onOpenPhase={openPhaseDirect} onOpenProgram={openProgram}
                    showHeader={groupBy !== "none"} months={months} chartEnd={chartEnd}
                    showYear2={showYear2} onToggleYear2={toggleYear2}
                    isIsolated={isolatedKey === g.key}
                    onIsolate={groupBy !== "none" ? () => setIsolatedKey(isolatedKey === g.key ? null : g.key) : null}
                  />
                ))
              );
            })()
          ) : (
            <TableView properties={filtered} onOpenProgram={openProgram} />
          )}
        </div>
      </div>

      {programProperty && !phaseSel && (
        <ProgramModal property={programProperty} onClose={closeProgram} onOpenPhase={openPhaseFromProgram} onSetManualStatus={setManualStatus} onSetDecision={setDecision} onSetPriority={setPriority} onOpenDurations={() => setPropDurationsOpen(true)} onUpdateAttribute={updateAttribute} onSetDDDate={setDDDate} onSetISPDate={setISPDate} regionsList={regionsList} onAddRegion={addRegion} />
      )}

      {phaseProperty && phaseSel && (
        <PhaseModal
          property={phaseProperty}
          phaseKey={phaseSel.phaseKey}
          onClose={closePhase}
          onToggleTodo={toggleTodo}
          onAddTodo={addTodo}
          onToggleOption={toggleOption}
          onReassignTodo={reassignTodo}
          onSetToggleWith={setToggleWith}
          onSwapToggle={swapToggle}
          onUndoSwap={undoSwap}
          onUpdateTodoNotes={updateTodoNotes}
          onOpenEconomicModel={() => setEconModelOpen(true)}
        />
      )}

      {econModelOpen && phaseProperty && (
        <EconomicModelModal
          property={phaseProperty}
          onClose={() => setEconModelOpen(false)}
          onSave={saveEconomicModel}
        />
      )}

      {queueStakeholder && (
        <WorkQueueModal
          stakeholder={queueStakeholder}
          items={openTodosByStakeholder[queueStakeholder] || []}
          onClose={() => setQueueStakeholder(null)}
          onOpenPhase={openPhaseDirect}
          onToggleDone={toggleTodoFor}
        />
      )}

      {addOpen && <AddPropertyModal nextCode={nextCode} onSave={addProperty} onClose={() => setAddOpen(false)} regionsList={regionsList} onAddRegion={addRegion} />}
      {importOpen && <ImportModal onImport={importData} onClose={() => setImportOpen(false)} />}
      {executedContractsOpen && <ExecutedContractsModal properties={properties} onOpenProperty={(p) => { setExecutedContractsOpen(false); openProgram(p); }} onClose={() => setExecutedContractsOpen(false)} />}
      {durationsOpen && (
        <PhaseDurationsModal
          durations={durations}
          onChange={updateDuration}
          onReset={resetDurations}
          onClose={() => setDurationsOpen(false)}
        />
      )}
      {propDurationsOpen && programProperty && (
        <PropertyDurationsModal
          property={programProperty}
          globalDurations={durations}
          onChange={updatePropertyDuration}
          onClose={() => setPropDurationsOpen(false)}
        />
      )}
    </div>
  );
}


function mountApp() {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
window.__mountApp = mountApp;

</script>
</body>
</html>
