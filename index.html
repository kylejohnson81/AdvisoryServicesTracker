/* ---------------------------------------------------------
   CHANGE LOG — review queue for public.master_sync_log
   Rows come from the daily master sync, the notes digest (ball in
   court / to-do suggestions), DD imports, intake forms and manual
   entries. Decisions made here update the property (through the
   normal properties save) and stamp the log row reviewed / applied,
   with an undo record so any decision can be reversed.
--------------------------------------------------------- */
/* ---------------------------------------------------------
   DUPLICATE CHECK — finds tracker properties that are probably the same
   building: same Yardi code, same street address, or similar names with
   the same client and no location conflict. Used by the import previews
   (before creating a property) and the Change Log "Duplicate" flags.
--------------------------------------------------------- */
const DUP_STOP = new Set(["the","at","of","on","a","an","and","apartments","apartment","apts","apt","residences","residence","homes","living","community","communities","phase","ph","by"]);
const DUP_ROMAN = { i: "1", ii: "2", iii: "3", iv: "4", v: "5" };
function dupNameTokens(name) {
  return String(name || "").toLowerCase().replace(/&/g, " and ").replace(/\(.*?\)/g, " ").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/)
    .map((t) => DUP_ROMAN[t] || t).filter((t) => t && !DUP_STOP.has(t));
}
const dupNorm = (s) => String(s || "").toLowerCase().replace(/[.,()]/g, " ").replace(/\b(llc|inc|lp|llp|ltd|co|corp)\b/g, " ").replace(/\s+/g, " ").trim();
const dupAddr = (s) => String(s || "").toLowerCase().replace(/[.,#]/g, " ").replace(/\b(street)\b/g, "st").replace(/\b(avenue)\b/g, "ave").replace(/\b(road)\b/g, "rd").replace(/\b(drive)\b/g, "dr").replace(/\b(lane)\b/g, "ln").replace(/\b(boulevard)\b/g, "blvd").replace(/\b(place)\b/g, "pl").replace(/\b(court)\b/g, "ct").replace(/\b(north)\b/g, "n").replace(/\b(south)\b/g, "s").replace(/\b(east)\b/g, "e").replace(/\b(west)\b/g, "w").replace(/\s+/g, " ").trim();
// Returns likely duplicate pairs among the given properties: [{ a, b, score, reasons[] }]
function findDuplicatePairs(list) {
  const items = list.map((p) => {
    const at = (p.program && p.program.attributes) || p.attrs || {};
    const g = (k) => (at[k] !== undefined ? at[k] : p[k.toLowerCase()]);
    return { p, tokens: dupNameTokens(p.name), client: dupNorm(g("Client")), jv: dupNorm(g("JV Partner")), addr: dupAddr(g("Address")),
      city: String(g("City") || "").toLowerCase().trim(), state: String(g("State") || "").toUpperCase().trim(),
      zip: String(g("Zip") || "").replace(/\D/g, "").padStart(String(g("Zip") || "").replace(/\D/g, "").length === 4 ? 5 : 0, "0").slice(0, 5),
      units: Number(g("Units")) || null, yardi: String(g("Yardi Code") || "").toLowerCase().trim() };
  });
  const out = [];
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const A = items[i], B = items[j];
    const reasons = []; let score = 0;
    if (A.yardi && A.yardi === B.yardi) { score += 100; reasons.push(`same Yardi code (${A.yardi})`); }
    const sameAddr = A.addr && A.addr === B.addr && (!A.state || !B.state || A.state === B.state);
    if (sameAddr) { score += 80; reasons.push(`same address (${A.addr})`); }
    const sa = new Set(A.tokens), sb = new Set(B.tokens);
    const inter = [...sa].filter((t) => sb.has(t)).length, uni = new Set([...sa, ...sb]).size;
    const jac = uni ? inter / uni : 0;
    const small = sa.size <= sb.size ? sa : sb, big = sa.size <= sb.size ? sb : sa;
    const contained = small.size > 0 && [...small].every((t) => big.has(t)) && (small.size >= 2 || [...small][0].length >= 6);
    const exact = A.tokens.join(" ") === B.tokens.join(" ") && A.tokens.length > 0;
    if (exact) { score += 60; reasons.push("same name"); }
    else if (contained || jac >= 0.6) { score += Math.round(40 * Math.max(jac, contained ? 0.75 : 0)); reasons.push(`similar names (${Math.round(jac * 100)}% word overlap${contained ? ", one name contains the other" : ""})`); }
    // A client named after the other property (e.g. "One West End Owner Phase I, LLC" vs "One West End").
    const refs = (client, toks) => toks.length >= 2 && toks.every((t) => dupNameTokens(client).includes(t));
    const clientRef = (A.client && refs(A.client, B.tokens)) || (B.client && refs(B.client, A.tokens));
    if (clientRef && !exact) {
      score += 30; reasons.push("one property's client is named after the other");
      if (!contained && jac < 0.6 && jac >= 0.3) { score += Math.round(40 * jac); reasons.push(`partly similar names (${Math.round(jac * 100)}% word overlap)`); }
    }
    const nameish = exact || contained || jac >= 0.6 || (clientRef && jac >= 0.3);
    if (!(A.yardi && A.yardi === B.yardi) && !sameAddr && !nameish) continue;
    // Location conflicts rule a pair out unless code or address already match.
    const stateClash = A.state && B.state && A.state !== B.state;
    const cityClash = A.city && B.city && A.city !== B.city;
    const zipClash = A.zip && B.zip && A.zip !== B.zip;
    if (!(A.yardi && A.yardi === B.yardi) && !sameAddr && (stateClash || cityClash || zipClash)) continue;
    if (A.addr && B.addr && !sameAddr && !(A.yardi && A.yardi === B.yardi)) continue; // both have different street addresses
    const clientSame = A.client && B.client && (A.client === B.client || A.client === B.jv || A.jv === B.client);
    if (clientSame) { score += 20; reasons.push("same client"); }
    else if (!clientRef && A.client && B.client && A.client !== "—" && B.client !== "—") { score -= 15; reasons.push("different clients"); }
    if (A.units && B.units) {
      if (Math.abs(A.units - B.units) <= Math.max(1, Math.round(Math.max(A.units, B.units) * 0.05))) { score += 10; reasons.push(`same units (${A.units})`); }
      else { score -= 20; reasons.push(`units differ (${A.units} vs ${B.units})`); }
    }
    if (!A.city && !B.city && !A.addr && !B.addr && !A.state && !B.state) reasons.push("no location data on either");
    else if (!A.addr && !B.addr) reasons.push("no street address on either to compare");
    else if (!(A.addr && B.addr)) reasons.push("street address missing on one, so it can't be compared");
    if (score >= 40) out.push({ a: A.p, b: B.p, score, reasons });
  }
  return out.sort((x, y) => y.score - x.score);
}
const dupConfidence = (score) => score >= 80 ? "High" : score >= 50 ? "Medium" : "Low";
// Existing properties a new import row may duplicate (best first).
function dupMatchesFor(candidate, properties) {
  const probe = { id: "__new__", code: "(new)", name: candidate.name, program: { attributes: candidate.attrs || {} } };
  return findDuplicatePairs([probe, ...properties.filter((p) => p.program && p.program.manualStatus !== "Closed")])
    .filter((x) => x.a === probe || x.b === probe)
    .map((x) => ({ property: x.a === probe ? x.b : x.a, score: x.score, reasons: x.reasons }));
}

function clFirstName(v) {

const clNorm = (s) => String(s || "").trim().toLowerCase();

// The single next open to-do on the phase being worked now — the same
// rule the stakeholder work queues use for "who has the ball".
function clCurrentTodo(property) {
  if (!property) return null;
  const phases = buildPhases(property.program);
  const current = phases.find((ph) => !ph.done);
  if (!current) return null;
  const ph = current.subPhases ? (current.subPhases.find((sp) => sp.contracted !== false && !sp.done) || current.subPhases[0]) : current;
  const todos = ph.todos || [];
  const idx = todos.findIndex((t) => !t.done && t.text !== ADVISORY_TRACKER_STEP);
  if (idx === -1) return null;
  return { phaseKey: ph.key, storageKey: storageKeyFor(ph.key), phaseLabel: ph.label, todos, idx, todo: todos[idx] };
}

// What applying a "ball in court" suggestion would do right now.
function clEvaluateBall(row, property) {
  const to = (row.details && row.details.to_party) || row.new_value;
  const cur = clCurrentTodo(property);
  if (!property) return { kind: "missing", message: `${row.property_code} isn't in the tracker.` };
  if (!cur) return { kind: "missing", message: "No open to-do on the current phase to move the ball on." };
  const resp = cur.todo.responsible || "Advisory Services";
  if (clNorm(resp) === clNorm(to)) return { kind: "noop", to, cur, message: `"${cur.todo.text}" is already with ${resp}.` };
  if (cur.todo.toggleWith && clNorm(cur.todo.toggleWith) === clNorm(to)) return { kind: "swap", to, cur, message: `Swap "${cur.todo.text}" from ${resp} to ${to}.` };
  return { kind: "reassign", to, cur, message: `Note puts the ball with ${to}, but "${cur.todo.text}" is with ${resp}${cur.todo.toggleWith ? ` and only swaps with ${cur.todo.toggleWith}` : " with no swap partner"}. Reassign it to ${to}?` };
}

// Every to-do on the property, phase by phase, read the same way the
// tick-off code reads it (saved copy first, otherwise the phase's list).
function clAllTodos(property) {
  if (!property) return [];
  const out = []; const seen = new Set();
  buildPhases(property.program).flatMap((ph) => ph.subPhases ? ph.subPhases : [ph]).forEach((ph) => {
    const sk = storageKeyFor(ph.key);
    if (seen.has(sk)) return; seen.add(sk);
    const stored = (property.program.phaseData || {})[sk];
    const todos = (stored && stored.todos) || ph.todos || defaultTodosFor(sk);
    todos.forEach((t, idx) => { if (t && t.text) out.push({ phaseKey: ph.key, storageKey: sk, phaseLabel: ph.label, idx, todo: t, current: !ph.done }); });
  });
  return out;
}
const CL_STOP = new Set(["a", "an", "the", "to", "of", "for", "and", "or", "with", "on", "in", "at", "by", "from", "is", "was", "be", "held", "done", "completed", "complete", "sent", "received", "made", "had"]);
const clTokens = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w && !CL_STOP.has(w))
  .map((w) => w.replace(/(ing|ed|es|s)$/, "")).filter((w) => w.length > 1);
// Finds the to-do a "to-do done" suggestion refers to: exact wording first,
// then the best word overlap ("Discovery call with client held" ->
// "Schedule discovery call"), preferring open to-dos on the current phase.
function clFindTodo(row, property) {
  const all = clAllTodos(property);
  if (!all.length) return null;
  const d = row.details || {};
  const hint = d.todo_hint || row.field || "";
  const pool = d.phase_key ? all.filter((c) => c.storageKey === storageKeyFor(d.phase_key)) : all;
  const exact = pool.find((c) => clNorm(c.todo.text) === clNorm(hint)) || all.find((c) => clNorm(c.todo.text) === clNorm(hint));
  if (exact) return exact;
  const ht = new Set(clTokens(hint));
  let best = null; let bestScore = 0;
  (pool.length ? pool : all).forEach((c) => {
    const tt = [...new Set(clTokens(c.todo.text))];
    if (!tt.length) return;
    const shared = tt.filter((w) => ht.has(w)).length;
    const score = shared / Math.max(tt.length, ht.size) + (c.todo.done ? 0 : 0.05) + (c.current ? 0.05 : 0);
    if (shared >= 2 && score > bestScore) { best = c; bestScore = score; }
  });
  return best;
}

// One-time fees contracted, using the same calculation as Billing
// (confirmed Ironclad fees first, otherwise the standard rate).
function acOneTimeFees(p) {
  try {
    const b = computeAdvisoryBilling(p);
    const opts = p.program.selectedOptions || {};
    let total = 0;
    [["dueDiligence", opts.dueDiligence], ["rfp", opts.rfp || opts.incumbentNegotiation], ["programDesign", opts.programDesign]].forEach(([k, sel]) => {
      const f = b && b[k];
      if (sel && f && !f.credited && Number.isFinite(f.total)) total += f.total;
    });
    return total;
  } catch (e) { return null; }
}

// ---- Refresh Contract Data: turn the existing builder's output into a field-level preview ----
function ieBuildContractsPreview(result, properties) {
  const byId = {}; properties.forEach((p) => { byId[p.id] = p; });
  const changes = [];
  const SVC = { dueDiligence: "Due Diligence", rfp: "RFP", incumbentNegotiation: "Incumbent Negotiation", programDesign: "Program Design", deployment: "Deployment" };
  result.updates.forEach((u) => {
    const p = byId[u.id]; if (!p) return;
    const prog = p.program; const fields = [];
    if (ieStr(u.advisoryContractExecuted) !== ieStr(prog.advisoryContractExecuted) && u.advisoryContractExecuted) fields.push({ field: "Advisory contract executed", oldv: prog.advisoryContractExecuted || null, newv: u.advisoryContractExecuted, apply: (pr) => ({ ...pr, advisoryContractExecuted: u.advisoryContractExecuted }) });
    if (ieStr(u.advisoryContractDrafted) !== ieStr(prog.advisoryContractDrafted) && u.advisoryContractDrafted) fields.push({ field: "Advisory contract drafted", oldv: prog.advisoryContractDrafted || null, newv: u.advisoryContractDrafted, apply: (pr) => ({ ...pr, advisoryContractDrafted: u.advisoryContractDrafted }) });
    const so = prog.selectedOptions || {};
    Object.keys(SVC).forEach((k) => {
      if (!!u.selectedOptions[k] && !so[k]) fields.push({ field: `Service: ${SVC[k]}`, oldv: "No", newv: "Yes", apply: (pr) => ({ ...pr, selectedOptions: { ...(pr.selectedOptions || {}), [k]: true } }) });
    });
    const scd = prog.serviceContractDates || {};
    const incomingScd = u.serviceContractDates || {};
    ["rfp", "programDesign", "deployment"].forEach((k) => {
      if (incomingScd[k] && !scd[k]) fields.push({ field: `${SVC[k]} contract date`, oldv: null, newv: incomingScd[k], apply: (pr) => ({ ...pr, serviceContractDates: { ...(pr.serviceContractDates || {}), [k]: incomingScd[k] } }) });
    });
    const cf = prog.confirmedFees || {};
    ["dueDiligence", "rfp", "programDesign", "deployment"].forEach((k) => {
      const nv = u.confirmedFees[k];
      if (nv != null && Number(nv) !== Number(cf[k])) fields.push({ field: `Fee: ${SVC[k]}`, oldv: cf[k] == null ? null : `$${cf[k]}`, newv: `$${nv}`, apply: (pr) => ({ ...pr, confirmedFees: { ...(pr.confirmedFees || {}), [k]: nv } }) });
    });
    if (u.attrs && (prog.attributes || {})["PMA Status"] !== "Active PMA") fields.push({ field: "PMA Status", oldv: (prog.attributes || {})["PMA Status"] || null, newv: "Active PMA", apply: (pr) => ({ ...pr, attributes: { ...(pr.attributes || {}), "PMA Status": "Active PMA" } }) });
    if (fields.length) changes.push({ id: p.id, code: p.code, name: p.name, fields });
  });
  return { changes, creates: result.creates, flags: result.flags };
}

// ---- Refresh Master Data: Greystar "Property Attributes (Master Level)" export -> master_properties ----
// Column -> master_properties field. Confirmed against the 10/09 import
// (e.g. 1 Flatbush / ny1flatb, Accent / ced15830 match field for field).
const IE_MD_COLUMNS = [
  ["master_id", "Master ID"], ["name", "Master Name"], ["master_status", "Master Status"], ["client", "Client"],
  ["region", "Region"], ["office", "Physical Office"], ["units", "Residential Units"],
  ["address", "Address"], ["city", "City"], ["state", "State"], ["zip", "Zip"],
  ["rpm", "RPM"], ["rpm_email", "RPM Email Address"], ["cm", "Property Manager"], ["cm_email", "Manager Email"],
];
const IE_MD_COMPARE = ["master_id", "name", "master_status", "client", "region", "office", "units", "address", "city", "state", "zip", "rpm", "rpm_email", "cm", "cm_email"];
const IE_MD_LABEL = { master_id: "Master ID", name: "Name", master_status: "Master Status", client: "Client", region: "Region", office: "Office", units: "Units", address: "Address", city: "City", state: "State", zip: "Zip", rpm: "RPM", rpm_email: "RPM Email", cm: "CM", cm_email: "CM Email" };

function ieParseMasterDataWorkbook(wb) {
  // Find the tab by its headers, not its name (Excel truncates tab names to 31 characters).
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, range: 0, defval: null });
    for (let h = 0; h < Math.min(rows.length, 10); h++) {
      const hdr = (rows[h] || []).map((x) => ieStr(x));
      if (!hdr.includes("Yardi Code") || !hdr.includes("Master Name")) continue;
      const ix = {}; hdr.forEach((x, i) => { if (x && !(x in ix)) ix[x] = i; });
      const missing = IE_MD_COLUMNS.filter(([, c]) => !(c in ix)).map(([, c]) => c);
      const records = []; const flags = []; const seen = {};
      for (let r = h + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const code = ieStr(row[ix["Yardi Code"]]);
        if (!code) continue;
        const k = code.toLowerCase();
        if (seen[k]) { flags.push(`Yardi code ${code} appears more than once in the file — the first row (${seen[k]}) was used.`); continue; }
        const rec = { yardi_code: code };
        IE_MD_COLUMNS.forEach(([f, c]) => {
          if (!(c in ix)) return;
          let v = row[ix[c]];
          if (v instanceof Date) v = v.toISOString().slice(0, 10);
          if (f === "units" || f === "master_id") { const n = parseInt(String(v ?? "").replace(/[^0-9-]/g, ""), 10); rec[f] = Number.isFinite(n) ? n : null; }
          else if (f === "zip") rec[f] = ieZip(v) || null;
          else { const s = ieStr(v); rec[f] = s && s !== "N/A" ? s : null; }
        });
        if (!rec.master_status) rec.master_status = "Active";
        seen[k] = rec.name || code;
        records.push(rec);
      }
      return { sheetName, records, flags, missing };
    }
  }
  throw new Error('No tab with "Yardi Code" and "Master Name" columns found. Is this the Greystar "Property Attributes (Master Level)" export?');
}

function ieBuildMasterDataPreview(parsed, current, properties) {
  const cur = {}; current.forEach((m) => { cur[ieStr(m.yardi_code).toLowerCase()] = m; });
  const inFile = new Set(parsed.records.map((r) => r.yardi_code.toLowerCase()));
  const created = []; const updated = []; const reactivated = []; let unchanged = 0;
  const fieldCounts = {};
  parsed.records.forEach((r) => {
    const m = cur[r.yardi_code.toLowerCase()];
    const willBeActive = /^active$/i.test(r.master_status || "Active");
    if (!m) { created.push(r); return; }
    const diffs = IE_MD_COMPARE.filter((f) => f in r && ieStr(r[f]) !== ieStr(m[f]));
    if (!m.is_active && willBeActive) reactivated.push(r);
    if (diffs.length || (!!m.is_active !== willBeActive)) { updated.push({ r, m, diffs }); diffs.forEach((f) => { fieldCounts[f] = (fieldCounts[f] || 0) + 1; }); }
    else unchanged += 1;
  });
  const retired = current.filter((m) => m.is_active && !inFile.has(ieStr(m.yardi_code).toLowerCase()));
  const retiredSet = new Set(retired.map((m) => ieStr(m.yardi_code).toLowerCase()));
  const impacted = properties.filter((p) => computeStatus(p) !== "Closed" && retiredSet.has(ieStr((p.program.attributes || {})["Yardi Code"]).toLowerCase()))
    .map((p) => ({ code: p.code, name: p.name, yardi: (p.program.attributes || {})["Yardi Code"] }));
  const activeAfter = parsed.records.filter((r) => /^active$/i.test(r.master_status || "Active")).length;
  const activeBefore = current.filter((m) => m.is_active).length;
  return { kind: "master", sheetName: parsed.sheetName, records: parsed.records, flags: parsed.flags, missing: parsed.missing,
    created, updated, reactivated, unchanged, retired, impacted, fieldCounts, activeAfter, activeBefore,
    suspicious: activeBefore > 0 && activeAfter < activeBefore * 0.8 };
}

async function ieApplyMasterData(supabaseClient, preview, fileName) {
  const stamp = new Date().toISOString();
  const rows = preview.records.map((r) => ({ ...r, is_active: /^active$/i.test(r.master_status || "Active"), last_imported_at: stamp }));
  for (let i = 0; i < rows.length; i += 500) {
    const { error } = await supabaseClient.from("master_properties").upsert(rows.slice(i, i + 500), { onConflict: "yardi_code" });
    if (error) throw new Error(`Saved ${i} of ${rows.length} master records, then failed: ${error.message}${/row-level security|permission/i.test(error.message) ? " (this needs write access to master data)" : ""}`);
  }
  const codes = preview.retired.map((m) => m.yardi_code);
  for (let i = 0; i < codes.length; i += 200) {
    const { error } = await supabaseClient.from("master_properties").update({ is_active: false, master_status: "Not in latest import" }).in("yardi_code", codes.slice(i, i + 200));
    if (error) throw new Error(`Master records saved, but marking ${codes.length} codes inactive failed: ${error.message}`);
  }
  const impacted = preview.impacted.length ? ` Tracker properties whose Yardi code is no longer in master: ${preview.impacted.map((p) => `${p.code} ${p.name} (${p.yardi})`).join("; ")}.` : "";
  const reason = `Master data refreshed from ${fileName}: ${preview.activeAfter} active properties (${preview.created.length} new, ${preview.updated.length} updated, ${preview.retired.length} no longer in master).${impacted}`;
  const { error: logErr } = await supabaseClient.from("master_sync_log").insert([{ property_code: "MASTER", property_name: "Master data", action: "info", field: "Master data",
    old_value: `${preview.activeBefore} properties`, new_value: `${preview.activeAfter} properties`, reason, source: "Master import" }]);
  return { saved: rows.length, retired: codes.length, logError: logErr ? logErr.message : null };
}
