        <div className="modal-actions" style={{ alignItems: "center" }}>
          {status && <span style={{ marginRight: "auto", fontSize: 13, color: status.ok ? "#7bd88a" : "#ff8f86" }}>{status.text}</span>}
          <button className="btn-ghost" onClick={close}>Close</button>
          <button className="btn-primary" disabled={!dirty || busy} onClick={save}>{busy ? "Saving…" : "Save owner record"}</button>
        </div>
      </div>
    </div>
  );
}

function PropertiesView({ properties, onOpenProperty, callNotes, search, setSearch, portfolios, clientNotes, onSaveOwner, supabaseClient }) {
  const [mode, setModeState] = useState(() => { try { return localStorage.getItem("clientPageMode") || "owner"; } catch (e) { return "owner"; } });
  const setMode = (m) => { setModeState(m); try { localStorage.setItem("clientPageMode", m); } catch (e) {} };
  const [expanded, setExpanded] = useState(() => new Set());
  const [openOwner, setOpenOwner] = useState(null);
  const q = (search || "").toLowerCase();

  const rows = useMemo(() => properties.filter((p) => !q || `${p.code} ${p.name} ${p.program.attributes.Client || ""} ${p.program.attributes["JV Partner"] || ""}`.toLowerCase().includes(q)), [properties, q]);
  const groups = useMemo(() => buildOwnerGroups(properties, portfolios), [properties, portfolios]);
  const shownGroups = useMemo(() => groups.filter((g) => !q || g.name.toLowerCase().includes(q) || g.items.some(({ p }) => `${p.code} ${p.name}`.toLowerCase().includes(q))), [groups, q]);

  const toggle = (key) => setExpanded((s) => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const allOpen = shownGroups.length > 0 && shownGroups.every((g) => expanded.has(g.key));

  const propCells = (p) => {
    const phaseLabel = currentPhaseGroupLabel(p);
    const status = computeStatus(p);
    const statusMeta = POV_STATUS_COLORS[status] || STATUS_META[status];
    const n = newestCallNote(callNotes || [], p.code);
    const noteCount = (callNotes || []).filter((r) => r.property_code === p.code).length;
    const days = n ? Math.floor((new Date(TODAY) - new Date(n.digest_date)) / 86400000) : null;
    return {
      phase: <><span className="dot" style={{ background: colorForPhaseLabel(phaseLabel) }} />{phaseLabel}</>,
      status: <span className="pill" style={{ background: statusMeta.bg, color: statusMeta.color }}>{status}</span>,
      notes: noteCount,
      last: n ? <>{fmtDate(n.digest_date)} <span className={`t-chip${days >= 14 ? " t-old" : ""}`}>{days} day{days === 1 ? "" : "s"} ago</span></> : "—",
    };
  };

  const ownerSummary = (g) => {
    const rec = (portfolios || {})[ownerRecordKey(portfolios, g.name)] || {};
    const openTodos = (rec.todos || []).filter((t) => !t.done).length;
    const bids = (rec.bids || []).length;
    const notes = (clientNotes || []).filter((n) => ownerNorm(n.client_key) === g.key);
    const last = notes.reduce((m, n) => (!m || n.digest_date > m ? n.digest_date : m), null);
    const phases = {};
    g.items.forEach(({ p }) => { const l = currentPhaseGroupLabel(p); phases[l] = (phases[l] || 0) + 1; });
    return { openTodos, bids, last, phases, hasRecord: !!(portfolios || {})[ownerRecordKey(portfolios, g.name)] };
  };

  const openGroup = openOwner && groups.find((g) => g.key === openOwner);
  const recordKey = openGroup ? ownerRecordKey(portfolios, openGroup.name) : null;

  return (
    <div className="proto-dash">
      <div className="wrap">
        <h1>Client</h1>
        <p className="sub">{mode === "owner" ? "Owners and the properties under them. Open an owner for its record; expand to see its properties." : "Open a property to see its attributes and Notes Log."}</p>
        <div className="toolbar" style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          <div className="nav" style={{ margin: 0 }} role="tablist" aria-label="View by">
            <button className={mode === "owner" ? "on" : ""} onClick={() => setMode("owner")} role="tab" aria-selected={mode === "owner"}>Owner</button>
            <button className={mode === "property" ? "on" : ""} onClick={() => setMode("property")} role="tab" aria-selected={mode === "property"}>Property</button>
          </div>
          <input type="text" placeholder={mode === "owner" ? "Search owners or properties" : "Search properties"} value={search} onChange={(e) => setSearch(e.target.value)} style={{ minWidth: 260 }} aria-label="Search" />
          {mode === "owner" && shownGroups.length > 0 && (
            <button className="link" onClick={() => setExpanded(allOpen ? new Set() : new Set(shownGroups.map((g) => g.key)))}>{allOpen ? "Collapse all" : "Expand all"}</button>
          )}
        </div>
        <div className="tw">
          {mode === "property" ? (
            <table>
              <thead><tr><th>Property</th><th>Client</th><th>Phase</th><th>Status</th><th className="r">Notes</th><th>Last note</th></tr></thead>
              <tbody>
                {rows.length === 0 ? (
                  <tr><td colSpan={6} style={{ color: "var(--mut)" }}>No properties match.</td></tr>
                ) : rows.map((p) => {
                  const c = propCells(p);
                  return (
                    <tr key={p.id} className="click" onClick={() => onOpenProperty(p)}>
                      <td><span className="id">{p.code}</span> {p.name}</td>
                      <td>{p.program.attributes.Client || "—"}</td>
                      <td>{c.phase}</td><td>{c.status}</td><td className="r">{c.notes}</td><td>{c.last}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          ) : (
            <table>
              <thead><tr><th>Owner</th><th>Properties</th><th>Phases</th><th className="r">Open to-dos</th><th className="r">Bids</th><th>Last client note</th><th></th></tr></thead>
              <tbody>
                {shownGroups.length === 0 ? (
                  <tr><td colSpan={7} style={{ color: "var(--mut)" }}>No owners match.</td></tr>
                ) : shownGroups.map((g) => {
                  const s = ownerSummary(g);
                  const isOpen = expanded.has(g.key) || (q && !g.name.toLowerCase().includes(q));
                  const items = q && !g.name.toLowerCase().includes(q) ? g.items.filter(({ p }) => `${p.code} ${p.name}`.toLowerCase().includes(q)) : g.items;
                  const clientN = g.items.filter((i) => i.role === "Client").length;
                  const jvN = g.items.length - clientN;
                  return (
                    <React.Fragment key={g.key}>
                      <tr className="click owner-tr" onClick={() => toggle(g.key)}>
                        <td style={{ fontWeight: 600 }}>
                          <span style={{ display: "inline-block", width: 18, transform: isOpen ? "none" : "rotate(-90deg)", transition: "transform .15s", verticalAlign: -2 }}><ChevronDown size={14} /></span>
                          {g.name}
                        </td>
                        <td>{clientN}{jvN ? <span style={{ color: "var(--mut)" }}> + {jvN} JV</span> : null}</td>
                        <td>{Object.entries(s.phases).sort((a, b) => PHASE_GROUP_ORDER.indexOf(a[0]) - PHASE_GROUP_ORDER.indexOf(b[0])).map(([l, n]) => (
                          <span key={l} title={`${l}: ${n}`} style={{ marginRight: 8, whiteSpace: "nowrap" }}><span className="dot" style={{ background: colorForPhaseLabel(l), marginRight: 4 }} />{n}</span>
                        ))}</td>
                        <td className="r">{s.openTodos || "—"}</td>
                        <td className="r">{s.bids || "—"}</td>
                        <td>{s.last ? fmtDate(s.last) : "—"}</td>
                        <td className="r">{!g.none && <button className="link" onClick={(e) => { e.stopPropagation(); setOpenOwner(g.key); }}>{s.hasRecord ? "Owner record" : "Create record"}</button>}</td>
                      </tr>
                      {isOpen && items.map(({ p, role }) => {
                        const c = propCells(p);
                        return (
                          <tr key={`${g.key}-${p.id}`} className="click" onClick={() => onOpenProperty(p)} style={{ background: "var(--inset)" }}>
                            <td style={{ paddingLeft: 34 }}><span className="id">{p.code}</span> {p.name}{role === "JV Partner" && <span className="t-chip t-src" style={{ marginLeft: 8 }}>JV partner</span>}</td>
                            <td style={{ color: "var(--mut)" }}>{role === "JV Partner" ? `Client: ${p.program.attributes.Client || "—"}` : (p.program.attributes["JV Partner"] ? `JV: ${p.program.attributes["JV Partner"]}` : "")}</td>
                            <td>{c.phase}</td>
                            <td className="r" colSpan={2}>{c.status}</td>
                            <td>{c.last}</td>
                            <td></td>
                          </tr>
                        );
                      })}
                      {isOpen && items.length === 0 && (
                        <tr><td colSpan={7} style={{ paddingLeft: 34, color: "var(--mut)", background: "var(--inset)" }}>No properties on the tracker for this owner.</td></tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </div>
      {openGroup && (
        <OwnerRecordModal
          key={openGroup.key}
          ownerName={recordKey}
          record={(portfolios || {})[recordKey]}
          items={openGroup.items}
          clientNotes={clientNotes}
          onSave={onSaveOwner}
          onClose={() => setOpenOwner(null)}
          onOpenProperty={onOpenProperty}
          supabaseClient={supabaseClient}
        />
      )}
    </div>
  );
}

function DashboardView({ properties, allProperties, onNavigate, onOpenProperty, onOpenExecutedContracts, onOpenExecutedContractsForProperty, onOpenBilling, stakeholderCounts, onOpenStakeholder, callNotes, billingImport }) {
  const money = (n) => `$${Math.round(n).toLocaleString()}`;

  // KPI status row — same computeStatus/STATUS_META data the app-wide
  // KpiStrip uses, styled for this screen specifically and clicking
  // through to Timeline the same way the charts below already do.
  const statusKpis = useMemo(() => {
    return STATUS_OPTIONS.map((s) => ({ label: s, value: properties.filter((p) => computeStatus(p) === s).length, meta: POV_STATUS_COLORS[s] || STATUS_META[s] }));
  }, [properties]);

  // Billing summary + the Greystar/ROVR owed split — one-time payments
  // only (DD/RFP/Program Design halves), matching the same convention
  // paymentsDueByProperty below already uses: Deployment is a
  // recurring monthly charge, not a discrete due/pending payment, so
  // it's excluded here too. Pending/Invoiced/Overdue on a
  // not-yet-Complete half also project ROVR's eventual share using the
  // same percentage table computeAdvisoryBilling itself relies on,
  // since the real rovrAmountDue field is only populated once a
  // payment is genuinely Complete.
  const legacyBillingSummary = useMemo(() => {
    // Only properties with an executed advisory contract — matching
    // the Advisory Contracts page's own convention exactly. A
    // drafted-but-unexecuted contract isn't a real billing obligation
    // yet, so it shouldn't contribute dollars to this total at all.
    const source = (allProperties || properties).filter((p) => p.program.advisoryContractExecuted);
    let pending = 0, invoiced = 0, paid = 0, overdue = 0;
    let rovrPaid = 0, rovrPending = 0;
    // Properties with any unpaid amount — the same set the Payments due dollar figure covers.
    const unpaidPropertyIds = new Set();
    const owed = { greystar: { pending: 0, invoiced: 0, overdue: 0 }, rovr: { pending: 0, invoiced: 0, overdue: 0 } };
    source.forEach((p) => {
      const opts = p.program.selectedOptions || {};
      const projectType = (p.program.attributes || {})["Project Type"] || "Retrofit";
      const billing = computeAdvisoryBilling(p);
      [["dueDiligence", opts.dueDiligence, billing.dueDiligence], ["rfp", opts.rfp, billing.rfp], ["programDesign", opts.programDesign, billing.programDesign]]
        .forEach(([phaseKey, selected, feeObj]) => {
          if (!selected || !feeObj || feeObj.credited) return;
          [feeObj.firstHalf, feeObj.secondHalf].forEach((h) => {
            if (h.status !== "Complete" && h.amount > 0) unpaidPropertyIds.add(p.id);
            const overdueNow = isPaymentOverdue(h);
            if (overdueNow) overdue += h.amount;
            else if (h.status === "Complete") paid += h.amount;
            else if (h.status === "Invoiced") invoiced += h.amount;
            else pending += h.amount;

            if (h.status === "Complete") {
              if (h.rovrAmountDue != null) { if (h.rovrStatus === "Complete") rovrPaid += h.rovrAmountDue; else rovrPending += h.rovrAmountDue; }
            } else {
              // Not yet Complete — project the eventual ROVR share so
              // the owed split reflects where the whole amount will
              // land once it is, not just what's already settled.
              const projectedRovrShare = h.amount * rovrPercentForProjectType(projectType, phaseKey);
              const greystarShare = h.amount - projectedRovrShare;
              const bucket = overdueNow ? "overdue" : (h.status === "Invoiced" ? "invoiced" : "pending");
              owed.greystar[bucket] += greystarShare;
              owed.rovr[bucket] += projectedRovrShare;
            }
          });
        });
    });
    // Rolls up from the exact same shared calculation the Advisory
    // Contracts page's own totals footer uses — not a separately
    // written version that happens to agree, but the same function
    // call, so the two can never independently drift.
    const assumedContractMonths = 60;
    const tcv = computeTotalContractValue(source, assumedContractMonths);

    let deploymentCollectedToDate = 0, deploymentVariance = 0;
    source.forEach((p) => {
      const opts = p.program.selectedOptions || {};
      if (!opts.deployment) return;
      const d = computeAdvisoryBilling(p).deployment;
      if (!d.started) return;
      const collected = p.program.deploymentCollectedToDate || 0;
      deploymentCollectedToDate += collected;
      if (d.monthsSinceStart != null) deploymentVariance += Math.max(0, d.monthsSinceStart * d.monthlyTotal - collected);
    });

    return { pending, invoiced, paid, overdue, unpaidProperties: unpaidPropertyIds.size, rovrPaid, rovrPending, owed, oneTimeTotal: tcv.oneTimeTotal, projectedDeploymentValue: tcv.projectedDeploymentValue, assumedContractMonths, totalContractValue: tcv.totalContractValue, deploymentCollectedToDate, deploymentVariance };
  }, [properties, allProperties]);

  // Last Note by Property — newest call_notes digest entry per
  // property, newest overall first. A simpler read-only version of
  // what the full spec describes (no filters/sort/export/pinning yet,
  // since that's a larger, separate notes system); still real,
  // genuine digest data, not sample content.
  const lastNoteByProperty = useMemo(() => {
    const byProperty = {};
    (callNotes || []).forEach((n) => {
      const existing = byProperty[n.property_code];
      if (!existing || n.digest_date > existing.digest_date) byProperty[n.property_code] = n;
    });
    return Object.values(byProperty).sort((a, b) => (b.digest_date || "").localeCompare(a.digest_date || "")).slice(0, 10);
  }, [callNotes]);

  const phaseCounts = useMemo(() => {
    const counts = {};
    properties.forEach((p) => {
      const label = currentPhaseGroupLabel(p);
      counts[label] = (counts[label] || 0) + 1;
    });
    const shorten = (l) => l.replace("Program Design & Contracting", "Program Design").replace("Post-Deployment Validation", "Post-Deployment");
    return PHASE_GROUP_ORDER
      .filter((label) => counts[label])
      .map((label) => ({ label, displayLabel: shorten(label), count: counts[label], color: colorForPhaseLabel(label) }));
  }, [properties]);

  const statusCounts = useMemo(() => {
    const counts = {};
    properties.forEach((p) => {
      const s = computeStatus(p);
      // Excluded from this chart specifically, not from Status itself —
      // Phase already shows Prospecting right next to this chart, so
      // showing it twice here was redundant. computeStatus is untouched;
      // a Prospecting property's actual status value is unchanged
      // everywhere else in the app.
      if (s === "Prospecting") return;
      counts[s] = (counts[s] || 0) + 1;
    });
    return STATUS_OPTIONS
      .filter((s) => counts[s])
      .map((s) => ({ label: s, count: counts[s], color: (POV_STATUS_COLORS[s] || STATUS_META[s]).color }));
  }, [properties]);

  // At Risk and Blocked specifically — the two statuses that actually
  // need attention right now, not just a count of them (which the Status
  // chart above already shows) but the real property names, so this is
  // directly actionable rather than something that still requires a
  // trip to Timeline just to find out which ones they are.
  const spotlightProperties = useMemo(() => {
    return properties
      .map((p) => ({ property: p, status: computeStatus(p) }))
      .filter((x) => x.status === "Blocked" || x.status === "At Risk")
      .sort((a, b) => (a.status === "Blocked" ? -1 : 1) - (b.status === "Blocked" ? -1 : 1));
  }, [properties]);

  // Genuinely outstanding payments — a real trigger has fired (done)
  // but nobody has actually marked it paid yet (manual). Excludes
  // Deployment, which is a recurring monthly charge rather than a
  // discrete one-time payment with its own due/pending state.
  const legacyPaymentsDueByProperty = useMemo(() => {
    const source = allProperties || properties;
    const byProperty = [];
    source.forEach((p) => {
      const opts = p.program.selectedOptions || {};
      const billing = computeAdvisoryBilling(p);
      let propertyTotal = 0, propertyCount = 0;
      [
        [opts.dueDiligence, billing.dueDiligence],
        [opts.rfp, billing.rfp],
        [opts.programDesign, billing.programDesign],
      ].forEach(([selected, feeObj]) => {
        if (!selected || !feeObj || feeObj.credited) return;
        [feeObj.firstHalf, feeObj.secondHalf].forEach((h) => {
          if (h.done && !h.manual) { propertyCount += 1; propertyTotal += h.amount; }
        });
      });
      if (propertyTotal > 0) byProperty.push({ property: p, total: propertyTotal, count: propertyCount });
    });
    return byProperty.sort((a, b) => b.total - a.total);
  }, [properties, allProperties]);

  // Billing figures come from the Revenue Tracker import when there is one
  // (same rules as the Billing page); the contract-value card still uses
  // the Advisory Contracts fees.
  const importBilling = useMemo(() => {
    if (!billingImport || !Array.isArray(billingImport.records)) return null;
    const evAll = billingImport.records.map((r) => rtEvaluate(r, TODAY, billingImport.settings));
    // Advisory Contracts guides billing: only lines for an executed, contracted service count.
    const { contracted: ev, excluded } = rtSplitByContract(evAll, allProperties || properties);
    const t = rtTotals(ev);
    const owed = { greystar: { pending: 0, invoiced: 0, overdue: 0 }, rovr: { pending: 0, invoiced: 0, overdue: 0 } };
    // Tracker properties with any unpaid line — the same set the Payments due dollar figure covers.
    const unpaidMatch = rtPropertyMatcher(allProperties || properties);
    const unpaidKeys = new Set();
    ev.forEach((r) => {
      if (r.payment_status === "Paid") return;
      if (r.invoiced > 0) { const up = unpaidMatch(r); unpaidKeys.add(up ? `p${up.id}` : rtBaseId(r.engagement_id)); }
      const bucket = r.payment_status === "Past due" ? "overdue" : r.payment_status === "Current" ? "invoiced" : "pending";
      const rv = Math.max(0, Math.min(r.rovr_pending, r.invoiced));
      owed.rovr[bucket] += rv; owed.greystar[bucket] += r.invoiced - rv;
    });
    const match = rtPropertyMatcher(allProperties || properties);
    const byP = new Map(); let unmatched = 0;
    ev.forEach((r) => {
      if (r.payment_status !== "Past due" && r.payment_status !== "Current") return;
      const p = match(r);
      if (!p) { unmatched += r.invoiced; return; }
      if (!byP.has(p.id)) byP.set(p.id, { property: p, total: 0, count: 0 });
      const e = byP.get(p.id); e.total += r.invoiced; e.count += 1;
    });
    return {
      summary: { pending: t.not_invoiced, invoiced: t.current, paid: t.paid, overdue: t.past_due, unpaidProperties: unpaidKeys.size, rovrPaid: t.rovr_paid, rovrPending: t.rovr_pending, owed },
      payments: [...byP.values()].sort((a, b) => b.total - a.total),
      unmatched, source: billingImport.source_file || "Revenue Tracker", importedAt: billingImport.imported_at || null,
      excludedCount: excluded.length, excludedTotal: excluded.reduce((sum, x) => sum + (x.line.invoiced || 0), 0),
    };
  }, [billingImport, properties, allProperties]);
  const billingSummary = importBilling ? { ...legacyBillingSummary, ...importBilling.summary } : legacyBillingSummary;
  const paymentsDueByProperty = importBilling ? importBilling.payments : legacyPaymentsDueByProperty;

  const paymentsDueSummary = useMemo(() => ({
    count: paymentsDueByProperty.reduce((sum, x) => sum + x.count, 0),
    total: paymentsDueByProperty.reduce((sum, x) => sum + x.total, 0),
    properties: paymentsDueByProperty.length,
  }), [paymentsDueByProperty]);

  // Dashboard is meant to stay a real at-a-glance summary — showing
  // every property with an outstanding balance could run to dozens of
  // rows. Top 8 by dollar amount, with a direct link to the rest.
  const TOP_N = 8;
  const paymentsChartData = paymentsDueByProperty.slice(0, TOP_N).map(({ property: p, total, count }) => ({
    label: `${p.code} — ${p.name}`, count: total, color: "#DA7A62",
    tooltip: `${p.code} — ${p.name} — ${money(total)} across ${count} payment${count === 1 ? "" : "s"}`,
    propertyRef: p,
  }));
  const remainingCount = Math.max(0, paymentsDueByProperty.length - TOP_N);

  const owedTotal = billingSummary.owed.greystar.pending + billingSummary.owed.greystar.invoiced + billingSummary.owed.greystar.overdue
    + billingSummary.owed.rovr.pending + billingSummary.owed.rovr.invoiced + billingSummary.owed.rovr.overdue;
  const owedBarPct = (side) => {
    const s = billingSummary.owed[side];
    const sideTotal = s.pending + s.invoiced + s.overdue;
    if (owedTotal === 0) return { pending: 0, invoiced: 0, overdue: 0, sideTotal };
    return { pending: (s.pending / owedTotal) * 100, invoiced: (s.invoiced / owedTotal) * 100, overdue: (s.overdue / owedTotal) * 100, sideTotal };
  };
  const greystarBar = owedBarPct("greystar");
  const rovrBar = owedBarPct("rovr");

  // Payments Due grouped by current phase, matching the prototype's
  // exact layout — a real grouping step added on top of the existing,
  // already-correct paymentsDueByProperty computation, not a
  // replacement of its underlying logic.
  const paymentsDueByPhase = useMemo(() => {
    const groups = {};
    paymentsDueByProperty.forEach(({ property: p, total, count }) => {
      const label = currentPhaseGroupLabel(p);
      (groups[label] = groups[label] || []).push({ property: p, total, count });
    });
    return PHASE_GROUP_ORDER.filter((l) => groups[l]).map((label) => ({
      label, color: colorForPhaseLabel(label),
      items: groups[label].sort((a, b) => b.total - a.total),
      subtotal: groups[label].reduce((s, x) => s + x.total, 0),
    }));
  }, [paymentsDueByProperty]);

  const unpaidTotal = billingSummary.pending + billingSummary.invoiced + billingSummary.overdue;

  return (
    <div className="proto-dash proto-dash-home">
      <div className="wrap">
        <h1>Portfolio Overview</h1>
        <p className="sub">{properties.length} properties. Click any phase, status, or card to filter everything on this page.</p>

        <div className="kpis phase-strip">
          <div className="kpi"><div className="v">{properties.length}</div><div className="k">Properties shown</div></div>
          {phaseCounts.map((ph) => (
            <button key={ph.label} className="kpi" onClick={() => onNavigate("phase", ph.label)} title={`Open ${ph.label}`}>
              <div className="v" style={{ color: ph.color }}>{ph.count}</div>
              <div className="k">{ph.displayLabel || ph.label}</div>
            </button>
          ))}
        </div>

        <div className="sec">Billing{importBilling && <span style={{ fontWeight: 400 }}> · from {importBilling.source}{importBilling.importedAt ? `, imported ${fmtDate(importBilling.importedAt.slice(0, 10))}` : ""}{importBilling.excludedCount > 0 && <> · <button className="link" onClick={() => onOpenBilling && onOpenBilling("all")} title="See them on the Billing page">{importBilling.excludedCount} line{importBilling.excludedCount === 1 ? "" : "s"} ({money(importBilling.excludedTotal)}) not on Advisory Contracts, not counted</button></>}</span>}</div>
        <div className="kpis">
          <button className="kpi" onClick={() => onOpenBilling && onOpenBilling("due")} title="Open Billing: all unpaid payments">
            <div className="v c-a">{money(unpaidTotal)}</div><div className="k">Payments due</div>
            <div className="n">{billingSummary.unpaidProperties || 0} {billingSummary.unpaidProperties === 1 ? "property" : "properties"} · Pending + Invoiced + Overdue</div>
          </button>
          <button className="kpi" onClick={() => onOpenBilling && onOpenBilling("pending")} title="Open Billing: Pending (contracted, future services)">
            <div className="v">{money(billingSummary.pending)}</div><div className="k">Pending</div><div className="n">Contracted, future services</div>
          </button>
          <button className="kpi" onClick={() => onOpenBilling && onOpenBilling("invoiced")} title="Open Billing: Invoiced, within net 30">
            <div className="v c-b">{money(billingSummary.invoiced)}</div><div className="k">Invoiced</div><div className="n">Within net {NET_TERMS_DAYS}</div>
          </button>
          <button className="kpi" onClick={() => onOpenBilling && onOpenBilling("overdue")} title="Open Billing: Overdue">
            <div className="v c-r">{money(billingSummary.overdue)}</div><div className="k">Overdue</div><div className="n">Over {NET_TERMS_DAYS} days since invoice</div>
          </button>
          <button className="kpi" onClick={() => onOpenBilling && onOpenBilling("paid")} title="Open Billing: Paid">
            <div className="v c-g">{money(billingSummary.paid)}</div><div className="k">Paid</div><div className="n">Collected, not in Payments due</div>
          </button>
        </div>

        <div className="card" style={{ marginTop: 14 }}>
          <h3>Total Contract Value - Life-to-Date</h3>
          <div className="owed-top">
            <div className="kpi"><div className="v">{money(billingSummary.oneTimeTotal)}</div><div className="k">One-time fees (DD/RFP/Program Design)</div></div>
            <div className="kpi"><div className="v">{money(billingSummary.projectedDeploymentValue)}</div><div className="k">Deployment, projected {billingSummary.assumedContractMonths} mo</div></div>
          </div>
          <div style={{ marginTop: 4 }}><b style={{ fontSize: 18, fontFamily: "var(--mono)" }}>{money(billingSummary.totalContractValue)}</b></div>
          <div className="foot">Deployment's ongoing $2/unit charge is projected at an assumed {billingSummary.assumedContractMonths}-month average contract length — not a guaranteed figure, and counted whether or not that property has actually gone live yet.</div>
          {billingSummary.deploymentCollectedToDate > 0 && (
            <div className="owed-top" style={{ marginBottom: 0, marginTop: 10 }}>
              <div className="kpi"><div className="v">{money(billingSummary.deploymentCollectedToDate)}</div><div className="k">Deployment collected to date</div></div>
              <div className="kpi"><div className="v" style={{ color: billingSummary.deploymentVariance > 0 ? "var(--amber)" : "var(--green)" }}>{billingSummary.deploymentVariance > 0 ? money(billingSummary.deploymentVariance) + " behind" : "Caught up"}</div><div className="k">Collections variance since go-live</div></div>
            </div>
          )}
        </div>

        <div className="row2">
          <div className="card">
            <h3>ROVR Score: Paid &amp; Pending</h3>
            <div className="owed-top">
              <div className="kpi"><div className="v c-g">{money(billingSummary.rovrPaid)}</div><div className="k">ROVR paid</div></div>
              <div className="kpi"><div className="v">{money(billingSummary.rovrPending)}</div><div className="k">ROVR pending</div></div>
            </div>
            <div className="foot">{importBilling ? "From the Revenue Tracker: ROVR paid is the ROVR share of RFP invoices; ROVR pending is Estimated AP Cost. They overlap on RFP lines, so don't add them." : "ROVR has no separate \"Invoiced\" state of its own — just Pending and Complete."}</div>
          </div>
          <div className="card">
            <h3>Total owed: ROVR vs Greystar</h3>
            <div className="owed-row">
              <span>Greystar</span>
              <div className="tr"><div className="bar">
                <i style={{ width: greystarBar.overdue + "%", background: "var(--red)" }} />
                <i style={{ width: greystarBar.invoiced + "%", background: "var(--blue)" }} />
                <i style={{ width: greystarBar.pending + "%", background: "#51607a" }} />
              </div></div>
              <b>{money(greystarBar.sideTotal)}</b>
            </div>
            <div className="owed-row">
              <span>ROVR</span>
              <div className="tr"><div className="bar">
                <i style={{ width: rovrBar.overdue + "%", background: "var(--red)" }} />
                <i style={{ width: rovrBar.invoiced + "%", background: "var(--blue)" }} />
                <i style={{ width: rovrBar.pending + "%", background: "#51607a" }} />
              </div></div>
              <b>{money(rovrBar.sideTotal)}</b>
            </div>
            <div className="lg">
              <span><i style={{ background: "var(--red)" }} />Overdue</span>
              <span><i style={{ background: "var(--blue)" }} />Invoiced</span>
              <span><i style={{ background: "#51607a" }} />Pending</span>
            </div>
            <div className="foot">Owed means every payment not yet paid. Both bars use one scale.</div>
          </div>
        </div>

        <div className="row2">
          <div className="card">
            <h3>By Phase</h3>
            {phaseCounts.map((ph) => {
              const maxCount = Math.max(...phaseCounts.map((x) => x.count), 1);
              return (
                <button key={ph.label} className={`bar-row${ph.count ? "" : " zero"}`} onClick={() => onNavigate("phase", ph.label)} title={`Open ${ph.label}`}>
                  <span><span className="dot" style={{ background: ph.color }} />{ph.displayLabel || ph.label}</span>
                  <div className="track"><i style={{ width: (ph.count / maxCount) * 100 + "%", background: ph.color }} /></div>
                  <b>{ph.count}</b>
                </button>
              );
            })}
          </div>
          <div className="card">
            <h3>By Status</h3>
            <div className="donut-wrap">
              <div className="donut" style={{ background: statusCounts.length ? (() => {
                const tot = statusCounts.reduce((t, s) => t + s.count, 0);
                let acc = 0;
                const stops = statusCounts.map((s) => {
                  const stop = `${s.color} ${(acc / tot) * 360}deg ${((acc + s.count) / tot) * 360}deg`;
                  acc += s.count;
                  return stop;
                });
                return `conic-gradient(${stops.join(",")})`;
              })() : "var(--inset)" }} role="img" aria-label="Status split of properties" />
              <div className="legend">
                {statusCounts.map((s) => (
                  <button key={s.label} onClick={() => onNavigate("status", s.label)}>
                    <span><span className="dot" style={{ background: s.color }} />{s.label}</span>
                    <b className="amt">{s.count}</b>
                  </button>
                ))}
              </div>
            </div>
            <div className="foot">Prospecting is not included. Click a row to filter.</div>
          </div>
        </div>

        <div className="row3">
          <div className="card">
            <h3>At Risk / Blocked</h3>
            {spotlightProperties.length === 0 ? (
              <div className="foot">No properties match the filters.</div>
            ) : (
              spotlightProperties.map(({ property: p, status }) => (
                <button key={p.id} className="list-item" onClick={() => onOpenProperty(p)}>
                  <span>{p.code} — {p.name}</span>
                  <span className="pill" style={{ background: (POV_STATUS_COLORS[status] || STATUS_META[status]).bg, color: (POV_STATUS_COLORS[status] || STATUS_META[status]).color }}>{status}</span>
                </button>
              ))
            )}
          </div>

          <div className="card">
            <h3>Payments Due by Property</h3>
            {paymentsDueByPhase.length === 0 ? (
              <div className="foot">No payments due for the filtered properties.</div>
            ) : (
              paymentsDueByPhase.map((g) => (
                <div key={g.label}>
                  <div className="grp" style={{ color: g.color }}>{g.label} · {money(g.subtotal)}</div>
                  {g.items.map(({ property: p, total }) => (
                    <button key={p.id} className="list-item" onClick={() => onOpenExecutedContractsForProperty(p)}>
                      <span>{p.code} — {p.name}</span>
                      <span className="amt">{money(total)}</span>
                    </button>
                  ))}
                </div>
              ))
            )}
            <div className="foot">
              {money(paymentsDueSummary.total)} total across {paymentsDueSummary.properties} propert{paymentsDueSummary.properties === 1 ? "y" : "ies"}
              {remainingCount > 0 && ` (+${remainingCount} more)`}. <button className="link" onClick={onOpenExecutedContracts}>View all billing</button>
            </div>
          </div>

          <div className="card">
            <h3>Open Work by Stakeholder</h3>
            {STAKEHOLDER_GROUPS.filter((s) => stakeholderCounts[s] > 0).length === 0 ? (
              <div className="foot">No open work right now.</div>
            ) : (
              STAKEHOLDER_GROUPS.filter((s) => stakeholderCounts[s] > 0).map((s) => (
                <button key={s} className="list-item" style={{ gridTemplateColumns: "1fr auto" }} onClick={() => onOpenStakeholder(s)}>
                  <b>{s}</b><span className="amt">{stakeholderCounts[s]}</span>
                </button>
              ))
            )}
          </div>
        </div>

        <div className="card" style={{ marginTop: 14 }}>
          <h3>Last Note by Property</h3>
          {lastNoteByProperty.length === 0 ? (
            <div className="foot">No notes match the filters.</div>
          ) : (
            lastNoteByProperty.map((n) => {
              const p = (allProperties || properties).find((x) => x.code === n.property_code);
              const days = Math.floor((new Date(TODAY) - new Date(n.digest_date)) / 86400000);
              const status = p ? computeStatus(p) : null;
              const statusMeta = status ? (POV_STATUS_COLORS[status] || STATUS_META[status]) : null;
              const dotColor = p ? colorForPhaseLabel(currentPhaseGroupLabel(p)) : "#888780";
              return (
                <button key={n.id} className="note-row" onClick={() => p && onOpenProperty(p)}>
                  <div>
                    <div className="nm"><span className="dot" style={{ background: dotColor }} />{n.property_code} — {n.property_name}</div>
                    <div className="chips">
                      {statusMeta && <span className="pill" style={{ background: statusMeta.bg, color: statusMeta.color }}>{status}</span>}
                      <span className="t-chip t-src">Digest</span>
                    </div>
                  </div>
                  <div>{n.summary}</div>
                  <div className="when">{fmtDate(n.digest_date)}<br />{days} day{days === 1 ? "" : "s"} ago</div>
                </button>
              );
            })
          )}
          <div className="foot">Shows the newest digest entry for each property. {lastNoteByProperty.length} properties shown.</div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   ACTION LIST — the new landing view. Answers "what do I need to do
   today" first, across every property, rather than leading with
   portfolio-health charts. One row per property with a real next
   action, sorted so overdue items ("catching up") surface before
   upcoming ones ("keeping on time") — a single list, not two separate
   sections, since both are the same underlying question of urgency.
--------------------------------------------------------- */
function PropertyGroup({ title, properties, onOpenPhase, onOpenProgram, showHeader, months, chartEnd, showYear2, onToggleYear2, isIsolated, onIsolate, onBackToDashboard }) {
  if (properties.length === 0) return null;
  // Collapsed by default for a real grouping (Client, Region, Phase,
  // etc.) — showing only the header until someone actually wants to see
  // what's inside. The flat list has no onIsolate at all (there's only
  // one undifferentiated group), so collapsing there would hide
  // everything with nothing left to click to see it — it always shows
  // its content instead. Isolating a group auto-expands it too, since
  // isolating specifically to then see nothing would defeat the point.
  const collapsible = !!onIsolate;
  const [expandedManual, setExpandedManual] = useState(false);
  const expanded = !collapsible || isIsolated || expandedManual;
  return (
    <div className="lane">
      {showHeader && (
        <div
          className={`lane-tab ${onIsolate ? "lane-tab-clickable" : ""}`}
          onClick={onIsolate || undefined}
          title={onIsolate ? (isIsolated ? "Click to show all groups again" : "Click to isolate this group") : undefined}
        >
          <span className="lane-tab-left">
            {collapsible && (
              <button
                className="lane-expand-btn"
                onClick={(e) => { e.stopPropagation(); setExpandedManual((v) => !v); }}
                title={expanded ? "Collapse" : "Expand"}
              >
                <ChevronDown size={14} className={expanded ? "chevron-expanded" : "chevron-collapsed"} />
              </button>
            )}
            <span className="lane-title">{title}</span>
            <span className="lane-count mono">{properties.length}</span>
          </span>
          {onBackToDashboard && (
            <button
              className="lane-tab-dashboard-link"
              onClick={(e) => { e.stopPropagation(); onBackToDashboard(); }}
              title="Back to Portfolio Overview"
            >
              ← Portfolio Overview
            </button>
          )}
        </div>
      )}
      {expanded && (
        <div className="lane-body">
          <TimelineHeader months={months} showYear2={showYear2} onToggleYear2={onToggleYear2} chartEnd={chartEnd} />
          <div className="lane-rows">
            {properties.map((p) => <PropertyRow key={p.id} property={p} onOpenPhase={onOpenPhase} onOpenProgram={onOpenProgram} chartEnd={chartEnd} months={months} />)}
          </div>
          <div className="today-overlay">
            <div className="today-line" style={{ left: `${pct(TODAY, chartEnd)}%` }}>
              <span className="today-label">Today</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

      </div>

}

/* ---------------------------------------------------------
   PROGRAM MODAL
--------------------------------------------------------- */
/* ---------------------------------------------------------
   NOTE PARSING — the daily digest appends each day's update onto the
   same note ("… | Update 10/22: … | Update 10/23: …") and packs
   next steps, ball-in-court and sources into one paragraph. These
   helpers split a note into dated segments and labeled parts for
   display only; the stored note text is never changed.
--------------------------------------------------------- */
const NOTE_LABELS = [
  { re: /next\s*steps?\s*\(updated\)/i, kind: "steps", label: "Next steps" },
  { re: /next\s*steps?/i, kind: "steps", label: "Next steps" },
  { re: /to-?do/i, kind: "steps", label: "To-do" },
  { re: /action\s*items/i, kind: "steps", label: "Action items" },
  { re: /open\s*items/i, kind: "steps", label: "Open items" },
  { re: /completed/i, kind: "para", label: "Completed" },
  { re: /true-?up/i, kind: "para", label: "True-up" },
  { re: /correction/i, kind: "para", label: "Correction" },
  { re: /ball/i, kind: "ball", label: "Ball" },
  { re: /source/i, kind: "source", label: "Source" },
];
const NOTE_LABEL_RE = /(^|\s)(Next [Ss]teps? \(updated\)|Next [Ss]teps?|To-[Dd]o|Action items|Open items|Completed|True-up|Correction|Ball|Source)\s*:\s*/g;

// Digest bookkeeping that means nothing to a reader.
function stripDigestNoise(s) {
  return String(s || "")
    .replace(/\s*P#\s*not stated in digest[^.]*\.?/gi, "")
    .replace(/\s*Phase not stated(?: in digest)?(?:\s*\([^)]*\))?\s*\.?/gi, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

// Splits on ";" but not inside parentheses.
function splitSteps(s) {
  const out = []; let depth = 0, cur = "";
  for (const ch of String(s || "")) {
    if (ch === "(") depth++;
    if (ch === ")") depth = Math.max(0, depth - 1);
    if (ch === ";" && depth === 0) { out.push(cur); cur = ""; } else cur += ch;
  }
  out.push(cur);
  return out.map((x) => x.trim().replace(/\.$/, "")).filter((x) => x && !/^none\.?$/i.test(x));
}

// Turns one segment's text into { summary, parts:[{kind,label,text|items}] }.
function parseNoteBody(text) {
  const t = stripDigestNoise(text);
  const marks = [];
  let m;
  NOTE_LABEL_RE.lastIndex = 0;
  while ((m = NOTE_LABEL_RE.exec(t))) marks.push({ at: m.index + m[1].length, end: m.index + m[0].length, name: m[2] });
  const summary = (marks.length ? t.slice(0, marks[0].at) : t).trim();
  const parts = marks.map((mk, i) => {
    const raw = t.slice(mk.end, i + 1 < marks.length ? marks[i + 1].at : t.length).trim();
    const def = NOTE_LABELS.find((d) => d.re.test(mk.name)) || { kind: "para", label: mk.name };
    if (def.kind === "steps") return { kind: "steps", label: def.label, items: splitSteps(raw) };
    if (def.kind === "ball") return { kind: "ball", label: "Ball", text: raw.replace(/\s*\(stated\)/i, "").replace(/\.$/, "").trim() };
    return { kind: def.kind, label: def.label, text: raw };
  }).filter((p) => (p.items ? p.items.length : p.text));
  return { summary, parts };
}

// Splits a note into dated segments: the original entry plus each "| Update M/D:".
function splitNoteSegments(text, baseDate) {
  const s = String(text || "");
  const re = /\s*\|\s*Update\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*:\s*/gi;
  const heads = [];
  let m;
  while ((m = re.exec(s))) heads.push({ at: m.index, end: m.index + m[0].length, mo: +m[1], dy: +m[2], yr: m[3] ? +m[3] : null });
  const base = /^\d{4}-\d{2}-\d{2}/.test(baseDate || "") ? baseDate.slice(0, 10) : "";
  const iso = (y, mo, dy) => `${y}-${String(mo).padStart(2, "0")}-${String(dy).padStart(2, "0")}`;
  const segs = [{ date: base, isUpdate: false, text: (heads.length ? s.slice(0, heads[0].at) : s).trim() }];
  heads.forEach((h, i) => {
    let y = h.yr ? (h.yr < 100 ? 2000 + h.yr : h.yr) : (base ? +base.slice(0, 4) : new Date().getFullYear());
    let d = iso(y, h.mo, h.dy);
    if (!h.yr && base && d < base) { const dt = (parseDate(base) - parseDate(d)) / 86400000; if (dt > 180) d = iso(y + 1, h.mo, h.dy); }
    segs.push({ date: d, isUpdate: true, text: s.slice(h.end, i + 1 < heads.length ? heads[i + 1].at : s.length).trim() });
  });
  return segs.filter((g) => g.text);
}

// Renders one note body as labeled sections; falls back to plain text.
function NoteBody({ text }) {
  const { summary, parts } = parseNoteBody(text);
  if (!parts.length) return <div className="nbub">{summary || text}</div>;
  const ball = parts.find((p) => p.kind === "ball");
  const sources = parts.filter((p) => p.kind === "source");
  return (
    <div className="nbub nbub-parsed">
      {summary && (/^[^.]{1,70}:$/.test(summary)
        ? <div className="nseg-sum" style={{ fontWeight: 700 }}>{summary.slice(0, -1)}</div>
        : <div className="nseg-sum">{summary}</div>)}
      {parts.filter((p) => p.kind === "para").map((p, i) => (
        <div key={`p${i}`} className="nseg-para"><span className="nseg-lbl">{p.label}</span> {p.text}</div>
      ))}
      {parts.filter((p) => p.kind === "steps").map((p, i) => (
        <div key={`s${i}`} className="nseg-steps">
          <div className="nseg-lbl">{p.label}</div>
          <ul>{p.items.map((it, j) => <li key={j}>{it}</li>)}</ul>
        </div>
      ))}
      {(ball || sources.length > 0) && (
        <div className="nseg-foot">
          {ball && <span className="t-chip t-ball">Ball: {ball.text}</span>}
          {sources.map((p, i) => <span key={i} className="nseg-src">Source: {p.text}</span>)}
        </div>
      )}
    </div>
  );
}

function ProgramModal({ property, onClose, onOpenPhase, onSetManualStatus, onSetDecision, onSetPriority, onUpdateAttribute, onUpdateNotes, onUpdateNotesLog, onSetDDDate, onToggleDueDiligence, onToggleServiceOption, onSetServiceContractDate, onSetISPDate, onSetExpectedTCO, onSetDeploymentLiveDate, regionsList, onAddRegion, currentUserEmail }) {
  const [notesOpen, setNotesOpen] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [editingNoteId, setEditingNoteId] = useState(null);
  const [historyOpenFor, setHistoryOpenFor] = useState({});
  const [composerOpen, setComposerOpen] = useState(false);
  const [noteText, setNoteText] = useState("");
  const [noteType, setNoteType] = useState(NOTE_TYPES[0]);
  const [stepText, setStepText] = useState("");
  const [stepOwner, setStepOwner] = useState("");
  const [stepDue, setStepDue] = useState("");
  const [pinChecked, setPinChecked] = useState(false);
  const program = property.program;
  const status = computeStatus(property);
  const meta = STATUS_META[status];
  const isProspect = !program.advisoryContractExecuted;
  const phases = buildPhases(program);
  const isHoldingPattern = !isProspect && phases.filter((ph) => !ph.virtual).length === 2 && phases.filter((ph) => !ph.virtual).every((ph) => ph.done) && status !== "Closed";

  // Notes Log entries come from several writers. The tracker database
  // stores them as { key, date, note, entry, phase, source, editedBy?,
  // amendedAt? } (Claude Digest, Change Log, imports); older in-app posts
  // used { id, text, type, author, pinned, steps, history }. Build a safe
  // view of each entry for display, and write changes back onto the
  // ORIGINAL object so untouched entries are saved exactly as they were.
  const rawNotes = Array.isArray(program.notesLog) ? program.notesLog : [];
  // Show people by first name: "eileen.dchristinzio@greystar.com" -> "Eileen".
  const firstName = (v) => {
    const t = typeof v === "string" ? v.trim() : "";
    if (!t.includes("@")) return t;
    const f = t.split("@")[0].split(/[._+\-]/).filter(Boolean)[0] || "";
    return f ? f[0].toUpperCase() + f.slice(1).toLowerCase() : t;
  };
  const safeDate = (s) => { if (!s) return ""; const d = parseDate(String(s).slice(0, 10)); return isNaN(d) ? "" : fmtDate(String(s).slice(0, 10)); };
  const notesLog = rawNotes.map((n, i) => {
    if (!n || typeof n !== "object") return null;
    const src = String(n.source || "");
    // "Call-out" = posted from the Notes Log composer ("manual" = older
    // in-app posts). Everything else is a property note pulled in by the
    // call/email digest, an import, or the Change Log.
    const kind = /^(call-out|manual)$/i.test(src) ? "callout" : /digest/i.test(src) ? "digest" : /change\s*log/i.test(src) ? "changelog" : "note";
    const body = typeof n.note === "string" ? n.note : typeof n.text === "string" ? n.text : String(n.note ?? n.text ?? "");
    const author = kind === "digest" ? "Claude Daily digest"
      : firstName(n.author) || firstName(n.editedBy) || (kind === "callout" ? "Author not recorded" : "Property note");
    return {
      uid: `${i}|${n.key ?? n.id ?? ""}`,
      idx: i,
      date: typeof n.date === "string" ? n.date.slice(0, 10) : "",
      text: body,
      type: typeof n.type === "string" ? n.type : "",
      phase: typeof n.phase === "string" ? n.phase : "",
      kind,
      srcLabel: kind === "digest" ? "Claude Daily digest" : kind === "changelog" ? "Change Log" : kind === "callout" ? "Call-out" : "Notes import",
      author,
      pinned: !!n.pinned,
      amended: !!n.amendedAt,
      entry: Number.isFinite(Number(n.entry)) ? Number(n.entry) : (Number.isFinite(Number(n.id)) ? Number(n.id) : 0),
      steps: (Array.isArray(n.steps) ? n.steps : []).map((s) => typeof s === "string" ? { t: s, o: "", d: "", done: false } : { t: "", o: "", d: "", ...(s || {}), done: !!(s && s.done) }),
      history: (Array.isArray(n.history) ? n.history : []).filter((h) => h && typeof h === "object"),
    };
  }).filter(Boolean);
  const viewByIdx = new Map(notesLog.map((v) => [v.idx, v]));
  const byNewest = (a, b) => b.date.localeCompare(a.date) || (b.entry - a.entry) || (b.idx - a.idx);
  // Notes Log window: only the call-outs tracker users added (pinned first).
  const callouts = notesLog.filter((n) => n.kind === "callout").sort((a, b) => (Number(b.pinned) - Number(a.pinned)) || byNewest(a, b));
  // History window: the property notes only (digest, import, Change Log),
  // newest first. Call-outs live in the Notes Log window, not here.
  const historyNotes = notesLog.filter((n) => n.kind !== "callout").sort(byNewest);
  // History shows each dated update in its own container: a note the digest
  // has appended "| Update M/D: …" sections to is split into one entry per
  // date, newest first. Display only — the stored note is unchanged.
  const historyEntries = historyNotes.flatMap((n) => {
    const segs = splitNoteSegments(n.text, n.date);
    const fromDigest = (t) => /Claude (Notes )?Digest/i.test(t) ? { kind: "digest", author: "Claude Daily digest", srcLabel: "Claude Daily digest" } : {};
    if (segs.length < 2) return [{ ...n, ...(n.kind === "note" ? fromDigest(n.text) : {}) }];
    return segs.map((g, i) => ({ ...n, ...(n.kind === "note" ? fromDigest(g.text) : {}), uid: `${n.uid}#${i}`, date: g.date || n.date, text: g.text, segOf: n.uid, segUpdate: g.isUpdate, segIdx: i, history: [] }));
  }).sort((a, b) => b.date.localeCompare(a.date) || ((b.segIdx || 0) - (a.segIdx || 0)) || byNewest(a, b));
  const setNoteBody = (raw, body) => (("note" in raw) || !("text" in raw)) ? { ...raw, note: body } : { ...raw, text: body };
  const updateOne = (uid, fn) => onUpdateNotesLog(rawNotes.map((r, i) => { const v = viewByIdx.get(i); return v && v.uid === uid ? fn(r, v) : r; }));

  const myEmail = (typeof currentUserEmail === "string" && currentUserEmail.trim()) || "";
  const me = firstName(myEmail) || "Signed-in user";

    const text = noteText.trim();
    if (!text) return;
    const steps = stepText.trim() ? [{ t: stepText.trim(), o: stepOwner.trim(), d: stepDue, done: false }] : [];
    const usedKeys = new Set(rawNotes.map((r) => r && r.key).filter(Boolean));
    let entry = notesLog.reduce((max, n) => Math.max(max, n.entry), 0) + 1;
    while (usedKeys.has(`${property.code}|${entry}`)) entry += 1;
    let phase = "";
    try { phase = currentPhaseGroupLabel(property) || ""; } catch (e) { phase = ""; }
    const base = pinChecked ? rawNotes.map((r, i) => { const v = viewByIdx.get(i); return v && v.pinned ? { ...r, pinned: false } : r; }) : rawNotes;
    const newNote = { key: `${property.code}|${entry}`, date: TODAY, note: text, entry, phase, source: "Call-out", type: noteType, author: me, pinned: pinChecked, steps, history: [] };
    onUpdateNotesLog([...base, newNote]);
    setNoteText(""); setStepText(""); setStepOwner(""); setStepDue(""); setPinChecked(false); setNoteType(NOTE_TYPES[0]); setComposerOpen(false);
  };
  const pinNote = (uid) => {
    onUpdateNotesLog(rawNotes.map((r, i) => {
      const v = viewByIdx.get(i);
      if (!v) return r;
      if (v.uid === uid) return { ...r, pinned: !v.pinned };
      return v.pinned ? { ...r, pinned: false } : r;
    }));
  };
  const startEdit = (uid) => { setEditingNoteId(uid); };
  const cancelEdit = () => setEditingNoteId(null);
  const saveEdit = (uid, newText) => {
    const trimmed = newText.trim();
    if (!trimmed) return;
    updateOne(uid, (r, v) => trimmed === v.text ? r : { ...setNoteBody(r, trimmed), editedBy: myEmail || me, history: [...v.history, { at: TODAY, by: me, prev: v.text }] });
    setEditingNoteId(null);
  };
  const toggleHistory = (uid) => setHistoryOpenFor((prev) => ({ ...prev, [uid]: !prev[uid] }));
  const toggleStepDone = (uid, stepIndex) => {
    updateOne(uid, (r, v) => ({ ...r, steps: v.steps.map((s, i) => i === stepIndex ? { ...s, done: !s.done } : s) }));
  };


  // One renderer for both windows; tools = pin / edit / tick next steps
  // (Notes Log call-outs only — History is read-only).
  const renderNote = (n, tools) => {
    const editing = tools && editingNoteId === n.uid;
    const author = n.author;
    const avatarText = n.kind === "digest" ? "CD" : n.kind === "note" && author === "Property note" ? "PN" : (String(author).split(/[^A-Za-z]+/).filter(Boolean).slice(0, 2).map((x) => x[0].toUpperCase()).join("") || "?");
    return (
      <div key={n.uid} className="nentry">
        <div className="av">{avatarText}</div>
        <div>
          <div className="nhead">
            {author}
            {n.type && <span className="t-chip">{n.type}</span>}
            {n.phase && <span className="t-chip">{n.phase}</span>}
            {n.kind !== "digest" && <span className="t-chip t-src">{n.srcLabel}</span>}
            {n.segUpdate && <span className="t-chip t-src">Digest update</span>}
            {n.amended && !n.segOf && <span className="t-chip t-src">Updated by digest</span>}
            {n.pinned && <span className="t-chip t-pin">Pinned to dashboard</span>}
            {n.history.length > 0 && <span className="t-chip t-src">Edited</span>}
            <span className="d">{safeDate(n.date)}</span>
          </div>
          {editing ? (
            <EditNoteBox initialText={n.text} onSave={(text) => saveEdit(n.uid, text)} onCancel={cancelEdit} />
          ) : (
            <NoteBody text={n.text} />
          )}
          {n.steps.length > 0 && (
            <div className="steps">
              Next steps
              {n.steps.map((s, i) => (
                <label key={i}>
                  <input type="checkbox" checked={s.done} disabled={!tools} onChange={() => toggleStepDone(n.uid, i)} />
                  {" "}{s.t}
                  {(s.o || s.d) && <span style={{ color: "var(--mut)" }}> {[s.o, safeDate(s.d)].filter(Boolean).join(" · ")}</span>}
                </label>
              ))}
            </div>
          )}
          <div style={{ marginTop: 6, display: "flex", gap: 14, flexWrap: "wrap" }}>
            {tools && <button className="link" onClick={() => pinNote(n.uid)}>{n.pinned ? "Unpin" : "Pin to dashboard"}</button>}
            {tools && !editing && <button className="link" onClick={() => startEdit(n.uid)}>Edit</button>}
            {n.history.length > 0 && <button className="link" onClick={() => toggleHistory(n.uid)}>{historyOpenFor[n.uid] ? "Hide history" : `View history (${n.history.length})`}</button>}
          </div>
          {historyOpenFor[n.uid] && (
            <div className="hist">
              Earlier versions
              {[...n.history].reverse().map((h, i) => <div key={i}>Replaced {safeDate(h.at)}{h.by ? ` by ${firstName(h.by)}` : ""}: {String(h.prev ?? "")}</div>)}
            </div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <span className="mono tag-code">{property.code}</span>
            <h2>{property.name}</h2>
          </div>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="modal-pills">
          <Pill color={meta.color} bg={meta.bg}>{status}</Pill>
          {!isProspect && <Pill color={PRIORITY_META[program.priority].color}>{program.priority} priority</Pill>}
        </div>

        <div className="field-label">Status override</div>
        <div className="chip-row" style={{ marginBottom: 14 }}>
          <button className={`chip ${!program.manualStatus ? "chip-active" : ""}`} onClick={() => onSetManualStatus(null)}>Auto-computed</button>
          {STATUS_OPTIONS.map((s) => (
            <button key={s} className={`chip ${program.manualStatus === s ? "chip-active" : ""}`} onClick={() => onSetManualStatus(s)}>{s}</button>
          ))}
        </div>

        {!isProspect && (
          <>
            <div className="field-label">Priority</div>
            <div className="chip-row" style={{ marginBottom: 14 }}>
              {PRIORITY_OPTIONS.map((p) => (
                <button key={p} className={`chip ${program.priority === p ? "chip-active" : ""}`} onClick={() => onSetPriority(p)}>{p}</button>
              ))}
            </div>
          </>
        )}

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button className="btn-ghost" onClick={() => setNotesOpen(true)}>
            <FileText size={13} /> Notes Log {callouts.length === 0 ? "(none yet)" : `(${callouts.length})`}
          </button>
          <button className="btn-ghost" onClick={() => setHistoryOpen(true)}>
            <FileText size={13} /> History {historyNotes.length === 0 ? "(none yet)" : `(${historyNotes.length})`}
          </button>
        </div>

        {notesOpen && (
          <div className="modal-overlay" onClick={() => setNotesOpen(false)}>
            <div className="modal nlog-scope" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 700 }}>
              <div className="modal-head" style={{ borderBottom: "1px solid var(--line)" }}>
                <h2 style={{ color: "var(--txt)" }}>Notes Log — {property.name}</h2>
                <button className="icon-btn" onClick={() => setNotesOpen(false)}><X size={18} /></button>
              </div>
              <div className="nlog">
                <div className="toolbar" style={{ marginBottom: 12 }}>
                  <h3 style={{ margin: 0 }}>Call-outs</h3>
                  <span className="sp" />
                  <span style={{ color: "var(--mut)" }}>{callouts.length} {callouts.length === 1 ? "call-out" : "call-outs"}</span>
                </div>

                ) : (
                  callouts.map((n) => renderNote(n, true))
                )}
                <div className="cmp">
                  <div className="av0" />
                  <div>
                    <textarea placeholder="Add a call-out…" aria-label="Call-out text" value={noteText} onChange={(e) => setNoteText(e.target.value)} onFocus={() => setComposerOpen(true)} />
                    {(composerOpen || noteText) && (
                      <div className="extra" style={{ display: "block" }}>
                        <div className="line types">
                          <span>Type</span>

                            <label key={t}><input type="radio" name="nType" checked={noteType === t} onChange={() => setNoteType(t)} /><span>{t}</span></label>
                          ))}
                        </div>
                        <div className="line">
                          <input type="text" placeholder="Next step (optional)" style={{ minWidth: 200 }} value={stepText} onChange={(e) => setStepText(e.target.value)} />
                          <input type="text" placeholder="Owner" style={{ width: 130 }} value={stepOwner} onChange={(e) => setStepOwner(e.target.value)} />
                          <input type="date" aria-label="Due date" value={stepDue} onChange={(e) => setStepDue(e.target.value)} />
                        </div>
                        <div className="line">
                          <label><input type="checkbox" checked={pinChecked} onChange={(e) => setPinChecked(e.target.checked)} /> Pin to dashboard</label>
                          <span style={{ marginLeft: "auto" }} />
                          <button className="btn" onClick={postNote}>Post call-out</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
              <div className="modal-actions">
                <button className="btn-primary" onClick={() => setNotesOpen(false)}>Done</button>
              </div>
            </div>
          </div>
        )}

        {historyOpen && (
          <div className="modal-overlay" onClick={() => setHistoryOpen(false)}>
            <div className="modal nlog-scope" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 700 }}>
              <div className="modal-head" style={{ borderBottom: "1px solid var(--line)" }}>
                <h2 style={{ color: "var(--txt)" }}>History — {property.name}</h2>
                <button className="icon-btn" onClick={() => setHistoryOpen(false)}><X size={18} /></button>
              </div>
              <div className="nlog">
                <div className="toolbar" style={{ marginBottom: 12 }}>
                  <h3 style={{ margin: 0 }}>Property notes</h3>
                  <span className="sp" />
                  <span style={{ color: "var(--mut)" }}>{historyEntries.length} {historyEntries.length === 1 ? "entry" : "entries"}</span>
                </div>
                {historyNotes.length === 0 ? (
                  <div className="foot" style={{ margin: "0 0 12px" }}>No property notes yet.</div>
                ) : historyEntries.map((n) => renderNote(n, false))}
              </div>
              <div className="modal-actions">
                <button className="btn-primary" onClick={() => setHistoryOpen(false)}>Done</button>
              </div>

        )}

        <div className="contract-dates-list" style={{ marginBottom: 10 }}>

            <span className="field-label">Advisory Contract Drafted</span>

          {[["dueDiligence", "Due Diligence", "dueDiligence"], ["rfp", "RFP", "rfp"], ["programDesign", "Program Design", "programDesign"], ["deployment", "Deployment", "deployment"]].map(([optionKey, label, phaseKey]) => {
            // The contract execution date for this specific service (its own

            const draftOnly = proposed && !program.advisoryContractExecuted;
            return (

            <select className="address-state" value={(program.attributes || {}).State || ""} onChange={(e) => onUpdateAttribute("State", e.target.value)}>
              <option value="">State</option>
              {US_STATES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
            <input className="address-zip" placeholder="Zip" value={(program.attributes || {}).Zip || ""} onChange={(e) => onUpdateAttribute("Zip", e.target.value)} />
          </div>
        </div>

        <div className="attr-edit-grid" style={{ marginBottom: 14 }}>
          {CORE_ATTRIBUTE_KEYS.map((k) => {
            const options = k === "Region" ? regionsList : ATTRIBUTE_DROPDOWN_OPTIONS_STATIC[k];
            return (
              <div className="attr-edit-item" key={k}>
                <label>{k}</label>
                {options ? (
                  <select
                    value={(program.attributes || {})[k] || options[0]}
                    onChange={(e) => {
                      if (k === "Region" && e.target.value === "__add_new__") {
                        const newRegion = window.prompt("New region name:");
                        const added = onAddRegion(newRegion);
                        if (added) onUpdateAttribute(k, added);
                      } else {
                        onUpdateAttribute(k, e.target.value);
                      }
                    }}
                  >
                    {options.map((o) => <option key={o} value={o}>{o}</option>)}
                    {k === "Region" && <option value="__add_new__">+ Add new region…</option>}
                  </select>
                ) : (
                  <input value={(program.attributes || {})[k] || ""} onChange={(e) => onUpdateAttribute(k, e.target.value)} placeholder="—" />
                )}
              </div>
            );
          })}
          {Object.keys(program.attributes || {}).filter((k) => !CORE_ATTRIBUTE_KEYS.includes(k) && !ADDRESS_KEYS.includes(k)).map((k) => (
            <div className="attr-edit-item" key={k}>
              <label>{k}</label>
              <input value={(program.attributes || {})[k] || ""} onChange={(e) => onUpdateAttribute(k, e.target.value)} placeholder="—" />
            </div>
          ))}
        </div>

        {phases.length > 0 ? (
          <>
            <div className="field-label">Phases — click one to open its to-do list</div>
            <div className="ms-list">
              {phases.map((ph) => {
                const doneCount = ph.todos ? ph.todos.filter((t) => t.done).length : 0;
                const totalCount = ph.todos ? ph.todos.length : 0;
                if (ph.virtual) {
                  return (
                    <button className="phase-row phase-row-virtual" key={ph.key} onClick={() => onOpenPhase(ph.key)}>
                      <span className="legend-swatch" style={{ background: ph.color }} />
                      <span className="dim" style={{ fontStyle: "italic" }}>{ph.label}</span>
                      <span className="phase-row-trailing">
                        <span className="mono ms-date">{fmtDate(ph.start)} – {fmtDate(ph.end)}</span>
                        {totalCount > 0 && <span className="chip-count phase-todo-count">{doneCount}/{totalCount}</span>}
                        <ChevronDown size={14} className="phase-chevron" />
                      </span>
                    </button>
                  );
                }
                return (
                  <button className="phase-row" key={ph.key} onClick={() => onOpenPhase(ph.key)}>
                    <span className="legend-swatch" style={{ background: ph.color }} />
                    {ph.done ? <CircleCheck size={16} color="#007B0C" /> : <Circle size={16} color="#B2B3B5" />}
                    <span className={ph.done ? "ms-done" : ""}>{ph.label}</span>
                    <span className="phase-row-trailing">
                      <span className="mono ms-date">{fmtDate(ph.end)}</span>
                      {totalCount > 0 && <span className="chip-count phase-todo-count">{doneCount}/{totalCount}</span>}
                      <ChevronDown size={14} className="phase-chevron" />
                    </span>
                  </button>
                );
              })}
            </div>

            {(() => {
              const legalContracted = isPhaseContracted(program, "contractingLegal");
              const designContracted = isPhaseContracted(program, "programDesign");
              const rows = NOT_CONTRACTED_ELIGIBLE_KEYS
                .filter((k) => k !== "contractingLegal" && k !== "programDesign" && !isPhaseContracted(program, k))
                .map((k) => {
                  const def = PHASE_DEFS.find((d) => d.key === k);
                  const stored = program.phaseData[k];
                  const todos = stored ? stored.todos : defaultTodosFor(k, true);
                  return { key: k, label: def.label, color: def.color, doneCount: todos.filter((t) => t.done).length, total: todos.length };
                });
              // Only combined into its own row when BOTH sides are
              // genuinely uncontracted — if just one is, it already
              // shows as its own tagged tile inside the real combined
              // phase above, so it shouldn't be duplicated here too.
              if (!legalContracted && !designContracted) {
                const legalStored = program.phaseData.contractingLegal;
                const designStored = program.phaseData.programDesign;
                const legalTodos = legalStored ? legalStored.todos : defaultTodosFor("contractingLegal", true);
                const designTodos = designStored ? designStored.todos : defaultTodosFor("programDesign", true);
                rows.unshift({
                  key: "programDesign", label: "Program Design & Contracting",
                  color: PHASE_DEFS.find((d) => d.key === "programDesign").color,
                  doneCount: legalTodos.filter((t) => t.done).length + designTodos.filter((t) => t.done).length,
                  total: legalTodos.length + designTodos.length,
                });
              }
              if (rows.length === 0) return null;
              return (
                <>
                  <div className="field-label" style={{ marginTop: 18 }}>
                    Additional checklists — not currently contracted, click to open
                  </div>
                  {rows.map((row) => {
                    const needsAttention = row.doneCount < row.total;
                    return (
                      <button className="not-contracted-row" key={row.key} onClick={() => onOpenPhase(row.key)}>
                        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span className="legend-swatch" style={{ background: row.color, opacity: 0.5 }} />
                          <span className="dim">{row.label}</span>
                          <span className="tag-not-contracted">Not Contracted</span>
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          {needsAttention && <span className="not-contracted-needs-attention">needs attention</span>}
                          <span className="chip-count phase-todo-count">{row.doneCount}/{row.total}</span>
                          <ChevronDown size={14} className="phase-chevron" />
                        </span>
                      </button>
                    );
                  })}
                </>
              );
            })()}

            {isHoldingPattern && (
              <>
                <div className="field-label" style={{ marginTop: 18 }}>Post-Due-Diligence decision</div>
                <div className="chip-row">
                  <button className={`chip ${program.decision !== "closed" ? "chip-active" : ""}`} onClick={() => onSetDecision(null)}>Holding — re-engage later</button>
                  <button className={`chip ${program.decision === "closed" ? "chip-active" : ""}`} onClick={() => onSetDecision("closed")}>Closed — client declined</button>
                </div>
              </>
            )}
          </>
        ) : (
          <div className="dim" style={{ fontSize: 13 }}>
            No agreement signed yet — this property is still in the pitch/prospect stage.
          </div>
        )}
      </div>
    </div>
  );
}
