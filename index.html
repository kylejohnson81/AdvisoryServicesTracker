<style>



        * { box-sizing: border-box; }
        html, body {
          margin: 0; padding: 0;
          min-height: 100%;
          height: auto;
          overflow-y: auto;
        }
        .app-root {
          --bg: #0A2245;
          --panel: #14315E;
          --panel-alt: #1C3E70;
          --border: rgba(169,196,218,0.16);
          --grid-line: rgba(169,196,218,0.10);
          --ink: #FFFFFF;
          --ink-muted: #B2B3B5;
          --accent: #0077D4;
          --accent-dim: rgba(0,119,212,0.16);
          background: var(--bg);
          color: var(--ink);
          font-family: Arial, Helvetica, sans-serif;
          min-height: 100vh;
          overflow-x: auto;
          padding: 28px;
        }
        .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
        h1, h2, h3 { font-family: Arial, Helvetica, sans-serif; margin: 0; }

        .top-bar { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-right: 220px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
        .brand-sub { color: var(--ink-muted); font-size: 12.5px; margin-top: 2px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
        .sync-badge { font-size: 10.5px; font-weight: 600; margin-top: 3px; font-family: Arial, Helvetica, sans-serif; }
        .sync-badge-live { color: #007B0C; }
        .sync-badge-local { color: var(--ink-muted); }
        .brand-icon { width: 34px; height: 34px; border: 1px solid var(--accent); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: var(--accent-dim); }
        .brand-logo-plate { position: absolute; top: 0; right: 0; background: #FFFFFF; padding: 6px 16px; border-radius: 4px; display: flex; align-items: center; }
        .brand-logo-img { height: 32px; width: auto; display: block; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1 1 100%; margin-right: -220px; }
        /* Main navigation: one group, perforated separators, a hover color per page */
        .nav-group { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .nav-group button { position: relative; background: transparent; color: var(--ink-muted); border: none; padding: 9px 16px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-family: Arial, Helvetica, sans-serif; white-space: nowrap; transition: color 0.15s, background 0.15s; }
        .nav-group button + button::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; border-left: 1px dashed rgba(169,196,218,0.38); }
        .nav-group button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px; background: var(--hc); opacity: 0; transition: opacity 0.15s; }
        .nav-group button:hover { color: var(--hc); background: color-mix(in srgb, var(--hc) 9%, transparent); }
        .nav-group button:hover::after { opacity: 0.55; }
        .nav-group button.active { color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); font-weight: 600; }
        .nav-group button.active::after { opacity: 1; }
        .top-actions .nav-spacer { flex: 1 1 auto; }
        .top-actions > .btn-ghost { padding: 9px 13px; }
        .top-actions > .search-box { min-width: 180px; }
        .btn-ghost { transition: color 0.15s, border-color 0.15s, background 0.15s; white-space: nowrap; }
        .btn-ghost:hover { color: var(--ink); border-color: rgba(169,196,218,0.45); background: rgba(169,196,218,0.06); }
        .btn-ghost.on { color: var(--ink); border-color: var(--accent); background: var(--accent-dim); }
        .nav-badge { margin-left: 2px; background: #c0392b; color: #fff; border-radius: 99px; padding: 1px 7px; font-size: 11px; font-weight: 700; line-height: 1.4; }

        .btn-primary { background: var(--accent); color: #FFFFFF; border: none; font-weight: 600; padding: 9px 16px; border-radius: 4px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: Arial, Helvetica, sans-serif; transition: filter 0.15s; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--border); padding: 9px 16px; border-radius: 4px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: Arial, Helvetica, sans-serif; }
        .btn-disabled { opacity: 0.45; }
        .icon-btn { background: none; border: none; color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .icon-btn:hover { color: var(--ink); }

        .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .view-toggle button { background: var(--panel); color: var(--ink-muted); border: none; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .view-toggle button.active { background: var(--accent-dim); color: var(--accent); }
        .team-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .team-toggle button { background: var(--panel); color: var(--ink-muted); border: none; padding: 8px 14px; cursor: pointer; font-size: 13px; }
        .team-toggle button.active { background: var(--accent-dim); color: var(--accent); }

        .search-box { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; min-width: 200px; }
        .search-box input { background: none; border: none; color: var(--ink); font-size: 13px; outline: none; width: 100%; }
        .search-box input::placeholder { color: var(--ink-muted); }

        .kpi-strip { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
        .kpi {
          background: var(--panel); flex: 1; padding: 18px 18px; display: flex; flex-direction: column; gap: 6px;
          border: none; border-right: 1px solid var(--border); cursor: pointer; text-align: left; font-family: Arial, Helvetica, sans-serif;
        }
        .kpi:last-child { border-right: none; }
        .kpi:hover { background: var(--panel-alt); }
        .kpi:disabled { cursor: default; }
        .kpi:disabled:hover { background: var(--panel); }
        .kpi-active { background: var(--panel-alt); }
        .kpi-value { font-size: 22px; font-weight: 600; }
        .kpi-label { font-size: 13.5px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.01em; }
        .kpi-total .kpi-value { color: var(--ink); }

        .legend { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 20px; font-size: 13.5px; font-weight: 600; color: var(--ink-muted); }
        .legend-item { flex: 1; background: var(--panel); padding: 14px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; border-right: 1px solid var(--border); }
        .legend-item:last-child { border-right: none; }
        .legend-item-clickable {
          border: none; border-right: 1px solid var(--border); cursor: pointer;
          font-family: inherit; font-size: inherit; font-weight: inherit; color: inherit;
        }
        .legend-item-clickable:last-child { border-right: none; }
        .legend-item-clickable:hover { background: var(--panel-alt); }
        .legend-item-active { background: var(--accent-dim) !important; color: var(--accent) !important; box-shadow: inset 0 0 0 1px var(--accent); }
        .legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; display: inline-block; }
        .legend-item .legend-swatch { width: 11px; height: 11px; }
        .legend-caption { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-muted); margin: -12px 0 20px 2px; flex-wrap: wrap; }
        .legend-caption-item {
          background: none; border: none; display: inline-flex; align-items: center; gap: 6px;
          font-size: 11px; color: var(--ink-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px;
          font-family: inherit;
        }
        .legend-caption-item:hover { background: var(--panel-alt); }
        .legend-caption-item.legend-item-active { color: var(--accent); background: var(--accent-dim); box-shadow: none; }
        .legend-hatch-sample {
          width: 20px; height: 9px; border-radius: 2px; flex-shrink: 0; display: inline-block;
          opacity: 0.85;
        }
        .legend-hatch-sky {
          background: #92C9EB;
          background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 2px, transparent 2px, transparent 6px);
          margin-left: 12px;
        }
        .legend-hatch-stucco {
          background: #FBF7EF;
          background-image: repeating-linear-gradient(45deg, rgba(10,34,69,0.3) 0, rgba(10,34,69,0.3) 2px, transparent 2px, transparent 6px);
        }

        .main-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: stretch; }
        .main-content { display: flex; flex-direction: column; }
        .sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; position: sticky; top: 20px; }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .group-option { width: 100%; text-align: left; background: none; border: none; color: var(--ink-muted); padding: 8px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-bottom: 2px; }
        .group-option.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
        .group-option:hover:not(.active) { background: var(--panel-alt); color: var(--ink); }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-muted); }
        .toggle-btn { background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink-muted); border-radius: 20px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 11.5px; }
        .toggle-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink-muted); font-size: 12px; padding: 6px 10px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .chip-active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .chip-static { cursor: default; }
        .chip-count { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 1px 6px; font-size: 10.5px; font-family: Consolas, 'SF Mono', Menlo, monospace; }
        .clear-link { margin-top: 8px; background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 0; }

        .lane { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
        .lane-tab { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; background: var(--panel-alt); border-bottom: 1px solid var(--border); border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .lane-tab-left { display: flex; align-items: center; gap: 12px; }
        .lane-expand-btn {
          background: none; border: none; color: var(--ink-muted); cursor: pointer;
          display: flex; align-items: center; padding: 2px; margin: -2px;
        }
        .lane-expand-btn:hover { color: var(--ink); }
        .chevron-collapsed { transform: rotate(-90deg); transition: transform 0.15s; }
        .chevron-expanded { transform: rotate(0deg); transition: transform 0.15s; }
        .lane-tab-clickable { cursor: pointer; }
        .lane-tab-clickable:hover { background: var(--panel); }
        .lane-tab-clickable:hover .lane-title { color: var(--accent); }
        .lane-tab-dashboard-link {
          background: none; border: 1px solid var(--border); border-radius: 4px;
          color: var(--ink-muted); font-size: 11.5px; padding: 4px 9px; cursor: pointer;
        }
        .lane-tab-dashboard-link:hover { color: var(--accent); border-color: var(--accent); }
        .isolate-banner {
          display: flex; align-items: center; justify-content: space-between; gap: 10px;
          background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 6px;
          padding: 10px 14px; margin-bottom: 12px; font-size: 13px;
        }
        .action-list-view { padding: 8px 4px 24px; }
        .action-list-header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .action-list-title { font-size: 22px; font-weight: 700; }
        .action-list-subtitle { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }
        .action-list-phase-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .phase-filter-chip { display: flex; align-items: center; gap: 6px; background: var(--panel-alt); border: 1px solid var(--border); color: var(--ink-muted); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
        .phase-filter-chip.active { background: var(--panel); color: var(--ink); border-color: rgba(169,196,218,0.4); }
        .phase-filter-swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .action-list-tier { margin-bottom: 20px; }
        .action-list-prospecting-link { display: flex; justify-content: center; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border); }
        .action-list-tier-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .action-list-tier-count { font-size: 11px; font-weight: 700; background: rgba(169,196,218,0.16); color: var(--ink-muted); border-radius: 10px; padding: 1px 8px; }
        .action-list-tier-header-overdue { color: #DA7A62; }
        .action-list-tier-header-thisWeek { color: #FFD972; }
        .action-list-tier-header-thisMonth { color: var(--ink); }
        .action-list-tier-header-later { color: var(--ink-muted); }
        .action-list-rows { display: flex; flex-direction: column; gap: 8px; }
        .action-list-row { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; cursor: pointer; }
        .action-list-row:hover { border-color: rgba(169,196,218,0.4); }
        .action-list-property-name { font-weight: 600; font-size: 13.5px; }
        .action-list-todo-text { color: var(--ink-muted); font-size: 12.5px; margin-top: 3px; }
        .action-list-todo-note { color: var(--ink-muted); font-size: 11.5px; font-style: italic; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border); }
        .action-list-digest-note { color: var(--ink-muted); font-size: 11.5px; margin-top: 4px; padding-left: 8px; border-left: 2px solid rgba(169,196,218,0.5); }
        .action-list-digest-date { font-weight: 600; color: var(--ink); }
        .action-list-history-btn { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; background: var(--panel-alt); color: var(--ink-muted); border: 1px solid var(--border); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .action-list-history-btn:hover { border-color: rgba(169,196,218,0.4); }
        .action-list-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 4px; border-top: 1px solid rgba(169,196,218,0.10); }
        .action-list-phase-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
        .action-list-responsible-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; background: var(--panel-alt); color: var(--ink-muted); border: 1px solid var(--border); }
        .action-list-status-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
        .action-list-urgency { font-size: 12px; font-weight: 600; white-space: nowrap; margin-left: auto; }
        .action-list-urgency-overdue { color: #DA7A62; }
        .action-list-urgency-due-today { color: #FFD972; }
        .action-list-urgency-upcoming { color: var(--ink-muted); }
        .action-list-urgency-dim { color: var(--ink-muted); opacity: 0.6; }
        /* Portfolio Overview — scoped navy theme matching the new
           prototype exactly. Its own variable names (--pov-*) rather
           than overriding the app's global tokens, so nothing here
           ever bleeds into the rest of the app's own styling. */
        .modal-portfolio-overview {
          --pov-bg: #0b1530; --pov-card: #16254a; --pov-card2: #1d2f5a; --pov-inset: #101d3d;
          --pov-line: #2c4170; --pov-line2: #3b5390; --pov-txt: #e8eef9; --pov-mut: #9fb0cb; --pov-dim: #6f82a6;
          --pov-blue: #4f8fe8; --pov-green: #7bd88a; --pov-amber: #f4b45a; --pov-red: #ff8f86; --pov-purple: #a79cf0;
          background: var(--pov-bg) !important; color: var(--pov-txt);
        }
        .modal-portfolio-overview .modal-head { border-bottom: 1px solid var(--pov-line); }
        .modal-portfolio-overview .modal-head h2 { color: var(--pov-txt); }
        .modal-portfolio-overview .icon-btn { color: var(--pov-mut); }
        .dashboard-view { padding: 8px 4px 24px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .dashboard-summary-line { font-size: 13px; color: var(--pov-mut); margin-bottom: 12px; }

        .pov-kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .pov-kpi { background: var(--pov-card); border: 1px solid var(--pov-line); border-radius: 10px; padding: 12px 14px; text-align: left; cursor: pointer; }
        .pov-kpi:hover { border-color: var(--pov-line2); }
        .pov-kpi.active { outline: 2px solid var(--pov-blue); }
        .pov-kpi .v { font: 600 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        .pov-kpi .k { font-size: 12.5px; color: var(--pov-mut); margin-top: 2px; }

        .pov-section-title { font-size: 13px; color: var(--pov-mut); margin: 18px 0 8px; font-weight: 600; }
        .pov-cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .pov-stat-card { background: var(--pov-card); border: 1px solid var(--pov-line); border-radius: 10px; padding: 12px 14px; }
        .pov-stat-card .v { font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        .pov-stat-card .k { font-size: 12.5px; color: var(--pov-mut); margin-top: 2px; }
        .pov-stat-card .n { font-size: 11.5px; color: var(--pov-dim); margin-top: 4px; }

        .pov-owed-card { background: var(--pov-card); border: 1px solid var(--pov-line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .pov-owed-card h3 { font-size: 15px; margin: 0 0 12px; color: var(--pov-txt); }
        .pov-owed-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .pov-owed-row { display: grid; grid-template-columns: 70px 1fr 90px; gap: 10px; align-items: center; margin-bottom: 10px; }
        .pov-owed-row .tr { height: 26px; background: var(--pov-inset); border-radius: 5px; overflow: hidden; }
        .pov-owed-row .bar { display: flex; height: 100%; }
        .pov-owed-row b { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--pov-txt); }
        .pov-legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--pov-mut); font-size: 12.5px; margin-top: 4px; }
        .pov-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

        .pov-notes-card { background: var(--pov-card); border: 1px solid var(--pov-line); border-radius: 12px; padding: 16px; margin-top: 14px; }
        .pov-notes-card h3 { font-size: 15px; margin: 0 0 12px; color: var(--pov-txt); }
        .pov-note-row { display: grid; grid-template-columns: 230px 1fr 130px; gap: 14px; padding: 11px 0; border-top: 1px solid var(--pov-line); align-items: start; cursor: pointer; }
        .pov-note-row:first-of-type { border-top: 0; }
        .pov-note-row:hover { background: var(--pov-card2); }
        .pov-note-row .nm { font-weight: 600; color: var(--pov-txt); }
        .pov-note-row .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .pov-note-row .when { text-align: right; color: var(--pov-mut); font-size: 12.5px; }
        .pov-note-text { color: var(--pov-txt); }
        .pov-t-chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: #1f4a82; color: #bcd9ff; }

/* ---------------------------------------------------------
   ECONOMIC MODEL — RFP vendor cost/revenue comparison
   Two input sources feed one calculation, matching how this is
   actually done today: the vendor's RFP Response form supplies cost
   data; Greystar's own commercial assumptions supply the revenue side.
--------------------------------------------------------- */
const CONTRACT_TERMS = [3, 5, 7, 10];

// Vendor-supplied fields — mirror the real RFP Response form exactly,
// not the older Cordoba-style model. Financing is a rate per unit for
// whichever term(s) the vendor actually offers, not a single flat fee.
function newVendorBid(name) {
  return {
    id: Date.now() + Math.random(), name: name || "New Vendor",
    circuitCostPerUnit: 0, supportFeePerUnit: 0, backupCircuitPerUnit: 0,
    annualRateIncreasePct: 0, contractTermYears: 5,
    lvConduitCost: 0, equipmentCost: 0,
    financingRates: { 3: null, 5: null, 7: null, 10: null }
  };
}

// Greystar-side assumptions — never vendor-supplied, since a vendor has
// no basis to set resident pricing or predict adoption.
function defaultEconomicAssumptions() {
  return { monthlyFee: 0, maxAdoptionPct: 0.9, adoptionRampMonths: 6, buyoutCost: 0 };
}

// Yearly rollup for one vendor — the term length itself flexes to
// whatever that vendor's contract runs (3/5/7/10 years), rather than a
// fixed 5-year window like the old model.
function computeVendorYearlyModel(vendor, assumptions, totalUnits) {
  const years = vendor.contractTermYears || 5;
  const rows = [];
  let cumulativeCCF = 0;
  const monthlyCostPerUnitBase = (vendor.circuitCostPerUnit || 0) + (vendor.supportFeePerUnit || 0) + (vendor.backupCircuitPerUnit || 0);
  const upfrontCost = (vendor.lvConduitCost || 0) + (vendor.equipmentCost || 0) + (assumptions.buyoutCost || 0);
  const rampMonths = Math.max(1, assumptions.adoptionRampMonths || 1);

  for (let year = 1; year <= years; year++) {
    // Average adoption fraction across this year's 12 months — ramps
    // linearly from 0 to Max Adoption over the ramp period, then holds flat.
    let monthSum = 0;
    for (let m = 1; m <= 12; m++) {
      const monthIndex = (year - 1) * 12 + m;
      const fraction = monthIndex >= rampMonths ? 1 : monthIndex / rampMonths;
      monthSum += fraction * (assumptions.maxAdoptionPct || 0);
    }
    const avgAdoption = monthSum / 12;
    const adoptedUnits = totalUnits * avgAdoption;

    const revenue = adoptedUnits * (assumptions.monthlyFee || 0) * 12;
    // Escalator compounds annually — the old model held cost flat for
    // every year, which doesn't reflect a real annual rate increase.
    const escalatedMonthlyCost = monthlyCostPerUnitBase * Math.pow(1 + (vendor.annualRateIncreasePct || 0), year - 1);
    const recurringCost = adoptedUnits * escalatedMonthlyCost * 12;
    const yearUpfront = year === 1 ? upfrontCost : 0;
    const profit = revenue - recurringCost - yearUpfront;
    cumulativeCCF += profit;

    rows.push({ year, adoptedUnits, revenue, recurringCost, upfrontCost: yearUpfront, profit, ccf: cumulativeCCF });
  }

  const totalRevenue = rows.reduce((s, r) => s + r.revenue, 0);
  const totalCost = rows.reduce((s, r) => s + r.recurringCost, 0) + upfrontCost;
  const finalCCF = rows.length ? rows[rows.length - 1].ccf : 0;
  const roi = upfrontCost > 0 ? finalCCF / upfrontCost : null;
  // Payback month, not just year — interpolates within whichever year CCF
  // actually crosses zero, assuming that year's profit accrues evenly
  // across its 12 months (the yearly rollup doesn't track true monthly
  // detail, so this is the closest reasonable estimate without it).
  let positiveCCFMonth = null;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (row.ccf < 0) continue;
    const prevCCF = i === 0 ? 0 : rows[i - 1].ccf;
    if (prevCCF >= 0) {
      positiveCCFMonth = (row.year - 1) * 12 + 1;
    } else {
      const monthlyProfit = row.profit / 12;
      const monthsIntoYear = monthlyProfit > 0 ? Math.ceil(-prevCCF / monthlyProfit) : 12;
      positiveCCFMonth = (row.year - 1) * 12 + Math.min(12, Math.max(1, monthsIntoYear));
    }
    break;
  }

  return { rows, upfrontCost, totalRevenue, totalCost, finalCCF, roi, positiveCCFMonth };
}

const TIMELINE_START = "2026-04-01"; // display now starts at April — every property's prospectStart is April 1 by design, so Jan-Mar would only ever be empty space
const TIMELINE_END = "2026-12-31"; // default/fallback range end (e.g. Ongoing Mgmt with no ISP term set)
const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Chart range is 1 year by default, expandable to 2 via the "+" control
// next to December — this returns both the column labels and the end date.
// Each month carries its real start date (not just a label) so the header
// grid can be sized proportionally to actual day counts — using equal 1/12
// columns instead would drift out of sync with any date-based position
// (the Today line, phase segments) since months have different lengths.
function buildChartRange(showYear2) {
  // Year 1 (2026) starts at April, not January — Jan/Feb/Mar removed from
  // display since nothing ever starts before April now. Year 2 (2027), if
  // shown, still runs the full 12 months from January — this trim is
  // specifically about the empty lead-in at the very start of the whole
  // range, not something that should repeat every year.
  const year1Labels = MONTH_LABELS.slice(3);
  const months = year1Labels.map((label, i) => ({ key: `${label}26`, label, start: `2026-${String(i + 4).padStart(2, "0")}-01` }));
  if (showYear2) {
    MONTH_LABELS.forEach((label, i) => months.push({ key: `${label}27`, label, year2: true, start: `2027-${String(i + 1).padStart(2, "0")}-01` }));
  }
  const end = showYear2 ? "2027-12-31" : "2026-12-31";
  return { months, end };
}

// Reference "today" for computing at-risk/on-track — computed once from
// the local system clock at load time (not a fixed date), so overdue
// detection, the Today marker, and every elapsed-time calculation always
// reflect whatever day the file is actually opened on. Uses local date
// parts rather than toISOString() specifically to avoid a UTC timezone
// shift rolling the date over early/late near midnight.
const _now = new Date();
const TODAY = `${_now.getFullYear()}-${String(_now.getMonth() + 1).padStart(2, "0")}-${String(_now.getDate()).padStart(2, "0")}`;

/* Six sequential phases with real billing meaning:
   - Due Diligence: $10/unit one-time (credited back if client opts into RFP)
   - Advisory Service Contracting: where the client decides what's next
   - RFP: $10/unit one-time
   - Program & Contract Design: $10/unit one-time
   - Deployment + Ongoing Management: billed together, $2/unit/month,
     running coterminous with the property's ISP agreement */
const PHASE_DEFS = [
  { key: "dueDiligence", label: "Due Diligence", days: 30, always: true, color: "#378ADD", billing: "$10/unit one-time" },
  { key: "advisory", label: "Additional Services", days: 30, always: true, color: "#85B7EB", billing: "Included" },
  { key: "rfp", label: "RFP Track", days: 30, optionKey: "rfp", color: "#639922", billing: "$10/unit one-time" },
  { key: "incumbentNegotiation", label: "Incumbent Negotiation Track", days: 30, optionKey: "incumbentNegotiation", color: "#D4537E", billing: "Included" },
  { key: "contractingLegal", label: "Contracting & Legal", days: 30, optionKey: "contractingLegal", color: "#534AB7", billing: "Included" },
  { key: "programDesign", label: "Program Design & Contracting", days: 60, optionKey: "programDesign", color: "#EF9F27", billing: "$10/unit one-time" },
  { key: "deployment", label: "Deployment", days: 183, optionKey: "deployment", color: "#D85A30", billing: "$2/unit/mo (with Ongoing Mgmt)" },
  { key: "postDeploymentValidation", label: "Post-Deployment Validation", days: 30, optionKey: "postDeploymentValidation", color: "#1D9E75", billing: "Included" },
  { key: "ongoing", label: "Ongoing Management", days: null, optionKey: "deployment", color: "#B2B3B5", billing: "$2/unit/mo (with Deployment)" }
];
// Deployment + Ongoing Management are sold and billed as a single line —
// selecting one always includes the other. Contracting & Legal and
// Post-Deployment Validation are never independently toggled by
// anyone — they're derived automatically (see buildPhases) from
// whichever real client decision actually drives them: either track
// being selected for the former, Deployment for the latter. Their
// optionKey exists only so they fit the same phase-building loop as
// everything else, not because someone manually flips them on.
// Phases eligible for off-contract tracking — someone sometimes does
// real work in one of these even though the client never formally
// contracted for it. Deliberately excludes Due Diligence and Advisory:
// those are foundational starting phases tied to real contract-
// execution dates, not independently optional services a client
// chooses or skips the way RFP, Program Design, or Deployment are.
const NOT_CONTRACTED_ELIGIBLE_KEYS = ["rfp", "incumbentNegotiation", "contractingLegal", "programDesign", "deployment", "postDeploymentValidation"];
function isPhaseContracted(program, phaseKey) {
  const opts = contractedOptionsOf(program);
  // Contracting & Legal and Post-Deployment Validation are never
  // independently selected — they follow from whichever real decision
  // actually drives them, same derivation buildPhases already uses.
  // Contracting & Legal is the "Contract Support" half of the Contract
  // Support & Program Design service, so it's engaged only with it.
  if (phaseKey === "contractingLegal") return !!opts.programDesign;
  if (phaseKey === "postDeploymentValidation") return !!opts.deployment;
  return !!opts[phaseKey];
}
// Services only count as contracted once the advisory contract is
// executed. A drafted agreement's service selections are proposals:
// they're kept on the record but never drive phases, icons or billing.
function contractedOptionsOf(program) {
  if (!program || !program.advisoryContractExecuted) return {};
  return program.selectedOptions || {};
}
// A service's own contract execution date: the date recorded for that
// service (an amendment adds a later one), else the advisory contract's
// execution date. Null when the service isn't on an executed contract.
function serviceExecutedDate(program, optionKey) {
  if (!program || !program.advisoryContractExecuted) return null;
  const opts = program.selectedOptions || {};
  const svcKey = optionKey === "dueDiligence" ? "rfp" : optionKey;
  if (!opts[optionKey]) return null;
  return ((program.serviceContractDates || {})[svcKey]) || program.advisoryContractExecuted;
}
const OPTIONAL_PHASES = [
  PHASE_DEFS.find((d) => d.key === "rfp"),
  PHASE_DEFS.find((d) => d.key === "incumbentNegotiation"),
  PHASE_DEFS.find((d) => d.key === "programDesign"),
  PHASE_DEFS.find((d) => d.key === "deployment")
];

// Default day-lengths for every phase with a fixed duration (Ongoing Mgmt
// has none — it always runs to the ISP term end). buildPhases reads this
// object directly, so editing it via Settings recalculates every phase
// length everywhere consistently — timeline, status, table view, all of it.
const DEFAULT_PHASE_DURATIONS = { dueDiligence: 30, advisory: 30, rfp: 30, incumbentNegotiation: 30, contractingLegal: 30, programDesign: 60, deployment: 90, postDeploymentValidation: 30 };
let PHASE_DURATIONS = { ...DEFAULT_PHASE_DURATIONS };

/* ---------------------------------------------------------
   DATE HELPERS
--------------------------------------------------------- */
const parseDate = (s) => new Date(s + "T00:00:00");
const pct = (s, chartEnd) => {
  const end = chartEnd || TIMELINE_END;
  const totalMs = parseDate(end) - parseDate(TIMELINE_START);
  const v = ((parseDate(s) - parseDate(TIMELINE_START)) / totalMs) * 100;
  return Math.min(100, Math.max(0, v));
};

// Real day-proportional column widths for the month grid — NOT equal 1/12
// columns. Months have different lengths, so an equal-width grid drifts
// out of alignment with any date-based position (Today line, phase
// segments) as the year progresses. This guarantees they always agree.
const monthColumnWidths = (months, chartEnd) => months.map((m, i) => {
  const startPct = pct(m.start, chartEnd);
  const nextStart = months[i + 1] ? months[i + 1].start : chartEnd;
  const endPct = pct(nextStart, chartEnd);
  return Math.max(0.1, endPct - startPct);
});
const fmtDate = (s) =>
  parseDate(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const addDays = (s, n) => {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};

// Substitutes {{property}}/{{client}}/{{manager}}/{{code}} placeholders
// with real data — shared by both the mailto link builder and the
// clipboard-copy fallback below, so they never drift out of sync.
function fillEmailTemplate(s, property) {
  return (s || "")
    .replace(/\{\{property\}\}/g, property.name)
    .replace(/\{\{client\}\}/g, property.program.attributes.Client || "")
    .replace(/\{\{manager\}\}/g, property.program.attributes["CM"] || "")
    .replace(/\{\{code\}\}/g, property.code);
}

// Builds a mailto: link from a to-do's email template, substituting
// placeholders with real property data. Opens the user's default mail
// client (Outlook, if configured) with a pre-filled draft — this can't
// auto-send or log anywhere without a real backend/Graph API integration,
// but it gets a one-click drafted email in front of the user right now.
// Note: mailto: links are silently blocked inside sandboxed iframes (e.g.
// an embedded artifact preview) — they work normally in a standalone
// browser tab. The clipboard-copy button below is the reliable fallback.
function buildMailtoLink(template, property) {
  const subject = encodeURIComponent(fillEmailTemplate(template.subject, property));
  const body = encodeURIComponent(fillEmailTemplate(template.body, property));
  const to = template.to ? encodeURIComponent(fillEmailTemplate(template.to, property)) : "";
  return `mailto:${to}?subject=${subject}&body=${body}`;
}

const PLANNING_COLOR = "#92C9EB"; // matches the Planning status color (Sky)
const PROSPECTING_COLOR = "#FBF7EF"; // near-white, lightened from Stucco

// Canonical Prospecting checklist — the pitch/pre-agreement stage, before
// the Due Diligence contract has been executed. This is shown both for
// pure prospects (no DD signed at all) and for the pre-engagement lead
// time on properties that have since signed DD — same underlying work.
function prospectingTemplate(done) {
  return [
    { text: "Identify property as a prospect", responsible: "Advisory Services", done },
    { text: "Initial contact / outreach to ownership/management", responsible: "Advisory Services", done },
    { text: "Introduce Greystar Advisory Services offering", responsible: "Advisory Services", done },
    { text: "Schedule discovery call", responsible: "Advisory Services", done },
    { text: "Gauge interest in a Due Diligence engagement", responsible: "Advisory Services", done },
    { text: "Tracker input — if no further discussion, enter owner and property details and mark the opportunity closed", responsible: "ROVR", done },
    { text: "Tracker input — if client wants to proceed, enter owner and property details in master tracker, send client intake form to client, request ISP contracts for each property", responsible: "Advisory Services", done },
    { text: "Follow up as needed", responsible: "Advisory Services", done }
  ];
}

// Canonical Planning checklist — the gap after Due Diligence completes but
// before the Advisory contract gets executed (whether that gap is still
// live/growing, or already resolved historically).
function planningTemplate(done) {
  return [
    { text: "Confirm current status with client", responsible: "Advisory Services", done },
    { text: "Follow up on outstanding next steps", responsible: "Advisory Services", done },
    { text: "Re-engage / check in with client", responsible: "Advisory Services", done },
    { text: "Update program status in master tracker after each client touchpoint", responsible: "Advisory Services", done }
  ];
}

// Planning's two possible timeline segments (waiting on the Advisory
// contract, already-resolved or still live/growing) share one underlying
// to-do list — this maps either display key back to the single canonical
// storage bucket they should read/write.
function storageKeyFor(phaseKey) {
  if (phaseKey === "planningGap" || phaseKey === "planningGapLive") return "planning";
  return phaseKey;
}

/* Build the actual phase sequence for a property's program. Two real
   events anchor the whole timeline: the Due Diligence contract execution
   date starts phase 1, and the Advisory Services contract execution date
   (a separate, independently-timed event) starts phase 2. Everything from
   RFP onward chains off Advisory's end. Ongoing Management runs to the
   ISP term end date rather than indefinitely. Prospecting renders before
   Due Diligence exists at all (pre-agreement lead time, whether or not DD
   has since been signed); Planning gaps render only after Due Diligence,
   if there's a real gap before the Advisory contract gets executed. */
function buildPhases(program) {
  // Per-property overrides take precedence over the portfolio-wide default —
  // anything not customized for this property falls back to PHASE_DURATIONS.
  // Overrides carry an optional note explaining why the timeframe was
  // extended or reduced, alongside the day count itself.
  const dur = (key) => {
    const override = program.durationOverrides && program.durationOverrides[key];
    return (override && override.days != null) ? override.days : PHASE_DURATIONS[key];
  };
  const durNote = (key) => {
    const override = program.durationOverrides && program.durationOverrides[key];
    return (override && override.note) || "";
  };
  // Once a phase is actually done, its real completion date — not the
  // calculated one — is what determines the phase's true end and the
  // next phase's start. Finishing every to-do early genuinely shifts the
  // whole downstream chain earlier; finishing late shifts it later. The
  // calculated end is only the fallback while a phase is still open,
  // used for At Risk detection.
  const actualEnd = (done, completedDate, calculatedEnd) => (done && completedDate) ? completedDate : calculatedEnd;

  const phases = [];
  // DD is never a separate contract or a separate phase of its own — a
  // real, signed Connected Living Advisory Services Agreement has no DD
  // line item at all. It's purely a selection flag meaning "RFP's real
  // fee is being billed as DD instead, and RFP itself shows as waived
  // on the same contract" — confirmed directly against a real executed
  // agreement. DD therefore always shares Advisory's own contract date;
  // there's no independent ddContractExecuted date anymore.
  const executedOpts = contractedOptionsOf(program);
  const draftedOnly = !program.advisoryContractExecuted && !!program.advisoryContractDrafted;
  const ddSelected = !!executedOpts.dueDiligence;
  // A property flows into Advisory Service Contracting the moment a
  // contract is genuinely drafted, not only once it's executed —
  // drafting isn't a separate pre-phase state, it's the real start of
  // this phase. advisoryStart prefers the drafted date throughout this
  // function wherever the phase's actual start matters, since a
  // contract is always drafted before it's ever executed.
  const hasAdvisory = !!program.advisoryContractExecuted || !!program.advisoryContractDrafted;
  const advisoryStart = program.advisoryContractDrafted || program.advisoryContractExecuted;

  if (!hasAdvisory) {
    // Nothing contracted at all yet — still show a live, growing segment
    // if we know when the pitch/prospecting relationship started.
    if (program.prospectStart) {
      const end = TODAY > program.prospectStart ? TODAY : program.prospectStart;
      const data = program.phaseData.prospecting || { done: false, todos: prospectingTemplate(false) };
      phases.push({
        key: "prospecting", label: "Prospecting", color: PROSPECTING_COLOR, hatchDark: true,
        start: program.prospectStart, end, virtual: true, ...data
      });
    }
    return phases;
  }

  // hasAdvisory is guaranteed true past this point.
  if (program.prospectStart && program.prospectStart < advisoryStart) {
    // Pre-agreement lead time before the single contract (covering DD,
    // if selected, and Advisory) was signed. Necessarily concluded by
    // now, so it always reads as done.
    const data = program.phaseData.prospecting || { done: false, todos: prospectingTemplate(false) };
    phases.push({
      key: "prospecting", label: "Prospecting", color: PROSPECTING_COLOR, hatchDark: true,
      start: program.prospectStart, end: advisoryStart, virtual: true, ...data, done: true
    });
  }

  // DD's own checklist and billing trigger still exist as a real phase
  // object when selected — bundled into, and starting on, the same
  // contract date as Advisory itself, not a separate earlier date.
  if (ddSelected) {
    const ddStart = (program.serviceContractDates && program.serviceContractDates.rfp) || advisoryStart;
    const ddDef = PHASE_DEFS[0];
    const ddData = program.phaseData.dueDiligence || { done: false, todos: defaultTodosFor("dueDiligence") };
    const ddCalcEnd = addDays(ddStart, dur("dueDiligence"));
    const ddEnd = actualEnd(ddData.done, ddData.completedDate, ddCalcEnd);
    phases.push({ ...ddDef, start: ddStart, end: ddEnd, defaultDeadline: ddCalcEnd, ...ddData, durationNote: durNote("dueDiligence") });
  }
  const advDef = PHASE_DEFS[1];
  const advData = program.phaseData.advisory || { done: false, todos: advisoryTemplate(false) };
  const advCalcEnd = addDays(advisoryStart, dur("advisory"));
  // "Advisory Services selected in tracker" isn't independently toggled —
  // it's derived directly from whether the client has actually had at
  // least one Contracted Option (RFP/Program Design/Deployment) selected.
  // That keeps the checklist and the options chips from ever drifting out
  // of sync with each other.
  //
  // Same idea applies to drafting itself: once a real "contract created"
  // date exists (the Ironclad workflow's own creation date, confirming a
  // draft genuinely exists), "NSC drafts advisory services agreement for
  // business unit review" reflects that automatically — driven by real
  // external data, not something anyone needs to click by hand.
  const optionsChosen = Object.values(executedOpts).some(Boolean);
  const advEnd = actualEnd(optionsChosen, advData.completedDate, advCalcEnd);
  const advTodos = (advData.todos || []).map((t) => {
    if (t.text === ADVISORY_TRACKER_STEP) return { ...t, done: optionsChosen };
    if (t.text === ADVISORY_DRAFT_STEP && program.advisoryContractDrafted) {
      return { ...t, done: true };
    }
    return t;
  });
  // Drafted but not executed: the property sits in its own "Advisory
  // Contracts Drafted" phase — none of the draft's proposed services
  // appear until the agreement is actually executed.
  const advLabel = draftedOnly ? { label: "Advisory Contracts Drafted", color: STATUS_META["Advisory Contracts Drafted"].color, drafted: true } : {};
  phases.push({ ...advDef, ...advLabel, start: advisoryStart, end: advEnd, ...advData, todos: advTodos, done: optionsChosen, defaultDeadline: advCalcEnd, durationNote: durNote("advisory") });

  // Contracting & Legal and Post-Deployment Validation are never
  // independently selected by anyone — they follow automatically from
  // a real, already-tracked decision: either track (RFP or Incumbent
  // Negotiation) leads into legal review, and Deployment leads into its
  // own validation step. Derived here rather than read directly from
  // program.selectedOptions, so nothing new needs to be manually stored
  // or imported — the existing rfp/incumbentNegotiation/deployment
  // flags already say everything needed.
  const derivedOptions = {
    ...executedOpts,
    // Contract Support & Program Design is one contracted service: legal
    // review is only modeled when that service is engaged, never as a
    // tail on RFP alone. The timeline models engaged services only.
    contractingLegal: !!executedOpts.programDesign,
    postDeploymentValidation: !!executedOpts.deployment,
  };

  let cursor = advEnd;
  // Separate from `cursor` (the real, actual-delay-aware chain) — this
  // tracks where each phase's deadline would fall if every phase before
  // it had finished exactly on its default/override duration, no matter
  // what actually happened. Without this, a late Advisory phase would
  // silently push RFP's marker later too, and the next phase's, and so
  // on — compounding one delay into every subsequent "deadline" instead
  // of keeping each one anchored to the original plan.
  let idealCursor = advCalcEnd;

  // Each selectable service can be genuinely contracted separately from
  // the others — a client who starts with just RFP and later comes back
  // for Program Design shows that as two real, independent contract
  // dates, not one shared date covering everything. A visible gap phase
  // marks the real wait when a service's own date is genuinely later
  // than where the sequential chain would otherwise place it. An
  // own-date that isn't later than the sequential position is ignored —
  // a phase can't have started before the work in front of it
  // concluded, so that'd be a data issue, not a real gap.
  const svcDates = program.serviceContractDates || {};
  const resolveServiceStart = (optionKey, label, sequentialStart) => {
    const ownDate = svcDates[optionKey];
    if (ownDate && ownDate > sequentialStart) {
      const gapData = program.phaseData.planning || { done: false, todos: planningTemplate(false) };
      phases.push({
        key: `planningGap_${optionKey}`, label: `Planning (awaiting ${label} contract)`, color: PLANNING_COLOR,
        start: sequentialStart, end: ownDate, virtual: true, ...gapData, done: true,
      });
      return ownDate;
    }
    return sequentialStart;
  };

  if (optionsChosen) {
    PHASE_DEFS.slice(2).forEach((def) => {
      if (def.key === "contractingLegal") return; // folded into the combined programDesign phase below, not its own standalone phase anymore
      if (def.key === "programDesign") {
        // Combined with Contracting & Legal into a single phase — both
        // genuinely remain separate, independently-tracked checklists
        // (their own phaseData, their own completion), but they're now
        // presented together as two side-by-side tiles under one
        // screen, and the phase as a whole only counts as done once
        // both are. That's what structurally keeps Deployment from
        // ever being treated as "current" until both have actually
        // finished — every current-phase check in the app already
        // works by finding the first not-done phase in order, so this
        // falls out naturally rather than needing a separate rule.
        const includeDesign = !!executedOpts.programDesign;
        const includeLegal = includeDesign;
        if (!includeDesign) return;
        const start = resolveServiceStart("programDesign", "Program Design", cursor);
        // Whichever side is genuinely contracted gets its normal, fresh-
        // start checklist; whichever isn't still gets a tile here too
        // (consolidated under this one phase, not a separate entry
        // elsewhere), pre-checked by default like any other off-contract
        // tracking, since nothing's actually expected there yet.
        const legalDataRaw = program.phaseData.contractingLegal || { done: false, todos: contractingLegalTemplate(!includeLegal) };
        const designDataRaw = program.phaseData.programDesign || { done: false, todos: programDesignTemplate(!includeDesign) };
        const legalActuallyDone = (legalDataRaw.todos || []).length > 0 && legalDataRaw.todos.every((t) => t.done);
        const designActuallyDone = (designDataRaw.todos || []).length > 0 && designDataRaw.todos.every((t) => t.done);
        const legalData = { ...legalDataRaw, done: legalActuallyDone };
        const designData = { ...designDataRaw, done: designActuallyDone };
        const subPhases = [
          { key: "contractingLegal", label: "Contracting & Legal", contracted: includeLegal, ...legalData },
          { key: "programDesign", label: "Program Design", contracted: includeDesign, ...designData },
        ];
        // Only genuinely contracted sub-tiles gate progression — an
        // off-contract tile never blocks Deployment, even if something
        // in it has been flagged as needing attention.
        const combinedDone = subPhases.filter((sp) => sp.contracted).every((sp) => sp.done);
        // The combined phase isn't genuinely finished until the later
        // of the two sub-checklists wraps, not the earlier one.
        const combinedCompletedDate = subPhases.filter((sp) => sp.contracted).reduce((latest, sp) => {
          if (!sp.done || !sp.completedDate) return latest;
          return (!latest || sp.completedDate > latest) ? sp.completedDate : latest;
        }, null);
        const totalDuration = (includeLegal ? dur("contractingLegal") : 0) + (includeDesign ? dur("programDesign") : 0);
        const calcEnd = addDays(start, totalDuration);
        const end = actualEnd(combinedDone, combinedCompletedDate, calcEnd);
        const defaultDeadline = addDays(idealCursor, totalDuration);
        phases.push({
          key: "programDesign", label: "Program Design & Contracting", color: def.color, billing: def.billing,
          start, end, done: combinedDone, completedDate: combinedCompletedDate,
          // Flattened for anything that just needs to scan every to-do
          // in this phase generically (e.g. finding the next undone
          // item for My Work) — the two-tile UI reads subPhases
          // directly instead, to keep each checklist visually distinct.
          todos: [...(includeLegal ? legalData.todos : []), ...(includeDesign ? designData.todos : [])],
          subPhases, defaultDeadline, durationNote: durNote("programDesign"),
        });
        cursor = end;
        idealCursor = defaultDeadline;
        return;
      }
      if (!derivedOptions[def.optionKey]) return;
      let start = cursor;
      // A client can skip Greystar running RFP/Incumbent
      // Negotiation/Program Design entirely — they did their own
      // procurement and just want deployment managed. In that case,
      // Advisory's calculated end date has no real bearing on when
      // Deployment should start — the ISP contract's actual execution
      // date does. Only applies when every upstream procurement path is
      // genuinely skipped; if any is selected, the normal calculated
      // chain still applies, since that's how the ISP contract would
      // actually get executed in the first place.
      if (def.key === "deployment" && program.ispContractExecuted && !executedOpts.rfp && !executedOpts.incumbentNegotiation && !executedOpts.programDesign) {
        start = program.ispContractExecuted;
      }
      start = resolveServiceStart(def.optionKey, def.label, start);
      const defaultTodos =
        def.key === "rfp" ? rfpTemplate(false) :
        def.key === "incumbentNegotiation" ? incumbentNegotiationTemplate(false) :
        def.key === "deployment" ? deploymentTemplate(false) :
        def.key === "postDeploymentValidation" ? postDeploymentValidationTemplate(false) :
        def.key === "ongoing" ? ongoingTemplate(false) : [];
      const data = program.phaseData[def.key] || { done: false, todos: defaultTodos };
      const end = def.key === "ongoing"
        ? (program.ispTermEnd || TIMELINE_END) // perpetual — never early-shifted
        : actualEnd(data.done, data.completedDate, addDays(start, dur(def.key)));
      const defaultDeadline = def.key === "ongoing" ? null : addDays(idealCursor, dur(def.key));
      phases.push({ ...def, start, end, ...data, defaultDeadline, durationNote: def.key === "ongoing" ? "" : durNote(def.key) });
      cursor = end;
      if (def.key !== "ongoing") idealCursor = defaultDeadline;
    });
  }

  // Due Diligence specifically can be superseded by Advisory genuinely
  // having started — DD's own checklist might never get manually
  // completed, but Advisory having a real, independent start date
  // (advisoryContractExecuted or advisoryContractDrafted) is solid
  // proof DD must be over regardless. This was previously applied to
  // every phase, which caused a real, confirmed bug: for the purely
  // calculated chain after Advisory (RFP through Post-Deployment
  // Validation), a later phase's mere existence in this array only
  // ever means a service was selected on the contract — not that the
  // property has actually reached that point in real life. Every
  // property with multiple services selected was incorrectly showing
  // as fully done straight through to Ongoing Management the moment
  // its checklist data was ever empty, regardless of real progress.
  // Every phase from Advisory onward now relies purely on its own
  // genuine `done` state — actual checklist completion, or (for
  // Advisory specifically) optionsChosen — never inferred from what
  // else merely exists in the sequence.
  const ddIndex = phases.findIndex((ph) => ph.key === "dueDiligence");
  if (ddIndex !== -1 && !phases[ddIndex].done) {
    const hasLaterRealPhase = phases.slice(ddIndex + 1).some((ph) => !ph.virtual);
    if (hasLaterRealPhase) phases[ddIndex].done = true;
  }

  return phases;
}

/* Status is computed from the current phase's to-do list — a manual
   override always wins if your team sets one. */
function computeStatus(property) {
  const { program } = property;
  if (program.manualStatus) return program.manualStatus;
  // A contract workflow has been created (drafting started, per the real
  // Ironclad "Workflow Created Date") but hasn't reached execution yet —
  // a genuine pivot point distinct from either Prospecting or a fully
  // executed Advisory engagement.
  if (program.advisoryContractDrafted && !program.advisoryContractExecuted) return "Advisory Contracts Drafted";
  if (!program.advisoryContractExecuted) return "Prospecting";

  const phases = buildPhases(program);
  const realPhases = phases.filter((ph) => !ph.virtual);
  const today = parseDate(TODAY);
  const allDone = realPhases.every((ph) => ph.done);
  if (allDone) {
    if (realPhases.length === 1) return "Planning"; // DD complete, Advisory contract not yet executed
    if (realPhases.length === 2) return program.decision === "closed" ? "Closed" : "Planning";
    const last = realPhases[realPhases.length - 1];
    // A phase can be checked off ahead of its own calculated schedule —
    // that shouldn't jump the status to Stabilized before today has
    // actually reached the point where Ongoing Management begins.
    return (last.key === "ongoing" && today >= parseDate(last.start)) ? "Stabilized" : "On Track";
  }
  const current = realPhases.find((ph) => !ph.done);
  const todos = current.todos || [];
  if (todos.some((t) => t.blocked && !t.done)) return "Blocked";
  if (todos.some((t) => t.due && !t.done && parseDate(t.due) < today)) return "At Risk";
  // No specific to-do is flagged, but the phase itself has already run past
  // its own default (or overridden) duration — that's still behind schedule.
  if (today > parseDate(current.end)) return "At Risk";
  // Same guard here — Ongoing Management only reads as Stabilized once
  // today has genuinely reached it, not just because everything before it
  // got marked done early.
  return (current.key === "ongoing" && today >= parseDate(current.start)) ? "Stabilized" : "On Track";
}

const PROPERTIES = [];

// Single source of truth for "what should this phase's checklist default
// to, if it hasn't been explicitly stored yet." Used everywhere a phase's
// data might not exist — both when rendering it (buildPhases) and when
// acting on it (toggling a specific to-do). These two previously used
// different fallbacks — display correctly showed the real template, but
// toggling used a bare empty array — which meant clicking any to-do
// beyond what happened to be stored crashed the whole app the moment a
// phase had never been explicitly initialized (true for every imported
// property, on any phase, until someone actually interacts with it).
function defaultTodosFor(phaseKey, done) {
  done = !!done;
  if (phaseKey === "dueDiligence") return ddTemplate(done);
  if (phaseKey === "advisory") return advisoryTemplate(done);
  if (phaseKey === "rfp") return rfpTemplate(done);
  if (phaseKey === "incumbentNegotiation") return incumbentNegotiationTemplate(done);
  if (phaseKey === "contractingLegal") return contractingLegalTemplate(done);
  if (phaseKey === "programDesign") return programDesignTemplate(done);
  if (phaseKey === "deployment") return deploymentTemplate(done);
  if (phaseKey === "postDeploymentValidation") return postDeploymentValidationTemplate(done);
  if (phaseKey === "ongoing") return ongoingTemplate(done);
  // Prospecting and Planning are drawn from these templates until a
  // property saves its own copy — ticking one of their to-dos before then
  // used to find an empty list here and crash the whole tracker.
  if (phaseKey === "prospecting") return prospectingTemplate(done);
  if (phaseKey === "planning" || phaseKey === "planningGap" || phaseKey === "planningGapLive") return planningTemplate(done);
  return [];
}

// Canonical Ongoing Support checklist — didn't exist as a real checklist
// before at all (Ongoing Management was purely a billing phase with no
// to-dos tracked). Matches the document's Phase 10 exactly, now that
// there's real, substantive work to track here rather than nothing.
function ongoingTemplate(done) {
  return [
    { text: "Recurring WiFi Score monitoring and periodic recertification", responsible: "ROVR", done },
    { text: "Resident feedback monitored for connectivity-related issues", responsible: "ROVR", done },
    { text: "ISP performance measured against contracted SLA; escalations raised with the ISP POC", responsible: "ROVR", done },
    { text: "Contract calendar maintained — renewal, auto-renewal, and notice windows tracked in master tracker", responsible: "ROVR", done },
    { text: "Periodic program review with client and Regional Ops", responsible: "Advisory Services", toggleWith: "Regional Ops", rounds: 0, emailTemplates: [{ label: "Standard", subject: "Periodic Program Review — {{property}}", body: "Hi,\n\nWe would like to schedule a periodic program review for {{property}}.\n\nBest,\nGreystar Advisory Services" }], done },
    { text: "Identify remaining properties in the owner's portfolio and return qualified properties to Prospecting", responsible: "Advisory Services", done },
    { text: "Continue updating master tracker", responsible: "Advisory Services", done }

}

// Functionally unused for actual grouping — Client grouping (like Region,
// Office, Project Type) derives its lanes dynamically from live filtered
// properties, not from this list. Left empty deliberately rather than
// derived from PROPERTIES, since that would put real client names back
// into the shipped JavaScript source.
const CLIENTS = [];

// Which phase a property is "currently" sitting in, normalized for
// grouping — matches the same current-phase logic used in the table view,
// with virtual Prospecting/Planning segments collapsed to a clean label.
// A drafted-but-not-executed advisory contract no longer produces a
// virtual Prospecting segment as the current phase at all — buildPhases
// itself now renders the real Advisory Service Contracting segment from
// the drafted date onward, so this naturally reads that real phase's
// own label without needing any special-case handling here.
function currentPhaseGroupLabel(property) {
  const phases = buildPhases(property.program);
  // Every property in this system exists for a genuine reason, even if
  // no prospect start date happens to be on file — there's no real
  // "nothing has happened yet" state, so this collapses into
  // Prospecting rather than a separate, ambiguous bucket. Matches
  // computeStatus, which already treats this exact case as Prospecting.
  if (phases.length === 0) return "Prospecting";
  const current = phases.find((ph) => !ph.done) || phases[phases.length - 1];
  if (current.virtual) return current.key === "prospecting" ? "Prospecting" : "Planning";
  return current.label;
}

// Natural phase sequence, used to sort Group-by-Phase lanes in the order
// work actually flows rather than alphabetically.
const PHASE_GROUP_ORDER = [
  "Prospecting", "Advisory Contracts Drafted", "Due Diligence", "Planning",
  "Additional Services", "RFP Track", "Incumbent Negotiation Track", "Program Design & Contracting",
  "Deployment", "Post-Deployment Validation", "Ongoing Management"
];

// Both tables are already fetched sorted newest-first by digest_date,
// so filtering by property/client preserves that order directly.
function newestCallNote(callNotes, propertyCode) {
  const rows = callNotes.filter((r) => r.property_code === propertyCode);
  return rows.length ? rows[0] : null;
}
function olderCallNotes(callNotes, propertyCode) {
  return callNotes.filter((r) => r.property_code === propertyCode).slice(1);
}
function collectCompletedNotesForProperty(property) {
  const entries = [];
  const scan = (phaseLabel, todos, completedDate) => {
    (todos || []).forEach((t) => {
      if (t.notes && t.notes.trim()) entries.push({ phaseLabel, todoText: t.text, notes: t.notes, responsible: t.responsible || "Advisory Services", completedDate: completedDate || null });
    });
  };
  const phases = buildPhases(property.program);
  phases.forEach((phase) => {
    if (phase.subPhases) {
      // Each side of the combined view finishes independently — only
      // the ones that are actually done count as completed workflow,
      // even while the phase as a whole is still open.
      phase.subPhases.forEach((sp) => { if (sp.done) scan(sp.label, sp.todos, sp.completedDate); });
    } else if (phase.done) {
      scan(phase.label, phase.todos, phase.completedDate);
    }
  });
  return entries.sort((a, b) => {
    const ai = PHASE_GROUP_ORDER.indexOf(a.phaseLabel);
    const bi = PHASE_GROUP_ORDER.indexOf(b.phaseLabel);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });
}

// Maps a phase-group label (from currentPhaseGroupLabel) back to its
// established color — real phases use their PHASE_DEFS color, and the
// two virtual labels (Prospecting, Planning) reuse their STATUS_META
// color, since those are also real statuses elsewhere in the app.
function colorForPhaseLabel(label) {
  if (STATUS_META[label]) return STATUS_META[label].color;
  const def = PHASE_DEFS.find((d) => d.label === label);
  return def ? def.color : "#B2B3B5";
}

function PropertyRow({ property, onOpenPhase, onOpenProgram, chartEnd, months }) {
  const isProspect = !property.program.advisoryContractExecuted;
  const phases = buildPhases(property.program);

  // A property reads as not-on-track (Blocked or At Risk) when its current
  // real phase has an unresolved blocked to-do, an overdue due date, or —
  // failing either of those — has simply run past its own default duration
  // with nothing flagged. Same three conditions computeStatus checks, in
  // the same order. Whichever fires, position the strike chronologically:
  // a specific to-do's position within the checklist if one exists, or the
  // phase's own end date if the phase itself is just running long.
  const currentRealPhase = phases.filter((ph) => !ph.virtual).find((ph) => !ph.done);
  const stallTodos = currentRealPhase ? (currentRealPhase.todos || []) : [];
  const today = parseDate(TODAY);
  const blockedIdx = stallTodos.findIndex((t) => t.blocked && !t.done);
  const overdueIdx = stallTodos.findIndex((t) => t.due && !t.done && parseDate(t.due) < today);
  const phaseOverdue = currentRealPhase && today > parseDate(currentRealPhase.end);
  const firstOpenIdx = stallTodos.findIndex((t) => !t.done);

  let stallIdx = blockedIdx !== -1 ? blockedIdx : overdueIdx;
  let stallKind = blockedIdx !== -1 ? "Blocked" : (overdueIdx !== -1 ? "At Risk" : null);
  let strikeAtPhaseEnd = false;
  if (stallIdx === -1 && phaseOverdue) {
    stallKind = "At Risk";
    if (firstOpenIdx !== -1) stallIdx = firstOpenIdx;
    else strikeAtPhaseEnd = true; // no to-dos to anchor to — just run past the phase's own end
  }
  const isBlocked = stallIdx !== -1 || strikeAtPhaseEnd;
  const stallColor = "#9E3B2E"; // red for both Blocked and At Risk — same visual for any stall
  let strikeX = 0;
  if (isBlocked) {
    const leftPct = pct(currentRealPhase.start, chartEnd);
    const rightPct = pct(currentRealPhase.end, chartEnd);
    if (strikeAtPhaseEnd) {
      strikeX = rightPct;
    } else {
      const frac = (stallIdx + 0.5) / stallTodos.length;
      strikeX = leftPct + frac * (rightPct - leftPct);
    }
  }
  const todayPct = pct(TODAY, chartEnd);

  return (
    <div className="prop-row">
      <button className="prop-row-label" onClick={() => onOpenProgram(property)}>
        <span className="mono tag-code">{property.code}</span>
        <div className="prop-row-name">{property.name}</div>
      </button>
      <div className="prop-track">
        <div className="tl-grid" style={{ gridTemplateColumns: monthColumnWidths(months, chartEnd).map((w) => `${w}fr`).join(" ") }}>
          {months.map((m) => <div className="tl-grid-line" key={m.key} />)}
        </div>
        {isProspect && phases.length === 0 && <div className="prospect-note">Prospecting — no agreement signed yet</div>}
        {phases.map((ph, i) => {
          const left = pct(ph.start, chartEnd);
          const right = pct(ph.end, chartEnd);
          const isFirst = i === 0, isLast = i === phases.length - 1;
          // A very short phase (a quick Planning gap, a DD that wrapped
          // in a few days out of a multi-year timeline) could compute a
          // true width under 0.8%, too thin to see or click. The 0.8%
          // floor keeps it visible — but naively applying that floor
          // could push this segment's right edge past where the next
          // one actually starts, since the next segment's own left is
          // still computed independently from its true start date. That
          // produced two adjacent segments visibly overlapping at their
          // shared boundary. Capping the floor at the space actually
          // available before the next segment begins (or 100% for the
          // last one) keeps every segment visible without ever
          // overlapping its neighbor.
          const nextLeft = isLast ? 100 : pct(phases[i + 1].start, chartEnd);
          const width = Math.min(Math.max(0.8, right - left), Math.max(0, nextLeft - left));
          return (
            <div
              key={ph.key}
              className={`phase-seg ${ph.done && !ph.virtual ? "phase-seg-done" : ""} ${ph.virtual ? "phase-seg-virtual" : ""} ${ph.hatchDark ? "phase-seg-virtual-dark" : ""}`}
              style={{
                left: `${left}%`, width: `calc(${width}% + 1px)`, backgroundColor: ph.color,
                borderTopLeftRadius: isFirst ? 3 : 0, borderBottomLeftRadius: isFirst ? 3 : 0,
                borderTopRightRadius: isLast ? 3 : 0, borderBottomRightRadius: isLast ? 3 : 0
              }}
              onClick={() => onOpenPhase(property, ph.key)}
              title={`${ph.label} — ${fmtDate(ph.start)} to ${fmtDate(ph.end)}${ph.done && !ph.virtual ? " (complete)" : ""}${ph.durationNote ? ` — ${ph.durationNote}` : ""}`}
            />
          );
        })}
        {/* The full expected trajectory for the current, still-open phase —
            a dashed outline spanning from its real start to where it would
            have ended on the default/override schedule, with no actual
            delays ever factored in. Replaces the old single should-be
            line: instead of one thin marker, the gap between this ghost
            outline and the solid, actual segment beneath it is the delay
            (or head start) itself, visible directly rather than requiring
            you to interpret where a single line sits. Only shown for the
            current phase, matching the old line's same scope. */}
        {currentRealPhase && currentRealPhase.defaultDeadline && (() => {
          const ghostLeft = pct(currentRealPhase.start, chartEnd);
          const ghostRight = pct(currentRealPhase.defaultDeadline, chartEnd);
          const daysDiff = Math.round((parseDate(TODAY) - parseDate(currentRealPhase.defaultDeadline)) / 86400000);
          const statusText = daysDiff > 0 ? `${daysDiff} day${daysDiff === 1 ? "" : "s"} behind schedule`
            : daysDiff < 0 ? `${-daysDiff} day${daysDiff === -1 ? "" : "s"} ahead of schedule`
            : "exactly on schedule";
          return (
            <div
              className="phase-ghost-seg"
              style={{ left: `${ghostLeft}%`, width: `calc(${Math.max(0.8, ghostRight - ghostLeft)}% + 1px)` }}
              onClick={() => onOpenPhase(property, currentRealPhase.key)}
              title={`Expected trajectory — ${currentRealPhase.label} would have ended ${fmtDate(currentRealPhase.defaultDeadline)} on the default schedule — currently ${statusText}`}
            />
          );
        })()}
        {isBlocked && (
          <>
            <div
              className="blocked-strike"
              style={{ left: `${strikeX}%`, borderLeftColor: stallColor }}
              title={strikeAtPhaseEnd
                ? `${stallKind} — ${currentRealPhase.label} has run past its expected ${fmtDate(currentRealPhase.end)} completion`
                : `${stallKind} — "${stallTodos[stallIdx].text}" (${currentRealPhase.label})`}
              onClick={() => onOpenPhase(property, currentRealPhase.key)}
            />
            {todayPct > strikeX && (
              <div
                className="blocked-dotted"
                style={{ left: `${strikeX}%`, width: `${todayPct - strikeX}%`, borderTopColor: stallColor }}
                title={`Stalled — no progress since this point, as of today`}
              />
            )}
          </>
        )}
      </div>
    </div>
  );
}

// Bar-chart summary dashboard — the new default landing view. Bar charts
// rather than pie charts deliberately: with 8+ phases and several status
// categories, pie slices become genuinely hard to compare precisely
// against each other once there are more than a handful of them; bars
// keep actual proportions readable at a glance. Each bar is clickable,
// jumping straight into the Timeline view grouped by that dimension and
// isolated to the clicked category — reusing the same group/isolate
// mechanism the Phase legend already uses elsewhere in the app.
function DashboardDonutChart({ title, data, onSelect, footer }) {
  const total = data.reduce((t, d) => t + d.count, 0);
  let acc = 0;
  const stops = [];
  data.forEach((d) => {
    if (!d.count) return;
    stops.push(`${d.color} ${(acc / total) * 360}deg ${((acc + d.count) / total) * 360}deg`);
    acc += d.count;
  });
  return (
    <div className="dashboard-chart">
      <div className="dashboard-widget-title"><span>{title}</span></div>
      <div className="dashboard-donut-wrap">
        <div
          className="dashboard-donut"
          style={{ background: total ? `conic-gradient(${stops.join(",")})` : "var(--pov-inset)" }}
          role="img"
          aria-label={title}
        />
        <div className="dashboard-donut-legend">
          {data.map((d) => (
            <button key={d.label} className="dashboard-donut-legend-row" onClick={() => onSelect(d.label)}>
              <span><span className="dashboard-bar-dot" style={{ background: d.color }} />{d.label}</span>
              <b>{d.count}</b>
            </button>
          ))}
        </div>
      </div>
      {footer && <div className="dashboard-summary-line" style={{ margin: "8px 0 0" }}>{footer}</div>}
    </div>
  );
}

function DashboardBarChart({ title, titleExtra, data, onBarClick, formatValue }) {
  const maxCount = Math.max(1, ...data.map((d) => d.count));
  const fmt = formatValue || ((n) => n);
  return (

        <div className="dashboard-widget-title">

            <div className="dashboard-bar-label"><span className="dashboard-bar-dot" style={{ background: d.color }} />{d.displayLabel || d.label}</div>
            <div className="dashboard-bar-track">
              <div className="dashboard-bar-fill" style={{ width: `${(d.count / maxCount) * 100}%`, background: d.color }} />
            </div>

          </div>
        ))}
      </div>

  );
}

// Overdue = net 30: a payment is overdue once it has been invoiced, is not
// yet paid, and more than 30 days have passed since its invoice date. The
// same rule applies to Revenue Tracker lines (see rtEvaluate).
const NET_TERMS_DAYS = 30;

// Invoice date for a calculated-billing half: the date it was marked
// Invoiced. Halves marked Invoiced before that date was recorded fall back
// to the trigger date (when the payment became billable).
function paymentInvoiceDate(half) {
  const d = half && (half.invoicedDate || half.dueDate);
  return typeof d === "string" && /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(0, 10) : null;
}

function paymentDaysPastDue(half, asOf = TODAY) {
  if (!half || half.status !== "Invoiced") return 0;
  const d = paymentInvoiceDate(half);
  if (!d) return 0;
  return Math.max(0, rtDaysBetween(d, asOf) - NET_TERMS_DAYS);
}

function isPaymentOverdue(half, asOf = TODAY) {
  return paymentDaysPastDue(half, asOf) > 0;
}

// Payment status buckets shared by the overview tiles and the Billing
// status filter: pending, invoiced, overdue, paid. "due" = anything unpaid.
function legacyHalfBucket(half) {

  if (half.status === "Complete") return "paid";
  if (half.status === "Invoiced") return "invoiced";
