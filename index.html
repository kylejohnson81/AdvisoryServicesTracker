        if (onLogged) onLogged();
      }
      setDone({ changed: activeChanges.length, fields: activeChanges.reduce((s, c) => s + c.fields.length, 0), created: newProps.map((p) => `${p.code} ${p.name}`), logError });
      setPreview(null);
    } catch (x) { setErr(x.message || String(x)); }
    setBusy(false);
  };

  const card = (title, desc, action) => (
    <div style={{ border: "1px solid var(--border, #2c4170)", borderRadius: 10, padding: 14, marginBottom: 10, display: "flex", gap: 14, alignItems: "center" }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 600, marginBottom: 3 }}>{title}</div>
        <div style={{ fontSize: 12.5, opacity: 0.8 }}>{desc}</div>
      </div>
      {action}
    </div>
  );

  const fmtV = (v) => (v === null || v === undefined || v === "") ? "(blank)" : String(v);

  return (
    <div className="modal-overlay" onClick={busy ? undefined : onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 860, width: "95vw" }}>
        <div className="modal-head">
          <div>
            {mode && <button className="btn-ghost" onClick={() => reset(null)} disabled={busy} style={{ marginBottom: 6 }}>← Back</button>}
            <h2>{mode === "contracts" ? "Refresh Contract Data" : mode === "master" ? "Refresh Master Data" : "Import / Export"}</h2>
          </div>
          <button className="icon-btn" onClick={onClose} disabled={busy}><X size={18} /></button>
        </div>

        {!mode && (
          <div style={{ marginTop: 8 }}>
            <div className="field-label">Export</div>
            {card("Master Export", "Download every property, its attributes, phases and notes history as an Excel file.",
              <button className="btn-primary" onClick={() => { onExport(); }}>Download</button>)}
            <div className="field-label" style={{ marginTop: 14 }}>Import</div>
            {card("Refresh Master Data", "Upload Greystar's Property Attributes (Master Level) export. Updates the master list and marks which Yardi codes are currently active; codes missing from the file are marked no longer in master.",
              <button className="btn-primary" onClick={() => reset("master")}>Choose</button>)}
            {card("Refresh Contract Data", "Upload the Ironclad All Status export. Updates advisory contract dates, selected services and confirmed fees.",
              <button className="btn-primary" onClick={() => reset("contracts")}>Choose</button>)}
            {card("Refresh Billing (Revenue Tracker)", `Upload the CL Advisory Services Revenue Tracker. Replaces the billing shown on the Billing and Overview pages and checks it against Advisory Contracts.${billingImport && billingImport.source_file ? ` Current: ${billingImport.source_file}${billingImport.imported_at ? `, imported ${fmtDate(billingImport.imported_at.slice(0, 10))}` : ""}.` : ""}`,
              <button className="btn-primary" onClick={() => setRevenueOpen(true)}>Choose</button>)}
          </div>
        )}
        {revenueOpen && <RevenueImportModal previous={billingImport} properties={properties} onClose={() => setRevenueOpen(false)} onSave={onSaveBillingImport} />}

        {mode && (
          <div style={{ marginTop: 8 }}>
            <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls,.csv" style={{ display: "none" }} onChange={onFile} />
            {!preview && !done && (
              <div style={{ padding: "8px 0 4px" }}>
                <p style={{ fontSize: 13, opacity: 0.85, marginTop: 0 }}>
                  {mode === "master"
                    ? "Choose Greystar's Property Attributes (Master Level) export (.xlsx). You'll see the counts before anything is saved. Only master data changes here — the daily master sync then updates tracker properties from it."
                    : "Choose the Ironclad All Status export (.xlsx or .csv). You'll see every change before anything is saved. Services are only ever turned on, never off; closed properties are skipped."}
                </p>
                <button className="btn-primary" disabled={busy} onClick={() => fileRef.current && fileRef.current.click()}>{busy ? "Reading file…" : "Choose file…"}</button>
              </div>
            )}
            {err && <div style={{ color: "#ff8f86", fontSize: 13, margin: "10px 0" }}>{err}</div>}

            {done && done.master && (
              <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>
                <div><b>Master data updated.</b> {done.saved.toLocaleString()} records saved ({done.activeAfter.toLocaleString()} active); {done.retired} marked no longer in master.</div>
                {done.impacted.length > 0 && <div>The next daily sync will flag {done.impacted.length} tracker propert{done.impacted.length === 1 ? "y" : "ies"} whose Yardi code is no longer in master.</div>}
                <div style={{ opacity: 0.8 }}>{done.logError ? `Saved, but writing the Change Log summary failed: ${done.logError}` : "A summary is in the Change Log. Tracker properties pick up the new values on the next daily sync."}</div>
                <button className="btn-ghost" style={{ marginTop: 10 }} onClick={() => reset(mode)}>Import another file</button>
              </div>
            )}
            {done && !done.master && (
              <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>
                <div><b>Applied.</b> {done.fields} change{done.fields === 1 ? "" : "s"} to {done.changed} propert{done.changed === 1 ? "y" : "ies"}.</div>
                {done.created.length > 0 && <div>Created: {done.created.join(", ")}</div>}
                <div style={{ opacity: 0.8 }}>{done.logError ? `The properties were saved, but writing to the Change Log failed: ${done.logError}` : "Every change is recorded in the Change Log."}</div>
                <button className="btn-ghost" style={{ marginTop: 10 }} onClick={() => reset(mode)}>Import another file</button>
              </div>
            )}

            {preview && preview.kind === "master" && (
              <div>
                <div style={{ fontSize: 13, opacity: 0.85, marginBottom: 10 }}>{preview.fileName} · tab "{preview.sheetName}" · {preview.records.length.toLocaleString()} rows</div>
                {preview.missing.length > 0 && <div style={{ color: "#ffd98a", fontSize: 13, marginBottom: 8 }}>Columns not found (those fields are left blank): {preview.missing.join(", ")}</div>}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 8, marginBottom: 12 }}>
                  {[["Active after", preview.activeAfter.toLocaleString(), `now ${preview.activeBefore.toLocaleString()}`], ["New", preview.created.length], ["Updated", preview.updated.length], ["Unchanged", preview.unchanged.toLocaleString()], ["No longer in master", preview.retired.length], ["Reactivated", preview.reactivated.length]]
                    .map(([k, v, sub]) => (
                      <div key={k} style={{ border: "1px solid var(--border, #2c4170)", borderRadius: 8, padding: "8px 10px" }}>
                        <div style={{ fontSize: 20, fontWeight: 700 }}>{v}</div><div style={{ fontSize: 12, opacity: 0.8 }}>{k}</div>{sub && <div style={{ fontSize: 11, opacity: 0.6 }}>{sub}</div>}
                      </div>
                    ))}
                </div>
                {preview.suspicious && <div style={{ color: "#ff8f86", fontSize: 13, marginBottom: 10 }}>This file has far fewer active properties than master data does now. Make sure it's the full export, not a filtered one, before applying.</div>}
                {Object.keys(preview.fieldCounts).length > 0 && (
                  <div style={{ fontSize: 12.5, marginBottom: 10 }}>Fields changing: {Object.entries(preview.fieldCounts).sort((a, b) => b[1] - a[1]).map(([f, n]) => `${IE_MD_LABEL[f] || f} (${n})`).join(", ")}</div>
                )}
                {preview.impacted.length > 0 && (
                  <div style={{ border: "1px solid #6e2a28", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, marginBottom: 10 }}>
                    <b>{preview.impacted.length} open tracker propert{preview.impacted.length === 1 ? "y uses a Yardi code" : "ies use Yardi codes"} leaving master</b> — the daily sync will flag {preview.impacted.length === 1 ? "it" : "them"} in the Change Log:
                    <div style={{ marginTop: 4 }}>{preview.impacted.map((p) => `${p.code} ${p.name} (${p.yardi})`).join("; ")}</div>
                  </div>
                )}
                {[["New in master", preview.created.map((r) => `${r.yardi_code} · ${r.name || ""}${r.city ? `, ${r.city}` : ""}${r.state ? ` ${r.state}` : ""}`)],
                  ["No longer in master", preview.retired.map((m) => `${m.yardi_code} · ${m.name || ""}${m.city ? `, ${m.city}` : ""}${m.state ? ` ${m.state}` : ""}`)],
                  ["Updated", preview.updated.map(({ r, diffs }) => `${r.yardi_code} · ${r.name || ""} — ${diffs.length ? diffs.map((f) => IE_MD_LABEL[f] || f).join(", ") : "status"}`)]]
                  .filter(([, list]) => list.length).map(([title, list]) => (
                    <details key={title} style={{ fontSize: 12.5, marginBottom: 6 }}>
                      <summary style={{ cursor: "pointer" }}>{title} ({list.length})</summary>
                      <div style={{ maxHeight: "22vh", overflowY: "auto", margin: "4px 0 0 14px" }}>{list.slice(0, 500).map((x, i) => <div key={i}>{x}</div>)}{list.length > 500 && <div>…and {list.length - 500} more</div>}</div>
                    </details>
                  ))}
                {preview.flags.length > 0 && (
                  <details style={{ fontSize: 12.5, marginBottom: 6 }}>
                    <summary style={{ cursor: "pointer" }}>{preview.flags.length} note{preview.flags.length === 1 ? "" : "s"}</summary>
                    <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>{preview.flags.map((f, i) => <li key={i}>{f}</li>)}</ul>
                  </details>
                )}
                <div className="modal-actions" style={{ marginTop: 14 }}>
                  <button className="btn-ghost" disabled={busy} onClick={() => reset(mode)}>Cancel</button>
                  <button className="btn-primary" disabled={busy || (!preview.created.length && !preview.updated.length && !preview.retired.length)} onClick={applyMaster}>{busy ? "Saving…" : "Apply to master data"}</button>
                </div>
              </div>
            )}

            {preview && preview.kind !== "master" && (
              <div>
                <div style={{ fontSize: 13, opacity: 0.85, marginBottom: 10 }}>
                  {preview.fileName} ·{" "}
                  <b>{activeChanges.length}</b> propert{activeChanges.length === 1 ? "y" : "ies"} to update · {preview.creates.length} not in the tracker
                </div>
                <div style={{ maxHeight: "48vh", overflowY: "auto", border: "1px solid var(--border, #2c4170)", borderRadius: 8 }}>
                  {preview.changes.length === 0 && <div style={{ padding: 12, fontSize: 13, opacity: 0.8 }}>Everything already matches this file — no updates.</div>}
                  {preview.changes.map((c) => {
                    const fields = c.fields;
                    if (!fields.length) return null;
                    return (
                      <div key={c.id} style={{ padding: "8px 12px", borderBottom: "1px solid var(--border, #2c4170)", opacity: skip[c.id] ? 0.45 : 1 }}>
                        <label style={{ display: "flex", gap: 8, alignItems: "center", fontWeight: 600, fontSize: 13.5 }}>
                          <input type="checkbox" checked={!skip[c.id]} onChange={(e) => setSkip((s) => ({ ...s, [c.id]: !e.target.checked }))} />
                          <span className="mono">{c.code}</span> {c.name}
                        </label>
                        <div style={{ marginLeft: 26, fontSize: 12.5 }}>
                          {fields.map((f) => <div key={f.field}>{f.field}: <span style={{ opacity: 0.65, textDecoration: "line-through" }}>{fmtV(f.oldv)}</span> → <b>{fmtV(f.newv)}</b></div>)}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {preview.creates.length > 0 && (
                  <div style={{ marginTop: 12 }}>
                    <div className="field-label">Not in the tracker — tick any you want created</div>
                    <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 6 }}>Names are matched exactly. Rows that look like an existing property (similar name and same client, same address or same Yardi code) are marked — check them before creating.</div>
                    <div style={{ maxHeight: "22vh", overflowY: "auto", border: "1px solid var(--border, #2c4170)", borderRadius: 8 }}>
                      {preview.creates.map((c, i) => (
                        <label key={i} style={{ display: "flex", gap: 8, alignItems: "center", padding: "6px 12px", fontSize: 13, borderBottom: "1px solid var(--border, #2c4170)" }}>
                          <input type="checkbox" checked={!!createOn[i]} onChange={(e) => setCreateOn((s) => ({ ...s, [i]: e.target.checked }))} />
                          <b>{c.name}</b>
                          <span style={{ opacity: 0.75 }}>
                            {[c.attrs && c.attrs.Client && c.attrs.Client !== "—" ? c.attrs.Client : null, c.attrs && c.attrs.City, c.attrs && c.attrs.State, c.attrs && c.attrs.Units ? `${c.attrs.Units} units` : null,
                              c.advisoryContractExecuted ? `executed ${c.advisoryContractExecuted}` : c.advisoryContractDrafted ? `drafted ${c.advisoryContractDrafted}` : null]
                              .filter(Boolean).join(" · ")}
                          </span>
                          {(() => {
                            const dm = dupMatchesFor(c, properties)[0];
                            return dm ? (
                              <span title={dm.reasons.join("; ")} style={{ marginLeft: "auto", fontSize: 12, fontWeight: 600, color: "#ffd98a", background: "rgba(90,74,26,0.6)", borderRadius: 99, padding: "2px 9px", whiteSpace: "nowrap" }}>
                                May duplicate {dm.property.code} {dm.property.name} ({dupConfidence(dm.score)})
                              </span>
                            ) : null;
                          })()}
                        </label>
                      ))}
                    </div>
                  </div>
                )}

                {preview.flags.length > 0 && (
                  <details style={{ marginTop: 12, fontSize: 12.5 }}>
                    <summary style={{ cursor: "pointer" }}>{preview.flags.length} note{preview.flags.length === 1 ? "" : "s"} from the import</summary>
                    <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>{preview.flags.map((f, i) => <li key={i} style={{ marginBottom: 3 }}>{f}</li>)}</ul>
                  </details>
                )}

                <div className="modal-actions" style={{ marginTop: 14 }}>
                  <button className="btn-ghost" disabled={busy} onClick={() => reset(mode)}>Cancel</button>
                  <button className="btn-primary" disabled={busy || (activeChanges.length === 0 && chosenCreates.length === 0)} onClick={apply}>
                    {busy ? "Applying…" : `Apply ${activeChanges.length} update${activeChanges.length === 1 ? "" : "s"}${chosenCreates.length ? ` + ${chosenCreates.length} new` : ""}`}
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function AdvisoryContractsView({ properties, onOpenProperty, supabaseClient, billingImport }) {
  // Revenue Tracker billing for each property, plus the contract checks.
  const billingByProp = useMemo(() => {
    const m = new Map();
    if (!billingImport || !Array.isArray(billingImport.records)) return m;
    const ev = billingImport.records.map((r) => rtEvaluate(r, TODAY, billingImport.settings));
    const match = rtPropertyMatcher(properties);
    // Billed/paid only count lines Advisory Contracts covers; the checks below still see every line.
    rtSplitByContract(ev, properties).contracted.forEach((r) => { const p = match(r); if (!p) return; if (!m.has(p.id)) m.set(p.id, { billed: 0, paid: 0, checks: [] }); const e = m.get(p.id); e.billed += r.invoiced; e.paid += r.paid; });
    rtContractChecks(ev, properties).forEach((c) => { if (!c.property) return; if (!m.has(c.property.id)) m.set(c.property.id, { billed: 0, paid: 0, checks: [] }); m.get(c.property.id).checks.push(c); });
    return m;
  }, [billingImport, properties]);
  const [tab, setTab] = useState("executed");
  const [search, setSearch] = useState("");
  const [openErr, setOpenErr] = useState(null);

  const rows = useMemo(() => properties
    .filter((p) => p.program && (p.program.advisoryContractExecuted || p.program.advisoryContractDrafted))
    .map((p) => {
      const a = p.program.attributes || {};
      const closed = p.program.manualStatus === "Closed";
      const executed = p.program.advisoryContractExecuted || null;
      const cs = p.program.contractStatus && typeof p.program.contractStatus === "object" ? p.program.contractStatus : null;
      let status; let statusFull = "";
      if (closed) status = "Closed";
      else if (cs && cs.status) { statusFull = cs.status; status = /pending/i.test(cs.status) ? "Pending execution" : cs.status; }
      else { try { status = currentPhaseGroupLabel(p); } catch (e) { status = ""; } }
      const units = contractUnitsOf(p) || null;
      return {
        p, closed, executed, drafted: p.program.advisoryContractDrafted || null,
        client: a.Client || "", units, type: a["Project Type"] || "Retrofit",
        services: AC_SERVICES.filter(([k]) => (p.program.selectedOptions || {})[k]).map(([, l, short]) => ({ l, short, draft: !executed })),
        fees: acOneTimeFees(p), status, statusFull,
        contractPath: p.program.contractPath || null, contractLink: p.program.contractLink || null,
      };
    }), [properties]);

  const executedRows = rows.filter((r) => r.executed);
  const draftedRows = rows.filter((r) => !r.executed && !r.closed);
  const scoped = tab === "executed" ? executedRows : tab === "drafted" ? draftedRows : rows;
  const q = search.trim().toLowerCase();
  const shown = scoped
    .filter((r) => !q || `${r.p.code} ${r.p.name} ${r.client} ${r.services.map((x) => x.l).join(" ")} ${r.status}`.toLowerCase().includes(q))
    .sort((x, y) => (y.executed || y.drafted || "").localeCompare(x.executed || x.drafted || "") || x.p.code.localeCompare(y.p.code));

  const money = (n) => `$${Math.round(n || 0).toLocaleString()}`;
  const unitsUnder = executedRows.reduce((s, r) => s + (r.units || 0), 0);
  const feesExecuted = executedRows.reduce((s, r) => s + (r.fees || 0), 0);
  const feesDrafted = draftedRows.reduce((s, r) => s + (r.fees || 0), 0);

  const openContract = async (r) => {
    setOpenErr(null);
    if (r.contractLink) { window.open(r.contractLink, "_blank", "noopener"); return; }
    if (!supabaseClient || !r.contractPath) return;
    const win = window.open("", "_blank");
    const { data, error } = await supabaseClient.storage.from("contract-documents").createSignedUrl(r.contractPath, 300);
    if (error || !data || !data.signedUrl) {
      if (win) win.close();
      setOpenErr(`Couldn't open the contract for ${r.p.name}: ${error ? error.message : "no link returned"}`);
      return;
    }
    if (win) win.location.href = data.signedUrl; else window.open(data.signedUrl, "_blank", "noopener");
  };

  return (
    <div className="proto-dash">
      <div className="wrap" style={{ maxWidth: "none" }}>
        <h1>Advisory Contracts</h1>
        <p className="sub">Every Advisory Services contract — executed, plus drafts awaiting execution. Closed properties stay on the list. Select a property to open it.</p>

        <div className="kpis">
          <div className="kpi"><div className="v">{executedRows.length}</div><div className="k">Executed contracts</div></div>
          <div className="kpi"><div className="v">{unitsUnder.toLocaleString()}</div><div className="k">Units under contract</div></div>
          <div className="kpi"><div className="v c-g">{money(feesExecuted)}</div><div className="k">One-time fees contracted</div></div>
          <div className="kpi"><div className="v c-a">{draftedRows.length}</div><div className="k">Drafted, awaiting execution</div><div className="n">{money(feesDrafted)} in one-time fees</div></div>
        </div>

        <div className="tabs" role="tablist">
          <button className={tab === "executed" ? "on" : ""} onClick={() => setTab("executed")}>Executed ({executedRows.length})</button>
          <button className={tab === "drafted" ? "on" : ""} onClick={() => setTab("drafted")}>Drafted ({draftedRows.length})</button>
          <button className={tab === "all" ? "on" : ""} onClick={() => setTab("all")}>All ({rows.length})</button>
        </div>

        <div className="toolbar">
          <input type="text" placeholder="Search by property, client or service" value={search} onChange={(e) => setSearch(e.target.value)} style={{ minWidth: 280 }} aria-label="Search advisory contracts" />
        </div>
        {openErr && <div className="banner" style={{ color: "#ffc7c1" }}>{openErr}</div>}

        <div className="tw ac-table">
          <table>
            <thead><tr>
              <th>Property</th><th>Client</th><th className="r">Units</th><th>Type</th><th>Services</th>
              <th>Drafted</th><th>Executed</th><th className="r">One-time fees</th>{billingImport && <th className="r">Billed (Revenue Tracker)</th>}<th>Status</th><th>Contract</th>
            </tr></thead>
            <tbody>
              {shown.length === 0 ? (
                <tr><td colSpan={billingImport ? 11 : 10} style={{ color: "var(--mut)" }}>No contracts match.</td></tr>
              ) : shown.map((r) => (
                <tr key={r.p.id} className="click" onClick={() => onOpenProperty(r.p)} style={{ cursor: "pointer", opacity: r.closed ? 0.65 : 1, whiteSpace: "nowrap" }}>
                  <td title={`${r.p.code} ${r.p.name}`} style={{ maxWidth: "clamp(200px, 16vw, 420px)", overflow: "hidden", textOverflow: "ellipsis" }}><span className="id">{r.p.code}</span> {r.p.name}</td>
                  <td title={r.client} style={{ maxWidth: "clamp(110px, 10vw, 260px)", overflow: "hidden", textOverflow: "ellipsis" }}>{r.client || "—"}</td>
                  <td className="r">{r.units ? r.units.toLocaleString() : "—"}</td>
                  <td>{r.type}</td>
                  <td>{r.services.length ? <div style={{ display: "flex", flexWrap: "nowrap", gap: 4 }}>{r.services.map((s) => <span key={s.l} className="t-chip" title={s.draft ? `${s.l} — in draft, not executed` : s.l} style={s.draft ? { background: "transparent", border: "1px dashed #A78BFA", color: "#c9bdfc" } : undefined}>{s.short}</span>)}</div> : <span style={{ color: "var(--mut)" }}>None selected</span>}</td>
                  <td style={{ whiteSpace: "nowrap" }}>{r.drafted ? fmtDate(r.drafted) : "—"}</td>
                  <td style={{ whiteSpace: "nowrap" }}>{r.executed ? fmtDate(r.executed) : <span className="pill s-atrisk">Not yet</span>}</td>
                  <td className="r">{r.fees == null ? "—" : money(r.fees)}</td>
                  {billingImport && (() => {
                    const b = billingByProp.get(r.p.id);
                    const worst = b && b.checks.length ? b.checks.reduce((w, c) => ({ error: 0, warn: 1, info: 2 }[c.sev] < { error: 0, warn: 1, info: 2 }[w] ? c.sev : w), "info") : null;
                    return (
                      <td className="r" title={b && b.checks.length ? b.checks.map((c) => `${c.title}: ${c.detail}`).join("\n") : b ? `Paid ${money(b.paid)}` : "Not in the Revenue Tracker"}>
                        {b && b.billed ? money(b.billed) : <span style={{ color: "var(--mut)" }}>—</span>}
                        {worst && <span className="pill" style={{ marginLeft: 6, background: RT_SEV_STYLE[worst].bg, color: RT_SEV_STYLE[worst].color }}>{b.checks.length} {b.checks.length === 1 ? "check" : "checks"}</span>}
                      </td>
                    );
                  })()}
                  <td>{r.closed ? <span className="pill p-Overdue">Closed</span>
                    : <span title={r.statusFull || r.status}><span className="dot" style={{ background: colorForPhaseLabel(r.status) }} />{r.status || "—"}</span>}</td>
                  <td>{(r.contractPath || r.contractLink)
                    ? <button className="link" onClick={(e) => { e.stopPropagation(); openContract(r); }}>View PDF</button>
                    : <span style={{ color: "var(--mut)" }}>—</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="foot">One-time fees cover Due Diligence, RFP / Incumbent Negotiation and Program Design, calculated the same way as Billing (confirmed Ironclad fees first, otherwise the standard rate). Deployment's monthly fee isn't included.</p>
      </div>
    </div>
  );
}

function ChangeLogView({ rows, loading, error, onRefresh, properties, setProperties, supabaseClient, userEmail, onOpenProperty, toggleTodoFor, setRows }) {
  const [filter, setFilter] = useState("decisions");
  const [showReviewed, setShowReviewed] = useState(false);
  const [q, setQ] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [msg, setMsg] = useState(null);
  const [masterCache, setMasterCache] = useState({});

  const byCode = useMemo(() => {
    const m = {};
    properties.forEach((p) => { m[p.code] = p; });
    return m;
  }, [properties]);
  const me = userEmail || "unknown";

  const shown = useMemo(() => {
    const qq = clNorm(q);
    return rows.filter((r) => {
      if (filter === "decisions" && !clIsDecision(r)) return false;
      if (filter === "updates" && clIsDecision(r)) return false;
      if (!showReviewed && r.reviewed) return false;
      if (qq) {
        const p = byCode[r.property_code];
        const hay = `${r.property_code} ${r.property_name || ""} ${p ? p.name : ""} ${r.field || ""} ${r.reason || ""} ${r.old_value || ""} ${r.new_value || ""}`.toLowerCase();
        if (!hay.includes(qq)) return false;
      }
      return true;
    });
  }, [rows, filter, showReviewed, q, byCode]);

  const openDecisions = rows.filter((r) => clIsDecision(r) && !r.reviewed).length;
  const openUpdates = rows.filter((r) => !clIsDecision(r) && !r.reviewed).length;

  const grouped = useMemo(() => {
    const g = [];
    shown.forEach((r) => {
      const d = r.run_date || (r.run_at || "").slice(0, 10);
      const last = g[g.length - 1];
      if (last && last.date === d) last.rows.push(r); else g.push({ date: d, rows: [r] });
    });
    return g;
  }, [shown]);

  // Loads candidate master records for Location flags (labels + link data).
  useEffect(() => {
    if (!supabaseClient) return;
    const need = new Set();
    shown.forEach((r) => {
      if (r.action === "flag" && r.field === "Location" && !r.reviewed && r.details && Array.isArray(r.details.candidates)) {
        r.details.candidates.forEach((c) => { if (c && !(c in masterCache)) need.add(c); });
      }
    });
    if (need.size === 0) return;
    const codes = [...need];
    supabaseClient.from("master_properties").select("yardi_code,name,address,city,state,zip,units,region,office,rpm,rpm_email,cm,client,is_active").in("yardi_code", codes).then(({ data }) => {
      const next = { ...masterCache };
      codes.forEach((c) => { next[c] = null; });
      (data || []).forEach((m) => { if (m.is_active) next[m.yardi_code] = m; });
      setMasterCache(next);
    });
  }, [shown, supabaseClient]); // eslint-disable-line

  // ---- persistence helpers ----
  const now = () => new Date().toISOString();
  const patchRow = async (id, patch) => {
    const { error: e } = await supabaseClient.from("master_sync_log").update(patch).eq("id", id);
    if (e) throw new Error(e.message);
    setRows((prev) => prev.map((r) => r.id === id ? { ...r, ...patch } : r));
  };
  const logRows = async (list) => {
    if (!list.length) return;
    const stamped = list.map((x) => ({ source: "Change Log", reviewed: true, reviewed_by: me, reviewed_at: now(), ...x }));
    const { data, error: e } = await supabaseClient.from("master_sync_log").insert(stamped).select();
    if (e) throw new Error(e.message);
    if (data) setRows((prev) => [...data, ...prev]);
  };
  const updateProgram = (code, fn) => {
    setProperties((prev) => prev.map((p) => p.code !== code ? p : { ...p, ...fn(p) }));
  };
  const run = async (row, fn) => {
    setBusyId(row.id); setMsg(null);
    try { await fn(); }
    catch (e) { setMsg({ id: row.id, text: `Couldn't save: ${e.message}. You may not have write access.` }); }
    setBusyId(null);
  };

  // Snapshot of the attribute keys (plus name / status) an action is about to change.
  const snapshot = (p, keys, extra = {}) => {
    const a = p.program.attributes || {};
    const before = {};
    keys.forEach((k) => { before[k] = k in a ? a[k] : null; });
    return { kind: "program", code: p.code, name: p.name, manualStatus: p.program.manualStatus ?? null, attributes: before, ...extra };
  };
  const closeNote = (p, text) => {
    const log = Array.isArray(p.program.notesLog) ? p.program.notesLog : [];
    const stamp = TODAY.replace(/-/g, "");
    let key = `${p.code}|CL${stamp}`; let n = 2;
    const keys = new Set(log.map((x) => x && x.key));
    while (keys.has(key)) key = `${p.code}|CL${stamp}-${n++}`;
    let phase = ""; try { phase = currentPhaseGroupLabel(p) || ""; } catch (e) { phase = ""; }
    const entry = log.reduce((m, x) => Math.max(m, Number(x && x.entry) || 0), 0) + 1;
    return { key, date: TODAY, note: `${p.name}: ${text}`, entry, phase, source: "Change Log", editedBy: me };
  };

  // ---- decisions ----
  const markReviewed = (row, result) => run(row, () => patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), ...(result ? { apply_result: result } : {}) }));
  const reopen = (row) => run(row, () => patchRow(row.id, { reviewed: false, reviewed_by: null, reviewed_at: null }));

  const setAttr = (row, key, value, label) => run(row, async () => {
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    const old = (p.program.attributes || {})[key] ?? null;
    const undo = { ...snapshot(p, [key]), message: `${key}: ${old || "(blank)"} → ${value}` };
    updateProgram(p.code, (pp) => ({ program: { ...pp.program, attributes: { ...(pp.program.attributes || {}), [key]: value } } }));
    await logRows([{ property_code: p.code, property_name: p.name, action: "update", field: key, old_value: old, new_value: value, reason: `${label} (from the ${row.field} flag in the Change Log)` }]);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: label, undo });
  });

  const closeProperty = (row, why) => run(row, async () => {
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    const note = closeNote(p, `Closed from the Change Log — ${why}`);
    const undo = { ...snapshot(p, []), removeNoteKey: note.key, message: "Closed the property" };
    const prevStatus = computeStatus(p);
    updateProgram(p.code, (pp) => ({ program: { ...pp.program, manualStatus: "Closed", notesLog: [...(Array.isArray(pp.program.notesLog) ? pp.program.notesLog : []), note] } }));
    await logRows([{ property_code: p.code, property_name: p.name, action: "info", field: "Status", old_value: prevStatus, new_value: "Closed", reason: `Closed from the Change Log — ${why}` }]);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "Closed property", undo });
  });

  const linkMaster = (row, yardi) => run(row, async () => {
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    let m = masterCache[yardi];
    if (!m) {
      const { data, error: e } = await supabaseClient.from("master_properties").select("*").eq("yardi_code", yardi).eq("is_active", true).maybeSingle();
      if (e) throw new Error(e.message);
      m = data;
    }
    if (!m) throw new Error(`${yardi} is no longer a current master record`);
    const a = p.program.attributes || {};
    const keys = [...CL_MASTER_FIELDS.map(([k]) => k), "Master Status", "Source of Record"];
    const undo = { ...snapshot(p, keys), message: `Linked to ${yardi}` };
    const next = {}; const logs = [];
    CL_MASTER_FIELDS.forEach(([k, col]) => {
      const v = m[col]; if (v === null || v === undefined || v === "") return;
      const sv = col === "units" ? Number(v) : String(v);
      if (String(a[k] ?? "").trim() !== String(sv).trim()) logs.push({ property_code: p.code, property_name: p.name, action: "update", field: k, old_value: a[k] == null ? null : String(a[k]), new_value: String(sv), reason: `Linked to master ${yardi} from the Change Log` });
      next[k] = sv;
    });
    const newName = m.name || p.name;
    if (newName !== p.name) logs.push({ property_code: p.code, property_name: p.name, action: "update", field: "Name", old_value: p.name, new_value: newName, reason: `Linked to master ${yardi} from the Change Log` });
    updateProgram(p.code, (pp) => ({ name: newName, program: { ...pp.program, attributes: { ...(pp.program.attributes || {}), ...next, "Master Status": "Linked", "Source of Record": "Master" } } }));
    await logRows(logs);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: `Linked to ${yardi}`, undo });
  });

  // Clears a wrong/retired Yardi code so the daily sync treats the property
  // as not in master instead of flagging the same code again tomorrow.
  const markNotInMaster = (row) => run(row, async () => {
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    const a = p.program.attributes || {};
    const undo = { ...snapshot(p, ["Yardi Code", "Master Status", "Source of Record"]), message: "Marked not in master" };
    const src = (a["Source of Record"] || "") === "" || a["Source of Record"] === "Master" ? "Manual" : a["Source of Record"];
    updateProgram(p.code, (pp) => ({ program: { ...pp.program, attributes: { ...(pp.program.attributes || {}), "Yardi Code": "", "Master Status": "Not in master", "Source of Record": src } } }));
    const logs = [{ property_code: p.code, property_name: p.name, action: "info", field: "Master Status", old_value: a["Master Status"] || null, new_value: "Not in master", reason: "Marked not in master from the Change Log" }];
    if (a["Yardi Code"]) logs.unshift({ property_code: p.code, property_name: p.name, action: "update", field: "Yardi Code", old_value: a["Yardi Code"], new_value: "", reason: "Yardi code cleared — not this property in master (Change Log)" });
    await logRows(logs);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "Not in master", undo });
  });

  const applyBall = (row) => run(row, async () => {
    const p = byCode[row.property_code];
    const ev = clEvaluateBall(row, p);
    if (ev.kind === "missing") throw new Error(ev.message);
    if (ev.kind === "noop") { await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "noop", undo: { message: ev.message } }); return; }
    const { cur, to } = ev;
    const stored = (p.program.phaseData || {})[cur.storageKey];
    const before = cur.todo;
    const after = ev.kind === "swap"
      ? { ...before, responsible: before.toggleWith, toggleWith: before.responsible || "Advisory Services", rounds: (before.rounds || 0) + 1 }
      : { ...before, responsible: to };
    const undo = { idx: cur.idx, storageKey: cur.storageKey, todoText: before.text, hadStored: !!stored, todoBefore: before, patchBefore: {}, phaseBefore: { done: stored ? !!stored.done : false, completedDate: stored ? (stored.completedDate || null) : null },
      message: `"${before.text}" ${ev.kind === "swap" ? "swapped" : "reassigned"} ${before.responsible || "Advisory Services"} → ${after.responsible} (approved in Change Log).` };
    updateProgram(p.code, (pp) => {
      const st = pp.program.phaseData[cur.storageKey] || { done: false, todos: cur.todos };
      return { program: { ...pp.program, phaseData: { ...pp.program.phaseData, [cur.storageKey]: { ...st, todos: st.todos.map((t, i) => i === cur.idx ? after : t) } } } };
    });
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "applied", undo });
  });

  const [todoPick, setTodoPick] = useState({}); // row id -> "storageKey|idx" chosen by hand
  const pickedTodo = (row, p) => {
    const k = todoPick[row.id];
    if (k) { const [sk, i] = k.split("|"); return clAllTodos(p).find((c) => c.storageKey === sk && c.idx === Number(i)) || null; }
    return clFindTodo(row, p);
  };
  const applyTodoDone = (row) => run(row, async () => {
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    const f = pickedTodo(row, p); if (!f) throw new Error("choose the to-do first");
    if (f.todo.done) { await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "noop", undo: { message: `"${f.todo.text}" was already done.` } }); return; }
    const stored = (p.program.phaseData || {})[f.storageKey];
    const patchBefore = {}; CL_PATCH_KEYS.forEach((k) => { patchBefore[k] = p.program[k] ?? null; });
    const undo = { idx: f.idx, storageKey: f.storageKey, todoText: f.todo.text, hadStored: !!stored, todoBefore: f.todo, patchBefore, phaseBefore: { done: stored ? !!stored.done : false, completedDate: stored ? (stored.completedDate || null) : null }, message: `Marked "${f.todo.text}" done (approved in Change Log).` };
    toggleTodoFor(p.id, f.phaseKey, f.idx);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: "applied", undo });
  });

  // Duplicate flag: merge "other" into "keep" — fill keep's blank attributes and
  // missing contract fields from other, copy other's notes across, close other.
  const MERGE_PROGRAM_KEYS = ["advisoryContractDrafted", "advisoryContractExecuted", "contractPath", "contractLink", "contractStatus", "selectedOptions", "confirmedFees", "serviceContractDates", "ddContractExecuted", "prospectStart"];
  const mergeDuplicate = (row, keepCode, otherCode) => run(row, async () => {
    const K = byCode[keepCode], O = byCode[otherCode];
    if (!K || !O) throw new Error("one of the properties isn't in the tracker");
    const ka = K.program.attributes || {}, oa = O.program.attributes || {};
    const blank = (v) => v === null || v === undefined || String(v).trim() === "" || String(v).trim() === "—";
    const attrsAdd = {}; const logs = [];
    Object.entries(oa).forEach(([k, v]) => {
      if (blank(v) || !blank(ka[k])) return;
      if (k === "Master Status" || k === "Source of Record") return;
      const val = k === "Zip" && /^\d{4}$/.test(String(v)) ? `0${v}` : v;
      attrsAdd[k] = val;
      logs.push({ property_code: K.code, property_name: K.name, action: "update", field: k, old_value: null, new_value: String(val), reason: `Merged from duplicate ${O.code} ${O.name} (Change Log)` });
    });
    const progAdd = {};
    const hasContract = (p) => p.program.advisoryContractDrafted || p.program.advisoryContractExecuted;
    if (!hasContract(K) && hasContract(O)) {
      MERGE_PROGRAM_KEYS.forEach((k) => { if (O.program[k] !== undefined && O.program[k] !== null) progAdd[k] = O.program[k]; });
      logs.push({ property_code: K.code, property_name: K.name, action: "update", field: "Advisory contract", old_value: null, new_value: O.program.advisoryContractExecuted ? `executed ${O.program.advisoryContractExecuted}` : `drafted ${O.program.advisoryContractDrafted}`, reason: `Contract dates and services copied from duplicate ${O.code} (Change Log)` });
    }
    const oNotes = Array.isArray(O.program.notesLog) ? O.program.notesLog.filter((n) => n && typeof n === "object") : [];
    const kNotes = Array.isArray(K.program.notesLog) ? K.program.notesLog : [];
    let entry = kNotes.reduce((m, x) => Math.max(m, Number(x && x.entry) || 0), 0);
    const movedNotes = oNotes.map((n, i) => ({ ...n, key: `${K.code}|M${O.code.replace(/\D/g, "")}-${n.key || i}`, entry: ++entry, mergedFrom: O.code }));
    const keepNote = closeNote(K, `Merged duplicate ${O.code} ${O.name} into this property${Object.keys(attrsAdd).length ? ` (added ${Object.keys(attrsAdd).join(", ")})` : ""}${movedNotes.length ? `; ${movedNotes.length} note${movedNotes.length === 1 ? "" : "s"} copied across` : ""}.`);
    const otherNote = closeNote(O, `Closed as a duplicate of ${K.code} ${K.name}; its details and notes were merged there.`);
    const undo = {
      kind: "merge", message: `Merge of ${O.code} into ${K.code}`,
      keep: { code: K.code, attributes: { ...ka }, program: Object.fromEntries(Object.keys(progAdd).map((k) => [k, K.program[k] === undefined ? null : K.program[k]])), addedNoteKeys: [...movedNotes.map((n) => n.key), keepNote.key] },
      other: { code: O.code, manualStatus: O.program.manualStatus ?? null, removeNoteKey: otherNote.key },
    };
    const prevStatus = computeStatus(O);
    updateProgram(K.code, (pp) => ({ program: { ...pp.program, ...progAdd, attributes: { ...(pp.program.attributes || {}), ...attrsAdd }, notesLog: [...(Array.isArray(pp.program.notesLog) ? pp.program.notesLog : []), ...movedNotes, keepNote] } }));
    updateProgram(O.code, (pp) => ({ program: { ...pp.program, manualStatus: "Closed", closedReason: `Duplicate of ${K.code}`, notesLog: [...(Array.isArray(pp.program.notesLog) ? pp.program.notesLog : []), otherNote] } }));
    logs.push({ property_code: O.code, property_name: O.name, action: "info", field: "Status", old_value: prevStatus, new_value: "Closed", reason: `Closed as a duplicate of ${K.code} ${K.name} (Change Log)` });
    await logRows(logs);
    await patchRow(row.id, { reviewed: true, reviewed_by: me, reviewed_at: now(), applied_at: now(), applied_by: me, apply_result: `Merged ${O.code} into ${K.code}`, undo });
  });

  const canUndo = (r) => r.undo && r.apply_result !== "undone" && (r.undo.kind === "program" || r.undo.kind === "merge" || (r.undo.storageKey && r.undo.idx !== undefined && r.undo.todoBefore));
  const undoRow = (row) => run(row, async () => {
    const u = row.undo || {};
    if (u.kind === "merge") {
      const K = byCode[u.keep.code], O = byCode[u.other.code];
      if (!K || !O) throw new Error("one of the merged properties is missing");
      updateProgram(K.code, (pp) => ({ program: { ...pp.program, ...Object.fromEntries(Object.entries(u.keep.program || {}).map(([k, v]) => [k, v])), attributes: { ...(u.keep.attributes || {}) }, notesLog: (Array.isArray(pp.program.notesLog) ? pp.program.notesLog : []).filter((n) => !(n && (u.keep.addedNoteKeys || []).includes(n.key))) } }));
      updateProgram(O.code, (pp) => { const prog = { ...pp.program, manualStatus: u.other.manualStatus, notesLog: (Array.isArray(pp.program.notesLog) ? pp.program.notesLog : []).filter((n) => !(n && n.key === u.other.removeNoteKey)) }; delete prog.closedReason; return { program: prog }; });
      await logRows([{ property_code: K.code, property_name: K.name, action: "info", field: "Duplicate", old_value: row.apply_result, new_value: "undone", reason: `Undone from the Change Log: ${u.message}; ${O.code} reopened` }]);
      await patchRow(row.id, { reviewed: false, reviewed_by: null, reviewed_at: null, apply_result: "undone" });
      return;
    }
    const p = byCode[row.property_code]; if (!p) throw new Error("property not found");
    if (u.kind === "program") {
      updateProgram(p.code, (pp) => {
        const attrs = { ...(pp.program.attributes || {}) };
        Object.entries(u.attributes || {}).forEach(([k, v]) => { if (v === null) delete attrs[k]; else attrs[k] = v; });
        let notesLog = pp.program.notesLog;
        if (u.removeNoteKey && Array.isArray(notesLog)) notesLog = notesLog.filter((n) => !(n && n.key === u.removeNoteKey));
        return { name: u.name || pp.name, program: { ...pp.program, attributes: attrs, manualStatus: u.manualStatus ?? null, ...(notesLog !== pp.program.notesLog ? { notesLog } : {}) } };
      });
    } else {
      const st = (p.program.phaseData || {})[u.storageKey];
      const todos = st ? st.todos : null;
      if (todos && (!todos[u.idx] || todos[u.idx].text !== u.todoText)) throw new Error("that to-do has changed since, so it can't be undone automatically");
      updateProgram(p.code, (pp) => {
        const cur = pp.program.phaseData[u.storageKey] || { done: false, todos: [] };
        const restored = { ...cur, ...(u.phaseBefore || {}), todos: (cur.todos || []).map((t, i) => i === u.idx ? u.todoBefore : t) };
        return { program: { ...pp.program, ...(u.patchBefore || {}), phaseData: { ...pp.program.phaseData, [u.storageKey]: restored } } };
      });
    }
    await logRows([{ property_code: p.code, property_name: p.name, action: "info", field: row.field, old_value: row.apply_result, new_value: "undone", reason: `Undone from the Change Log: ${u.message || row.apply_result}` }]);
    await patchRow(row.id, { reviewed: false, reviewed_by: null, reviewed_at: null, apply_result: "undone" });
  });

  const reviewAllShownUpdates = async () => {
    const ids = shown.filter((r) => !clIsDecision(r) && !r.reviewed).map((r) => r.id);
    if (!ids.length) return;
    if (!window.confirm(`Mark ${ids.length} update${ids.length === 1 ? "" : "s"} as reviewed?`)) return;
    setBusyId("bulk"); setMsg(null);
    const stamp = { reviewed: true, reviewed_by: me, reviewed_at: now() };
    const { error: e } = await supabaseClient.from("master_sync_log").update(stamp).in("id", ids);
    if (e) setMsg({ id: "bulk", text: `Couldn't save: ${e.message}` });
    else setRows((prev) => prev.map((r) => ids.includes(r.id) ? { ...r, ...stamp } : r));
    setBusyId(null);
  };

  // ---- rendering ----
  const clTab = (on) => ({ background: on ? "#1f4a82" : "var(--card2)", border: `1px solid ${on ? "var(--blue)" : "var(--line)"}`, color: on ? "#fff" : "var(--txt)", borderRadius: 99, padding: "5px 13px", fontSize: 13, fontWeight: on ? 600 : 500 });
  const label = (yardi) => {
    const m = masterCache[yardi];
    const fromDetails = (r) => r && r.details && r.details.candidate_labels && r.details.candidate_labels[yardi];
    if (m) return `${m.name}, ${m.city}, ${m.state} · ${m.units ?? "?"} units · ${m.client || "no client"}`;
    return fromDetails(shown.find((r) => fromDetails(r))) || yardi;
  };
  const Btn = ({ children, onClick, primary, disabled }) => (
    <button className={primary ? "btn sm" : "btn ghost sm"} disabled={disabled || busyId !== null} onClick={onClick} style={{ padding: "4px 11px", fontSize: 12.5 }}>{children}</button>
  );

  const actionsFor = (r) => {
    const p = byCode[r.property_code];
    const out = [];
    if (r.reviewed) {
      if (canUndo(r)) out.push(<Btn key="undo" onClick={() => { if (window.confirm(`Undo: ${(r.undo && r.undo.message) || r.apply_result}?`)) undoRow(r); }}>Undo</Btn>);
      out.push(<Btn key="reopen" onClick={() => reopen(r)}>Reopen</Btn>);
      return out;
    }
    if (r.action === "flag" && r.field === "Client" && p) {
      out.push(<Btn key="keep" primary onClick={() => markReviewed(r, "Kept tracker client")}>Keep {r.old_value || "tracker client"}</Btn>);
      if (r.new_value) out.push(<Btn key="use" onClick={() => setAttr(r, "Client", r.new_value, `Client set to master's ${r.new_value}`)}>Use {r.new_value}</Btn>);
      if (r.new_value) out.push(<Btn key="jv" onClick={() => setAttr(r, "JV Partner", r.new_value, `JV Partner set to ${r.new_value}`)}>Set {r.new_value} as JV Partner</Btn>);
      out.push(<Btn key="close" onClick={() => { if (window.confirm(`Close ${p.name}?`)) closeProperty(r, `ownership changed (master now lists ${r.new_value}; tracker client was ${r.old_value}).`); }}>Close property</Btn>);
      return out;
    }
    if (r.action === "flag" && r.field === "Duplicate") {
      const d = r.details || {};
      const k = d.keep || r.property_code, o = d.other;
      const K = byCode[k], O = byCode[o];
      if (K && O) {
        out.push(<Btn key="m1" primary onClick={() => { if (window.confirm(`Merge ${O.code} ${O.name} into ${K.code} ${K.name}?\n\n${K.code} keeps its values and gains any details it's missing from ${O.code}, plus ${O.code}'s notes. ${O.code} is then closed as a duplicate.`)) mergeDuplicate(r, K.code, O.code); }}>Merge {O.code} into {K.code}</Btn>);
        out.push(<Btn key="m2" onClick={() => { if (window.confirm(`Merge ${K.code} ${K.name} into ${O.code} ${O.name}?\n\n${O.code} keeps its values and gains any details it's missing from ${K.code}, plus ${K.code}'s notes. ${K.code} is then closed as a duplicate.`)) mergeDuplicate(r, O.code, K.code); }}>Merge {K.code} into {O.code}</Btn>);
        out.push(<Btn key="o1" onClick={() => onOpenProperty(K)}>Open {K.code}</Btn>);
        out.push(<Btn key="o2" onClick={() => onOpenProperty(O)}>Open {O.code}</Btn>);
      }
      out.push(<Btn key="nd" onClick={() => markReviewed(r, "Not a duplicate")}>Not duplicates</Btn>);
      return out;
    }
    if (r.action === "flag" && r.field === "Location" && p) {
      const cands = (r.details && Array.isArray(r.details.candidates)) ? r.details.candidates.filter(Boolean) : [];
      cands.forEach((c) => {
        const gone = masterCache[c] === null;
        out.push(<Btn key={`l-${c}`} primary={cands.length === 1} disabled={gone} onClick={() => { if (window.confirm(`Link ${p.code} ${p.name} to ${c} (${label(c)})? Master values replace the address and contacts; Client is not changed.`)) linkMaster(r, c); }}>{gone ? `${c} no longer in master` : `Link to ${c}`}</Btn>);
      });
      out.push(<Btn key="nim" onClick={() => { if (window.confirm(`Mark ${p.name} not in master${(p.program.attributes || {})["Yardi Code"] ? " and clear its Yardi code" : ""}?`)) markNotInMaster(r); }}>Not in master</Btn>);
      out.push(<Btn key="close" onClick={() => { if (window.confirm(`Close ${p.name}?`)) closeProperty(r, `Location: ${r.reason}`); }}>Close property</Btn>);
      out.push(<Btn key="rev" onClick={() => markReviewed(r, "Dismissed")}>Dismiss</Btn>);
      return out;
    }
    if (r.action === "ball") {
      const ev = clEvaluateBall(r, p);
      if (ev.kind === "noop") out.push(<Btn key="ok" primary onClick={() => markReviewed(r, "noop")}>Mark reviewed (already there)</Btn>);
      else if (ev.kind !== "missing") out.push(<Btn key="ap" primary onClick={() => applyBall(r)}>{ev.kind === "swap" ? `Swap ball to ${ev.to}` : `Reassign to ${ev.to}`}</Btn>);
      out.push(<Btn key="dis" onClick={() => markReviewed(r, "Dismissed")}>Dismiss</Btn>);
      return out;
    }
    if (r.action === "todo_done") {
      const f = pickedTodo(r, p);
      const open = clAllTodos(p).filter((c) => !c.todo.done);
      if (p && open.length > 0) out.push(
        <select key="pick" aria-label="Which to-do" value={f ? `${f.storageKey}|${f.idx}` : ""} onChange={(e) => setTodoPick((s) => ({ ...s, [r.id]: e.target.value }))}
          style={{ maxWidth: 360, fontSize: 12.5, padding: "3px 6px" }}>
          {!f && <option value="">Choose the to-do…</option>}
          {f && f.todo.done && <option value={`${f.storageKey}|${f.idx}`}>{f.phaseLabel}: {f.todo.text} (done)</option>}
          {[...new Set(open.map((c) => c.phaseLabel))].map((lab) => (
            <optgroup key={lab} label={lab}>
              {open.filter((c) => c.phaseLabel === lab).map((c) => <option key={`${c.storageKey}|${c.idx}`} value={`${c.storageKey}|${c.idx}`}>{c.todo.text}</option>)}
            </optgroup>
          ))}
        </select>
      );
      if (f && !f.todo.done) out.push(<Btn key="ap" primary onClick={() => applyTodoDone(r)}>Mark to-do done</Btn>);
      if (f && f.todo.done) out.push(<Btn key="ok" primary onClick={() => markReviewed(r, "noop")}>Mark reviewed (already done)</Btn>);
      out.push(<Btn key="dis" onClick={() => markReviewed(r, "Dismissed")}>Dismiss</Btn>);
      return out;
    }
    out.push(<Btn key="rev" primary={clIsDecision(r)} onClick={() => markReviewed(r)}>Mark reviewed</Btn>);
    return out;
  };

  const hint = (r) => {
    const p = byCode[r.property_code];
    if (r.reviewed) return null;
    if (r.action === "ball") return clEvaluateBall(r, p).message;
    if (r.action === "todo_done") {
      const f = pickedTodo(r, p);
      if (!p) return `${r.property_code} isn't in the tracker.`;
      return f ? `${todoPick[r.id] ? "Chosen" : "Best match"} — ${f.phaseLabel}: "${f.todo.text}" is ${f.todo.done ? "already done" : "open"}.` : "No close match — choose the to-do from the list.";
    }
    if (r.action === "flag" && r.field === "Duplicate" && r.details) {
      const d = r.details; const K = byCode[d.keep], O = byCode[d.other];
      const desc = (x) => { if (!x) return "not in the tracker"; const a = x.program.attributes || {}; return `${x.code} ${x.name} — ${[a.Client, a.Address, a.City, a.State, a.Units ? `${a.Units} units` : null, x.program.advisoryContractExecuted ? `executed ${x.program.advisoryContractExecuted}` : x.program.advisoryContractDrafted ? `drafted ${x.program.advisoryContractDrafted}` : null, x.program.manualStatus === "Closed" ? "Closed" : null].filter(Boolean).join(" · ")}`; };
      return `${d.confidence || ""} confidence: ${(d.reasons || []).join("; ")}. ${desc(K)}  |  ${desc(O)}`;
    }
    if (r.action === "flag" && r.field === "Location" && r.details && Array.isArray(r.details.candidates) && r.details.candidates.length) {
      return "Candidates: " + r.details.candidates.filter(Boolean).map((c) => `${c} — ${label(c)}`).join("; ");
    }
    return null;
  };

  return (
    <div className="proto-dash">
      <div className="wrap">
        <h1>Change Log</h1>
        <p className="sub">Changes from the daily master sync, notes digest and imports. Decide on flagged items here; every decision can be undone.</p>
        <div className="toolbar">
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => setFilter("decisions")} style={clTab(filter === "decisions")}>Needs decision ({openDecisions})</button>
            <button onClick={() => setFilter("updates")} style={clTab(filter === "updates")}>Updates ({openUpdates})</button>
            <button onClick={() => setFilter("all")} style={clTab(filter === "all")}>All</button>
          </div>
          <label style={{ display: "inline-flex", gap: 6, alignItems: "center", color: "var(--mut)", fontSize: 13 }}>
            <input type="checkbox" checked={showReviewed} onChange={(e) => setShowReviewed(e.target.checked)} /> Show reviewed
          </label>
          <input type="text" placeholder="Search code, name, field…" value={q} onChange={(e) => setQ(e.target.value)} style={{ minWidth: 220 }} aria-label="Search change log" />
          <span className="sp" />
          {filter !== "decisions" && <button className="btn ghost" disabled={busyId !== null} onClick={reviewAllShownUpdates}>Mark shown updates reviewed</button>}
          <button className="btn ghost" onClick={onRefresh} disabled={loading}>{loading ? "Loading…" : "Refresh"}</button>
        </div>
        {error && <div className="banner" style={{ color: "#ffc7c1" }}>Couldn't load the Change Log: {error}</div>}
        {msg && msg.id === "bulk" && <div className="banner" style={{ color: "#ffc7c1" }}>{msg.text}</div>}
        {!loading && grouped.length === 0 && <div className="foot">{filter === "decisions" && !showReviewed ? "Nothing needs a decision right now." : "No entries match."}</div>}
        {grouped.map((g) => (
          <div key={g.date} className="card" style={{ marginBottom: 14 }}>
            <div className="grp" style={{ color: "var(--mut)" }}>{g.date ? fmtDate(g.date) : "Undated"} · {g.rows.length} {g.rows.length === 1 ? "entry" : "entries"}</div>
            {g.rows.map((r) => {
              const p = byCode[r.property_code];
              const meta = CL_ACTION_META[r.action] || CL_ACTION_META.info;
              const h = hint(r);
              return (
                <div key={r.id} style={{ borderTop: "1px solid var(--line)", padding: "10px 0", opacity: r.reviewed ? 0.7 : 1 }}>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
                    <span className="pill" style={{ background: meta.bg, color: meta.color }}>{meta.label}</span>
                    {p ? <button className="link" onClick={() => onOpenProperty(p)} style={{ fontWeight: 600, fontSize: 13.5 }}>{r.property_code} · {p.name}</button>
                      : <span style={{ fontWeight: 600 }}>{r.property_code}{r.property_name ? ` · ${r.property_name}` : ""}</span>}
                    {r.field && r.field !== meta.label && <span className="t-chip t-src">{r.field}</span>}
                    <span style={{ marginLeft: "auto", color: "var(--dim)", fontSize: 12 }}>{r.source}</span>
                  </div>
                  {(r.old_value || r.new_value) && (
                    <div style={{ marginTop: 5, fontSize: 13 }}>
                      <span style={{ color: "var(--mut)", textDecoration: r.old_value ? "line-through" : "none" }}>{r.old_value || "(blank)"}</span>
                      {"  →  "}<b>{r.new_value || "(blank)"}</b>
                    </div>
                  )}
                  {r.reason && <div style={{ marginTop: 4, fontSize: 13, color: "var(--txt)", whiteSpace: "pre-wrap" }}>{r.reason}</div>}
                  {h && <div style={{ marginTop: 4, fontSize: 12.5, color: "var(--amber)" }}>{h}</div>}
                  {r.reviewed && (
                    <div style={{ marginTop: 4, fontSize: 12, color: "var(--dim)" }}>
                      Reviewed{r.reviewed_by ? ` by ${clFirstName(r.reviewed_by)}` : ""}{r.reviewed_at ? ` · ${fmtDate(String(r.reviewed_at).slice(0, 10))}` : ""}{r.apply_result ? ` · ${r.apply_result}` : ""}{r.undo && r.undo.message && r.apply_result !== "noop" ? ` — ${r.undo.message}` : ""}
                    </div>
                  )}
                  {!r.reviewed && r.apply_result === "undone" && <div style={{ marginTop: 4, fontSize: 12, color: "var(--dim)" }}>Previously applied, then undone.</div>}
                  <div style={{ marginTop: 7, display: "flex", gap: 8, flexWrap: "wrap" }}>{actionsFor(r)}</div>
                  {msg && msg.id === r.id && <div style={{ marginTop: 5, fontSize: 12.5, color: "#ffc7c1" }}>{msg.text}</div>}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function locateProperty(a, zipCache) {

  if (!isNaN(lat) && !isNaN(lng)) return { ll: [lat, lng], exact: true };
  const z = String(a.Zip || "").trim().slice(0, 5);
  if (MAP_ZIPS[z]) return { ll: MAP_ZIPS[z], exact: true };

// ---- Client Map: outline loader ----
// d3, topojson-client and the US state outline are loaded only when the map opens,
// each with an 8s timeout and backup CDNs, so a slow CDN can never leave the map
// stuck on "Loading map…" (or block the rest of the tracker). The outline is cached
// in this browser after the first successful load. Failures are not remembered, so
// reopening the map retries.
const MAP_LOAD_TIMEOUT_MS = 8000;
const MAP_ATLAS_CACHE_KEY = "clientMapAtlas_v1";
const MAP_ATLAS_URLS = [
  "https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json",
  "https://unpkg.com/us-atlas@3.0.1/states-10m.json"
];
const MAP_TOPOJSON_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js",
  "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js",
  "https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"
];
const MAP_D3_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js",
  "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js",
  "https://unpkg.com/d3@7.9.0/dist/d3.min.js"
];
function mapWithTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("timed out")), ms);
    promise.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
  });
}
function mapFirstThatWorks(urls, tryOne) {
  let i = 0;
  const next = (lastErr) => i >= urls.length ? Promise.reject(lastErr || new Error("all sources failed")) : tryOne(urls[i++]).catch(next);
  return next();
}
function mapIsAtlas(a) { return !!(a && a.type === "Topology" && a.objects && a.objects.states); }
function mapLoadScript(check) {
  return (url) => mapWithTimeout(new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = url; s.async = true;
    s.onload = () => (check() ? resolve() : reject(new Error("library missing")));
    s.onerror = () => reject(new Error("failed to load " + url));
    document.head.appendChild(s);
  }), MAP_LOAD_TIMEOUT_MS);
}
function mapEnsureLib(check, urls) { return check() ? Promise.resolve() : mapFirstThatWorks(urls, mapLoadScript(check)); }
function mapGetAtlas() {
  try {
    const cached = JSON.parse(localStorage.getItem(MAP_ATLAS_CACHE_KEY) || "null");
    if (mapIsAtlas(cached)) return Promise.resolve(cached);
  } catch (e) {}
  return mapFirstThatWorks(MAP_ATLAS_URLS, (url) =>
    mapWithTimeout(fetch(url).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }), MAP_LOAD_TIMEOUT_MS)
      .then((a) => { if (!mapIsAtlas(a)) throw new Error("bad map data"); return a; })
  ).then((a) => { try { localStorage.setItem(MAP_ATLAS_CACHE_KEY, JSON.stringify(a)); } catch (e) {} return a; });
}
let US_ATLAS_PROMISE = null;
function loadUsAtlas() {
  if (!US_ATLAS_PROMISE) {
    US_ATLAS_PROMISE = Promise.all([
      mapGetAtlas(),
      mapEnsureLib(() => !!(window.topojson && window.topojson.feature && window.topojson.mesh), MAP_TOPOJSON_URLS),
      mapEnsureLib(() => !!(window.d3 && window.d3.geoAlbersUsa && window.d3.geoPath), MAP_D3_URLS)
    ]).then((r) => r[0]);
    US_ATLAS_PROMISE.catch(() => { US_ATLAS_PROMISE = null; });
  }
  return US_ATLAS_PROMISE;
}

// A state's highlight tier: "active" when it has a live (not failed) measure
// other than a plain mandatory-access statute; otherwise "access".
function legisTierFor(items) {
  if (!items || !items.length) return null;
  return items.some((x) => x.category !== "Mandatory access" && x.status !== "Failed") ? "active" : "access";
}
const LEGIS_STATUS_STYLE = { "Enacted": "#2f9e61", "In effect (regulation)": "#2f9e61", "Passed, not yet effective": "#3d8bd9", "Pending": "#d98b2b", "Proposed rule": "#d98b2b", "Carried over": "#b98a3b", "Failed": "#7a8494", "Watch": "#7a8494" };
const LEGIS_IMPACT_STYLE = { High: "#e0663f", Medium: "#d9a12b", Low: "#7a8494" };
const safeHttpUrl = (u) => (/^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : null);

function LegislationItemEditor({ item, onSave, onCancel, saving }) {
  const [d, setD] = useState(item);
  const set = (k) => (e) => setD((x) => ({ ...x, [k]: e.target.value }));
  const field = (label, k, wide) => (
    <label className={`lg-f${wide ? " wide" : ""}`}><span>{label}</span><input value={d[k] || ""} onChange={set(k)} /></label>
  );
  const select = (label, k, opts) => (
    <label className="lg-f"><span>{label}</span><select value={d[k] || ""} onChange={set(k)}>{opts.map((o) => <option key={o} value={o}>{o}</option>)}</select></label>
  );
  const area = (label, k) => (
    <label className="lg-f wide"><span>{label}</span><textarea rows={3} value={d[k] || ""} onChange={set(k)} /></label>
  );
  return (
    <div className="lg-edit">
      <div className="lg-grid">
        {field("Measure (bill / ordinance / rule)", "measure")}
        {field("Jurisdiction", "jurisdiction")}
        {select("Level", "level", LEGIS_LEVELS)}
        {select("Category", "category", LEGIS_CATEGORIES)}
        {select("Status", "status", LEGIS_STATUSES)}
        {select("Impact on bulk programs", "impact", LEGIS_IMPACTS)}
        <label className="lg-f"><span>Effective date</span><input type="date" value={d.effective || ""} onChange={set("effective")} /></label>
        {field("Last action", "lastAction")}
        {field("Title", "title", true)}
        {area("Summary", "summary")}
        {area("Impact on bulk programs (notes)", "bulkImpact")}
        {field("Source link", "source", true)}
      </div>
      <div className="lg-actions">
        <button className="btn-primary" disabled={saving || !String(d.measure || "").trim()} onClick={() => onSave(d)}>{saving ? "Saving…" : "Save"}</button>
        <button className="btn-ghost" onClick={onCancel} disabled={saving}>Cancel</button>
      </div>
    </div>
  );
}
