function sanitizeCounselHtml(html) {
  if (typeof DOMParser === "undefined" || typeof document === "undefined") return "";
  const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
  const out = document.createElement("div");
  const walk = (node, parent) => {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) { parent.appendChild(document.createTextNode(n.textContent.replace(/ /g, " "))); return; }
      if (n.nodeType !== 1) return;
      let tag = n.tagName.toUpperCase();
      if (["SCRIPT", "STYLE", "META", "LINK", "TITLE", "HEAD", "IMG", "SVG", "IFRAME", "OBJECT", "BUTTON", "INPUT", "SELECT", "TEXTAREA"].includes(tag) || tag.includes(":")) return;
      if (tag === "H1" || tag === "H2") tag = "H3";
      if (tag === "H5" || tag === "H6") tag = "H4";
      if (tag === "DIV" || tag === "SECTION" || tag === "ARTICLE") tag = "P";
      if (!COUNSEL_TAGS.has(tag)) {
        // Unwrap (e.g. Word's spans), keeping bold/italic expressed as styles.
        const st = (n.getAttribute && n.getAttribute("style")) || "";
        let target = parent;
        if (/font-weight\s*:\s*(bold|[6-9]00)/i.test(st)) { const b = document.createElement("strong"); target.appendChild(b); target = b; }
        if (/font-style\s*:\s*italic/i.test(st)) { const i = document.createElement("em"); target.appendChild(i); target = i; }
        walk(n, target);
        return;
      }
      const el = document.createElement(tag);
      if (tag === "A") {
        const href = String(n.getAttribute("href") || "").trim();
        if (safeHttpUrl(href) || /^mailto:/i.test(href)) { el.setAttribute("href", href); el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener noreferrer"); }
      }
      if ((tag === "TD" || tag === "TH") && /^\d+$/.test(n.getAttribute("colspan") || "")) el.setAttribute("colspan", n.getAttribute("colspan"));
      parent.appendChild(el);
      walk(n, el);
    });
  };
  walk(doc.body.firstChild, out);
  out.querySelectorAll("p, li, h3, h4, strong, b, em, i, u").forEach((e) => { if (!e.textContent.trim() && !e.querySelector("br, table")) e.remove(); });
  return out.innerHTML.trim();
}
// Plain text (e.g. from a PDF or a plain-text email) → paragraphs and lists.
function counselTextToHtml(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(esc).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((x) => `<li>${esc(x)}</li>`).join("")}</${list.tag}>`); list = null; } };
  lines.forEach((raw) => {
    const line = raw.trim();
    const ul = line.match(/^[-*•▪◦·]\s+(.*)$/);
    const ol = line.match(/^(\d+|[a-z])[.)]\s+(.*)$/i);
    if (!line) { flushPara(); flushList(); return; }
    if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(ul ? ul[1] : ol[2]);
      return;
    }
    flushList(); para.push(line);
  });
  flushPara(); flushList();
  return out.join("");
}

function CounselNoteEditor({ note, measures, onSave, onCancel, saving }) {
  const [d, setD] = useState(note);
  const bodyRef = React.useRef(null);
  useEffect(() => { if (bodyRef.current) bodyRef.current.innerHTML = sanitizeCounselHtml(note.html || ""); }, []);
  const set = (k) => (e) => setD((x) => ({ ...x, [k]: e.target.value }));
  const onPaste = (e) => {
    const cd = e.clipboardData; if (!cd) return;
    e.preventDefault();
    const html = cd.getData("text/html");
    const clean = html ? sanitizeCounselHtml(html) : counselTextToHtml(cd.getData("text/plain"));
    document.execCommand("insertHTML", false, clean);
  };
  const cmd = (c, v) => (e) => { e.preventDefault(); document.execCommand(c, false, v); if (bodyRef.current) bodyRef.current.focus(); };
  const save = () => onSave({ ...d, html: sanitizeCounselHtml(bodyRef.current ? bodyRef.current.innerHTML : "") });
  return (
    <div className="lg-edit">
      <div className="lg-grid">
        <label className="lg-f wide"><span>Title</span><input value={d.title || ""} onChange={set("title")} placeholder="e.g. Memo on AB 1414 opt-out requirements" /></label>
        <label className="lg-f"><span>From (firm / attorney)</span><input value={d.from || ""} onChange={set("from")} /></label>
        <label className="lg-f"><span>Date</span><input type="date" value={d.date || ""} onChange={set("date")} /></label>
        <label className="lg-f wide"><span>Related measure</span>
          <select value={d.measureId || ""} onChange={set("measureId")}>
            <option value="">General (whole state)</option>
            {measures.map((m) => <option key={m.id} value={m.id}>{m.measure}{m.level !== "State" ? ` (${m.jurisdiction})` : ""}</option>)}
          </select>
        </label>
        <div className="lg-f wide"><span>Note — paste from Word, Outlook or a PDF; formatting is kept</span>
          <div className="lg-rt-bar">
            <button onMouseDown={cmd("bold")} title="Bold"><b>B</b></button>
            <button onMouseDown={cmd("italic")} title="Italic"><i>I</i></button>
            <button onMouseDown={cmd("formatBlock", "H4")} title="Heading">H</button>
            <button onMouseDown={cmd("formatBlock", "P")} title="Paragraph">¶</button>
            <button onMouseDown={cmd("insertUnorderedList")} title="Bulleted list">• List</button>
            <button onMouseDown={cmd("insertOrderedList")} title="Numbered list">1. List</button>
            <button onMouseDown={cmd("removeFormat")} title="Clear formatting">Clear</button>
          </div>
          <div ref={bodyRef} className="lg-rt lg-note-body" contentEditable suppressContentEditableWarning onPaste={onPaste} />
        </div>
      </div>
      <div className="lg-actions">
        <button className="btn-primary" disabled={saving || !String(d.title || "").trim()} onClick={save}>{saving ? "Saving…" : "Save note"}</button>
        <button className="btn-ghost" onClick={onCancel} disabled={saving}>Cancel</button>
      </div>
    </div>
  );
}

function LegislationPanel({ stateCode, items, notes, onSave, userEmail }) {
  const [editing, setEditing] = useState(null); // measure id, "new", "note:<id>" or "note:new"
  const [noteFilter, setNoteFilter] = useState(null); // measure id to filter counsel notes by
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);
  const notesRef = React.useRef(null);
  const mine = items.filter((x) => x.state === stateCode);
  const myNotes = (notes || []).filter((n) => n.state === stateCode).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  const shownNotes = noteFilter ? myNotes.filter((n) => n.measureId === noteFilter) : myNotes;
  const notesFor = (id) => myNotes.filter((n) => n.measureId === id).length;
  const order = { High: 0, Medium: 1, Low: 2 };
  // Groups (statewide / city / county) ordered by their most significant measure.
  const best = (xs) => Math.min(...xs.map((x) => order[x.impact] ?? 3));
  const groups = LEGIS_LEVELS.map((lv) => [lv, mine.filter((x) => (x.level || "State") === lv)]).filter(([, xs]) => xs.length)
    .sort((a, b) => best(a[1]) - best(b[1]));
  const save = async (nextItems, nextNotes) => {
    setSaving(true); setErr(null);
    try { await onSave(nextItems, nextNotes); setEditing(null); } catch (e) { setErr(e.message || String(e)); }
    setSaving(false);
  };
  const stamp = (x) => ({ ...x, updatedBy: userEmail || "unknown", updatedAt: new Date().toISOString() });
  const upsertItem = (d) => save(items.some((x) => x.id === d.id) ? items.map((x) => (x.id === d.id ? stamp(d) : x)) : [...items, stamp(d)], notes || []);
  const removeItem = (id) => {
    const linked = notesFor(id);
    if (window.confirm(`Remove this measure from the tracker?${linked ? ` Its ${linked} counsel ${linked === 1 ? "note stays" : "notes stay"} as general state notes.` : ""}`))
      save(items.filter((x) => x.id !== id), (notes || []).map((n) => (n.measureId === id ? { ...n, measureId: "" } : n)));
  };
  const upsertNote = (d) => {
    const all = notes || [];
    const next = all.some((n) => n.id === d.id) ? all.map((n) => (n.id === d.id ? stamp(d) : n)) : [...all, { ...stamp(d), addedBy: userEmail || "unknown", addedAt: new Date().toISOString() }];
    save(items, next);
  };
  const removeNote = (id) => { if (window.confirm("Remove this counsel note?")) save(items, (notes || []).filter((n) => n.id !== id)); };
  const showNotesFor = (id) => { setNoteFilter(id); setTimeout(() => notesRef.current && notesRef.current.scrollIntoView({ behavior: "smooth", block: "start" }), 0); };
  const blank = { id: `${stateCode.toLowerCase()}-${Date.now()}`, state: stateCode, level: "State", jurisdiction: US_STATE_NAMES[stateCode] || stateCode, measure: "", title: "", category: "Bulk billing / opt-out", status: "Pending", impact: "Medium", effective: "", lastAction: "", summary: "", bulkImpact: "", source: "" };
  const blankNote = { id: `note-${stateCode.toLowerCase()}-${Date.now()}`, state: stateCode, measureId: noteFilter || "", title: "", from: "", date: TODAY, html: "" };
  const measureName = (id) => { const m = mine.find((x) => x.id === id); return m ? m.measure : null; };
  return (
    <div className="lg-panel">
      <div className="lg-head">
        <h3>Legislation &amp; regulation</h3>
        <button className="btn-ghost" onClick={() => setEditing("new")} disabled={!!editing}>+ Add measure</button>
      </div>
      {err && <div className="lg-err">Couldn't save: {err}</div>}
      {editing === "new" && <LegislationItemEditor item={blank} saving={saving} onCancel={() => setEditing(null)} onSave={upsertItem} />}
      {!mine.length && editing !== "new" && <div className="lg-empty">Nothing tracked for {US_STATE_NAMES[stateCode] || stateCode} yet.</div>}
      {groups.map(([lv, xs]) => (
        <div key={lv} className="lg-group">
          <div className="lg-group-h">{lv === "State" ? "Statewide" : lv === "City" ? "City" : lv === "County" ? "County" : "Federal"}</div>
          {[...xs].sort((a, b) => (order[a.impact] ?? 3) - (order[b.impact] ?? 3)).map((x) => editing === x.id ? (
            <LegislationItemEditor key={x.id} item={x} saving={saving} onCancel={() => setEditing(null)} onSave={upsertItem} />
          ) : (
            <div key={x.id} className="lg-card">
              <div className="lg-card-top">
                <b>{x.measure}</b>{x.level !== "State" && <span className="lg-jur">{x.jurisdiction}</span>}
                <span className="lg-chip" style={{ borderColor: LEGIS_STATUS_STYLE[x.status] || "#7a8494", color: LEGIS_STATUS_STYLE[x.status] || "#7a8494" }}>{x.status}</span>
                <span className="lg-chip" style={{ borderColor: LEGIS_IMPACT_STYLE[x.impact] || "#7a8494", color: LEGIS_IMPACT_STYLE[x.impact] || "#7a8494" }}>{x.impact} impact</span>
                <span className="lg-cat">{x.category}</span>
                <span className="lg-sp" />
                <button className="link" onClick={() => setEditing(x.id)} disabled={!!editing}>Edit</button>
                <button className="link" onClick={() => removeItem(x.id)} disabled={!!editing}>Remove</button>
              </div>
              {x.title && <div className="lg-title">{x.title}</div>}
              {x.summary && <div className="lg-sum">{x.summary}</div>}
              {x.bulkImpact && <div className="lg-imp"><span>Bulk programs:</span> {x.bulkImpact}</div>}
              <div className="lg-meta">
                {x.effective && <span>Effective {fmtDate(x.effective)}</span>}
                {x.lastAction && <span>{x.lastAction}</span>}
                {safeHttpUrl(x.source) && <a href={safeHttpUrl(x.source)} target="_blank" rel="noopener noreferrer">Source</a>}
                {notesFor(x.id) > 0 && <button className="link" onClick={() => showNotesFor(x.id)}>{notesFor(x.id)} counsel {notesFor(x.id) === 1 ? "note" : "notes"}</button>}
                {x.updatedAt && <span className="lg-upd">Edited {fmtDate(x.updatedAt.slice(0, 10))}{x.updatedBy ? ` by ${x.updatedBy}` : ""}</span>}
              </div>
            </div>
          ))}
        </div>
      ))}

      <div className="lg-head lg-notes-head" ref={notesRef}>
        <h3>Outside counsel notes</h3>
        <button className="btn-ghost" onClick={() => setEditing("note:new")} disabled={!!editing}>+ Add counsel note</button>
      </div>
      {noteFilter && <div className="lg-filter">Showing notes on {measureName(noteFilter) || "one measure"} · <button className="link" onClick={() => setNoteFilter(null)}>Show all</button></div>}
      {editing === "note:new" && <CounselNoteEditor note={blankNote} measures={mine} saving={saving} onCancel={() => setEditing(null)} onSave={upsertNote} />}
      {!shownNotes.length && editing !== "note:new" && <div className="lg-empty">No counsel notes yet. Paste a memo or email from outside counsel with “Add counsel note.”</div>}
      {shownNotes.map((n) => editing === `note:${n.id}` ? (
        <CounselNoteEditor key={n.id} note={n} measures={mine} saving={saving} onCancel={() => setEditing(null)} onSave={upsertNote} />
      ) : (
        <div key={n.id} className="lg-card lg-note">
          <div className="lg-card-top">
            <b>{n.title}</b>
            {n.measureId && measureName(n.measureId) && <span className="lg-chip lg-note-chip">{measureName(n.measureId)}</span>}
            <span className="lg-sp" />
            <button className="link" onClick={() => setEditing(`note:${n.id}`)} disabled={!!editing}>Edit</button>
            <button className="link" onClick={() => removeNote(n.id)} disabled={!!editing}>Remove</button>
          </div>
          <div className="lg-meta" style={{ marginTop: 2 }}>
            {n.from && <span>{n.from}</span>}
            {n.date && <span>{fmtDate(n.date)}</span>}
            {(n.updatedBy || n.addedBy) && <span className="lg-upd">Added by {n.addedBy || n.updatedBy}{n.updatedAt && n.addedAt && n.updatedAt !== n.addedAt ? `, edited ${fmtDate(n.updatedAt.slice(0, 10))}` : ""}</span>}
          </div>
          <div className="lg-note-body" dangerouslySetInnerHTML={{ __html: sanitizeCounselHtml(n.html) }} />
        </div>
      ))}
    </div>
  );
}

function ClientMapView({ properties, onOpenProperty, legislation, onSaveLegislation, userEmail }) {
  const W = 975, H = 610;
  const [atlas, setAtlas] = useState(null);
  const [atlasError, setAtlasError] = useState(false);
  const [zipCache, setZipCache] = useState(mapZipCache);
  const [hidden, setHidden] = useState(() => new Set());
  const [clientFilter, setClientFilter] = useState("");
  const [tip, setTip] = useState(null);
  const [showLegis, setShowLegis] = useState(true);
  const [showPins, setShowPins] = useState(true);
  const [selState, setSelState] = useState(null); // postal code of the state being viewed
  const [hoverCode, setHoverCode] = useState(null); // property highlighted from the state list
  const wrapRef = React.useRef(null);
  const legisItems = (legislation && legislation.items) || LEGIS_SEED;
  const legisNotes = (legislation && legislation.notes) || [];

  useEffect(() => { loadUsAtlas().then(setAtlas).catch(() => setAtlasError(true)); }, []);

  const active = useMemo(() => properties
    .filter((p) => (p.program.advisoryContractExecuted || p.program.ddContractExecuted) && !MAP_HIDDEN_STATUSES.includes(computeStatus(p)))
    .map((p) => {
      const a = p.program.attributes || {};
      const phase = currentPhaseGroupLabel(p);
      return { p, name: p.name, code: p.code, client: a.Client || "—", phase, color: colorForPhaseLabel(phase), a };
    }), [properties]);

  // Look up any zip we don't know yet, once per browser.
  useEffect(() => {
    const missing = [...new Set(active.map((r) => String(r.a.Zip || "").trim().slice(0, 5)))]
      .filter((z) => /^\d{5}$/.test(z) && !MAP_ZIPS[z] && !zipCache[z]);
    if (!missing.length) return;
    let cancelled = false;
    Promise.all(missing.map((z) => fetch(`https://api.zippopotam.us/us/${z}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => (j && j.places && j.places[0] ? [z, [parseFloat(j.places[0].latitude), parseFloat(j.places[0].longitude)]] : null))
      .catch(() => null)))
      .then((pairs) => {
        if (cancelled) return;
        const next = { ...zipCache };
        pairs.forEach((x) => { if (x) next[x[0]] = x[1]; });
        mapSaveZipCache(next); setZipCache(next);
      });
    return () => { cancelled = true; };
  }, [active]);

  // Legislation grouped by state; tier drives the overlay colour.
  const legisByState = useMemo(() => {
    const m = {};
    legisItems.forEach((x) => { if (x.state && x.state !== "US") (m[x.state] = m[x.state] || []).push(x); });
    return m;
  }, [legisItems]);
  const federalItems = legisItems.filter((x) => x.state === "US");

  // National view, or the selected state fitted to the frame.
  const geo = useMemo(() => {
    if (!atlas || !window.d3 || !window.topojson) return null;
    const features = topojson.feature(atlas, atlas.objects.states).features.map((f) => ({ f, code: US_STATE_BY_NAME[String((f.properties && f.properties.name) || "").toLowerCase()] || null }));
    const sel = selState ? features.find((x) => x.code === selState) : null;
    const proj = d3.geoAlbersUsa();
    if (sel) proj.fitExtent([[40, 30], [W - 40, H - 30]], sel.f); else proj.scale(1300).translate([W / 2, H / 2]);
    const path = d3.geoPath(proj);
    const states = features.map((x) => ({ code: x.code, d: path(x.f), f: x.f }));
    const nation = sel ? null : path(topojson.mesh(atlas, atlas.objects.states, (a, b) => a === b));
    return { proj, states, nation, sel };
  }, [atlas, selState]);

  const clients = useMemo(() => [...new Set(active.map((r) => r.client))].sort(), [active]);
  const phaseCounts = useMemo(() => {
    const m = new Map();
    active.forEach((r) => m.set(r.phase, (m.get(r.phase) || 0) + 1));
    return [...m.entries()].sort((a, b) => {
      const ai = PHASE_GROUP_ORDER.indexOf(a[0]), bi = PHASE_GROUP_ORDER.indexOf(b[0]);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });
  }, [active]);

  const { pins, unmapped } = useMemo(() => {
    if (!geo) return { pins: [], unmapped: [] };
    const placed = [], unmapped = [];
    active.forEach((r) => {
      const loc = locateProperty(r.a, zipCache);
      if (!loc) { unmapped.push(r); return; }
      const lonlat = [loc.ll[1], loc.ll[0]];
      // In a state view, keep only that state's properties.
      if (geo.sel) {
        const st = String(r.a.State || "").trim().toUpperCase();
        if (st ? st !== selState : !d3.geoContains(geo.sel.f, lonlat)) return;
      }
      const xy = geo.proj(lonlat);
      if (xy) placed.push({ ...r, x: xy[0], y: xy[1], approx: !loc.exact }); else unmapped.push(r);
    });
    // Fan out pins that land on top of each other (same zip / same city).
    placed.sort((a, b) => a.code.localeCompare(b.code));
    const near = geo.sel ? 24 : 8;
    const groups = [];
    placed.forEach((m) => {
      const g = groups.find((g) => Math.hypot(g.x - m.x, g.y - m.y) < near);
      if (g) g.items.push(m); else groups.push({ x: m.x, y: m.y, items: [m] });
    });
    groups.forEach((g) => {
      const n = g.items.length; if (n < 2) return;
      const rad = geo.sel ? 16 + n * 4 : 5 + n * 1.1;
      g.items.forEach((m, i) => { const t = (i / n) * 2 * Math.PI - Math.PI / 2; m.x = g.x + rad * Math.cos(t); m.y = g.y + rad * Math.sin(t); });
    });
    return { pins: placed, unmapped };
  }, [geo, active, zipCache, selState]);

  const shown = (r) => !hidden.has(r.phase) && (!clientFilter || r.client === clientFilter);
  const shownCount = active.filter(shown).length;
  const statePinCount = selState ? pins.filter(shown).length : 0;

  const showTip = (e, r) => {
    const box = wrapRef.current.getBoundingClientRect();
    setTip({ r, x: e.clientX - box.left, y: e.clientY - box.top, w: box.width, h: box.height });
  };
  const showStateTip = (e, code) => {
    if (selState || !code) return;
    const box = wrapRef.current.getBoundingClientRect();
    setTip({ state: code, x: e.clientX - box.left, y: e.clientY - box.top, w: box.width, h: box.height });
  };
  const toggle = (ph) => setHidden((s) => { const n = new Set(s); n.has(ph) ? n.delete(ph) : n.add(ph); return n; });
  const openState = (code) => { if (code) { setSelState(code); setTip(null); } };
  const backToUs = () => { setSelState(null); setTip(null); setHoverCode(null); };
  // Esc returns to the national map (unless typing in a field).
  useEffect(() => {
    if (!selState) return;
    const onKey = (e) => { if (e.key === "Escape" && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "") && !(e.target && e.target.isContentEditable)) backToUs(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selState]);

  const trackedStates = Object.keys(legisByState).sort((a, b) => (US_STATE_NAMES[a] || a).localeCompare(US_STATE_NAMES[b] || b));
  const activeStates = trackedStates.filter((c) => legisTierFor(legisByState[c]) === "active");
  const accessStates = trackedStates.filter((c) => legisTierFor(legisByState[c]) === "access");
  const pinR = geo && geo.sel ? 8 : 4.5;

  return (
    <div className="cmap">
      <div className="cmap-head">
        <div>
          <h2>{selState ? <><button className="cmap-back-btn" onClick={backToUs}>← Back to US map</button> {US_STATE_NAMES[selState] || selState}</> : "Client Map"}</h2>
          <div className="cmap-sub">
            {selState
              ? `${statePinCount} active advisory ${statePinCount === 1 ? "property" : "properties"} in ${US_STATE_NAMES[selState] || selState} · ${(legisByState[selState] || []).length} tracked ${(legisByState[selState] || []).length === 1 ? "measure" : "measures"}`
              : `${shownCount} active advisory ${shownCount === 1 ? "property" : "properties"}${clientFilter ? ` · ${clientFilter}` : ""} · ${activeStates.length} states with bulk-program legislation`}
          </div>
        </div>
        <div className="cmap-tools">
          <label className="cmap-toggle"><input type="checkbox" checked={showPins} onChange={(e) => setShowPins(e.target.checked)} /> Client properties</label>
          <label className="cmap-toggle"><input type="checkbox" checked={showLegis} onChange={(e) => setShowLegis(e.target.checked)} /> Legislation</label>
          <select className="cmap-select" value={clientFilter} onChange={(e) => setClientFilter(e.target.value)}>
            <option value="">All clients</option>
            {clients.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>

      <div className="cmap-legend">
        {showPins && phaseCounts.map(([ph, n]) => (
          <button key={ph} className={hidden.has(ph) ? "off" : ""} onClick={() => toggle(ph)} title={hidden.has(ph) ? "Show" : "Hide"}>
            <span className="sw" style={{ background: colorForPhaseLabel(ph) }} />{ph}<span className="n">{n}</span>
          </button>
        ))}
        {showLegis && !selState && <>
          <span className="cmap-lg-key"><span className="box active" />Bulk-program legislation</span>
          <span className="cmap-lg-key"><span className="box access" />Mandatory access only</span>
        </>}
      </div>

      {showLegis && !selState && (
        <div className="cmap-states">
          {activeStates.map((c) => <button key={c} className="active" onClick={() => openState(c)} title={`${legisByState[c].length} tracked`}>{US_STATE_NAMES[c] || c}</button>)}
          {accessStates.map((c) => <button key={c} className="access" onClick={() => openState(c)} title="Mandatory access statute">{US_STATE_NAMES[c] || c}</button>)}
        </div>
      )}

      <div className={`cmap-body${selState ? " split" : ""}`}>
        <div className="cmap-frame" ref={wrapRef} onMouseLeave={() => setTip(null)}>
          {selState && <button className="cmap-back-btn cmap-back-float" onClick={backToUs} title="Back to the US map (Esc)">← Back to US map</button>}
          {!geo && <div className="cmap-msg">{atlasError ? "Couldn't load the map outline — check your connection and refresh." : "Loading map…"}</div>}
          {geo && (
            <svg viewBox={`0 0 ${W} ${H}`} className="cmap-svg">
              <g>{geo.states.map((s, i) => {
                const tier = showLegis ? legisTierFor(legisByState[s.code]) : null;
                const isSel = geo.sel && s.code === selState;
                return (
                  <path key={i} d={s.d}
                    className={`cmap-state${tier ? ` lg-${tier}` : ""}${isSel ? " sel" : ""}${geo.sel && !isSel ? " dim" : ""}`}
                    onClick={() => { if (!geo.sel) openState(s.code); }}
                    onMouseMove={(e) => showStateTip(e, s.code)}
                    style={{ cursor: geo.sel ? "default" : "pointer" }} />
                );
              })}</g>
              {geo.nation && <path d={geo.nation} className="cmap-nation" />}
              {showPins && <g>
                {/* Highlighted flag drawn last so it sits on top. */}
                {[...pins.filter(shown)].sort((a, b) => (a.code === hoverCode) - (b.code === hoverCode)).map((r) => geo.sel ? (
                  <g key={r.code} transform={`translate(${r.x},${r.y})${r.code === hoverCode ? " scale(1.35)" : ""}`} className={`cmap-flag${r.code === hoverCode ? " hot" : ""}`}
                     onMouseMove={(e) => { e.stopPropagation(); showTip(e, r); setHoverCode(r.code); }} onMouseLeave={() => { setTip(null); setHoverCode(null); }}
                     onClick={(e) => { e.stopPropagation(); onOpenProperty(r.p); }}>
                    <path d="M0 0 C-3 -7 -11 -12 -11 -22 A11 11 0 1 1 11 -22 C11 -12 3 -7 0 0 Z" fill={r.color} className="cmap-flag-body" strokeDasharray={r.approx ? "3 2" : undefined} />
                    <circle cy={-22} r={4} className="cmap-flag-eye" />
                    <text y={-38} className="cmap-pin-label">{r.code}</text>
                  </g>
                ) : (
                  <g key={r.code} transform={`translate(${r.x},${r.y})`} className="cmap-pin"
                     onMouseMove={(e) => { e.stopPropagation(); showTip(e, r); }} onMouseLeave={() => setTip(null)}
                     onClick={(e) => { e.stopPropagation(); onOpenProperty(r.p); }}>
                    <circle r={pinR + 4} fill="transparent" />
                    <circle r={pinR} className="dot" fill={r.color} strokeDasharray={r.approx ? "2 2" : undefined} />
                  </g>
                ))}
              </g>}
            </svg>
          )}
          {tip && (
            <div className="cmap-tip" style={{
              left: tip.x + 250 > tip.w ? tip.x - 14 : tip.x + 14,
              top: tip.y + 100 > tip.h ? tip.y - 14 : tip.y + 14,
              transform: `${tip.x + 250 > tip.w ? "translateX(-100%)" : ""} ${tip.y + 100 > tip.h ? "translateY(-100%)" : ""}`.trim() || "none"
            }}>
              {tip.r ? <>
                <b>{tip.r.name}</b>
                <div className="ph"><i style={{ background: tip.r.color }} />{tip.r.phase}</div>
                <div className="cl">{tip.r.client}</div>
                {tip.r.approx && <div className="ap">Approximate — no zip on file</div>}
              </> : <>
                <b>{US_STATE_NAMES[tip.state] || tip.state}</b>
                {(legisByState[tip.state] || []).length
                  ? <div className="cl">{legisByState[tip.state].length} tracked {legisByState[tip.state].length === 1 ? "measure" : "measures"}: {legisByState[tip.state].slice(0, 3).map((x) => x.measure).join(", ")}{legisByState[tip.state].length > 3 ? "…" : ""}</div>
                  : <div className="cl">No tracked legislation</div>}
                <div className="ap">Click to zoom in</div>
              </>}
            </div>
          )}
        </div>
        {selState && (
          <div className="cmap-side">
            {showPins && (
              <div className="cmap-plist">
                <div className="lg-head"><h3>Client properties in {US_STATE_NAMES[selState] || selState}</h3><span className="cmap-plist-n">{pins.filter(shown).length}</span></div>
                {!pins.filter(shown).length && <div className="lg-empty">No active advisory properties here{clientFilter ? ` for ${clientFilter}` : ""}.</div>}
                {[...pins.filter(shown)].sort((a, b) => a.name.localeCompare(b.name)).map((r) => (
                  <button key={r.code} className={`cmap-prow${r.code === hoverCode ? " hot" : ""}`}
                    onMouseEnter={() => setHoverCode(r.code)} onMouseLeave={() => setHoverCode(null)} onClick={() => onOpenProperty(r.p)}>
                    <span className="sw" style={{ background: r.color }} />
                    <span className="nm"><b>{r.name}</b> <span className="cd">{r.code}</span></span>
                    <span className="cl">{r.client}</span>
                    <span className="ph">{r.phase}</span>
                  </button>
                ))}
                {(legisByState[selState] || []).length > 0 && pins.filter(shown).length > 0 && (
                  <div className="cmap-plist-foot">Subject to {(legisByState[selState] || []).length} tracked {(legisByState[selState] || []).length === 1 ? "measure" : "measures"} below; city and county measures apply only within those jurisdictions.</div>
                )}
              </div>
            )}
            <LegislationPanel stateCode={selState} items={legisItems} notes={legisNotes} onSave={onSaveLegislation} userEmail={userEmail} />
          </div>
        )}
      </div>

      {!selState && showLegis && federalItems.length > 0 && (
        <div className="cmap-fed">
          <b>Federal:</b> {federalItems.map((x, i) => (
            <span key={x.id}>{i > 0 && " · "}{x.measure} ({x.status}){x.lastAction ? ` — ${x.lastAction}` : ""}{safeHttpUrl(x.source) && <> <a href={safeHttpUrl(x.source)} target="_blank" rel="noopener noreferrer">Source</a></>}</span>
          ))}
        </div>
      )}
      {unmapped.length > 0 && !selState && (
        <div className="cmap-foot">Not on the map (no state or zip): {unmapped.map((u, i) => (
          <span key={u.code}>{i > 0 && ", "}<a onClick={() => onOpenProperty(u.p)}>{u.name}</a></span>
        ))}</div>
      )}
    </div>
  );
}

// Saved web links shown at the top of Documents.
const DOC_LINKS = [
  { name: "Connected Living Order Form", note: "Formstack", url: "https://greystarit.formstack.com/forms/connected_living_order_form_copy" },
];
const docDisplayName = (n) => String(n || "").replace(/^\d{13}-/, "");
const docSize = (b) => !b && b !== 0 ? "" : b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(0)} KB` : `${(b / 1048576).toFixed(1)} MB`;
const docIcon = (n) => { const e = String(n).split(".").pop().toLowerCase(); return ["xlsx", "xlsm", "xls", "csv"].includes(e) ? "Spreadsheet" : e === "pdf" ? "PDF" : ["doc", "docx"].includes(e) ? "Word" : ["ppt", "pptx"].includes(e) ? "PowerPoint" : e.toUpperCase(); };

function DocumentsModal({ onClose, supabaseClient }) {
  const [files, setFiles] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState("");
  const [note, setNote] = useState(null);
  const fileRef = React.useRef(null);

  const list = async () => {
    const { data, error } = await supabaseClient.storage.from(DOC_BUCKET).list(DOC_PREFIX, { limit: 1000, sortBy: { column: "name", order: "asc" } });
    if (error) throw new Error(error.message);
    return (data || []).filter((f) => f.name && !f.name.startsWith(".") && f.id !== null);
  };
  const upload = async (name, blob, type) => {
    const path = `${DOC_PREFIX}/${Date.now()}-${name.replace(/[\\/]/g, "-")}`;
    const { error } = await supabaseClient.storage.from(DOC_BUCKET).upload(path, blob, { contentType: type || undefined, upsert: false });
    if (error) throw new Error(error.message);
  };

  const refresh = async (seed) => {
    setErr(null);
    try {
      let current = await list();
      if (seed) {
        const have = new Set(current.map((f) => docDisplayName(f.name).toLowerCase()));
        for (const s of DOC_SEED) {
          if (have.has(s.name.toLowerCase()) || !s.b64 || s.b64.startsWith("__")) continue;
          try {
            const bytes = Uint8Array.from(atob(s.b64), (c) => c.charCodeAt(0));
            await upload(s.name, new Blob([bytes], { type: s.type }), s.type);
          } catch (e) { /* read-only users can't upload; it will be saved by the next write user */ }
        }
        current = await list();
      }
      setFiles(current);
    } catch (e) { setErr(`Couldn't load documents: ${e.message}`); setFiles([]); }
  };
  useEffect(() => { if (supabaseClient) refresh(true); else { setFiles([]); setErr("Not connected to the shared database."); } }, []); // eslint-disable-line

  const onPick = async (e) => {
    const picked = [...(e.target.files || [])];
    e.target.value = "";
    if (!picked.length) return;
    setBusy(true); setErr(null); setNote(null);
    const failed = [];
    for (const f of picked) {
      try { await upload(f.name, f, f.type); } catch (x) { failed.push(`${f.name}: ${x.message}`); }
    }
    await refresh(false);
    setBusy(false);
    if (failed.length) setErr(`Couldn't upload ${failed.length === 1 ? "a file" : `${failed.length} files`} — ${failed.join("; ")}${failed.some((m) => /row-level security|policy|permission/i.test(m)) ? " (uploading needs write access)" : ""}`);
    else setNote(`Uploaded ${picked.length} file${picked.length === 1 ? "" : "s"}.`);
  };

  const open = async (f) => {
    setErr(null);
    const win = window.open("", "_blank");
    const { data, error } = await supabaseClient.storage.from(DOC_BUCKET).createSignedUrl(`${DOC_PREFIX}/${f.name}`, 300, { download: docDisplayName(f.name) });
    if (error || !data || !data.signedUrl) { if (win) win.close(); setErr(`Couldn't open ${docDisplayName(f.name)}: ${error ? error.message : "no link returned"}`); return; }
    if (win) win.location.href = data.signedUrl; else window.open(data.signedUrl, "_blank", "noopener");
  };

  const shown = (files || []).filter((f) => !q || docDisplayName(f.name).toLowerCase().includes(q.toLowerCase()));
  const shownLinks = DOC_LINKS.filter((l) => !q || `${l.name} ${l.note || ""}`.toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="modal-overlay" onClick={busy ? undefined : onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 760, width: "95vw" }}>
        <div className="modal-head">
          <div>
            <h2>Documents</h2>
            <div style={{ fontSize: 12.5, opacity: 0.75, marginTop: 4 }}>Shared forms, templates and reference files for the team.</div>
          </div>
          <button className="icon-btn" onClick={onClose} disabled={busy}><X size={18} /></button>
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center", margin: "12px 0" }}>
          <div className="search-box" style={{ flex: 1, minWidth: 0 }}>
            <Search size={14} color="#B2B3B5" />
            <input placeholder="Search documents…" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search documents" />
          </div>
          <input ref={fileRef} type="file" multiple style={{ display: "none" }} onChange={onPick} />
          <button className="btn-primary" disabled={busy || !supabaseClient} onClick={() => fileRef.current && fileRef.current.click()}><Plus size={14} /> {busy ? "Uploading…" : "Upload"}</button>
        </div>
        {err && <div style={{ color: "#ff8f86", fontSize: 13, marginBottom: 8 }}>{err}</div>}
        {note && <div style={{ color: "#7bd88a", fontSize: 13, marginBottom: 8 }}>{note}</div>}

        {shownLinks.length > 0 && (
          <div style={{ border: "1px solid var(--border)", borderRadius: 8, marginBottom: 10 }}>
            <div className="field-label" style={{ padding: "8px 14px 0" }}>Links</div>
            {shownLinks.map((l) => (
              <div key={l.url} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderTop: "1px solid var(--border)" }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8ab8ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
                <div style={{ flex: 1, minWidth: 0 }}>

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Master Export");

    const historyWs = XLSX.utils.json_to_sheet(historyRows);
    historyWs["!cols"] = Object.keys(historyRows[0] || {}).map((key) => ({ wch: key === "Note" || key === "To-Do" ? 60 : Math.min(40, Math.max(10, key.length + 4)) }));
    XLSX.utils.book_append_sheet(wb, historyWs, "Notes History");

    XLSX.writeFile(wb, `Advisory-Services-Master-Export-${TODAY}.xlsx`);
  };

  const openTodosByStakeholder = useMemo(() => {
    const map = {};
    STAKEHOLDER_GROUPS.forEach((s) => { map[s] = []; });
    visible.forEach((p) => {
      const phases = buildPhases(p.program);
      // Only the phase actually being worked on right now — otherwise a
      // property in RFP still surfaces every to-do from Program Design
      // and Deployment too, since those phases are pre-populated with
      // full checklists the moment they're selected, long before they're
      // actually reached. That's clutter, not a real action item.
      const current = phases.find((ph) => !ph.done);
      if (!current) return;
      // Only the single next actionable item per property — not every
      // open item in the phase. A property sitting in Prospecting with 6
      // undone outreach steps contributes exactly one entry (whichever
      // comes first in the checklist), not six, since only one of them is
      // actually the next real thing to do.
      const todos = current.todos || [];
      const nextIdx = todos.findIndex((t) => !t.done && t.text !== ADVISORY_TRACKER_STEP);
      if (nextIdx === -1) return;
      const t = todos[nextIdx];
      const resp = t.responsible || "Advisory Services";
      if (map[resp]) map[resp].push({ property: p, phase: current, todoIdx: nextIdx, todo: t });
    });
    return map;
  }, [visible]);

  const stakeholderCounts = useMemo(() => {
    const map = {};
    STAKEHOLDER_GROUPS.forEach((s) => { map[s] = (openTodosByStakeholder[s] || []).length; });
    return map;
  }, [openTodosByStakeholder]);

  const grouped = useMemo(() => {
    if (groupBy === "none") return [{ key: null, properties: filtered }];
    const def = GROUP_DEFS[groupBy];
    // Client, Region, and Phase are all open-ended or derived live (new
    // values can arrive via import, or a property's current phase changes
    // as work progresses) — Status is the only truly fixed enum.
    let keys;
    if (groupBy === "client" || groupBy === "region" || groupBy === "office" || groupBy === "projectType") {
      keys = [...new Set(filtered.map((p) => def.get(p)[0]))].sort();
    } else if (groupBy === "phase") {
      keys = [...new Set(filtered.map((p) => def.get(p)[0]))]
        .sort((a, b) => PHASE_GROUP_ORDER.indexOf(a) - PHASE_GROUP_ORDER.indexOf(b));
    } else {
      keys = def.keys;
    }
    return keys.map((key) => ({ key, properties: filtered.filter((p) => def.get(p).includes(key)) }));
  }, [filtered, groupBy]);

  const programProperty = properties.find((p) => p.id === programPropertyId) || null;
  const phaseProperty = phaseSel ? properties.find((p) => p.id === phaseSel.propertyId) : null;

  const openProgram = (property) => { setProgramPropertyId(property.id); setPhaseSel(null); };
  const closeProgram = () => setProgramPropertyId(null);
  const openPhaseDirect = (property, phaseKey) => { setQueueStakeholder(null); setProgramPropertyId(property.id); setPhaseSel({ propertyId: property.id, phaseKey }); };
  const openPhaseFromProgram = (phaseKey) => setPhaseSel({ propertyId: programPropertyId, phaseKey });
  const closePhase = () => setPhaseSel(null);

  const mutatePhaseDataFor = (propertyId, phaseKey, updater) => {
    const storageKey = storageKeyFor(phaseKey);
    setProperties((prev) => prev.map((p) => {
      if (p.id !== propertyId) return p;
      const current = p.program.phaseData[storageKey] || { done: false, todos: defaultTodosFor(storageKey) };
      return { ...p, program: { ...p.program, phaseData: { ...p.program.phaseData, [storageKey]: updater(current) } } };
    }));
  };
  const mutatePhaseData = (updater, subKey) => mutatePhaseDataFor(phaseSel.propertyId, subKey || phaseSel.phaseKey, updater);

  // Toggling these specific to-dos is what actually starts the clock —
  // Due Diligence's and Advisory's "Advisory Services contract executed"
  // set ddContractExecuted / advisoryContractExecuted respectively (same
  // text, but phaseKey disambiguates which one), and Program Design's
  // "ISP contract executed" sets ispContractExecuted.
  // These five have a real, finite default duration and chain into the
  // next phase — Ongoing Management deliberately isn't included here,
  // since it's a perpetual steady-state phase, not something that should
  // "complete" just because a checklist item got checked.
  const AUTO_COMPLETE_KEYS = ["dueDiligence", "advisory", "rfp", "incumbentNegotiation", "contractingLegal", "programDesign", "deployment"];
  const toggleTodoGeneric = (propertyId, phaseKey, todoIdx) => {
    const storageKey = storageKeyFor(phaseKey);
    setProperties((prev) => prev.map((p) => {
      if (p.id !== propertyId) return p;
      const current = p.program.phaseData[storageKey] || { done: false, todos: defaultTodosFor(storageKey) };
      const todo = current.todos[todoIdx];
      if (!todo) return p; // stale index — never crash the tracker over it
      const newDone = !todo.done;
      const newTodos = current.todos.map((t, idx) => idx !== todoIdx ? t : { ...t, done: newDone });
      const patch = {};
      if (phaseKey === "dueDiligence" && todo.text === "Advisory Services contract executed") patch.ddContractExecuted = newDone ? TODAY : null;
      if (phaseKey === "advisory" && todo.text === "Advisory Services contract executed") patch.advisoryContractExecuted = newDone ? TODAY : null;
      if (phaseKey === "contractingLegal" && todo.text === "Final ISP agreement executed by owner; executed copy filed in SharePoint and logged in master tracker") patch.ispContractExecuted = newDone ? TODAY : null;
      if (phaseKey === "rfp" && todo.text === "Client selects vendor") patch.vendorSelectedDate = newDone ? TODAY : null;
      if (phaseKey === "incumbentNegotiation" && todo.text === "Client approves negotiated terms or elects to move to RFP") patch.vendorSelectedDate = newDone ? TODAY : null;
      if (phaseKey === "dueDiligence" && todo.text === "Present findings to client") patch.ddFindingsPresentedDate = newDone ? TODAY : null;

      let phaseUpdate = { todos: newTodos };
      if (AUTO_COMPLETE_KEYS.includes(storageKey)) {
        const allDone = newTodos.length > 0 && newTodos.every((t) => t.done);
        // Quietly records the real completion date the moment every to-do
        // is checked — used to shift the next phase's start earlier when
        // work wraps ahead of the default schedule, and to eventually
        // report on how often phases finish early vs. late. Nothing about
        // this shows up on the tracker itself.
        phaseUpdate = { todos: newTodos, done: allDone, completedDate: allDone ? (current.completedDate || TODAY) : null };
      }
      return { ...p, program: { ...p.program, ...patch, phaseData: { ...p.program.phaseData, [storageKey]: { ...current, ...phaseUpdate } } } };
    }));
  };
  const toggleTodo = (i, subKey) => toggleTodoGeneric(phaseSel.propertyId, subKey || phaseSel.phaseKey, i);
  const addTodo = (text, subKey) => mutatePhaseData((ph) => ({ ...ph, todos: [...(ph.todos || []), { text, done: false, responsible: "Advisory Services" }] }), subKey);
  const reassignTodo = (i, newResponsible, subKey) => mutatePhaseData((ph) => ({ ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, responsible: newResponsible }) }), subKey);
  const setToggleWith = (i, partner, subKey) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : (partner ? { ...t, toggleWith: partner, rounds: t.rounds || 0 } : { ...t, toggleWith: null }))
  }), subKey);
  const swapToggle = (i, subKey) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, responsible: t.toggleWith, toggleWith: t.responsible, rounds: (t.rounds || 0) + 1 })
  }), subKey);
  // Steps back exactly one swap — same swap mechanic as forward, but only
  // available while rounds > 0, and it decrements instead of increments.
  // Leaves the toggle pairing itself alone (see setToggleWith to remove it).
  const undoSwap = (i, subKey) => mutatePhaseData((ph) => ({
    ...ph, todos: ph.todos.map((t, idx) => (idx !== i || !(t.rounds > 0)) ? t : { ...t, responsible: t.toggleWith, toggleWith: t.responsible, rounds: t.rounds - 1 })
  }), subKey);
  const updateTodoNotes = (i, text, subKey) => mutatePhaseData((ph) => ({ ...ph, todos: ph.todos.map((t, idx) => idx !== i ? t : { ...t, notes: text }) }), subKey);
  const toggleTodoFor = (propertyId, phaseKey, todoIdx) => toggleTodoGeneric(propertyId, phaseKey, todoIdx);

  const toggleOption = (optionKey) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== phaseSel.propertyId) return p;
      const newSelectedOptions = { ...p.program.selectedOptions, [optionKey]: !p.program.selectedOptions[optionKey] };
      const wasChosen = Object.values(p.program.selectedOptions).some(Boolean);
      const nowChosen = Object.values(newSelectedOptions).some(Boolean);
      const advisory = p.program.phaseData.advisory || { done: false, todos: defaultTodosFor("advisory") };
      // Quietly captures when Advisory actually wrapped (an option got
      // chosen) relative to its default timeline — nothing shown on the
      // tracker for this, but the data is there for future reporting on
      // how often phases finish early vs. late.
      const advisoryPatch = (!wasChosen && nowChosen && !advisory.completedDate)
        ? { completedDate: TODAY }
        : (!nowChosen ? { completedDate: null } : {});
      return {
        ...p,
        program: {
          ...p.program, selectedOptions: newSelectedOptions,
          phaseData: { ...p.program.phaseData, advisory: { ...advisory, ...advisoryPatch } }
        }
      };
    }));
  };

  const setPaymentStatus = (propertyId, key, status) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== propertyId) return p;
      // Record the invoice date the first time a half is marked Invoiced
      // (net 30 overdue counts from it); clear it if moved back to Pending.
      const invoicedDates = { ...(p.program.paymentInvoicedDates || {}) };
      if (status === "Invoiced") { if (!invoicedDates[key]) invoicedDates[key] = TODAY; }
      else if (status === "Pending") delete invoicedDates[key];
      return { ...p, program: { ...p.program, manualPaymentOverrides: { ...(p.program.manualPaymentOverrides || {}), [key]: status }, paymentInvoicedDates: invoicedDates } };
    }));
  };
  const setManualStatus = (status) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, manualStatus: status } }));
  };
  const setDecision = (decision) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, decision } }));
  };
  const setPriority = (priority) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : { ...p, program: { ...p.program, priority } }));
  };
  const setDDDate = (dateStr) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== programPropertyId) return p;
      const hasChecklist = p.program.phaseData.dueDiligence && p.program.phaseData.dueDiligence.todos && p.program.phaseData.dueDiligence.todos.length > 0;
      const dueDiligence = hasChecklist
        ? p.program.phaseData.dueDiligence
        : { done: false, todos: ddTemplate(false) };
      return { ...p, program: { ...p.program, ddContractExecuted: dateStr, phaseData: { ...p.program.phaseData, dueDiligence } } };
    }));
  };
  // Replaces setDDDate as the real way DD gets turned on for a property —
  // DD is a selection flag bundled into the Advisory contract, not a
  // separate contract with its own date, confirmed against a real
  // executed agreement with no DD line item at all.
  const toggleDueDiligenceSelected = () => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== programPropertyId) return p;
      const nowSelected = !(p.program.selectedOptions && p.program.selectedOptions.dueDiligence);
      const hasChecklist = p.program.phaseData.dueDiligence && p.program.phaseData.dueDiligence.todos && p.program.phaseData.dueDiligence.todos.length > 0;
      const dueDiligence = hasChecklist ? p.program.phaseData.dueDiligence : { done: false, todos: ddTemplate(false) };
      return {
        ...p,
        program: {
          ...p.program,
          selectedOptions: { ...p.program.selectedOptions, dueDiligence: nowSelected },
          phaseData: { ...p.program.phaseData, dueDiligence },
        },
      };
    }));
  };
  // ProgramModal-scoped equivalent of toggleOption (which is scoped to
  // whichever phase modal is open) — same behavior, including the
  // quiet advisory.completedDate tracking, just reachable directly from
  // property attributes without needing the Advisory phase modal open.
  const toggleServiceOption = (optionKey) => {
    setProperties((prev) => prev.map((p) => {
      if (p.id !== programPropertyId) return p;
      const newSelectedOptions = { ...p.program.selectedOptions, [optionKey]: !p.program.selectedOptions[optionKey] };
      const wasChosen = Object.values(p.program.selectedOptions).some(Boolean);
      const nowChosen = Object.values(newSelectedOptions).some(Boolean);
      const advisory = p.program.phaseData.advisory || { done: false, todos: defaultTodosFor("advisory") };
      const advisoryPatch = (!wasChosen && nowChosen && !advisory.completedDate)
        ? { completedDate: TODAY }
        : (!nowChosen ? { completedDate: null } : {});
      return {
        ...p,
        program: {
          ...p.program, selectedOptions: newSelectedOptions,
          phaseData: { ...p.program.phaseData, advisory: { ...advisory, ...advisoryPatch } }
        }
      };
    }));
  };
  const setServiceContractDate = (optionKey, dateStr) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, serviceContractDates: { ...(p.program.serviceContractDates || {}), [optionKey]: dateStr || null } }
    }));
  };
  const setISPDate = (dateStr) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, ispContractExecuted: dateStr }
    }));
  };
  const setExpectedTCO = (dateStr) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, expectedTCO: dateStr }
    }));
  };
  const setDeploymentLiveDate = (dateStr) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, deploymentLiveDate: dateStr }
    }));
  };
  const updateAttribute = (key, value) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, attributes: { ...(p.program.attributes || {}), [key]: value } }
    }));
  };
  // General, property-level notes — separate from any single to-do's
  // own note, since this is meant for broader context about the
  // property as a whole (e.g. brought over from a conversation with
  // Claude about strategy or history), not tied to one specific
  // checklist item.
  const updateNotes = (text) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, notes: text }
    }));
  };
  const updateNotesLog = (notesLog) => {
    setProperties((prev) => prev.map((p) => p.id !== programPropertyId ? p : {
      ...p, program: { ...p.program, notesLog }
    }));
  };
  const saveEconomicModel = (data) => {
    if (!phaseSel) return;
    setProperties((prev) => prev.map((p) => p.id !== phaseSel.propertyId ? p : {
      ...p, program: { ...p.program, economicModel: data }
    }));
  };

  const [magicLinkEmail, setMagicLinkEmail] = useState("");
  const [magicLinkSent, setMagicLinkSent] = useState(false);
  const [magicLinkError, setMagicLinkError] = useState("");
  const [sendingCode, setSendingCode] = useState(false);
  const [otpCode, setOtpCode] = useState("");
  const [otpError, setOtpError] = useState("");
  const [verifying, setVerifying] = useState(false);

  const sendMagicLink = async () => {
    setMagicLinkError("");
    setSendingCode(true);
    // Check the allow-list first — a non-authorized email gets a clear,
    // immediate error and no code is ever sent, rather than sending a
    // working code that only turns out to be pointless after the fact.
    const { data: allowed, error: checkError } = await supabaseClient.rpc("is_email_allowed", { check_email: magicLinkEmail.trim() });
    if (checkError) {
      setSendingCode(false);
      setMagicLinkError("Couldn't verify access right now. Please try again.");
      return;
    }
    if (!allowed) {
      setSendingCode(false);
      setMagicLinkError("This email doesn't have access to the tracker. Contact your administrator to be added.");
      return;
    }
    const { error } = await supabaseClient.auth.signInWithOtp({ email: magicLinkEmail });
    setSendingCode(false);
    if (error) setMagicLinkError(error.message);
    else setMagicLinkSent(true);
  };

  const verifyCode = async () => {
    setOtpError("");
    setVerifying(true);
    const { error } = await supabaseClient.auth.verifyOtp({ email: magicLinkEmail, token: otpCode.trim(), type: "email" });
    setVerifying(false);
    if (error) setOtpError(error.message);
    // On success, the onAuthStateChange listener elsewhere picks up the
    // new session automatically — nothing else needed here.
  };

  if (session === undefined) {
    return <div className="app-root" style={{ minHeight: "100vh", background: "#0A2245" }} />;
  }

  if (!session && justSignedOut) {
    return (
      <div className="app-root" style={{ minHeight: "100vh", background: "#0A2245", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Arial, Helvetica, sans-serif" }}>
        <div style={{ background: "#14315E", border: "1px solid rgba(169,196,218,0.16)", borderRadius: 8, padding: 32, width: 360, textAlign: "center" }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", background: "rgba(0,123,12,0.16)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <CircleCheck size={24} color="#007B0C" />
          </div>
          <h1 style={{ color: "#FFFFFF", fontSize: 18, marginTop: 0, marginBottom: 6 }}>You've been signed out</h1>
          <div style={{ color: "#B2B3B5", fontSize: 13, marginBottom: 24 }}>Your session has ended. Sign back in whenever you're ready to continue.</div>
          <button
            onClick={() => setJustSignedOut(false)}
            style={{ width: "100%", background: "#0077D4", color: "#FFFFFF", border: "none", fontWeight: 600, padding: "10px 16px", borderRadius: 4, fontSize: 13.5, cursor: "pointer" }}
          >
            Sign back in
          </button>
        </div>
      </div>
    );
  }

  if (!session) {
    return (
      <div className="app-root" style={{ minHeight: "100vh", background: "#0A2245", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Arial, Helvetica, sans-serif" }}>
        <div style={{ background: "#14315E", border: "1px solid rgba(169,196,218,0.16)", borderRadius: 8, padding: 32, width: 360, textAlign: "center" }}>
          <h1 style={{ color: "#FFFFFF", fontSize: 20, marginTop: 0, marginBottom: 4 }}>Advisory Services Tracker</h1>
          <div style={{ color: "#B2B3B5", fontSize: 12.5, fontStyle: "italic", marginBottom: 24 }}>Sign in to continue</div>

          {magicLinkSent ? (
            <>
              <div style={{ color: "#007B0C", fontSize: 13, marginBottom: 16 }}>
                Check your email — a sign-in code was sent to {magicLinkEmail}.
              </div>
              <input
                type="text" inputMode="numeric" value={otpCode} onChange={(e) => setOtpCode(e.target.value)}
                placeholder="Enter your code" maxLength={10}
                style={{ width: "100%", background: "#1C3E70", border: "1px solid rgba(169,196,218,0.16)", borderRadius: 4, padding: "8px 10px", color: "#FFFFFF", fontSize: 16, letterSpacing: "0.3em", textAlign: "center", boxSizing: "border-box", marginBottom: 10 }}
              />
              <button
                onClick={verifyCode} disabled={verifying || otpCode.trim().length === 0}
                style={{ width: "100%", background: "#0077D4", color: "#FFFFFF", border: "none", fontWeight: 600, padding: "10px 16px", borderRadius: 4, fontSize: 13.5, cursor: verifying ? "default" : "pointer", opacity: verifying ? 0.7 : 1 }}
              >
                {verifying ? "Checking…" : "Verify code"}
              </button>
              {otpError && <div style={{ color: "#DA7A62", fontSize: 12, marginTop: 8 }}>{otpError}</div>}
              <button
                onClick={() => { setMagicLinkSent(false); setOtpCode(""); setOtpError(""); }}
                style={{ width: "100%", background: "none", color: "#B2B3B5", border: "none", fontSize: 12, cursor: "pointer", marginTop: 12, textDecoration: "underline" }}
              >
                Use a different email
              </button>
            </>
          ) : (
            <>
              <input
                type="email" value={magicLinkEmail} onChange={(e) => setMagicLinkEmail(e.target.value)}
                placeholder="you@company.com"
                style={{ width: "100%", background: "#1C3E70", border: "1px solid rgba(169,196,218,0.16)", borderRadius: 4, padding: "8px 10px", color: "#FFFFFF", fontSize: 13, boxSizing: "border-box", marginBottom: 10 }}
              />
              <button
                onClick={sendMagicLink} disabled={sendingCode || !magicLinkEmail.trim()}
                style={{ width: "100%", background: "#0077D4", color: "#FFFFFF", border: "none", fontWeight: 600, padding: "10px 16px", borderRadius: 4, fontSize: 13.5, cursor: sendingCode ? "default" : "pointer", opacity: sendingCode ? 0.7 : 1 }}
              >
                {sendingCode ? "Sending…" : "Email me a sign-in code"}
              </button>
              {magicLinkError && <div style={{ color: "#DA7A62", fontSize: 12, marginTop: 8 }}>{magicLinkError}</div>}
            </>
          )}
        </div>
      </div>
    );
  }

  // Signed in, but the allow-list check hasn't resolved yet — avoid
  // flashing either the real interface or a false "not authorized"
  // message before we actually know.
  if (isAllowed === undefined) {
    return <div className="app-root" style={{ minHeight: "100vh", background: "#0A2245" }} />;
  }

  // Signed in successfully, but not on the allow-list — show a real,
  // dedicated screen instead of any version of the actual interface,
  // even an empty one.
  if (isAllowed === false) {
    return (
      <div className="app-root" style={{ minHeight: "100vh", background: "#0A2245", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Arial, Helvetica, sans-serif" }}>
        <div style={{ background: "#14315E", border: "1px solid rgba(169,196,218,0.16)", borderRadius: 8, padding: 32, width: 380, textAlign: "center" }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", background: "rgba(158,59,46,0.18)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <X size={22} color="#DA7A62" />
          </div>
          <h1 style={{ color: "#FFFFFF", fontSize: 18, marginTop: 0, marginBottom: 6 }}>You don't have access yet</h1>
          <div style={{ color: "#B2B3B5", fontSize: 13, marginBottom: 24 }}>
            You've signed in successfully as {session.user && session.user.email}, but this account hasn't been given access to the Advisory Services Tracker. Contact your administrator to be added.
          </div>
          <button
            onClick={() => { supabaseClient.auth.signOut(); setJustSignedOut(true); }}
            style={{ width: "100%", background: "transparent", color: "#B2B3B5", border: "1px solid rgba(169,196,218,0.16)", padding: "9px 16px", borderRadius: 4, fontSize: 13, cursor: "pointer" }}
          >
            Sign out
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="app-root">
      

      <div className="top-bar">
        <div className="brand">
          <div className="brand-icon"><Building2 size={18} /></div>
          <div>
            <h1 style={{ cursor: "pointer" }} onClick={() => setView("home")} title="Back to Portfolio Overview">Advisory Services Tracker</h1>
            <div className="brand-sub">Master property tracker</div>
            {dataSyncStatus === "shared" && <div className="sync-badge sync-badge-live">● Shared — live for your whole team</div>}
            {dataSyncStatus === "standalone" && <div className="sync-badge sync-badge-local">○ Standalone — this device only</div>}
            {dataSyncStatus === "loading" && <div className="sync-badge sync-badge-local">Loading shared data…</div>}
          </div>
        </div>
        <div className="top-actions">
          <div className="search-box">
            <Search size={14} color="#B2B3B5" />
            <input placeholder="Search properties…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          <nav className="nav-group" aria-label="Pages">
            {[
              ["home", "Overview", LayoutGrid, "#4f8fe8"],
              ["timeline", "Timeline", CheckSquare, "#7bd88a"],
              ["properties", "Client", Table2, "#a79cf0"],
              ["billing", "Billing", FileText, "#f4b45a"],
              ["contracts", "Advisory Contracts", FileText, "#3cc8c0"],
              ["map", "Client Map", MapIcon, "#5fb3f0"],
            ].map(([key, label, Icon, color]) => (
              <button key={key} className={view === key ? "active" : ""} style={{ "--hc": color }} onClick={() => { if (key === "billing") setBillingStatus("all"); setView(key); }} aria-current={view === key ? "page" : undefined}>
                <Icon size={14} /> {label}
              </button>
            ))}
          </nav>
          <span className="nav-spacer" />
          <button className={`btn-ghost ${view === "changelog" ? "on" : ""}`} onClick={() => { setView("changelog"); loadChangeLog(); }} title="Review master sync, digest and import changes">
            <FileText size={15} /> Change Log
            {(() => { const n = changeLogRows.filter((r) => !r.reviewed && CL_DECISION_ACTIONS.includes(r.action)).length; return n > 0 ? <span className="nav-badge">{n}</span> : null; })()}
          </button>
          <button className="btn-ghost" onClick={() => setDocumentsOpen(true)} title="Shared forms, templates and reference files"><FileText size={15} /> Documents</button>
          <button className="btn-ghost" onClick={() => setImportExportOpen(true)}><FileText size={15} /> Import / Export</button>
          <button className="btn-ghost" onClick={() => { supabaseClient.auth.signOut(); setJustSignedOut(true); }}>Sign out</button>
        </div>
        <div className="brand-logo-plate">
          <img src={GREYSTAR_LOGO} alt="Greystar" className="brand-logo-img" />
        </div>
      </div>

      {view === "home" && (
        <div className="modal-portfolio-overview" style={{ borderRadius: 10, padding: "4px 4px 20px" }}>
          <DashboardView
            properties={visible}
            allProperties={properties}
            onNavigate={(groupByKey, label) => setView("timeline")}
            onOpenProperty={(p) => openProgram(p)}
            onOpenExecutedContracts={() => { setBillingStatus("all"); setView("billing"); }}
            onOpenExecutedContractsForProperty={(p) => { setBillingStatus("all"); setView("billing"); openProgram(p); }}
            onOpenBilling={(status) => { setBillingStatus(status || "all"); setView("billing"); }}
            stakeholderCounts={stakeholderCounts}
            onOpenStakeholder={(s) => setQueueStakeholder(s)}
            callNotes={callNotes}
            billingImport={billingImport}
          />
        </div>
      )}
      {view === "timeline" && (
        <TimelineView properties={visible} onOpenProperty={(p) => openProgram(p)} />
      )}
      {view === "billing" && (
        <BillingView properties={visible} allProperties={properties} onOpenProperty={(p) => openProgram(p)} onSetPaymentStatus={setPaymentStatus} onExport={exportMasterFile} billingImport={billingImport} onSaveBillingImport={saveBillingImport} statusFilter={billingStatus} onStatusFilterChange={setBillingStatus} />
      )}
      {view === "contracts" && (
        <AdvisoryContractsView properties={properties} onOpenProperty={(p) => openProgram(p)} supabaseClient={supabaseClient} billingImport={billingImport} />
      )}
      {view === "map" && (
        <ClientMapView properties={properties} onOpenProperty={(p) => openProgram(p)} legislation={legislation} onSaveLegislation={saveLegislation} userEmail={session && session.user ? session.user.email : null} />
      )}
      {view === "changelog" && (
        <ChangeLogView
          rows={changeLogRows}
          setRows={setChangeLogRows}
          loading={changeLogLoading}
          error={changeLogError}
          onRefresh={loadChangeLog}
          properties={properties}
          setProperties={setProperties}
          supabaseClient={supabaseClient}
          userEmail={session && session.user ? session.user.email : null}
          onOpenProperty={(p) => openProgram(p)}
          toggleTodoFor={toggleTodoFor}
        />
      )}
      {view === "properties" && (
        <PropertiesView properties={visible} onOpenProperty={(p) => openProgram(p)} callNotes={callNotes} search={search} setSearch={setSearch} portfolios={portfolios} clientNotes={clientNotes} onSaveOwner={saveOwnerRecord} supabaseClient={supabaseClient} />
      )}


      {documentsOpen && <DocumentsModal onClose={() => setDocumentsOpen(false)} supabaseClient={supabaseClient} />}
      {importExportOpen && (
        <ImportExportModal
          onClose={() => setImportExportOpen(false)}
          properties={properties}
          setProperties={setProperties}
          supabaseClient={supabaseClient}
          onExport={exportMasterFile}
          userEmail={session && session.user ? session.user.email : null}
          onLogged={loadChangeLog}
          billingImport={billingImport}
          onSaveBillingImport={saveBillingImport}
        />
      )}

      {programProperty && !phaseSel && (
        <ProgramModal property={programProperty} onClose={closeProgram} onOpenPhase={openPhaseFromProgram} onSetManualStatus={setManualStatus} onSetDecision={setDecision} onSetPriority={setPriority} onUpdateAttribute={updateAttribute} onUpdateNotes={updateNotes} onUpdateNotesLog={updateNotesLog} onSetDDDate={setDDDate} onToggleDueDiligence={toggleDueDiligenceSelected} onToggleServiceOption={toggleServiceOption} onSetServiceContractDate={setServiceContractDate} onSetISPDate={setISPDate} onSetExpectedTCO={setExpectedTCO} onSetDeploymentLiveDate={setDeploymentLiveDate} regionsList={regionsList} onAddRegion={addRegion} currentUserEmail={session && session.user ? session.user.email : null} />
      )}

      {phaseProperty && phaseSel && (
        <PhaseModal
          property={phaseProperty}
          phaseKey={phaseSel.phaseKey}
          onClose={closePhase}
          onToggleTodo={toggleTodo}
          onAddTodo={addTodo}
          onToggleOption={toggleOption}
          onReassignTodo={reassignTodo}
          onSetToggleWith={setToggleWith}
          onSwapToggle={swapToggle}
          onUndoSwap={undoSwap}
          onUpdateTodoNotes={updateTodoNotes}
          onOpenEconomicModel={() => setEconModelOpen(true)}
        />
      )}

      {econModelOpen && phaseProperty && (
        <EconomicModelModal
          property={phaseProperty}
          onClose={() => setEconModelOpen(false)}
          onSave={saveEconomicModel}
        />
      )}

      {queueStakeholder && (
        <WorkQueueModal
          stakeholder={queueStakeholder}
          items={openTodosByStakeholder[queueStakeholder] || []}
          onClose={() => setQueueStakeholder(null)}
          onOpenPhase={openPhaseDirect}
          onToggleDone={toggleTodoFor}
        />
      )}

    </div>
  );
}


// Error boundary: a render error now shows a message instead of an
// empty dark-blue page.
class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Tracker crashed:", error, info && info.componentStack); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 24, color: "#e8eef9", fontFamily: "system-ui, sans-serif" }}>
        <h2>Something went wrong displaying this view.</h2>
        <pre style={{ whiteSpace: "pre-wrap", color: "#ff8f86" }}>{String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}</pre>
        <button onClick={() => this.setState({ error: null })} style={{ marginTop: 12, padding: "6px 14px" }}>Try again</button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App /></AppErrorBoundary>);



ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
